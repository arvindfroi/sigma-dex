<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of the Sigmas Pokedex</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2f6fde; --good: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --bar: #e6e9ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1f2329; --text: #e8eaed; --muted: #9aa3ae; --line: #323841;
    --accent: #6ea2ff; --good: #4cc27e; --warn: #e0a040; --bad: #ef6b5b; --bar: #2c323a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 12px; max-width: 1200px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); }
.totals { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
.total { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.total b { display: block; font-size: 20px; }
.total span { color: var(--muted); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1200px; margin: 0 auto; padding: 8px 16px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 180px; min-width: 0; }
input[type=checkbox] { width: auto; }
a { color: var(--accent); }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.small { padding: 3px 9px; font-size: 13px; }
button:disabled { opacity: .6; cursor: default; }
main { max-width: 1200px; margin: 0 auto; padding: 4px 16px 60px; }
.notice { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin: 8px 0 14px; }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; display: block; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.open { border-style: dashed; color: var(--muted); }
.card .num { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
.card .name { font-weight: 650; font-size: 16px; margin: 2px 0 6px; overflow-wrap: anywhere; }
.flag { color: var(--warn); }
.pending { color: var(--accent); font-size: 12px; }
.types { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; }
.type { color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.meter { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(780px, calc(100vw - 20px)); max-height: calc(100vh - 20px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.detail { padding: 18px 20px 24px; }
.detail .top { display: flex; gap: 14px; align-items: flex-start; }
.detail .top img { width: 120px; height: 120px; object-fit: contain; border-radius: 10px; background: var(--bar); }
.detail h3 { margin: 0; font-size: 24px; }
.actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.entry { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-line; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stat td:first-child { width: 86px; color: var(--muted); }
.stat td:nth-child(2) { width: 40px; text-align: right; font-weight: 600; }
.statbar { height: 10px; border-radius: 5px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.match { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; }
.sim { background: var(--bg); border-radius: 10px; padding: 12px; }
.sim input[type=range] { width: 100%; padding: 0; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; min-width: 0; }
.row > .tiny { flex: 0 1 76px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); margin: 22px -20px -24px; padding: 12px 20px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; padding: 4px 16px 0; }
.tabs button { border-radius: 999px; padding: 6px 14px; }
.tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.card .line { color: var(--muted); font-size: 13px; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); }
.badge.done { color: var(--good); border-color: var(--good); }
.badge.need { color: var(--warn); border-color: var(--warn); }
.card .thumb { float: right; width: 56px; height: 56px; object-fit: contain; border-radius: 8px; background: var(--bar); margin: 0 0 4px 8px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 12px; color: var(--muted); }
.gallery img { width: 100%; height: 110px; object-fit: contain; border-radius: 6px; background: var(--bar); display: block; }
.gallery figcaption { margin-top: 4px; overflow-wrap: anywhere; }
.upload { background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 10px; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
@media (max-width: 520px) { .todo { columns: 1; } .detail .top img { width: 84px; height: 84px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub">Every Pokemon as the game will use it. Click one to see its page and to edit it. Click an open slot to add a new one. Moves and abilities that do not exist in any Pokemon game are described under "New moves" and "New abilities".</div>
  <div class="totals" id="totals"></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="tools">
  <input type="search" id="search" placeholder="Search name, move, ability...">
  <select id="type"><option value="">All types</option></select>
  <select id="show">
    <option value="all">All slots</option>
    <option value="filled">Has a Pokemon</option>
    <option value="todo">Not complete</option>
    <option value="playable">Playable in the game</option>
    <option value="problems">Has warnings</option>
    <option value="open">Open slots</option>
  </select>
</div>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dialog"><div class="detail" id="detail"></div></dialog>
<datalist id="list-moves"></datalist>
<datalist id="list-abilities"></datalist>
<datalist id="list-methods"></datalist>

  if (m === "level") return "Lv " + e.level;
  if (m === "level_attack_higher") return "Lv " + e.level + " (Attack > Defense)";
  if (m === "level_attack_equal") return "Lv " + e.level + " (Attack = Defense)";
  if (m === "level_defense_higher") return "Lv " + e.level + " (Attack < Defense)";
  if (m === "item") return String(e.item);
  if (m === "trade") return "Trade";
  if (m === "trade_item") return "Trade holding " + e.item;
  if (m === "friendship") return "Friendship";
  if (m === "friendship_day") return "Friendship (day)";
  if (m === "friendship_night") return "Friendship (night)";
  if (m === "beauty") return "Beauty " + e.level;
  return "Other: " + (e.note || "");
}

// Work out everything that is calculated from a Pokemon's data.
function derive(s) {
  const d = s.data, stats = d.base_stats || {};
  s.bst = STATS.every(([k]) => Number.isInteger(stats[k])) ? STATS.reduce((a, [k]) => a + stats[k], 0) : null;
  s.missing = DEX.checks.filter(([, , path]) => {
    if (path === "base_stats.*") return s.bst === null;
    return !filled(path.split(".").reduce((v, k) => (v && typeof v === "object" ? v[k] : undefined), d));
  }).map(([section, label]) => section + ": " + label);
  s.complete = Math.round(100 * (DEX.checks.length - s.missing.length) / DEX.checks.length);
  s.evolutions = (d.evolutions || []).filter(e => e && typeof e === "object").map(e => ({into: e.into, how: evolutionText(e)}));
  s.problems = s.problems || [];
  s.gameNeeds = gameNeeds(s);
  return s;
}

// What a Pokemon still needs before it can be put into the game (same rule as the game export).
function gameNeeds(s) {
  const d = s.data, needs = [];
  const inGame = (kind, name) => name && (new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm)).has(norm(name))
    || DEX.custom[kind].some(c => norm(c.name) === norm(name) && c.implemented));
  if (s.bst === null) needs.push("all six base stats");
  if (!(d.types || []).length || (d.types || []).some(t => !DEX.types.includes(t))) needs.push("a type");
  if (!inGame("ability", (d.abilities || {}).primary)) needs.push("an ability that exists in the game");
  if (!((d.learnset || {}).level_up || []).some(m => inGame("move", m.move))) needs.push("a level-up move that exists in the game");
  if (String(d.name || "").length > DEX.lists.name_limit) needs.push("a name of at most " + DEX.lists.name_limit + " letters");
  return needs;
}

function calcStat(base, level, iv, ev, nature, isHp) {
  const core = Math.floor((2 * base + iv + Math.floor(ev / 4)) * level / 100);
  return isHp ? core + level + 10 : Math.floor((core + 5) * nature);
}

function simulator(s) {
  const stats = s.data.base_stats || {};
  const moves = ((s.data.learnset || {}).level_up || []).slice().sort((a, b) => a.level - b.level);
  const out = h("div", {});
  const slider = h("input", {type: "range", min: 1, max: 100, value: 5, "aria-label": "Level"});
  function draw() {
    const level = Number(slider.value);
    out.replaceChildren(h("div", {}, h("b", {}, "Level " + level)));
    if (s.bst !== null) {
      out.append(h("table", {}, h("tr", {}, h("th", {}, ""), ...STATS.map(([, label]) => h("th", {}, label))),
        h("tr", {}, h("td", {}, "Lowest"), ...STATS.map(([k]) => h("td", {}, String(calcStat(stats[k], level, 0, 0, k === "hp" ? 1 : .9, k === "hp"))))),
        h("tr", {}, h("td", {}, "Typical"), ...STATS.map(([k]) => h("td", {}, h("b", {}, String(calcStat(stats[k], level, 15, 0, 1, k === "hp")))))),
        h("tr", {}, h("td", {}, "Highest"), ...STATS.map(([k]) => h("td", {}, String(calcStat(stats[k], level, 31, 252, k === "hp" ? 1 : 1.1, k === "hp")))))));
    } else out.append(h("div", {class: "empty"}, "Base stats are not filled in yet."));
    const known = moves.filter(m => m.level <= level).slice(-4);

    const evolved = s.evolutions.filter(e => /^Lv (\d+)/.test(e.how) && Number(e.how.match(/^Lv (\d+)/)[1]) <= level);
    if (evolved.length) out.append(h("div", {class: "sub", style: "margin-top:6px"}, "By this level it can have evolved into " + evolved.map(e => nameOf(e.into)).join(" or ") + "."));
  }

}

function matchups(types) {
  const known = types.filter(t => CHART[t]);
  if (!known.length) return h("div", {class: "empty"}, "No type yet.");
  const groups = {};
  for (const attacker of Object.keys(CHART)) {
    const mult = known.reduce((m, t) => m * (CHART[attacker][t] ?? 1), 1);
    if (mult !== 1) (groups[mult] ||= []).push(attacker);
  }
  const labels = [[4, "Takes 4x"], [2, "Takes 2x"], [.5, "Takes 1/2"], [.25, "Takes 1/4"], [0, "Immune to"]];
  const rows = labels.filter(([m]) => groups[m]).flatMap(([m, label]) => [h("span", {}, label), h("div", {class: "types"}, groups[m].map(typeChip))]);
  return h("div", {class: "match"}, rows);
}

const imagesOf = id => DEX.images[id] || [];

// Large pictures are scaled down in the browser so uploads stay small; small ones (sprites) are sent untouched.
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error(file.name + " is not a PNG, JPG, WEBP or GIF image.");
  if (file.type === "image/gif" || file.size <= 400 * 1024) {
    if (file.size > 3 * 1024 * 1024) throw new Error(file.name + " is larger than 3 MB.");
    return file;
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const encode = (type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  let blob = await encode("image/webp", 0.85);
  if (!blob || blob.type !== "image/webp") blob = await encode("image/png");       // browsers that cannot write WEBP
  if (blob.size > 3 * 1024 * 1024) {                                               // still too big: flatten onto white as JPG
    const flat = Object.assign(document.createElement("canvas"), {width: canvas.width, height: canvas.height}), ctx = flat.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, flat.width, flat.height); ctx.drawImage(canvas, 0, 0);
    blob = await new Promise(resolve => flat.toBlob(resolve, "image/jpeg", 0.85));
  }
  if (!blob || blob.size > 3 * 1024 * 1024) throw new Error(file.name + " is too large even after shrinking.");
  return new File([blob], file.name, {type: blob.type});
}

async function imageRequest(fields) {
  const form = new FormData();
  for (const [key, value] of Object.entries(fields)) form.append(key, value);
  let response;
  try { response = await fetch(DEX.web.url + "/functions/v1/species-image", {method: "POST", body: form}); }
  catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(/edit key/i.test(body.message || "") ? "Wrong edit key. Ask in the Discord for the current one." : (body.message || "That did not work (" + response.status + ")."));
  return body;
}

function imageSection(s) {
  const box = h("div", {});
  const editor = textInput(remember.get("editor"), {maxlength: 40, placeholder: "your Discord name"});
  const key = h("input", {type: "password", value: remember.get("key"), autocomplete: "off"});
  const files = h("input", {type: "file", accept: "image/png,image/jpeg,image/webp,image/gif", multiple: true});
  const caption = textInput("", {maxlength: 200, placeholder: "e.g. concept art, front view, shiny idea"});
  const status = h("div", {class: "hint", role: "status"});
  const send = h("button", {class: "primary", type: "button"}, "Upload");
  function draw() {
    const list = imagesOf(s.id);
    box.replaceChildren(list.length ? h("div", {class: "gallery"}, list.map(image => h("figure", {},
      h("a", {href: image.src, target: "_blank", rel: "noopener"}, h("img", {src: image.src, alt: image.caption || "Picture of " + s.data.name, loading: "lazy"})),
      h("figcaption", {}, [image.caption, image.editor ? "by " + image.editor : null].filter(Boolean).join(" - ") || "no caption", " ",
        DEX.web.url ? h("button", {type: "button", class: "small", onclick: () => remove(image)}, "Remove") : null))))
      : h("div", {class: "empty"}, "No images yet."));
  }
  async function remove(image) {
    if (!confirm("Remove this image from " + s.data.name + "?")) return;
    status.textContent = "Removing...";
    try {
      await imageRequest({action: "remove", id: image.id, key: key.value});
      DEX.images[s.id] = imagesOf(s.id).filter(i => i.id !== image.id);
      remember.set("key", key.value); status.textContent = ""; draw(); render();
    } catch (err) { status.textContent = err.message; }
  }
  send.addEventListener("click", async () => {
    if (!files.files.length) { status.textContent = "Choose one or more images first."; return; }
    send.disabled = true;
    try {
      let done = 0;
      for (const file of files.files) {
        status.textContent = "Uploading " + (++done) + " of " + files.files.length + "...";
        const row = await imageRequest({key: key.value, species_id: s.id, caption: caption.value, editor: editor.value, file: await prepareImage(file)});
        (DEX.images[s.id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
        draw();
      }
      remember.set("editor", editor.value); remember.set("key", key.value);
      files.value = ""; caption.value = ""; status.textContent = "Uploaded."; render();
    } catch (err) { status.textContent = err.message; }
    send.disabled = false;
  });
  draw();
  return h("div", {}, box, DEX.web.url ? h("div", {class: "upload"},
    h("div", {class: "fields"}, field("Add images (concept art, sketches, sprites)", files, "wide"), field("Caption (optional)", caption, "wide"), field("Your name", editor), field("Edit key (from the Discord)", key)),
    h("div", {style: "margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"}, send, status)) : null);
}

function checkGrid(options, chosen) {

// Remove everything empty so only real content is saved.
function clean(value) {
  if (Array.isArray(value)) return value.map(clean).filter(filled);
  if (value && typeof value === "object") {
    const out = {};
    for (const [k, v] of Object.entries(value)) { const c = clean(v); if (filled(c) || c === 0 || c === false) out[k] = c; }
    return out;
  }
  return value;
}

// Sends one save to the database. Throws an Error with a readable message if it fails.
async function saveEdit(kind, id, data, editor, key) {
  let response;
  try {
    response = await fetch(DEX.web.url + "/rest/v1/rpc/submit_edit", {method: "POST",
      headers: {apikey: DEX.web.key, "Content-Type": "application/json"},
      body: JSON.stringify({p_key: key, p_kind: kind, p_id: id, p_data: data, p_editor: editor})});
  } catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(/edit key/i.test(body.message || "") ? "Wrong edit key. Ask in the Discord for the current one." : (body.message || "The save did not go through (" + response.status + ")."));
  }
  remember.set("editor", editor); remember.set("key", key);
}

const KINDS = {
  move: {plural: "New moves", one: "move", used: s => { const l = s.data.learnset || {}; return [...(l.level_up || []).map(m => m.move), ...(l.tm_hm || []), ...(l.tutor || []), ...(l.egg || [])]; }},
  ability: {plural: "New abilities", one: "ability", used: s => Object.values(s.data.abilities || {})},
};
const existingNames = kind => new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm));
const usedBy = (kind, name) => DEX.species.filter(s => KINDS[kind].used(s).some(n => n && norm(n) === norm(name)));
// Names Pokemon use that exist neither in the game nor in our list of new ones.
function undescribed(kind) {
  const known = existingNames(kind), described = new Set(DEX.custom[kind].map(c => norm(c.name))), found = new Map();
  for (const s of DEX.species) for (const name of KINDS[kind].used(s))
    if (name && !known.has(norm(name)) && !described.has(norm(name)) && !found.has(norm(name))) found.set(norm(name), String(name));
  return [...found.values()].sort();
}
function refreshLists() {
  document.getElementById("list-moves").replaceChildren(...[...DEX.lists.moves, ...DEX.custom.move.map(c => c.name)].sort().map(m => h("option", {value: m})));
  document.getElementById("list-abilities").replaceChildren(...[...new Set([...DEX.lists.abilities, ...DEX.custom.ability.map(c => c.name)])].sort().map(m => h("option", {value: m})));
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Images uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const list = await fetch(DEX.web.url + "/rest/v1/species_images?select=id,species_id,path,caption,editor,removed&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (list.ok) {
      for (const row of await list.json()) {
        if (row.removed) DEX.images[row.species_id] = imagesOf(row.species_id).filter(i => i.id !== row.id);
        else if (!built.has(row.id)) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      render();
    }
  } catch (e) { /* the built data is still shown */ }
}

document.getElementById("title").textContent = DEX.project;
DEX.species.forEach(derive); index();
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
refreshLists();
document.getElementById("list-methods").append(...["grass", "cave", "surf", "fishing", "rock smash", "gift", "trade", "static"].map(m => h("option", {value: m})));
if (DEX.problems.length) document.getElementById("notice").append(h("div", {class: "notice"}, h("b", {}, "These edits could not be used - please fix and save them again:"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) ev.target.close(); });
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
loadRecentEdits();
</script>
</body>
</html>
