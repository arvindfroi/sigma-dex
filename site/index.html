* { box-sizing: border-box; }
html { image-rendering: pixelated; }
body { margin: 0; background: var(--bg) var(--dots) repeat; background-size: 16px 16px; color: var(--ink); font: 16px/1.55 var(--body); }
img { image-rendering: auto; }
img.px, .px img, canvas { image-rendering: pixelated; }
h1, h2, h3, h4, button, th, summary, .tab, .plate, .type, .badge, .num, .pixfont { font-family: var(--display); font-weight: 400; letter-spacing: .3px; }
h2 { font-size: 17px; color: var(--pri); margin: 20px 0 8px; }
h3 { margin: 0; }
h4 { font-size: 15px; color: var(--muted); margin: 14px 0 6px; }
a { color: var(--blue); }
.sub { color: var(--muted); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* the pixel box: dark outline, light band, thin inner line, white (or night) inside, stepped corners */
.frame { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; }
.frame.sel { border-image: var(--box-sel) 5 fill / 15px stretch; }

/* header: a band of the dusk sky, the title in the DS face */
.topbar { background: linear-gradient(var(--shade), var(--shade)), var(--band) center / cover no-repeat; border-bottom: 3px solid var(--pri-edge); }
header { max-width: 1400px; margin: 0 auto; padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
header .titles { flex: 1 1 280px; min-width: 0; color: #ffffff; text-shadow: 2px 2px 0 rgba(40, 20, 80, .55); }
h1 { margin: 0; font-size: 28px; line-height: 1.15; }
header .sub { color: #fbefff; font-size: 15px; }
.me { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ffffff; font-family: var(--display); text-shadow: 1px 1px 0 rgba(40, 20, 80, .6); }
.me input { width: 170px; }
.daynight { display: flex; gap: 0; }
.daynight button { min-height: 0; padding: 4px 10px; font-size: 13px; border-width: 2px; border-bottom-width: 3px; }
.daynight button[aria-pressed=true] { background: var(--gold); color: #2c2000; border-color: #8a6a10; }

/* fields */
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 3px solid var(--edge2); border-radius: 0; padding: 6px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--pri); outline: none; }
textarea { width: 100%; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--pri); }
input[type=range] { accent-color: var(--pink); padding: 0; border: 0; background: none; }

/* buttons: a DS button with a pressable lower edge */
button { font-size: 15px; color: var(--ink); background: var(--panel); border: 3px solid var(--edge); border-bottom-width: 5px; border-radius: 0; padding: 6px 12px; cursor: pointer; line-height: 1.2; }
button:hover { background: var(--soft); }
button:active { border-bottom-width: 3px; transform: translateY(2px); }
button.primary { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); text-shadow: 1px 1px 0 var(--pri-edge); }
button.primary:hover { filter: brightness(1.08); background: var(--pri); }
button.good { border-color: var(--good); color: var(--good); }
button.small { padding: 3px 9px; font-size: 13px; border-width: 2px; border-bottom-width: 4px; }
button.link { border: 0; background: none; color: var(--blue); padding: 0; text-decoration: underline; font-family: var(--body); }
button.link:active { transform: none; }
button:disabled { opacity: .5; cursor: default; transform: none; }

/* main menu: tabs like the summary screen's */
nav { max-width: 1400px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 4px 6px; flex-wrap: wrap; align-items: flex-end; }
nav > button, nav summary { font-size: 16px; padding: 4px 6px 6px; border-style: solid; border-width: 12px 12px 0 12px; border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: #ffffff; text-shadow: 1px 1px 0 rgba(30, 10, 70, .6); background: none; transform: none; }
nav > button[aria-pressed=true], nav details[open] > summary, nav summary[aria-pressed=true] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR42mNkQAI2WhX/GfCAI9c6GGFsFmQNh6+249PHYKvN8B9mABNMcMeJJoavn3/jxTtONMENYbTRqviPLEAM8LCoY2BiIBOwMDAwMHx4941kjWTbOKpxUGkEANDOLnKYGqiaAAAAAElFTkSuQmCC) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: var(--pri-edge); text-shadow: none; }
nav > button:hover { filter: brightness(1.08); background: none; }
nav details { position: relative; }
nav summary { list-style: none; cursor: pointer; }
nav summary::-webkit-details-marker { display: none; }
nav .menu { position: absolute; z-index: 5; top: 100%; left: 0; display: flex; flex-direction: column; min-width: 230px; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0; }
nav .menu button { border: 0; text-align: left; padding: 7px 8px 7px 26px; background: none; position: relative; transform: none; }
nav .menu button:hover::before, nav .menu button:focus-visible::before { content: "▶"; position: absolute; left: 6px; color: var(--cursor); }
nav .menu button:hover { background: none; }
.navrule { max-width: 1240px; margin: 0 auto; border-top: 3px solid var(--pri-edge); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1400px; margin: 0 auto; padding: 12px 16px 6px; align-items: center; }
.tools input[type=search] { flex: 1 1 220px; }
main { max-width: 1400px; margin: 0 auto; padding: 6px 16px 70px; }
.notice { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 4px 4px; margin: 6px 0 14px; }
.notice.info b:first-child { color: var(--pri); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }

/* cards (the Cards layout) */
.card { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; background: none; padding: 0 2px 2px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; border-bottom-width: 15px; color: var(--ink); }
.card:hover, .card:focus-visible { border-image: var(--box-sel) 5 fill / 15px stretch; background: none; outline: none; }
.card:active { transform: none; }
.card.open { color: var(--muted); align-items: center; justify-content: center; min-height: 150px; text-align: center; }
.card .pic { height: 92px; display: flex; align-items: center; justify-content: center; }
.card .pic img { max-width: 100%; max-height: 90px; object-fit: contain; }
.card .pic img.px { image-rendering: pixelated; height: 80px; }
.card .pic .letter { font-size: 34px; color: var(--line); font-family: var(--display); }
.card .num { color: var(--muted); font-size: 13px; }
.card .name { font-family: var(--display); font-size: 17px; overflow-wrap: anywhere; line-height: 1.2; }
.pending { color: var(--pink); font-size: 12px; font-family: var(--display); }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.type, .plate { display: inline-block; color: #ffffff; padding: 1px 8px; font-size: 13px; text-transform: uppercase; text-shadow: 1px 1px 0 rgba(0, 0, 0, .45); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .28), inset 0 5px 0 rgba(255, 255, 255, .22);
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.meter { height: 9px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); margin: 6px 3px 2px; }
.meter i { display: block; height: 100%; background: linear-gradient(180deg, #a8f0a0 0 3px, #58c058 3px); }

/* the list, as a menu box */
.dexlist { width: 100%; border-collapse: collapse; font-size: 15px; }
.listbox { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0; }
.dexlist th { position: sticky; top: 0; background: var(--pri); color: #ffffff; text-shadow: 1px 1px 0 var(--pri-edge); text-align: left; padding: 6px 6px; cursor: pointer; user-select: none; white-space: nowrap; z-index: 1; font-size: 14px; }
.dexlist th.num, .dexlist td.num { text-align: right; width: 40px; }
.dexlist th[aria-sort] { background: var(--pink); text-shadow: 1px 1px 0 var(--pink-edge); }
.dexlist td { padding: 4px 6px; border-top: 2px dashed var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
.dexlist tr.mon { cursor: pointer; }
.dexlist tr.mon:hover td, .dexlist tr.mon:focus-visible td { background: var(--soft); }
.dexlist tr.mon td:first-child { position: relative; padding-left: 20px; }
.dexlist tr.mon:hover td:first-child::before, .dexlist tr.mon:focus-visible td:first-child::before { content: "▶"; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); color: var(--cursor); font-family: var(--display); }
.dexlist tr.mon:focus-visible { outline: none; }
.dexlist .ico { width: 40px; height: 40px; object-fit: contain; display: block; }
.dexlist .ico.px { image-rendering: pixelated; }
.dexlist .nm { font-family: var(--display); font-size: 16px; white-space: nowrap; }
.dexlist .ab { font-size: 13px; color: var(--muted); line-height: 1.25; }
.dexlist .bst { font-family: var(--display); }
.dexlist .types { flex-wrap: nowrap; }
.stage img.silhouette { filter: brightness(0); opacity: .55; }
.dexlist .stat-lo { color: var(--bad); } .dexlist .stat-hi { color: var(--good); }
.viewtoggle { display: flex; }
.viewtoggle button[aria-pressed=true], .views button[aria-pressed=true], .toolbar button[aria-pressed=true], .filters button[aria-pressed=true] { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); }

/* ---------- the two screens ---------- */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); width: min(1280px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; }
dialog::backdrop { background: rgba(16, 8, 36, .72); }
.detail { padding: 6px; }
.ds { display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch; }
.screen { flex: 1 1 520px; min-width: 0; position: relative; border: 3px solid #241c3c; box-shadow: 0 0 0 3px #c9c0dc, 0 0 0 6px #241c3c; margin: 6px; }
.ds.wide .screen { flex-basis: 100%; }
.screen.top { background: var(--top) center top / cover no-repeat; padding: 16px; display: flex; flex-direction: column; min-height: 560px; }
.ds.wide .screen.top { min-height: 0; }
#detail .ds:not(.wide) > .screen.top { position: sticky; top: 6px; align-self: flex-start; z-index: 2; }
@media (max-width: 1100px) { #detail .ds:not(.wide) > .screen.top { position: static; align-self: stretch; } }
#detail .ds.wide > .screen.top { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 0 16px; }
#detail .ds.wide > .screen.top .namebar { flex-basis: 100%; }
#detail .ds.wide > .screen.top .stage { flex: 0 1 320px; min-height: 190px; }
#detail .ds.wide > .screen.top .viewbtns { flex-direction: column; align-self: center; }
#detail .ds.wide > .screen.top .dlg { flex: 1 1 300px; }
.screen.bottom { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 0; min-height: 560px; background: var(--bot-purple) center bottom / cover no-repeat; }
.screen.bottom[data-c=pink] { background-image: var(--bot-pink); } .screen.bottom[data-c=blue] { background-image: var(--bot-blue); } .screen.bottom[data-c=sky] { background-image: var(--bot-sky); }
.namebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.namebar .frame { padding: 0 6px; }
.namebar h3 { font-size: 28px; line-height: 1.1; }
.namebar .no { font-family: var(--display); font-size: 16px; }
.namebar .types { margin-left: auto; }
.namebar .type { font-size: 15px; padding: 3px 12px; }
.stage { flex: 1 1 auto; position: relative; min-height: 300px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 30px; }
.ds.wide .stage { min-height: 200px; }
.stage::before { content: ""; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(340px, 80%); height: 104px; background: var(--plat) center / 100% 100% no-repeat; }
.stage img { position: relative; max-width: 86%; max-height: 300px; object-fit: contain; }
.stage img.px { width: 240px; height: auto; }
.stage canvas { position: relative; margin-bottom: 18px; }
.stage img:not(.px) { border: 4px solid #ffffff; box-shadow: 0 0 0 3px #241c3c; max-height: 280px; margin-bottom: 24px; }
.stage img.px.icon { width: 128px; }
.stage .noart { position: relative; font-family: var(--display); color: #ffffff; text-shadow: 2px 2px 0 rgba(40, 20, 80, .6); font-size: 18px; margin-bottom: 40px; }
.viewbtns { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
.viewbtns button { border: 0; padding: 0 4px; background: none; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; min-height: 0; }
.viewbtns button[aria-pressed=true] { border-image: var(--box-sel) 5 fill / 15px stretch; }
.viewbtns button:active { transform: none; }
.dlg { position: relative; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 22px 2px 6px; font-family: var(--display); font-size: 17px; line-height: 1.85; min-height: 96px; white-space: pre-line; color: var(--ink); }
.dlg::after { content: "▼"; position: absolute; right: 0; bottom: -4px; color: var(--cursor); font-size: 13px; }
.dlg b { font-weight: 400; color: var(--pri); }
.screen-tabs { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
.screen-tabs button { font-size: 16px; padding: 3px 4px 6px; border-style: solid; border-width: 12px 12px 0 12px; color: #ffffff; text-shadow: 1px 1px 0 rgba(20, 10, 50, .65); background: none; }
.screen-tabs button:active { transform: none; }
.screen-tabs button[data-c=purple] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=pink] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJeIgb/GfCAbW8uMMLYjMgatt45hk8fg7eKFdwAuMZ1G1YxEAOCAsIgGknRhKyZiYFMwMLAwMDwats5kjWSbeOoxkGlEQAh/hkWEGxrUQAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=blue] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAICSn7/GfCAD/c2McLYjMgaHlzZiE8fg4KOP9wAuMYtW1YwEAN8fCIgGknRhKyZiYFMwMLAwMCwYt8zkjWSbeOoxkGlEQC5ORjmn/+rsAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=sky] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAI8Wi7/GfCAL9f2MMLYjMgaHl/YjU8fg6yBK9wAuMZtuzYxEAO83PwgGknRhKyZiYFMwMLAwMCw7sIbkjWSbeOoxkGlEQDqUxj+yNktrwAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[aria-selected=true] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR42mNkQAI2WhX/GfCAI9c6GGFsFmQNh6+249PHYKvN8B9mABNMcMeJJoavn3/jxTtONMENYbTRqviPLEAM8LCoY2BiIBOwMDAwMHx4941kjWTbOKpxUGkEANDOLnKYGqiaAAAAAElFTkSuQmCC) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: var(--pri-edge); text-shadow: none; }
.screen-tabs .right { margin-left: auto; display: flex; gap: 6px; align-items: center; padding-bottom: 4px; }
.screen-tabs .right button { border-image: none; border: 3px solid var(--edge); border-bottom-width: 5px; padding: 4px 10px; background: var(--panel); color: var(--ink); text-shadow: none; }
.screen-tabs .right button.primary { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); }
.page { flex: 1 1 auto; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 6px 6px; min-height: 0; overflow: auto; }
.page > h2:first-child, .page > div > h2:first-child { margin-top: 4px; }

/* inside the pages */
.entry { border-left: 6px solid var(--pink); background: var(--soft); padding: 8px 12px; margin-top: 10px; white-space: pre-line; }
.status { margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; font-family: var(--display); }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-size: 13px; }
.stat td:first-child { width: 96px; }
.stat td:first-child span { display: inline-block; background: var(--pri); color: #ffffff; font-family: var(--display); font-size: 13px; padding: 0 6px; text-shadow: 1px 1px 0 var(--pri-edge); }
.stat td:nth-child(2) { width: 44px; text-align: right; font-family: var(--display); font-size: 17px; }
.statbar { height: 10px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); background: linear-gradient(180deg, rgba(255, 255, 255, .45) 0 3px, transparent 3px), var(--sb, #58c058); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--soft); border: 2px solid var(--edge2); padding: 1px 8px; font-size: 14px; }
button.chip { font-family: var(--body); border-bottom-width: 2px; }
button.chip[aria-pressed=true] { border-color: var(--gold); background: var(--soft); box-shadow: inset 0 0 0 2px var(--gold); }
.match { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; font-family: var(--display); }
.sim { background: var(--soft); padding: 12px; overflow-x: auto; border: 2px dashed var(--line); }
.sim input[type=range] { width: 100%; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 6px 0 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-family: var(--display); }
.field input, .field select, .field textarea { width: 100%; }
.field.wide { grid-column: 1 / -1; }
.statedit { display: grid; grid-template-columns: 90px 70px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.statedit > span { font-family: var(--display); font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; }
.row > .tiny { flex: 0 1 80px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.section { border-top: 3px dashed var(--line); margin: 6px 0; }
.section > summary { cursor: pointer; padding: 10px 4px 10px 22px; display: flex; gap: 8px; align-items: center; list-style: none; position: relative; color: var(--pri); font-size: 16px; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: "▶"; position: absolute; left: 2px; color: var(--cursor); font-size: 13px; }
.section[open] > summary::before { content: "▼"; }
.section > summary .count { margin-left: auto; font-size: 13px; color: var(--muted); }
.section > .body { padding: 0 4px 12px; }
.savebar { position: sticky; bottom: 0; margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-style: solid; border-width: 15px; border-image: var(--box-sel) 5 fill / 15px stretch; padding: 0 4px 2px; z-index: 2; }
.savebar .ask { font-family: var(--display); }
.badge { font-size: 12px; padding: 0 7px; border: 2px solid var(--edge2); color: var(--muted); white-space: nowrap; font-family: var(--display); }
.badge.done { color: var(--good); border-color: var(--good); }
.badge.need { color: var(--warn); border-color: var(--warn); }
.badge.ai { color: var(--blue); border-color: var(--blue); }
.card .line { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--soft); border: 2px solid var(--edge2); padding: 6px; font-size: 12px; color: var(--muted); }
.gallery img { width: 100%; height: 116px; object-fit: contain; display: block; }
.gallery figcaption { margin-top: 4px; overflow-wrap: anywhere; }
.box { background: var(--soft); border: 2px dashed var(--line); padding: 12px; margin-top: 10px; }
.dropzone { border: 3px dashed var(--edge2); background: var(--soft); padding: 16px; text-align: center; margin-top: 10px; }
.dropzone.over { border-color: var(--pink); background: var(--panel); }
.dropzone b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--pri); display: block; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
.ok { color: var(--good); }
.scroll { overflow-x: auto; }
.xclose { display: none; }

/* sprite studio (inside the bottom screen, which then spans the width) */
.step { display: flex; gap: 10px; align-items: baseline; margin: 18px 0 8px; }
.step b.n { flex: none; width: 26px; height: 26px; line-height: 26px; text-align: center; background: var(--pink); color: #fff; font-size: 14px; font-family: var(--display); font-weight: 400; clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.step .what { font-family: var(--display); font-size: 17px; color: var(--pri); }
.inspo { display: flex; gap: 8px; flex-wrap: wrap; }
.inspo button { position: relative; padding: 4px; background: var(--soft); }
.inspo button[aria-pressed=true] { border-color: var(--pink); }
.inspo img { width: 76px; height: 76px; object-fit: contain; display: block; }
.inspo .order { position: absolute; top: -8px; right: -8px; background: var(--pink); color: #fff; width: 22px; height: 22px; font-size: 12px; line-height: 22px; text-align: center; font-family: var(--display); }
.queue { background: var(--soft); border: 2px dashed var(--line); padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.queue ol { margin: 4px 0 0; padding-left: 22px; }
.queue li.mine { font-weight: 700; }
.spinner { display: inline-block; width: 10px; height: 10px; background: var(--pink); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .try .bar i { transition: none; } }
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.version { flex: none; width: 108px; padding: 4px; text-align: center; font-size: 12px; background: var(--panel); }
.version[aria-pressed=true] { border-color: var(--pink); }
.version img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto; background: var(--soft); }
.version .badge { display: inline-block; margin-top: 3px; }
.version.rejected { opacity: .5; }
.studio-ed { border: 2px dashed var(--line); padding: 12px; margin-top: 8px; }
.views { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.canvaswrap { display: flex; justify-content: center; background: var(--soft); padding: 8px; }
.pixcanvas { touch-action: none; image-rendering: pixelated; cursor: crosshair; max-width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.toolbar .sep { width: 3px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatch { width: 28px; height: 28px; padding: 0; border: 3px solid var(--edge); border-bottom-width: 3px; }
.swatch[aria-pressed=true] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.swatches input[type=color] { width: 36px; height: 30px; padding: 0 2px; }
.aibox { background: var(--soft); border: 2px dashed var(--line); padding: 10px 12px; margin-top: 10px; }
.aibox .row { margin: 6px 0 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.trio { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.trio figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.trio img { image-rendering: pixelated; background: var(--soft); display: block; }

.try.picked { border-image: var(--box-sel) 5 fill / 15px stretch; }

.trypic { margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 4px;
  background: repeating-conic-gradient(var(--soft) 0% 25%, var(--panel) 0% 50%) 50% / 16px 16px; }
.trypic img { width: 100%; height: 100%; object-fit: contain; }

/* type balance, reorder */

.rrow input[type=number] { width: 70px; padding: 3px 6px; }
@media (min-width: 760px) { .reorder .bar { position: sticky; top: 8px; z-index: 1; } }

/* progress and the request board */
.split { display: flex; flex-wrap: wrap; gap: 22px; }

.counter { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: flex-end; }

.exp { display: flex; align-items: center; gap: 14px; font-family: var(--display); }
.exp .track { flex: 1; height: 14px; background: #3a3450; box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #241c3c; }
.exp .track i { display: block; height: 100%; background: linear-gradient(180deg, #a8d8ff 0 4px, #4a90e0 4px); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.badges .b { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: 13px; padding: 6px 2px; }
.badges .b.locked { opacity: .55; }

.needrow { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 76px; gap: 10px; align-items: center; padding: 4px 0; }
.needrow .track { height: 12px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); }

.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 18px; overflow-x: auto; padding: 4px 6px 10px; }
.boardcol { min-width: 230px; display: flex; flex-direction: column; }
.boardcol .colbody { flex: 1; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 2px 4px; display: flex; flex-direction: column; gap: 10px; min-height: 360px; }
.boardcol .colhead { align-self: flex-start; margin-left: 10px; font-family: var(--display); font-size: 16px; padding: 3px 6px 6px; border-style: solid; border-width: 12px 12px 0 12px; color: #ffffff; text-shadow: 1px 1px 0 rgba(20, 10, 50, .65); }
.boardcol .colhead[data-c=purple] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=pink] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJeIgb/GfCAbW8uMMLYjMgatt45hk8fg7eKFdwAuMZ1G1YxEAOCAsIgGknRhKyZiYFMwMLAwMDwats5kjWSbeOoxkGlEQAh/hkWEGxrUQAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=blue] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAICSn7/GfCAD/c2McLYjMgaHlzZiE8fg4KOP9wAuMYtW1YwEAN8fCIgGknRhKyZiYFMwMLAwMCwYt8zkjWSbeOoxkGlEQC5ORjmn/+rsAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=sky] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAI8Wi7/GfCAL9f2MMLYjMgaHl/YjU8fg6yBK9wAuMZtuzYxEAO83PwgGknRhKyZiYFMwMLAwMCw7sIbkjWSbeOoxkGlEQDqUxj+yNktrwAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.req { background: var(--soft); border: 2px solid var(--edge2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.req h4 { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.35; }
.req .meta { font-size: 13px; color: var(--muted); }
.req .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.area { display: inline-block; font-family: var(--display); font-size: 12px; color: #ffffff; padding: 0 7px; text-shadow: 1px 1px 0 rgba(0, 0, 0, .35); }

/* pickers */

.cat.Physical { background: #c4492f; } .cat.Special { background: #4a63b8; } .cat.Status { background: #7d7690; }
.picker { flex-basis: 100%; width: 100%; max-height: 340px; overflow: auto; border: 3px solid var(--pri); background: var(--panel); margin: 2px 0 8px; }
.picker table { width: 100%; border-collapse: collapse; font-size: 13px; }
.picker th { position: sticky; top: 0; background: var(--pri); color: #ffffff; text-align: left; padding: 5px 6px; cursor: pointer; white-space: nowrap; z-index: 1; }
.picker th[aria-sort] { background: var(--pink); }
.picker td { padding: 4px 6px; border-top: 2px dashed var(--line); vertical-align: top; }

/* ---------- the page itself as two screens: top = what you look at, bottom = what you do ---------- */

.home > .screen.bottom { flex: 1 1 620px; min-height: 600px; gap: 10px; }

.screen-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.home > .screen.top .exp { margin: 14px 2px 4px; color: #ffffff; text-shadow: 2px 2px 0 #3c2a78, -1px -1px 0 #3c2a78, 1px -1px 0 #3c2a78, -1px 1px 0 #3c2a78; font-size: 15px; }

/* the Pokemon page */
.namebar .frame.cat { font-family: var(--display); font-size: 14px; color: var(--muted); }
.dlg .say-title { color: var(--pri); }
.page[hidden] { display: none; }
.pagehead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 2px 0 6px; }
.pagehead h2 { margin: 0; }
.abilitybtns { display: flex; flex-wrap: wrap; gap: 6px; }

/* stat sliders: a bar like the HP bar, a number to type in, arrows for small steps */
.statrow { display: grid; grid-template-columns: 84px 64px 26px minmax(0, 1fr) 26px; gap: 8px; align-items: center; margin-bottom: 8px; }

/* body colour swatches */

.yesno .menu button:hover::before, .yesno .menu button:focus-visible::before, .yesno .menu button.hot::before { content: "▶"; position: absolute; left: 2px; color: var(--cursor); }
.yesno .menu button:focus-visible { outline: none; }
.yesno .who { font-family: var(--body); font-size: 13px; color: var(--muted); }

/* a custom move / ability form keeps a plain box */

body.dragging .dropzone { border-color: var(--pink); }

nav > button[data-c=blue] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAICSn7/GfCAD/c2McLYjMgaHlzZiE8fg4KOP9wAuMYtW1YwEAN8fCIgGknRhKyZiYFMwMLAwMCwYt8zkjWSbeOoxkGlEQC5ORjmn/+rsAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }

nav > button[aria-pressed=true], nav details[open] > summary, nav summary[aria-pressed=true] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR42mNkQAI2WhX/GfCAI9c6GGFsFmQNh6+249PHYKvN8B9mABNMcMeJJoavn3/jxTtONMENYbTRqviPLEAM8LCoY2BiIBOwMDAwMHx4941kjWTbOKpxUGkEANDOLnKYGqiaAAAAAElFTkSuQmCC) 4 4 0 4 fill / 12px 12px 0 12px stretch !important; color: var(--pri-edge); text-shadow: none; }

/* ---------- sprite studio v4: the set on the top screen, one step at a time on the bottom one ---------- */

@media (max-width: 1100px) { #detail .ds.studio > .screen.top { position: static; flex-basis: 100%; } }
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 2px 4px; }

  background: repeating-conic-gradient(var(--soft) 0% 25%, var(--panel) 0% 50%) 50% / 16px 16px; }

.slot.live .slotname small { color: var(--good); }
.studio-bottom { display: flex; flex-direction: column; gap: 0; flex: 1 1 auto; }
.stepbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 8px; }
.stepbar button { border-width: 2px 2px 4px; padding: 3px 9px 3px 4px; font-size: 14px; display: inline-flex; gap: 5px; align-items: center; }
.stepbar button b { font-weight: 400; display: inline-block; min-width: 20px; height: 20px; line-height: 20px; text-align: center; background: var(--pink); color: #fff;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.stepbar button[aria-selected=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.stepbar button[aria-selected=true] b { background: #fff; color: var(--pri); }
.stepbar .tick { color: var(--good); }
.stepbar button[aria-selected=true] .tick { color: #fff; }
.stepbar .spinner { margin: 0 0 0 2px; }
.studio-page { min-height: 420px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; margin-top: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; }
.tilepic { position: relative; height: 136px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 4px;
  background: repeating-conic-gradient(var(--soft) 0% 25%, var(--panel) 0% 50%) 50% / 16px 16px; border: 3px solid var(--edge2); border-bottom-width: 3px; }
button.tilepic:hover { border-color: var(--pri); }
button.tilepic:active { transform: none; }
.tilepic img { max-width: 100%; max-height: 124px; object-fit: contain; }
.tile.inuse .tilepic { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
.tile.broken .tilepic img, .tile.broken .tilepic canvas { opacity: .45; }
.tile.wait .tilepic { border-style: dashed; }
.tag { position: absolute; top: 3px; left: 3px; background: var(--gold); color: #2c2000; font-family: var(--display); font-size: 11px; padding: 0 5px; }
.warnmark { position: absolute; top: 3px; right: 3px; background: var(--warn); color: #fff; width: 18px; height: 18px; line-height: 18px; text-align: center; font-family: var(--display); font-size: 13px; }
.tilenote { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.3; }
.tileact { display: flex; justify-content: center; gap: 4px; }
.tryctl select { padding: 4px 6px; }
.tryctl .from img { width: 40px; height: 40px; object-fit: contain; }
.bodybox { background: var(--soft); border: 2px dashed var(--line); padding: 8px 10px; margin: 6px 0 8px; font-size: 14px; }
.grass { display: flex; gap: 18px; align-items: flex-end; justify-content: center; background: #c8e098; padding: 14px; border: 3px solid var(--edge); min-width: 180px; }
canvas.walker { image-rendering: pixelated; }
.pixeditor { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 4px 4px; display: flex; flex-direction: column; gap: 8px; }
.edhead { display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--pri); }
.edgrid { display: grid; grid-template-columns: 76px minmax(0, 1fr) 196px; gap: 10px; align-items: start; }
.toolcol { display: flex; flex-direction: column; gap: 4px; }
.tool { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; font-size: 12px; border-width: 2px 2px 4px; min-height: 0; }
.tool .ic { font-size: 18px; line-height: 1.1; font-family: var(--body); }
.tool[aria-pressed=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.edcanvas { display: flex; justify-content: center; align-items: center; background: var(--soft); padding: 4px; min-height: 260px; border: 3px solid var(--edge2); }
.edswatches { display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 4px; margin-top: 6px; }
.sidecol input[type=color] { flex: none; width: 44px; height: 34px; padding: 0 2px; }
.pixeditor .yesno .ask input { width: 100%; font-size: 14px; padding: 4px 6px; }
@media (max-width: 760px) {
  .edgrid { grid-template-columns: 1fr; }
  .toolcol { flex-direction: row; flex-wrap: wrap; }
  .tool { flex: 1 0 58px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .tilepic { height: 112px; }
  .setgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 0; }
  .slot { padding: 0 0 2px; }
  .slotpic { min-height: 64px; padding: 2px; }
  .slotpic img { width: 100% !important; max-width: 72px; }
  .slotpic canvas.walker { width: 48px !important; height: 48px !important; }
  .slotname { font-size: 12px; flex-direction: column; align-items: center; gap: 0; }
  .slot button.small { min-height: 30px; padding: 2px 6px; font-size: 12px; }
}

/* the guided first time */
.guided h2 { font-size: 20px; }
.track { display: flex; flex-wrap: wrap; gap: 4px 2px; margin: 0 0 10px; font-family: var(--display); font-size: 13px; color: var(--muted); }
.track span { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; }
.track span + span::before { content: "\25b8"; margin-right: 4px; color: var(--edge2); }
.track b { font-weight: 400; display: inline-block; min-width: 20px; height: 20px; line-height: 20px; text-align: center; background: var(--line); color: var(--muted);
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.track .past b { background: var(--good); color: #fff; }
.track .now { color: var(--pri); }
.track .now b { background: var(--pink); color: #fff; }
.howmany { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.howmany button { min-width: 44px; font-size: 18px; }
.howmany button[aria-pressed=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.eta { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 2px dashed var(--line); padding: 8px 10px; margin: 8px 0; font-family: var(--display); }
button.big { font-size: 22px; padding: 10px 24px; margin-top: 10px; }
.guided h4 .tick { color: var(--good); }

.req .acts .trash { margin-left: auto; color: var(--bad); border-color: var(--bad); }

/* the sprite tray */
.tray { position: fixed; right: 14px; bottom: 14px; z-index: 50; width: min(360px, calc(100vw - 28px)); border-style: solid; border-width: 15px;
  border-image: var(--box-sel) 5 fill / 15px stretch; padding: 0 2px 2px; box-shadow: 0 6px 18px rgba(20, 10, 50, .25); }
.tray[hidden] { display: none; }
.trayhead { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 2px; font-size: 15px; color: var(--pri); min-height: 0; }
.trayhead:active { transform: none; }
.trayhead .chev { margin-left: auto; color: var(--muted); }
.traybody { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; max-height: 46vh; overflow: auto; }
.trayrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "i who when" "i what when"; gap: 0 8px; align-items: center;
  text-align: left; border: 0; border-top: 2px dashed var(--line); background: none; padding: 5px 2px; font-family: var(--body); font-size: 14px; min-height: 0; }
.trayrow:active { transform: none; }
.trayrow:hover { background: var(--soft); }
.trayrow > :first-child { grid-area: i; }
.trayrow .who { grid-area: who; font-family: var(--display); }
.trayrow .what { grid-area: what; color: var(--muted); font-size: 13px; }
.trayrow .when { grid-area: when; font-family: var(--display); font-size: 13px; white-space: nowrap; }
.trayrow.mine .who { color: var(--pink); }
.trayrow.ready .when { color: var(--good); }
.trayrow .dot { width: 8px; height: 8px; background: var(--edge2); display: inline-block; }
.tray .tick { color: var(--good); font-family: var(--display); }
.trayoff { color: var(--warn); font-size: 13px; padding: 4px 2px; }
.traynote { color: var(--muted); font-size: 12px; padding: 6px 2px 0; border-top: 2px dashed var(--line); }
@media (max-width: 760px) { .tray { right: 8px; bottom: 8px; } }
</style>
</head>

_by_claude": ["body shape", "look", "movement"], "body_shape": "an upright body on two legs with a tail", "movement": "It walks on two legs with its wings folded.", "look": "It is a big, plump seagull-like bird with a white body and head, an orange beak and orange webbed feet. It has dark wings with a green and purple oily sheen, a grey sash across its chest holding three sheathed green-crossguard swords on its back, and a small anchor mark on one wing."}, "assets": {"concept_art": "assets/concept-art/maagamad/263.webp", "front_sprite": null, "front_anim": null, "back_sprite": null, "icon": null, "footprint": null, "shiny_palette": null, "cry": null}, "engine": {"no_flip": false, "elevation": 0, "front_y_offset": null, "back_y_offset": null, "icon_palette": null, "safari_flee_rate": 0}}, "problems": ["category 'Weather Switch' is 14 characters, the game fits at most 12", "description is 211 characters, the Pokedex page fits about 168", "ability 'Weather Switch' does not exist in the game yet - check the spelling; if it is a new ability it has to be programmed"]}, {"id": "sandrema", "data": {"dex": 151, "name": "Sandrema", "credits": {"designer": "Arvind", "artist": null}, "types": ["Fairy", "Ground"], "category": null, "description": null, "height_m": null, "weight_kg": null, "body_color": null, "abilities": {"primary": null, "secondary": null, "hidden": null}, "base_stats": {"hp": 100, "attack": 100, "defense": 100, "sp_attack": 100, "sp_defense": 100, "speed": 100}, "ev_yield": null, "catch_rate": null, "base_exp": null, "growth_rate": null, "base_friendship": null, "gender": null, "egg_groups": [], "egg_cycles": null, "held_items": {"common": null, "rare": null}, "evolutions": [], "learnset": {"level_up": [], "tm_hm": [], "tutor": [], "egg": []}, "encounters": [], "design": {"concept": null, "name_origin": null, "notes": null, "wishes": null, "claude_fill": false, "filled_by_claude": ["body shape", "look", "movement"], "body_shape": "an upright body on two legs without a tail", "movement": "It walks upright on two legs.", "look": "It is a small tan-beige creature with a tall rounded head that has one big eye with a pink-purple pupil, a smooth body and two short legs. Its thin arms stretch out wide and end in large swirling rainbow-coloured clouds instead of hands."}, "assets": {"concept_art": "assets/concept-art/sandrema/293.webp", "front_sprite": null, "front_anim": null, "back_sprite": null, "icon": null, "footprint": null, "shiny_palette": null, "cry": null}, "engine": {"no_flip": false, "elevation": 0, "front_y_offset": null, "back_y_offset": null, "icon_palette": null, "safari_flee_rate": 0}}, "problems": []}], "types": ["Normal", "Fire", "Water", "Grass", "Electric", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon", "Dark", "Steel", "Fairy"], "checks": [["Identity", "types", "types"], ["Identity", "designer credit", "credits.designer"], ["Dex page", "category", "category"], ["Dex page", "description", "description"], ["Dex page", "height", "height_m"], ["Dex page", "weight", "weight_kg"], ["Dex page", "body color", "body_color"], ["Stats", "base stats", "base_stats.*"], ["Stats", "ability", "abilities.primary"], ["Stats", "EV yield", "ev_yield"], ["Stats", "catch rate", "catch_rate"], ["Stats", "base exp", "base_exp"], ["Stats", "growth rate", "growth_rate"], ["Stats", "base friendship", "base_friendship"], ["Breeding", "gender", "gender"], ["Breeding", "egg groups", "egg_groups"], ["Breeding", "egg cycles", "egg_cycles"], ["Moves", "level-up moves", "learnset.level_up"], ["Moves", "TM/HM moves", "learnset.tm_hm"], ["Location", "encounters", "encounters"], ["Design", "concept", "design.concept"], ["Art", "concept art", "assets.concept_art"], ["Art", "front sprite", "assets.front_sprite"], ["Art", "front animation frame", "assets.front_anim"], ["Art", "back sprite", "assets.back_sprite"], ["Art", "icon", "assets.icon"], ["Art", "footprint", "assets.footprint"], ["Art", "shiny palette", "assets.shiny_palette"], ["Art", "cry", "assets.cry"]], "custom": {"move": [{"id": "gravirel-s-curse", "name": "Gravirel’s Curse", "type": "Ghost", "category": "special", "power": 100, "accuracy": 100, "pp": 10, "target": "one opponent", "effect": "This move is super effective on Dark types.", "similar_to": "Freeze-Dry", "designer": "Emil"}], "ability": [{"id": "catch-master", "name": "Catch Master", "description": "Weakens wild Pokémon's resistance to Poké Balls", "effect": "Trigger: Passive. It activates when the player throws a Poké Ball at a wild Pokémon while the holder is on the field and not fainted. There is no activation message, but the ability pop-up shows on switch-in like other battle abilities.", "designer": "Emil"}, {"id": "drunken-rage", "name": "Drunken Rage", "description": "Raises Attack by two stages upon entering battle, but become confused", "effect": "When a Pokémon with Drunken Rage enters battle, its Attack rises by two stages and it becomes confused, as though it had been hit by Swagger. The effect triggers every time the Pokémon switches in, so it can be reused by switching out and back in. Since the confusion is self-inflicted, each turn while confused the Pokémon has a 33% chance of hurting itself instead of attacking, and the confusion wears off after a few turns (or immediately upon switching out). The Attack boost, however, stays until the Pokémon leaves the field or the stat is changed by another effect.", "designer": "Emil"}, {"id": "fog-of-war", "name": "Fog Of War", "description": "Shrouds the field in fog for 1 turn, raising all Pokémon's evasiveness", "effect": "When this Pokémon enters battle, a thick fog covers the field for one turn. During that turn, every Pokémon on the field (allies and opponents) has its evasiveness raised by one stage, making moves 25% less likely to hit than normal (accuracy drops to about 75%, since a +1 evasion stage is a 3/4 multiplier). The effect ends at the end of the turn it was activated. Moves that never miss, like Aerial Ace or Swift, and moves with perfect accuracy are not affected. Fog of War can only trigger once per switch-in.", "designer": "Casper & Emil"}, {"id": "trash-talker", "name": "Heckler", "description": "On switch-in, lower the Special Attack of all adjacent opponents", "effect": "When this Pokémon enters battle, it hurls insults at the opposing side, lowering the Special Attack of every adjacent opponent by one stage. It works exactly like Intimidate, but for Special Attack. It triggers once per switch-in. Pokémon with Clear Body, White Smoke, Full Metal Body, Hyper Cutter-style protections against stat drops, Mirror Armor, Oblivious, Own Tempo, Inner Focus, and Scrappy-style immunity to Intimidate-like effects are not affected, and Contrary, Defiant, Competitive, and Guard Dog react as they would to any stat drop. Substitute does not block it.", "designer": "Emil"}, {"id": "parry-stance", "name": "Parry Stance", "description": "The first hit the user takes each battle is parried, dealing no damage", "effect": "When this Pokémon enters battle, it holds a parry stance. The first damaging move that would hit it is deflected completely, so it takes no damage. The stance then breaks and the Pokémon takes 1/8 of its max HP in recoil from the shock. Once broken, Parry Stance stays down for the rest of the battle, even if the Pokémon switches out and back in. Like Disguise, it is bypassed by moves that ignore abilities (Mold Breaker and similar), and it does not block status moves, Sheer Cold-style effects that bypass it, or indirect damage like weather, poison, or hazards. Against multi-hit moves, only the first hit is parried.", "designer": "Emil"}, {"id": "punchable-face", "name": "Punchable Face", "description": "On switch-in, taunts every other Pokémon on the field for 2 turns.", "effect": "When this Pokémon enters battle, its smug expression provokes every other Pokémon on the field, opponents and its own allies alike. Affected Pokémon are Taunted for 2 turns and can only use damaging moves. The holder is not affected and can use status moves normally. The effect otherwise works like the move Taunt: switching a Pokémon out clears it, and Pokémon with Oblivious, Aroma Veil, or Own Tempo are immune. It only triggers once per switch-in.", "designer": "Emil"}, {"id": "sloth-combat", "name": "Sloth Combat", "description": "Doubles the user's Attack stat while it is asleep.", "effect": "Sloth Combat doubles the Attack stat of a Pokémon while it is asleep, the same multiplier Huge Power gives. The boost only applies while the sleep status is active, so it disappears as soon as the Pokémon wakes up. Since a sleeping Pokémon can't normally attack, the ability is only useful with moves that can be used during sleep, such as Sleep Talk and Snore, or if the Pokémon is put to sleep by Rest, which guarantees a short nap.", "designer": "Emil"}, {"id": "toxic-voice", "name": "Toxic Voice", "description": "Sound-based moves become Poison type. They may also badly poison the t", "effect": "Toxic Voice turns the user's sound-based moves into Poison-type moves, and they receive the usual same-type attack bonus (STAB). Any target hit by one of these moves has a chance of being badly poisoned, with damage that grows worse each turn. Because the moves are still sound-based, they bypass Substitute, and the type change applies to every sound move the user knows, such as Hyper Voice, Bug Buzz, and Boomburst.\nPoison type Pokémon also gain STAB from those moves.", "similar_to": "Liquid Voice", "designer": "Emil"}]}, "images": {"bergflabbser": [{"id": 4, "src": "art/bergflabbser/4.png", "caption": "Concept card posted by Slothbaby in Discord, 29 Sep 2026", "editor": "Claude (from Discord)"}, {"id": 5, "src": "art/bergflabbser/5.png", "caption": "Original sketch posted by Slothbaby in Discord, 29 Sep 2026", "editor": "Claude (from Discord)"}], "ampeel": [{"id": 169, "src": "art/ampeel/169.webp", "caption": "Concept ca // Everything that is calculated from a Pokemon's data.
function derive(s) {
  const d = s.data, stats = d.base_stats || {};
  s.bst = STATS.every(([k]) => Number.isInteger(stats[k])) ? STATS.reduce((a, [k]) => a + stats[k], 0) : null;
  // Art is made in the sprite studio, not typed in, so the "still missing" list only counts what people fill in.
  const checks = DEX.checks.filter(([section]) => section !== "Art");
  s.missing = checks.filter(([, , path]) => {
    if (path === "base_stats.*") return s.bst === null;
    return !filled(path.split(".").reduce((v, k) => (v && typeof v === "object" ? v[k] : undefined), d));
  }).map(([section, label]) => label);
  s.complete = Math.round(100 * (checks.length - s.missing.length) / checks.length);
  s.evolutions = (d.evolutions || []).filter(e => e && typeof e === "object").map(e => ({into: e.into, how: evolutionText(e)}));
  s.problems = s.problems || [];
  s.gameNeeds = gameNeeds(s);
  return s;
}

// What a Pokemon still needs before it can be put into the game (same rule as the game export).
function gameNeeds(s) {
  const d = s.data, needs = [];
  const inGame = (kind, name) => name && (new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm)).has(norm(name))
    || DEX.custom[kind].some(c => norm(c.name) === norm(name) && c.implemented));
  if (s.bst === null) needs.push("all six base stats");
  if (!(d.types || []).length || (d.types || []).some(t => !DEX.types.includes(t))) needs.push("a type");
  if (!inGame("ability", (d.abilities || {}).primary)) needs.push("an ability that exists in the game");
  if (!((d.learnset || {}).level_up || []).some(m => inGame("move", m.move))) needs.push("a level-up move that exists in the game");
  if (String(d.name || "").length > DEX.lists.name_limit) needs.push("a name of at most " + DEX.lists.name_limit + " letters");
  return needs;
}

// Large pictures are scaled down in the browser so uploads stay small.
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error(file.name + " is not a PNG, JPG, WEBP or GIF image.");
  if (file.type === "image/gif" || file.size <= 400 * 1024) {
    if (file.size > 3 * 1024 * 1024) throw new Error(file.name + " is larger than 3 MB.");
    return file;
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const encode = (type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  let blob = await encode("image/webp", 0.85);
  if (!blob || blob.type !== "image/webp") blob = await encode("image/png");       // browsers that cannot write WEBP
  if (blob.size > 3 * 1024 * 1024) {                                               // still too big: flatten onto white as JPG
    const flat = Object.assign(document.createElement("canvas"), {width: canvas.width, height: canvas.height}), ctx = flat.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, flat.width, flat.height); ctx.drawImage(canvas, 0, 0);
    blob = await new Promise(resolve => flat.toBlob(resolve, "image/jpeg", 0.85));
  }
  if (!blob || blob.size > 3 * 1024 * 1024) throw new Error(file.name + " is too large even after shrinking.");
  return new File([blob], file.name, {type: blob.type});
}

async function postForm(fn, fields) {
  const form = new FormData();
  for (const [key, value] of Object.entries(fields)) if (value !== null && value !== undefined) form.append(key, value);

  try { response = await fetch(DEX.web.url + "/functions/v1/" + fn, {method: "POST", body: form}); }
  catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || "That did not work (" + response.status + ").");
  return body;
}

function attachPicker(input, kind) {

        kind === "move" ? "No move with that name. A brand-new move can be typed in; describe it under More > New moves." : "No ability with that name. A brand-new one can be typed in; describe it under More > New abilities.") : null);

// Sends one save to the database. Throws an Error with a readable message if it fails.
async function saveEdit(kind, id, data) {
  let response;
  try {
    response = await fetch(DEX.web.url + "/rest/v1/rpc/submit_edit", {method: "POST",
      headers: {apikey: DEX.web.key, "Content-Type": "application/json"},
      body: JSON.stringify({p_key: remember.get("key"), p_kind: kind, p_id: id, p_data: data, p_editor: me()})});
  } catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.message || "The save did not go through (" + response.status + ").");
  }
}

// Removing a Pokemon from the dex: its pictures go to Lost and found, then the removal is saved
// (the import deletes its file within about 15 minutes; git and the edit log keep everything).
function removalSection(s) {
  const name = String(s.data.name || s.id);
  const typed = h("input", {type: "text", placeholder: name, "aria-label": "Type the name to confirm", autocomplete: "off"});
  const status = h("div", {class: "hint", role: "status"});
  const go = h("button", {type: "button", disabled: true, style: "border-color:var(--bad);color:var(--bad);font-weight:600"}, "Remove " + name + " from the dex");
  typed.addEventListener("input", () => { go.disabled = norm(typed.value) !== norm(name); });
  const evolvesFrom = DEX.species.filter(o => o.evolutions.some(e => e.into === s.id)).map(o => o.data.name);
  go.addEventListener("click", async () => {
    go.disabled = true;
    try {
      const pictures = imagesOf(s.id).filter(i => Number.isInteger(i.id));
      for (const [n, image] of pictures.entries()) {
        status.textContent = "Moving picture " + (n + 1) + " of " + pictures.length + " to Lost and found...";
        await moveImage(image, s.id, LOST);
      }
      status.textContent = "Removing...";
      await saveEdit("species", s.id, {deleted: true, name});
      DEX.species = DEX.species.filter(o => o !== s);
      delete DEX.images[s.id];
      DEX.species.forEach(derive); index(); closeDialog(); render();
      document.getElementById("notice").prepend(h("div", {class: "notice info"}, name + " was removed from the dex" + (pictures.length ? "; its " + pictures.length + " picture(s) are in Lost and found." : ".")));
    } catch (err) { status.textContent = err.message; go.disabled = false; }
  });
  return section("Remove this Pokemon from the dex", false, null,
    h("div", {class: "hint"}, "For a Pokemon that was dropped, or added twice. Its pictures are moved to Lost and found (More > Lost and found), so nothing is lost and they can be given to another Pokemon. ",
      evolvesFrom.length ? "It is also removed as the evolution of " + evolvesFrom.join(", ") + ". " : "",
      "The removal is stored within about 15 minutes; Arvind can bring it back from the history if it was a mistake."),
    field("Type its name to confirm", typed), h("div", {style: "margin-top:8px"}, go), status);
}

async function dbCall(name, args) {

  } catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));

// A walking sprite (128 x 64: up, down, left, right x 2 steps) as a small animation: down, left, up, right, two steps each.
const walkers = new Set();
let walkTick = 0;
setInterval(() => {
  walkTick++;
  for (const w of walkers) { if (!w.canvas.isConnected) { walkers.delete(w); continue; } w.draw(); }
}, 260);
function walker(src, scale) {
  const canvas = h("canvas", {width: 32, height: 32, class: "px walker", style: "width:" + 32 * scale + "px;height:" + 32 * scale + "px"});
  const ctx = canvas.getContext("2d"), order = [1, 1, 1, 1, 2, 2, 0, 0, 3, 3];            // column: up 0, down 1, left 2, right 3
  let im = null;
  loadPicture(src).then(x => { im = x; }).catch(() => {});
  walkers.add({canvas, draw() {
    if (!im) return;
    const col = order[Math.floor(walkTick / 4) % order.length], row = walkTick % 2;
    ctx.clearRect(0, 0, 32, 32); ctx.imageSmoothingEnabled = false; ctx.drawImage(im, col * 32, row * 32, 32, 32, 0, 0, 32, 32);
  }});
  return canvas;
}

function spriteStudio(s, startStep) {

  const pictures = imagesOf(s.id).filter(i => Number.isInteger(i.id));
  let chosen = (remember.get("refs-" + s.id) || "").split(",").map(Number).filter(id => pictures.some(p => p.id === id));
  if (!chosen.length) chosen = pictures.slice(0, 1).map(p => p.id);
  const top = h("section", {class: "screen top studio-top", "aria-label": "The sprite of " + s.data.name});
  const steps = h("div", {class: "stepbar", role: "tablist", "aria-label": "Steps"});
  const page = h("div", {class: "page studio-page"});
  const say = h("div", {class: "dlg", role: "status"});

      const what = jobs.map(j => (j.count || 1) + " " + (names[j.stage] || j.stage)).join(", then ");

      return (jobs.some(j => j.status === "running") ? "DRAWING " : "IN LINE ") + "\n" + what[0].toUpperCase() + what.slice(1) + ".\nReady in " + aboutMinutes(secondsLeft()) +

      walk: "PICK A WALKING SPRITE\nTap the one that walks best.", done: "ALL DONE!\nSave them as its sprite below."}[phase()];

  async function make(stepId, count, button) {

  // input (we cut them out automatically) and which sprites they liked before the pipeline goes on; they choose how many
  // are made (1-4), with the time it takes"). The steps: pictures -> fronts (cut out first, by itself) -> back and icon
  // (drawn as soon as a front is picked) -> walking sprite (as soon as a back is picked) -> save.
  const firstTime = () => !approved() && !(DEX.ds_sprites[s.id] || {}).front;
  const guided = () => firstTime() && remember.get("studio-full") !== "1";
  let howMany = Math.min(4, Math.max(1, Number(remember.get("studio-count")) || 3));
  const newestPick = list => list.filter(t => t.picked).sort((a, b) => String(b.picked_at).localeCompare(String(a.picked_at)))[0] || null;
  const madeFrom = (stage, front) => st.tries.filter(t => t.stage === stage && front && t.parent_try === front.id && t.status !== "failed");
  const drawing = (stage, from) => mine().some(j => j.stage === stage && (!from || j.from_try === from.id));
  function phase() {

    if (!f) return st.tries.some(t => t.stage === "front" || t.stage === "art") || drawing("art") || drawing("front") ? "front" : "start";
    if (!newestPick(madeFrom("back", f)) || !newestPick(madeFrom("icon", f))) return "backicon";
    if (!newestPick(madeFrom("follower", f))) return "walk";
    return "done";
  }
  const estimate = n => secondsFor(st.worker && st.worker.timings, "art") + n * ["front", "back", "icon", "follower"].reduce((a, k) => a + secondsFor(st.worker && st.worker.timings, k), 0);
  async function ask(stage, from, extra) {

      p_refs: stage === "art" || stage === "back" || (stage === "front" && !from) ? chosen : [], p_prompt: body, p_recipe: null, p_editor: me(), p_with_try: null}, extra || {}));
  }
  // What a pick sets going: a front -> its backs and icons; a back -> the walking sprites.

      if (t.stage === "back" && f && !drawing("follower", f)) await ask("follower", f, {p_with_try: t.id});

  }
  function guidedPage() {

    const track = h("div", {class: "track"}, [["start", "PICTURES"], ["front", "FRONT"], ["backicon", "BACK + ICON"], ["walk", "WALK"], ["done", "DONE"]].map(([id, label], i, all) => {

      [1, 2, 3, 4].map(n => h("button", {type: "button", "aria-pressed": String(n === howMany), onclick: () => { howMany = n; remember.set("studio-count", n); draw(); }}, String(n))));

    const more = (label, stage, from, extra) => h("button", {type: "button", class: "small", onclick: async ev => {
      ev.currentTarget.disabled = true;

    }}, label);
    const tilesFor = (stage, list) => {
      const waiting = [];
      for (const j of mine().filter(j => j.stage === stage)) for (let k = st.tries.filter(x => x.job_id === j.id).length; k < (j.count || 1); k++) waiting.push({waiting: true, stage});

      body = [h("h2", {style: "margin-top:4px"}, "Let's make " + s.data.name + "'s sprites!"),
        pictures.length ? [
          h("div", {class: "hint"}, "1. Tap the pictures that show " + s.data.name + " best (1 to 3; the first one matters most). The PC cuts the creature out of them by itself."),

// The same rules as dexlib.change_layout in scripts/dexlib.py (the import applies them for real). layout = ids per slot, null = empty.
function arrange(layout, ops) {

    const slot = op.to || op.at;
    if (!Number.isInteger(slot) || slot < 1 || slot > size) throw new Error("There is no slot #" + slot + ". Use a number from 1 to " + size + ".");
    if (op.op === "move") {
      const old = layout.indexOf(op.id);
      if (old < 0) throw new Error("That Pokemon is not in the dex.");
      if (layout[slot - 1] === null) { layout[old] = null; layout[slot - 1] = op.id; }
      else { layout.splice(old, 1); layout.splice(slot - 1, 0, op.id); }
    } else if (op.op === "insert") {
      if (layout[size - 1] !== null) throw new Error("The last slot (#" + size + ") is taken, so nothing can move down. Move that Pokemon first or remove an empty slot.");
      layout.splice(slot - 1, 0, null); layout.pop();
    } else if (op.op === "close") {
      if (layout[slot - 1] !== null) throw new Error("Slot #" + slot + " is not empty.");
      layout.splice(slot - 1, 1); layout.push(null);
