<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of the Sigmas Pokedex</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2f6fde; --good: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --bar: #e6e9ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1f2329; --text: #e8eaed; --muted: #9aa3ae; --line: #323841;
    --accent: #6ea2ff; --good: #4cc27e; --warn: #e0a040; --bad: #ef6b5b; --bar: #2c323a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 12px; max-width: 1200px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); }
.totals { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
.total { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.total b { display: block; font-size: 20px; }
.total span { color: var(--muted); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1200px; margin: 0 auto; padding: 8px 16px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 180px; min-width: 0; }
input[type=checkbox] { width: auto; }
a { color: var(--accent); }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.small { padding: 3px 9px; font-size: 13px; }
button:disabled { opacity: .6; cursor: default; }
main { max-width: 1200px; margin: 0 auto; padding: 4px 16px 60px; }
.notice { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin: 8px 0 14px; }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; display: block; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.open { border-style: dashed; color: var(--muted); }
.card .num { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
.card .name { font-weight: 650; font-size: 16px; margin: 2px 0 6px; overflow-wrap: anywhere; }
.flag { color: var(--warn); }
.pending { color: var(--accent); font-size: 12px; }
.types { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; }
.type { color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.meter { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(780px, calc(100vw - 20px)); max-height: calc(100vh - 20px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.detail { padding: 18px 20px 24px; }
.detail .top { display: flex; gap: 14px; align-items: flex-start; }
.detail .top img { width: 120px; height: 120px; object-fit: contain; border-radius: 10px; background: var(--bar); }
.detail h3 { margin: 0; font-size: 24px; }
.actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.entry { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-line; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stat td:first-child { width: 86px; color: var(--muted); }
.stat td:nth-child(2) { width: 40px; text-align: right; font-weight: 600; }
.statbar { height: 10px; border-radius: 5px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.match { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; }
.sim { background: var(--bg); border-radius: 10px; padding: 12px; }
.sim input[type=range] { width: 100%; padding: 0; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; min-width: 0; }
.row > .tiny { flex: 0 1 76px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); margin: 22px -20px -24px; padding: 12px 20px; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
@media (max-width: 520px) { .todo { columns: 1; } .detail .top img { width: 84px; height: 84px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub">Every Pokemon as the game will use it. Click one to see its page and to edit it. Click an open slot to add a new one.</div>
  <div class="totals" id="totals"></div>
</header>
<div class="tools">
  <input type="search" id="search" placeholder="Search name, move, ability...">
  <select id="type"><option value="">All types</option></select>
  <select id="show">
    <option value="all">All slots</option>
    <option value="filled">Has a Pokemon</option>
    <option value="todo">Not complete</option>
    <option value="problems">Has warnings</option>
    <option value="open">Open slots</option>
  </select>
</div>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dialog"><div class="detail" id="detail"></div></dialog>
<datalist id="list-moves"></datalist>
<datalist id="list-abilities"></datalist>
<datalist id="list-methods"></datalist>

function checkGrid(options, chosen) {
  const picked = new Set((chosen || []).map(norm));
  const boxes = options.map(o => [o, h("input", {type: "checkbox", checked: picked.has(norm(o))})]);
  return {el: h("div", {class: "checks"}, boxes.map(([o, box]) => h("label", {}, box, o))), read: () => boxes.filter(([, box]) => box.checked).map(([o]) => o)};
}
// Remove everything empty so only real content is saved.
function clean(value) {
  if (Array.isArray(value)) return value.map(clean).filter(filled);
  if (value && typeof value === "object") {
    const out = {};
    for (const [k, v] of Object.entries(value)) { const c = clean(v); if (filled(c) || c === 0 || c === false) out[k] = c; }
    return out;
  }
  return value;
}

function openEditor(s) {
  const isNew = !s.id, d = s.data, L = DEX.lists;
  const credits = d.credits || {}, abilities = d.abilities || {}, stats = d.base_stats || {}, ev = d.ev_yield || {}, items = d.held_items || {}, learn = d.learnset || {}, design = d.design || {};
  const f = {
    name: textInput(d.name, {required: true, maxlength: 20}),
    type1: selectInput((d.types || [])[0], DEX.types, "none yet"), type2: selectInput((d.types || [])[1], DEX.types, "none"),
    designer: textInput(credits.designer, {maxlength: 40}), artist: textInput(credits.artist, {maxlength: 40}),
    category: textInput(d.category, {maxlength: 20}),
    description: h("textarea", {rows: 4, maxlength: 400}, d.description || ""),
    height: numberInput(d.height_m, 0.1, 99, 0.1), weight: numberInput(d.weight_kg, 0.1, 999.9, 0.1),
    color: selectInput(d.body_color, L.body_colors, "not decided"),
    ability1: textInput(abilities.primary, {list: "list-abilities"}), ability2: textInput(abilities.secondary, {list: "list-abilities"}),
    hidden: textInput(abilities.hidden, {list: "list-abilities"}),
    stats: Object.fromEntries(STATS.map(([k]) => [k, numberInput(stats[k], 1, 255)])),
    ev: Object.fromEntries(STATS.map(([k]) => [k, numberInput(ev[k] || "", 0, 3)])),
    catchRate: numberInput(d.catch_rate, 1, 255), baseExp: numberInput(d.base_exp, 1, 255),
    growth: selectInput(d.growth_rate, L.growth_rates, "not decided"), friendship: numberInput(d.base_friendship, 0, 255),
    gender: selectInput(d.gender === undefined || d.gender === null ? "" : String(d.gender),
      [["87.5", "87.5% male (starters)"], ["50", "50% male"], ["100", "Always male"], ["75", "75% male"], ["25", "25% male"], ["12.5", "12.5% male"], ["0", "Always female"], ["genderless", "Genderless"]], "not decided"),
    egg1: selectInput((d.egg_groups || [])[0], L.egg_groups, "not decided"), egg2: selectInput((d.egg_groups || [])[1], L.egg_groups, "none"),
    eggCycles: numberInput(d.egg_cycles, 1, 120),
    itemCommon: textInput(items.common), itemRare: textInput(items.rare),
    concept: h("textarea", {rows: 2, maxlength: 600}, design.concept || ""), origin: textInput(design.name_origin, {maxlength: 300}),
    notes: h("textarea", {rows: 2, maxlength: 1000}, design.notes || ""),
    editor: textInput(remember.get("editor"), {maxlength: 40, placeholder: "your Discord name"}),
    key: h("input", {type: "password", value: remember.get("key"), autocomplete: "off"}),
  };
  const total = h("b", {});
  const drawTotal = () => { const v = STATS.map(([k]) => readNumber(f.stats[k])); total.textContent = v.every(x => x !== null) ? "Total " + v.reduce((a, b) => a + b, 0) : "Total -"; };
  Object.values(f.stats).forEach(el => el.addEventListener("input", drawTotal)); drawTotal();
  const others = DEX.species.filter(o => o.id !== s.id).sort((a, b) => a.data.dex - b.data.dex).map(o => [o.id, "#" + o.data.dex + " " + o.data.name]);
  const evolutions = rowList([
    {key: "into", make: v => selectInput(v, others, "evolves into...")},
    {key: "method", make: v => selectInput(v || "level", L.evolution_methods.map(m => [m, METHOD_LABELS[m] || m]))},
    {key: "level", number: true, make: v => numberInput(v, 1, 255, 1, {class: "tiny", placeholder: "level"})},
    {key: "item", make: v => textInput(v, {placeholder: "item"})},
    {key: "note", make: v => textInput(v, {placeholder: "note"})}], d.evolutions, "Add an evolution");
  const levelUp = rowList([
    {key: "level", number: true, make: v => numberInput(v, 1, 100, 1, {class: "tiny", placeholder: "level"})},
    {key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}],
    (learn.level_up || []).slice().sort((a, b) => a.level - b.level), "Add a level-up move");
  const tmhm = checkGrid(L.tm_hm, learn.tm_hm), tutor = checkGrid(L.tutor, learn.tutor);
  const egg = rowList([{key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}], (learn.egg || []).map(m => ({move: m})), "Add an egg move");
  const encounters = rowList([
    {key: "location", make: v => textInput(v, {placeholder: "place, e.g. Route 1"})},
    {key: "method", make: v => textInput(v, {list: "list-methods", placeholder: "how"})},
    {key: "levels", make: v => textInput(v === undefined || v === null ? "" : String(v), {class: "tiny", placeholder: "levels"})},
    {key: "rate", number: true, make: v => numberInput(v, 1, 100, 1, {class: "tiny", placeholder: "%"})}], d.encounters, "Add a place");
  const error = h("div", {class: "error", role: "alert"});
  const save = h("button", {class: "primary", type: "submit"}, "Save");

  function collect() {
    const out = JSON.parse(JSON.stringify(d));   // keeps what the form does not show (dex slot, art, sprite details)
    const types = [f.type1.value, f.type2.value].filter(Boolean);
    Object.assign(out, {
      name: readText(f.name), types: types.filter((t, i) => types.indexOf(t) === i),
      credits: {designer: readText(f.designer), artist: readText(f.artist)},
      category: readText(f.category), description: readText(f.description), height_m: readNumber(f.height), weight_kg: readNumber(f.weight), body_color: readText(f.color),
      abilities: {primary: readText(f.ability1), secondary: readText(f.ability2), hidden: readText(f.hidden)},
      base_stats: Object.fromEntries(STATS.map(([k]) => [k, readNumber(f.stats[k])])),
      ev_yield: Object.fromEntries(STATS.map(([k]) => [k, readNumber(f.ev[k])]).filter(([, v]) => v)),
      catch_rate: readNumber(f.catchRate), base_exp: readNumber(f.baseExp), growth_rate: readText(f.growth), base_friendship: readNumber(f.friendship),
      gender: f.gender.value === "" ? null : f.gender.value === "genderless" ? "genderless" : Number(f.gender.value),
      egg_groups: [f.egg1.value, f.egg2.value].filter((g, i, all) => g && all.indexOf(g) === i), egg_cycles: readNumber(f.eggCycles),
      held_items: {common: readText(f.itemCommon), rare: readText(f.itemRare)},
      evolutions: evolutions.read().filter(e => e.into).map(e => {
        const evo = {into: e.into, method: e.method};
        if (LEVEL_METHODS.includes(e.method)) evo.level = e.level;
        if (ITEM_METHODS.includes(e.method)) evo.item = e.item;
        if (e.note) evo.note = e.note;
        return evo; }),
      learnset: {level_up: levelUp.read().filter(m => m.move).sort((a, b) => a.level - b.level), tm_hm: tmhm.read(), tutor: tutor.read(), egg: egg.read().map(m => m.move).filter(Boolean)},
      encounters: encounters.read().filter(e => e.location).map(e => Object.assign({}, e, {levels: /^\d+$/.test(e.levels || "") ? Number(e.levels) : e.levels})),
      design: {concept: readText(f.concept), name_origin: readText(f.origin), notes: readText(f.notes)},
    });
    const result = clean(out);
    if (out.gender === 0) result.gender = 0;
    return result;
  }
  function check(data) {
    const id = isNew ? slugify(data.name || "") : s.id;
    if (!id) return "Give it a name.";
    if (isNew && byId.has(id)) return "There is already a Pokemon with that name.";
    if (DEX.species.some(o => o.id !== s.id && norm(o.data.name) === norm(data.name))) return "Another Pokemon already has that name.";
    if (Object.values(data.ev_yield || {}).reduce((a, b) => a + b, 0) > 3) return "The EV yield can be at most 3 points in total.";
    for (const e of data.evolutions || []) {
      if (LEVEL_METHODS.includes(e.method) && !e.level) return "The evolution into " + nameOf(e.into) + " needs a level (or value).";
      if (ITEM_METHODS.includes(e.method) && !e.item) return "The evolution into " + nameOf(e.into) + " needs an item.";
      if (e.method === "other" && !e.note) return "Describe how it evolves into " + nameOf(e.into) + " in the note.";
    }
    for (const m of data.learnset && data.learnset.level_up || []) if (!m.level) return "The level-up move " + m.move + " needs a level.";
    return null;
  }
  async function submit(ev) {
    ev.preventDefault();
    const data = collect(), problem = check(data);
    error.textContent = problem || "";
    if (problem) return;
    const id = isNew ? slugify(data.name) : s.id;
    save.disabled = true; save.textContent = "Saving...";
    try {
      const response = await fetch(DEX.web.url + "/rest/v1/rpc/submit_species", {method: "POST",
        headers: {apikey: DEX.web.key, "Content-Type": "application/json"},
        body: JSON.stringify({p_key: f.key.value, p_species_id: id, p_data: data, p_editor: f.editor.value})});
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(/edit key/i.test(body.message || "") ? "Wrong edit key. Ask in the Discord for the current one." : (body.message || "The save did not go through (" + response.status + ")."));
      }
      remember.set("editor", f.editor.value); remember.set("key", f.key.value);
      const entry = isNew ? {id, art: null, problems: []} : s;
      entry.data = data; entry.pending = {editor: f.editor.value.trim()}; entry.problems = [];
      if (isNew) DEX.species.push(entry);
      DEX.species.forEach(derive); index(); render(); openDetail(entry);
    } catch (err) {
      error.textContent = err.message === "Failed to fetch" ? "Could not reach the server. Check your connection and try again." : err.message;
      save.disabled = false; save.textContent = "Save";
    }
  }
  showDialog(h("form", {onsubmit: submit},
    h("div", {class: "top"}, h("div", {}, h("div", {class: "sub"}, "#" + String(d.dex).padStart(3, "0")), h("h3", {}, isNew ? "New Pokemon" : "Edit " + d.name)),
      h("div", {class: "actions"}, h("button", {type: "button", onclick: () => isNew ? closeDialog() : openDetail(s)}, "Cancel"))),
    h("div", {class: "hint"}, "Fill in what you know and leave the rest empty. Nothing is lost by saving a half-finished Pokemon."),
    h("h2", {}, "Identity"),
    h("div", {class: "fields"}, field("Name (the game fits " + L.name_limit + " letters)", f.name), field("Type 1", f.type1), field("Type 2", f.type2), field("Designed by", f.designer), field("Art by", f.artist)),
    h("h2", {}, "Pokedex page"),
    h("div", {class: "fields"}, field("Category, e.g. Seed (max " + L.category_limit + " letters)", f.category), field("Height (m)", f.height), field("Weight (kg)", f.weight), field("Body color", f.color),
      field("Pokedex entry (4 short lines)", f.description, "wide")),
    h("h2", {}, "Abilities"),
    h("div", {class: "fields"}, field("Ability 1", f.ability1), field("Ability 2 (optional)", f.ability2), field("Hidden ability (optional)", f.hidden)),
    h("h2", {}, "Base stats (1-255) - ", total),
    h("div", {class: "fields narrow"}, STATS.map(([k, label]) => field(label, f.stats[k]))),
    h("h2", {}, "EVs given when defeated (0-3, at most 3 in total)"),
    h("div", {class: "fields narrow"}, STATS.map(([k, label]) => field(label, f.ev[k]))),
    h("h2", {}, "Catching and growing"),
    h("div", {class: "fields"}, field("Catch rate (3 hard - 255 easy)", f.catchRate), field("Exp given (1-255)", f.baseExp), field("Growth rate", f.growth), field("Starting friendship (70 normal)", f.friendship)),
    h("h2", {}, "Breeding and items"),
    h("div", {class: "fields"}, field("Gender", f.gender), field("Egg group 1", f.egg1), field("Egg group 2", f.egg2), field("Egg cycles (20 normal)", f.eggCycles),
      field("Held item, common", f.itemCommon), field("Held item, rare", f.itemRare)),
    h("h2", {}, "Evolves into"), h("div", {class: "hint"}, "What THIS Pokemon turns into. Where it comes from is set on the earlier Pokemon."), evolutions.el,
    h("h2", {}, "Level-up moves"), h("div", {class: "hint"}, "Start typing to pick from the moves that exist in Emerald."), levelUp.el,
    h("h2", {}, "TM and HM moves it can learn"), tmhm.el,
    h("h2", {}, "Move tutor moves it can learn"), tutor.el,
    h("h2", {}, "Egg moves"), egg.el,
    h("h2", {}, "Where it is found"), encounters.el,
    h("h2", {}, "Design"),
    h("div", {class: "fields"}, field("What is it? (one or two sentences)", f.concept, "wide"), field("Where the name comes from", f.origin, "wide"), field("Notes", f.notes, "wide")),
    h("h2", {}, "Who is saving"),
    h("div", {class: "fields"}, field("Your name", f.editor), field("Edit key (from the Discord)", f.key)),
    h("div", {class: "savebar"}, error,
      h("div", {style: "display:flex;gap:8px"}, save, h("button", {type: "button", onclick: () => isNew ? closeDialog() : openDetail(s)}, "Cancel")))));
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("type").value, mode = document.getElementById("show").value;
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (let slot = 1; slot <= DEX.dex_size; slot++) {
    const s = bySlot.get(slot);
    if (!s) {
      if ((mode === "all" || mode === "open") && !query && !type) grid.append(h(DEX.web.url ? "button" : "div", {class: "card open", onclick: DEX.web.url ? () => openEditor({data: {dex: slot}}) : null},
        h("div", {class: "num"}, "#" + String(slot).padStart(3, "0")), h("div", {class: "name"}, "Open slot"), DEX.web.url ? h("div", {class: "pending"}, "+ Add a Pokemon") : null));
      continue;
    }
    if (mode === "open" || (mode === "todo" && s.complete === 100) || (mode === "problems" && !s.problems.length)) continue;
    if (type && !(s.data.types || []).includes(type)) continue;
    if (query && !JSON.stringify(s.data).toLowerCase().includes(query)) continue;
    grid.append(h("button", {class: "card", onclick: () => openDetail(s)},
      h("div", {class: "num"}, h("span", {}, "#" + String(slot).padStart(3, "0")), h("span", {}, s.problems.length ? h("span", {class: "flag", title: "Has warnings"}, "! ") : null, s.complete + "%")),
      h("div", {class: "name"}, s.data.name), h("div", {class: "types"}, (s.data.types || []).map(typeChip)),
      s.pending ? h("div", {class: "pending"}, "just edited") : null,
      h("div", {class: "meter"}, h("i", {style: "width:" + s.complete + "%"}))));
  }
  if (!grid.children.length) grid.append(h("div", {class: "empty"}, "Nothing matches."));
  const done = DEX.species.filter(s => s.complete === 100).length;
  const average = DEX.species.length ? Math.round(DEX.species.reduce((a, s) => a + s.complete, 0) / DEX.species.length) : 0;
  document.getElementById("totals").replaceChildren(...[[DEX.species.length + " / " + DEX.dex_size, "slots filled"], [done, "fully complete"], [average + "%", "average completeness"],
    [DEX.species.filter(s => s.problems.length).length, "with warnings"]].map(([n, label]) => h("div", {class: "total"}, h("b", {}, String(n)), h("span", {}, label))));
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id, art: null}; DEX.species.push(entry);
      }
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    render();
  } catch (e) { /* the built data is still shown */ }
}

document.getElementById("title").textContent = DEX.project;
DEX.species.forEach(derive); index();
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
document.getElementById("list-moves").append(...DEX.lists.moves.map(m => h("option", {value: m})));
document.getElementById("list-abilities").append(...DEX.lists.abilities.map(m => h("option", {value: m})));
document.getElementById("list-methods").append(...["grass", "cave", "surf", "fishing", "rock smash", "gift", "trade", "static"].map(m => h("option", {value: m})));
if (DEX.problems.length) document.getElementById("notice").append(h("div", {class: "notice"}, h("b", {}, "These edits could not be used - please fix and save them again:"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) ev.target.close(); });
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
loadRecentEdits();
