<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of the Sigmas Pokedex</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8; --soft: #eef1f5;
  --accent: #2f6fde; --good: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --bar: #e6e9ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1f2329; --text: #e8eaed; --muted: #9aa3ae; --line: #323841; --soft: #262b32;
    --accent: #6ea2ff; --good: #4cc27e; --warn: #e0a040; --bad: #ef6b5b; --bar: #2c323a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { max-width: 1100px; margin: 0 auto; padding: 18px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header .titles { flex: 1 1 260px; min-width: 0; }
h1 { margin: 0; font-size: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
h3 { margin: 0; }
.sub { color: var(--muted); }
.me { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.me input { width: 160px; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; }
input[type=checkbox] { width: auto; }
a { color: var(--accent); }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.good { border-color: var(--good); color: var(--good); font-weight: 600; }
button.small { padding: 3px 10px; font-size: 13px; }
button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
button:disabled { opacity: .55; cursor: default; }
nav { max-width: 1100px; margin: 0 auto; padding: 6px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
nav button { border-radius: 999px; padding: 6px 16px; }
nav button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
nav details { position: relative; }
nav summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; background: var(--panel); }
nav summary::-webkit-details-marker { display: none; }
nav .menu { position: absolute; z-index: 5; top: 110%; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; min-width: 210px; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
nav .menu button { border: 0; border-radius: 6px; text-align: left; padding: 8px 10px; }
nav .menu button:hover { background: var(--soft); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1100px; margin: 0 auto; padding: 10px 16px; }
.tools input[type=search] { flex: 1 1 200px; min-width: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 4px 16px 60px; }
.notice { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin: 8px 0 14px; }
.notice.info { border-color: var(--accent); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.open { border-style: dashed; color: var(--muted); align-items: center; justify-content: center; min-height: 150px; text-align: center; }
.card .pic { height: 86px; display: flex; align-items: center; justify-content: center; background: var(--soft); border-radius: 8px; }
.card .pic img { max-width: 100%; max-height: 86px; object-fit: contain; }
.card .pic img.px { image-rendering: pixelated; height: 80px; }
.card .pic .letter { font-size: 34px; font-weight: 700; color: var(--line); }
.card .num { color: var(--muted); font-size: 12px; }
.card .name { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.pending { color: var(--accent); font-size: 12px; }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.type { color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.meter { height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: auto; }
.meter i { display: block; height: 100%; background: var(--good); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(820px, calc(100vw - 20px)); max-height: calc(100vh - 20px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.detail { padding: 18px 20px 24px; }
.detail .top { display: flex; gap: 14px; align-items: flex-start; }
.detail .top .hero { width: 104px; height: 104px; object-fit: contain; border-radius: 10px; background: var(--soft); flex: none; }
.detail .top .hero.px { image-rendering: pixelated; }
.detail h3 { font-size: 24px; }
.actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0 4px; overflow-x: auto; }
.subtabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
.subtabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.entry { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; white-space: pre-line; }
.status { margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stat td:first-child { width: 86px; color: var(--muted); }
.stat td:nth-child(2) { width: 40px; text-align: right; font-weight: 600; }
.statbar { height: 10px; border-radius: 5px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.match { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; }
.sim { background: var(--soft); border-radius: 10px; padding: 12px; overflow-x: auto; }
.sim input[type=range] { width: 100%; padding: 0; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 6px 0 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; min-width: 0; }
.row > .tiny { flex: 0 1 76px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.section { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; background: var(--panel); }
.section > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; list-style: none; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: "▸"; color: var(--muted); }
.section[open] > summary::before { content: "▾"; }
.section > summary .count { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
.section > .body { padding: 0 14px 14px; }
.section h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); margin: 18px -20px -24px; padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.done { color: var(--good); border-color: var(--good); }
.badge.need { color: var(--warn); border-color: var(--warn); }
.badge.ai { color: var(--accent); border-color: var(--accent); }
.card .line { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 12px; color: var(--muted); }
.gallery img { width: 100%; height: 110px; object-fit: contain; border-radius: 6px; display: block; }
.gallery figcaption { margin-top: 4px; overflow-wrap: anywhere; }
.box { background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 10px; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
.ok { color: var(--good); }
.scroll { overflow-x: auto; }
.xclose { display: none; }

/* sprite studio */
.step { display: flex; gap: 10px; align-items: baseline; margin: 18px 0 8px; }
.step b.n { flex: none; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; }
.step .what { font-weight: 600; }
.inspo { display: flex; gap: 8px; flex-wrap: wrap; }
.inspo button { position: relative; padding: 4px; border-width: 2px; background: var(--soft); }
.inspo button[aria-pressed=true] { border-color: var(--accent); }
.inspo img { width: 76px; height: 76px; object-fit: contain; display: block; }
.inspo .order { position: absolute; top: -8px; right: -8px; background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; line-height: 22px; text-align: center; font-weight: 700; }
.queue { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.queue ol { margin: 4px 0 0; padding-left: 22px; }
.queue li.mine { font-weight: 600; }
.spinner { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.version { flex: none; width: 104px; padding: 4px; text-align: center; font-size: 12px; background: var(--panel); border-width: 2px; }
.version[aria-pressed=true] { border-color: var(--accent); }
.version img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto; background: var(--soft); border-radius: 6px; }
.version .badge { display: inline-block; margin-top: 3px; }
.version.rejected { opacity: .5; }
.studio-ed { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
.views { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.views button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.canvaswrap { display: flex; justify-content: center; background: var(--soft); border-radius: 10px; padding: 8px; }
.pixcanvas { touch-action: none; image-rendering: pixelated; cursor: crosshair; max-width: 100%; border-radius: 4px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.toolbar button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatch { width: 28px; height: 28px; padding: 0; border-radius: 6px; border: 2px solid var(--line); }
.swatch[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatches input[type=color] { width: 36px; height: 30px; padding: 0 2px; }
.aibox { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.aibox .row { margin: 6px 0 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.trio { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.trio figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.trio img { image-rendering: pixelated; background: var(--soft); border-radius: 8px; display: block; }
/* studio v3: tries, picked by people */
.trystage { border-top: 1px solid var(--line); margin-top: 14px; }
.tryctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 8px; font-size: 14px; }
.tryctl .from { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 8px; padding: 3px 8px; }
.tryctl .from img { width: 36px; height: 36px; object-fit: contain; }
.trygroup { margin: 6px 0 10px; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.try { width: 132px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.try.picked { border-color: var(--accent); }
.try.current { box-shadow: 0 0 0 2px var(--accent); }
.try.broken .trypic, .try.failed .trypic { opacity: .45; }
.try.waiting { opacity: .7; }
.trypic { margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 6px;
  background: repeating-conic-gradient(var(--soft) 0% 25%, var(--panel) 0% 50%) 50% / 16px 16px; }
.trypic img { width: 100%; height: 100%; object-fit: contain; }
img.px, .trypic img.px { image-rendering: pixelated; }
.try .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.try .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
.tryfoot { color: var(--muted); min-height: 16px; }
.tryfoot .warn { color: var(--warn); }
.tryact { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tryact button { font-size: 12px; padding: 3px 8px; }
.together { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
canvas.battle { width: 512px; max-width: 100%; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); }
.drawbox { margin: 6px 0 10px; }
canvas.drawpad { width: 480px; max-width: 100%; touch-action: none; cursor: crosshair; background: repeating-conic-gradient(var(--soft) 0% 25%, var(--panel) 0% 50%) 50% / 24px 24px; }
canvas.drawpad.px { image-rendering: pixelated; }
canvas.pcbox { width: 360px; max-width: 100%; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); display: block; margin-bottom: 6px; }

/* type balance, reorder */
.balance { width: 100%; max-width: 760px; }
.balance td { padding: 5px 6px; vertical-align: middle; }
.balance .track { position: relative; height: 14px; background: var(--bar); border-radius: 7px; min-width: 120px; }
.balance .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; }
.balance .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
.reorder .bar { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reorder .bar .grow { flex: 1 1 200px; }
.rrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; margin-bottom: 4px; }
.rrow.open { border-style: dashed; color: var(--muted); }
.rrow.moved { border-color: var(--accent); }
.rrow.over { outline: 2px solid var(--accent); }
.rrow .no { width: 44px; font-variant-numeric: tabular-nums; color: var(--muted); }
.rrow .who { flex: 1 1 140px; font-weight: 600; cursor: grab; }
.rrow input[type=number] { width: 64px; padding: 3px 6px; }
@media (min-width: 760px) { .reorder .bar { position: sticky; top: 8px; z-index: 1; } }

@media (max-width: 760px), (pointer: coarse) {
  input, select, textarea { font-size: 16px; min-height: 44px; }
  input[type=range] { min-height: 32px; }
  input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; }
  button { min-height: 44px; }
  button.small { min-height: 40px; padding: 6px 12px; }
  .swatch { width: 36px; height: 36px; min-height: 0; }
  .checks label { min-height: 40px; }
  .row > .tiny { flex: 0 1 84px; }
}
@media (max-width: 760px) {
  header { padding: 14px 16px 4px; }
  h1 { font-size: 21px; }
  .me { flex-basis: 100%; }
  .me input { flex: 1; width: auto; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  dialog { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; overscroll-behavior: contain; }
  .detail { padding: 14px 16px 24px; }
  .detail .top .hero { width: 76px; height: 76px; }
  .detail h3 { font-size: 21px; }
  .actions { flex-direction: column; flex-wrap: nowrap; }
  .savebar { margin: 18px -16px -24px; padding: 10px 16px; }
  .todo { columns: 1; }
  .xclose { display: block; position: sticky; bottom: 14px; margin: 14px 0 -10px auto; min-width: 88px; z-index: 3; background: var(--panel); border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.3); font-weight: 600; }
  .balance { min-width: 560px; }
}

/* Showdown-style list and pickers */
.dexlist { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 14px; }
.dexlist th { position: sticky; top: 0; background: var(--soft); text-align: left; padding: 6px 6px; cursor: pointer; user-select: none; white-space: nowrap; z-index: 1; }
.dexlist th.num, .dexlist td.num { text-align: right; width: 38px; }
.dexlist th[aria-sort] { color: var(--accent); }
.dexlist td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
.dexlist tr.mon { cursor: pointer; }
.dexlist tr.mon:hover td { background: var(--soft); }
.dexlist .ico { width: 40px; height: 40px; object-fit: contain; display: block; }
.dexlist .ico.px { image-rendering: pixelated; }
.dexlist .nm { font-weight: 600; white-space: nowrap; }
.dexlist .ab { font-size: 13px; color: var(--muted); line-height: 1.25; }
.dexlist .bst { font-weight: 700; }
.dexlist .stat-lo { color: var(--bad); } .dexlist .stat-hi { color: var(--good); }
.viewtoggle { display: flex; gap: 0; }
.viewtoggle button { border-radius: 0; } .viewtoggle button:first-child { border-radius: 8px 0 0 8px; } .viewtoggle button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.viewtoggle button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.cat { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; color: #fff; white-space: nowrap; }
.cat.Physical { background: #c4492f; } .cat.Special { background: #4a63b8; } .cat.Status { background: #8a8a8a; }
.picker { flex-basis: 100%; width: 100%; max-height: 340px; overflow: auto; border: 1px solid var(--accent); border-radius: 8px; background: var(--panel); margin: 2px 0 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.picker table { width: 100%; border-collapse: collapse; font-size: 13px; }
.picker th { position: sticky; top: 0; background: var(--soft); text-align: left; padding: 5px 6px; cursor: pointer; white-space: nowrap; z-index: 1; }
.picker th[aria-sort] { color: var(--accent); }
.picker td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.picker tr.opt { cursor: pointer; } .picker tr.opt:hover td, .picker tr.opt.hot td { background: var(--soft); }
.picker .nm { font-weight: 600; white-space: nowrap; }
.picker .ds { color: var(--muted); }
.picker .filters { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px; border-bottom: 1px solid var(--line); position: sticky; left: 0; }
.picker .filters button { padding: 1px 7px; font-size: 12px; min-height: 0; border-radius: 6px; }
.picker .filters button[aria-pressed=true] { outline: 2px solid var(--text); }
.movetable td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.movetable .ds { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1 id="title"></h1>
    <div class="sub" id="summary"></div>
  </div>
  <label class="me">Your name <input id="me" maxlength="40" placeholder="Discord name" autocomplete="nickname"></label>
</header>
<nav id="nav"></nav>
<div class="tools" id="tools">
  <input type="search" id="search" placeholder="Search a name, move or ability" aria-label="Search">

fused", "effect": "When a Pokémon with Drunken Rage enters battle, its Attack rises by two stages and it becomes confused, as though it had been hit by Swagger. The effect triggers every time the Pokémon switches in, so it can be reused by switching out and back in. Since the confusion is self-inflicted, each turn while confused the Pokémon has a 33% chance of hurting itself instead of attacking, and the confusion wears off after a few turns (or immediately upon switching out). The Attack boost, however, stays until the Pokémon leaves the field or the stat is changed by another effect.", "designer": "Emil"}, {"id": "fog-of-war", "name": "Fog Of War", "description": "Shrouds the field in fog for 1 turn, raising all Pokémon's evasiveness", "effect": "When this Pokémon enters battle, a thick fog covers the field for one turn. During that turn, every Pokémon on the field (allies and opponents) has its evasiveness raised by one stage, making moves 25% less likely to hit than normal (accuracy drops to about 75%, since a +1 evasion stage is a 3/4 multiplier). The effect ends at the end of the turn it was activated. Moves that never miss, like Aerial Ace or Swift, and moves with perfect accuracy are not affected. Fog of War can only trigger once per switch-in.", "designer": "Casper & Emil"}, {"id": "sloth-combat", "name": "Sloth Combat", "description": "Doubles the user's Attack stat while it is asleep.", "effect": "Sloth Combat doubles the Attack stat of a Pokémon while it is asleep, the same multiplier Huge Power gives. The boost only applies while the sleep status is active, so it disappears as soon as the Pokémon wakes up. Since a sleeping Pokémon can't normally attack, the ability is only useful with moves that can be used during sleep, such as Sleep Talk and Snore, or if the Pokémon is put to sleep by Rest, which guarantees a short nap.", "designer": "Emil"}, {"id": "toxic-voice", "name": "Toxic Voice", "description": "Sound-based moves become Poison type. They may also badly poison the t", "effect": "Toxic Voice turns the user's sound-based moves into Poison-type moves, and they receive the usual same-type attack bonus (STAB). Any target hit by one of these moves has a chance of being badly poisoned, with damage that grows worse each turn. Because the moves are still sound-based, they bypass Substitute, and the type change applies to every sound move the user knows, such as Hyper Voice, Bug Buzz, and Boomburst.\nPoison type Pokémon also gain STAB from those moves.", "similar_to": "Liquid Voice", "designer": "Emil"}]}, "images": {"bergflabbser": [{"id": 4, "src": "art/bergflabbser/4.png", "caption": "Concept card posted by Slothbaby in Discord, 29 Sep 2026", "editor": "Claude (from Discord)"}, {"id": 5, "src": "art/bergflabbser/5.png", "caption": "Original sketch posted by Slothbaby in Discord, 29 Sep 2026", "editor": "Claude (from Discord)"}], "ampeel": [{"id": 169, "src": "art/ampeel/169.webp", "caption": "Concept card from Discord, posted by johnnes3204 2026-05-02", "editor": "Claude (from Discord)"}, {"id": 363, "src": "art/ampeel/363.webp", "caption": "Sketch from Discord (#pokemon-goons), posted by johnnes3204 2026-05-01", "editor": "Claude (from Discord)"}, {"id": 392, "src": "art/ampeel/392.webp", "caption": "Cut-out from Discord, posted by johnnes3204 2026-05-02 (Named in the small evolution strip at the bottom)", "editor": "Claude (from Discord)"}, {"id": 438, "src": "art/ampeel/438.webp", "caption": "Picture from Discord, posted by johnnes3204 2026-05-01 (Name Ampeel written on the card.)", "editor": "Claude (from Discord)"}, {"id": 440, "src": "art/ampeel/440.webp", "caption": "Picture from Discord, posted by johnnes3204 2026-05-02 (Name Ampeel ex written on the card.)", "editor": "Claude (from Discord)"}], "anjane": [{"id": 170, "src": "art/anjane/170.webp", "caption": "Concept card from Discord, posted by SLOTHBABY 2026-05-07", "editor": "Claude (from Discord)"}, {"id": 171, "src": "art/anjane/171.webp", "caption": // Everything that is calculated from a Pokemon's data.
function derive(s) {

  // Art is made in the sprite studio, not typed in, so the "still missing" list only counts what people fill in.
  const checks = DEX.checks.filter(([section]) => section !== "Art");
  s.missing = checks.filter(([, , path]) => {
    if (path === "base_stats.*") return s.bst === null;
    return !filled(path.split(".").reduce((v, k) => (v && typeof v === "object" ? v[k] : undefined), d));
  }).map(([section, label]) => label);
  s.complete = Math.round(100 * (checks.length - s.missing.length) / checks.length);
  s.evolutions = (d.evolutions || []).filter(e => e && typeof e === "object").map(e => ({into: e.into, how: evolutionText(e)}));
  s.problems = s.problems || [];

// What a Pokemon still needs before it can be put into the game (same rule as the game export).
function gameNeeds(s) {

    || DEX.custom[kind].some(c => norm(c.name) === norm(name) && c.implemented));

// Large pictures are scaled down in the browser so uploads stay small.
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error(file.name + " is not a PNG, JPG, WEBP or GIF image.");
  if (file.type === "image/gif" || file.size <= 400 * 1024) {
    if (file.size > 3 * 1024 * 1024) throw new Error(file.name + " is larger than 3 MB.");
    return file;
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const encode = (type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  let blob = await encode("image/webp", 0.85);
  if (!blob || blob.type !== "image/webp") blob = await encode("image/png");       // browsers that cannot write WEBP
  if (blob.size > 3 * 1024 * 1024) {                                               // still too big: flatten onto white as JPG
    const flat = Object.assign(document.createElement("canvas"), {width: canvas.width, height: canvas.height}), ctx = flat.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, flat.width, flat.height); ctx.drawImage(canvas, 0, 0);
    blob = await new Promise(resolve => flat.toBlob(resolve, "image/jpeg", 0.85));
  }
  if (!blob || blob.size > 3 * 1024 * 1024) throw new Error(file.name + " is too large even after shrinking.");
  return new File([blob], file.name, {type: blob.type});
}

async function postForm(fn, fields) {
  const form = new FormData();
  for (const [key, value] of Object.entries(fields)) if (value !== null && value !== undefined) form.append(key, value);
  let response;
  try { response = await fetch(DEX.web.url + "/functions/v1/" + fn, {method: "POST", body: form}); }
  catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || "That did not work (" + response.status + ").");
  return body;
}

// Removing a Pokemon from the dex: its pictures go to Lost and found, then the removal is saved
// (the import deletes its file within about 15 minutes; git and the edit log keep everything).
function removalSection(s) {
  const name = String(s.data.name || s.id);
  const typed = h("input", {type: "text", placeholder: name, "aria-label": "Type the name to confirm", autocomplete: "off"});
  const status = h("div", {class: "hint", role: "status"});
  const go = h("button", {type: "button", disabled: true, style: "border-color:var(--bad);color:var(--bad);font-weight:600"}, "Remove " + name + " from the dex");
  typed.addEventListener("input", () => { go.disabled = norm(typed.value) !== norm(name); });
  const evolvesFrom = DEX.species.filter(o => o.evolutions.some(e => e.into === s.id)).map(o => o.data.name);
  go.addEventListener("click", async () => {
    go.disabled = true;
    try {
      const pictures = imagesOf(s.id).filter(i => Number.isInteger(i.id));
      for (const [n, image] of pictures.entries()) {
        status.textContent = "Moving picture " + (n + 1) + " of " + pictures.length + " to Lost and found...";
        await moveImage(image, s.id, LOST);
      }
      status.textContent = "Removing...";
      await saveEdit("species", s.id, {deleted: true, name});
      DEX.species = DEX.species.filter(o => o !== s);
      delete DEX.images[s.id];
      DEX.species.forEach(derive); index(); closeDialog(); render();
      document.getElementById("notice").prepend(h("div", {class: "notice info"}, name + " was removed from the dex" + (pictures.length ? "; its " + pictures.length + " picture(s) are in Lost and found." : ".")));
    } catch (err) { status.textContent = err.message; go.disabled = false; }
  });
  return section("Remove this Pokemon from the dex", false, null,
    h("div", {class: "hint"}, "For a Pokemon that was dropped, or added twice. Its pictures are moved to Lost and found (More > Lost and found), so nothing is lost and they can be given to another Pokemon. ",
      evolvesFrom.length ? "It is also removed as the evolution of " + evolvesFrom.join(", ") + ". " : "",
      "The removal is stored within about 15 minutes; Arvind can bring it back from the history if it was a mistake."),
    field("Type its name to confirm", typed), h("div", {style: "margin-top:8px"}, go), status);
}

// Pick pictures, the AI draws one DS sprite (80x80 front and back, 32x32 icon) with the approved pipeline,
// then change it: by drawing on it, or by asking the AI to change the whole sprite or a marked area.
const artUrl = path => DEX.web.url + "/storage/v1/object/public/art/" + path;
async function dbRead(path) {
  const response = await fetch(DEX.web.url + "/rest/v1/" + path, {headers: {apikey: DEX.web.key}});
  if (!response.ok) throw new Error("Could not load the sprites (" + response.status + ").");
  return response.json();
}
async function dbCall(name, args) {
  let response;
  try {
    response = await fetch(DEX.web.url + "/rest/v1/rpc/" + name, {method: "POST", headers: {apikey: DEX.web.key, "Content-Type": "application/json"}, body: JSON.stringify(args)});
  } catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.message || "That did not work (" + response.status + ").");
  }
  return response.json().catch(() => null);
}
const VIEW_NAMES = {front: "Front", back: "Back", icon: "Menu icon"};

// The line of sprite requests from everyone, and the drawing PC's state.
async function loadQueue() {

    dbRead("sprite_jobs?status=in.(queued,running)&order=id.asc&select=id,species_id,status,mode,editor,stage,count"),
    dbRead("sprite_worker?select=seen_at,state")]);

// Every picture the drawing PC makes is a try, shown while it draws (with the time it should take) and kept with the
// time it took. People pick; the machine only greys out plainly broken ones. Picked front + back + icon become a version.
const TRY_STAGES = [
  {id: "art", count: 4, what: "Cut the creature out",
   hint: "The AI draws the creature alone from the chosen pictures: one clean, full-body drawing. Skip this if a chosen picture already is one."},
  {id: "front", count: 8, what: "Front sprite",
   hint: "Drawn from the picked drawing (or, if none is picked, from the first chosen picture). Pick the ones you like."},
  {id: "back", count: 6, what: "Back sprite",

  {id: "icon", count: 8, what: "Menu icon",
   hint: "Drawn from the picked front. Odd numbers the PC box way, even numbers keep the design closer to the front."}];
const TRY_DEFAULT_SECONDS = {art: 75, front: 100, back: 55, icon: 8};
const mmss = sec => Math.floor(Math.max(0, sec) / 60) + ":" + String(Math.floor(Math.max(0, sec) % 60)).padStart(2, "0");
function secondsFor(timings, stage) {
  const t = timings || {};
  if (stage === "icon") return ((t["icon:pc"] || 8) + (t["icon:canvas"] || 8)) / 2;
  return t[stage] || TRY_DEFAULT_SECONDS[stage] || 60;
}

const loadPicture = src => new Promise((ok, no) => {
  const im = new Image(); im.crossOrigin = "anonymous";
  im.onload = () => ok(im); im.onerror = () => no(new Error("the picture did not load")); im.src = src;
});
const TRY_SIDE = {art: 640, front: 80, back: 80, icon: 32};

// Drawing on a try: new details or a changed design, right on top (Arvind, 2026-10-14). Saved as a new try of the same
// step, which can be picked and drawn from. Sprites are edited pixel by pixel; the art drawing with bigger brushes.
function drawPad(t, done) {
  const side = TRY_SIDE[t.stage], art = t.stage === "art";
  const cv = h("canvas", {width: side, height: side, class: "drawpad" + (art ? "" : " px")});
  const cx = cv.getContext("2d", {willReadFrequently: true}); cx.imageSmoothingEnabled = false;
  let tool = "pen", colour = "#303030", size = art ? 6 : 1, last = null;
  const undo = [], redo = [], msg = h("span", {class: "sub"});
  const swatches = h("div", {class: "swatches"}), toolsEl = h("div", {class: "toolbar"});
  const colourIn = h("input", {type: "color", value: colour, "aria-label": "Colour", oninput: e => { colour = e.target.value; tool = tool === "erase" ? "pen" : tool; drawTools(); }});
  const note = h("input", {type: "text", maxlength: 300, placeholder: "What did you change? (optional)", style: "flex:1;min-width:180px"});
  const hex = p => "#" + [p[0], p[1], p[2]].map(v => v.toString(16).padStart(2, "0")).join("");
  loadPicture(artUrl(t.image)).then(im => { cx.drawImage(im, 0, 0, side, side); fillSwatches(); })
    .catch(err => { msg.textContent = "Could not load the picture: " + err.message; });
  function fillSwatches() {
    const d = cx.getImageData(0, 0, side, side).data, count = new Map();
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 127) { const k = hex(d.subarray(i, i + 3)); count.set(k, (count.get(k) || 0) + 1); }
    swatches.replaceChildren(...[...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, art ? 16 : 24).map(([c]) =>
      h("button", {type: "button", class: "swatch", style: "background:" + c, title: c, "aria-pressed": String(c === colour),
        onclick: () => { colour = c; colourIn.value = c; if (tool === "erase" || tool === "pick") tool = "pen"; drawTools(); }})), colourIn);
  }
  const snap = () => { undo.push(cx.getImageData(0, 0, side, side)); if (undo.length > 60) undo.shift(); redo.length = 0; };
  const at = ev => { const r = cv.getBoundingClientRect(); return [Math.floor((ev.clientX - r.left) / r.width * side), Math.floor((ev.clientY - r.top) / r.height * side)]; };
  function dab(x, y) {
    const o = Math.floor(size / 2);
    if (tool === "erase") cx.clearRect(x - o, y - o, size, size); else { cx.fillStyle = colour; cx.fillRect(x - o, y - o, size, size); }
  }
  function stroke([x0, y0], [x1, y1]) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) dab(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n));
  }
  function flood(x, y) {
    const img = cx.getImageData(0, 0, side, side), d = img.data, i0 = (y * side + x) * 4;

      rows.map(r => h("tr", {}, h("td", {}, typeChip(r.type)), h("td", {}, h("b", {}, String(r.ours))), h("td", {}, String(r.goal)),

    h("p", {class: "sub"}, DEX.species.length + " of " + size + " slots are filled (" + open + " open)" + (typed < DEX.species.length ? ", " + (DEX.species.length - typed) + " Pokemon have no type yet" : "") + ". " +

// ---------- changing dex numbers ----------
// The same rules as dexlib.change_layout in scripts/dexlib.py (the import applies them for real). layout = ids per slot, null = empty.
function arrange(layout, ops) {
  layout = layout.slice();
  const size = layout.length;
  for (const op of ops) {
    const slot = op.to || op.at;
    if (!Number.isInteger(slot) || slot < 1 || slot > size) throw new Error("There is no slot #" + slot + ". Use a number from 1 to " + size + ".");
    if (op.op === "move") {
      const old = layout.indexOf(op.id);
      if (old < 0) throw new Error("That Pokemon is not in the dex.");
      if (layout[slot - 1] === null) { layout[old] = null; layout[slot - 1] = op.id; }
      else { layout.splice(old, 1); layout.splice(slot - 1, 0, op.id); }
    } else if (op.op === "insert") {
      if (layout[size - 1] !== null) throw new Error("The last slot (#" + size + ") is taken, so nothing can move down. Move that Pokemon first or remove an empty slot.");
      layout.splice(slot - 1, 0, null); layout.pop();
    } else if (op.op === "close") {
      if (layout[slot - 1] !== null) throw new Error("Slot #" + slot + " is not empty.");
      layout.splice(slot - 1, 1); layout.push(null);
    } else throw new Error("Unknown step.");
  }
  return layout;
}
const currentLayout = () => Array.from({length: DEX.dex_size}, (_, i) => bySlot.has(i + 1) ? bySlot.get(i + 1).id : null);
function applyLayout(layout) {
  layout.forEach((id, i) => { if (id && byId.has(id)) byId.get(id).data.dex = i + 1; });
  index();
}

// Showdown's teambuilder list: one row per Pokemon, every column sortable.

let listSort = {key: "dex", dir: 1};
const LIST_COLS = [["dex", "#"], ["name", "Name"], ["types", "Types"], ["abilities", "Abilities"], ["hidden", "Hidden"],

function listValue(s, key) {
  const d = s.data, st = d.base_stats || {}, ab = d.abilities || {};

  });
  const grid = document.getElementById("grid");
  grid.append(h("div", {class: "scroll", style: "grid-column:1/-1"}, h("table", {class: "dexlist"}, h("thead", {}, head), h("tbody", {}, rows))));
}

function render() {

  const playable = DEX.species.filter(s => !s.gameNeeds.length).length;

  if (view === "reorder" && plan) return renderReorder();

    && (!type || (s.data.types || []).includes(type)) && (!query || JSON.stringify(s.data).toLowerCase().includes(query)));

      h("div", {class: "num"}, "#" + pad(s.data.dex), s.problems.length ? h("span", {class: "badge need", style: "margin-left:6px", title: "Has warnings"}, "!") : null),

  if (!grid.children.length) grid.append(h("div", {class: "empty"}, "Nothing matches."));
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      if (row.kind === "reorder") {
        try { applyLayout(arrange(currentLayout(), Array.isArray(row.data.ops) ? row.data.ops : [])); } catch (e) { /* the import reports it */ }
        continue;
      }
      if (row.data.deleted) {                       // removed from the dex on the website
        DEX.species = DEX.species.filter(o => o.id !== row.species_id);
        delete DEX.images[row.species_id];
        DEX.species.forEach(derive); index();
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      delete row.data._base;
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Pictures uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const builtIn = new Map(Object.entries(DEX.images).flatMap(([sid, list]) => list.map(i => [i.id, sid])));
    const list = await fetch(DEX.web.url + "/rest/v1/species_images?select=id,species_id,path,caption,editor,removed&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (list.ok) {
      for (const row of await list.json()) {
        if (row.removed) DEX.images[row.species_id] = allImages(row.species_id).filter(i => i.id !== row.id);
        else if (builtIn.has(row.id) && builtIn.get(row.id) !== row.species_id) {         // moved to another Pokemon since the page was built
          const from = builtIn.get(row.id), image = allImages(from).find(i => i.id === row.id);
          DEX.images[from] = allImages(from).filter(i => i.id !== row.id);
          if (image && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push(image);
        }
        else if (!built.has(row.id) && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      if (!document.getElementById("dialog").open) render();
    }
  } catch (e) { /* the built data is still shown */ }
}
