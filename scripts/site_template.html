<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8; --soft: #eef1f5;
  --accent: #2f6fde; --good: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --bar: #e6e9ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1f2329; --text: #e8eaed; --muted: #9aa3ae; --line: #323841; --soft: #262b32;
    --accent: #6ea2ff; --good: #4cc27e; --warn: #e0a040; --bad: #ef6b5b; --bar: #2c323a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { max-width: 1100px; margin: 0 auto; padding: 18px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header .titles { flex: 1 1 260px; min-width: 0; }
h1 { margin: 0; font-size: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
h3 { margin: 0; }
.sub { color: var(--muted); }
.me { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.me input { width: 160px; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; }
input[type=checkbox] { width: auto; }
a { color: var(--accent); }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.good { border-color: var(--good); color: var(--good); font-weight: 600; }
button.small { padding: 3px 10px; font-size: 13px; }
button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
button:disabled { opacity: .55; cursor: default; }
nav { max-width: 1100px; margin: 0 auto; padding: 6px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
nav button { border-radius: 999px; padding: 6px 16px; }
nav button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
nav details { position: relative; }
nav summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; background: var(--panel); }
nav summary::-webkit-details-marker { display: none; }
nav .menu { position: absolute; z-index: 5; top: 110%; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; min-width: 210px; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
nav .menu button { border: 0; border-radius: 6px; text-align: left; padding: 8px 10px; }
nav .menu button:hover { background: var(--soft); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1100px; margin: 0 auto; padding: 10px 16px; }
.tools input[type=search] { flex: 1 1 200px; min-width: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 4px 16px 60px; }
.notice { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin: 8px 0 14px; }
.notice.info { border-color: var(--accent); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.open { border-style: dashed; color: var(--muted); align-items: center; justify-content: center; min-height: 150px; text-align: center; }
.card .pic { height: 86px; display: flex; align-items: center; justify-content: center; background: var(--soft); border-radius: 8px; }
.card .pic img { max-width: 100%; max-height: 86px; object-fit: contain; }
.card .pic img.px { image-rendering: pixelated; height: 80px; }
.card .pic .letter { font-size: 34px; font-weight: 700; color: var(--line); }
.card .num { color: var(--muted); font-size: 12px; }
.card .name { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.pending { color: var(--accent); font-size: 12px; }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.type { color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.meter { height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: auto; }
.meter i { display: block; height: 100%; background: var(--good); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(820px, calc(100vw - 20px)); max-height: calc(100vh - 20px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.detail { padding: 18px 20px 24px; }
.detail .top { display: flex; gap: 14px; align-items: flex-start; }
.detail .top .hero { width: 104px; height: 104px; object-fit: contain; border-radius: 10px; background: var(--soft); flex: none; }
.detail .top .hero.px { image-rendering: pixelated; }
.detail h3 { font-size: 24px; }
.actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0 4px; overflow-x: auto; }
.subtabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
.subtabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.entry { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; white-space: pre-line; }
.status { margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stat td:first-child { width: 86px; color: var(--muted); }
.stat td:nth-child(2) { width: 40px; text-align: right; font-weight: 600; }
.statbar { height: 10px; border-radius: 5px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.match { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; }
.sim { background: var(--soft); border-radius: 10px; padding: 12px; overflow-x: auto; }
.sim input[type=range] { width: 100%; padding: 0; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 6px 0 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; min-width: 0; }
.row > .tiny { flex: 0 1 76px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.section { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; background: var(--panel); }
.section > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; list-style: none; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: "▸"; color: var(--muted); }
.section[open] > summary::before { content: "▾"; }
.section > summary .count { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
.section > .body { padding: 0 14px 14px; }
.section h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); margin: 18px -20px -24px; padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.done { color: var(--good); border-color: var(--good); }
.badge.need { color: var(--warn); border-color: var(--warn); }
.badge.ai { color: var(--accent); border-color: var(--accent); }
.card .line { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 12px; color: var(--muted); }
.gallery img { width: 100%; height: 110px; object-fit: contain; border-radius: 6px; display: block; }
.gallery figcaption { margin-top: 4px; overflow-wrap: anywhere; }
.box { background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 10px; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
.ok { color: var(--good); }
.scroll { overflow-x: auto; }
.xclose { display: none; }

/* sprite studio */
.step { display: flex; gap: 10px; align-items: baseline; margin: 18px 0 8px; }
.step b.n { flex: none; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; }
.step .what { font-weight: 600; }
.inspo { display: flex; gap: 8px; flex-wrap: wrap; }
.inspo button { position: relative; padding: 4px; border-width: 2px; background: var(--soft); }
.inspo button[aria-pressed=true] { border-color: var(--accent); }
.inspo img { width: 76px; height: 76px; object-fit: contain; display: block; }
.inspo .order { position: absolute; top: -8px; right: -8px; background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; line-height: 22px; text-align: center; font-weight: 700; }
.queue { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.queue ol { margin: 4px 0 0; padding-left: 22px; }
.queue li.mine { font-weight: 600; }
.spinner { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.version { flex: none; width: 104px; padding: 4px; text-align: center; font-size: 12px; background: var(--panel); border-width: 2px; }
.version[aria-pressed=true] { border-color: var(--accent); }
.version img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto; background: var(--soft); border-radius: 6px; }
.version .badge { display: inline-block; margin-top: 3px; }
.version.rejected { opacity: .5; }
.studio-ed { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
.views { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.views button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.canvaswrap { display: flex; justify-content: center; background: var(--soft); border-radius: 10px; padding: 8px; }
.pixcanvas { touch-action: none; image-rendering: pixelated; cursor: crosshair; max-width: 100%; border-radius: 4px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.toolbar button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatch { width: 28px; height: 28px; padding: 0; border-radius: 6px; border: 2px solid var(--line); }
.swatch[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatches input[type=color] { width: 36px; height: 30px; padding: 0 2px; }
.aibox { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.aibox .row { margin: 6px 0 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.trio { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.trio figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.trio img { image-rendering: pixelated; background: var(--soft); border-radius: 8px; display: block; }

/* type balance, reorder */
.balance { width: 100%; max-width: 760px; }
.balance td { padding: 5px 6px; vertical-align: middle; }
.balance .track { position: relative; height: 14px; background: var(--bar); border-radius: 7px; min-width: 120px; }
.balance .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; }
.balance .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
.reorder .bar { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reorder .bar .grow { flex: 1 1 200px; }
.rrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; margin-bottom: 4px; }
.rrow.open { border-style: dashed; color: var(--muted); }
.rrow.moved { border-color: var(--accent); }
.rrow.over { outline: 2px solid var(--accent); }
.rrow .no { width: 44px; font-variant-numeric: tabular-nums; color: var(--muted); }
.rrow .who { flex: 1 1 140px; font-weight: 600; cursor: grab; }
.rrow input[type=number] { width: 64px; padding: 3px 6px; }
@media (min-width: 760px) { .reorder .bar { position: sticky; top: 8px; z-index: 1; } }

@media (max-width: 760px), (pointer: coarse) {
  input, select, textarea { font-size: 16px; min-height: 44px; }
  input[type=range] { min-height: 32px; }
  input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; }
  button { min-height: 44px; }
  button.small { min-height: 40px; padding: 6px 12px; }
  .swatch { width: 36px; height: 36px; min-height: 0; }
  .checks label { min-height: 40px; }
  .row > .tiny { flex: 0 1 84px; }
}
@media (max-width: 760px) {
  header { padding: 14px 16px 4px; }
  h1 { font-size: 21px; }
  .me { flex-basis: 100%; }
  .me input { flex: 1; width: auto; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  dialog { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; overscroll-behavior: contain; }
  .detail { padding: 14px 16px 24px; }
  .detail .top .hero { width: 76px; height: 76px; }
  .detail h3 { font-size: 21px; }
  .actions { flex-direction: column; flex-wrap: nowrap; }
  .savebar { margin: 18px -16px -24px; padding: 10px 16px; }
  .todo { columns: 1; }
  .xclose { display: block; position: sticky; bottom: 14px; margin: 14px 0 -10px auto; min-width: 88px; z-index: 3; background: var(--panel); border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.3); font-weight: 600; }
  .balance { min-width: 560px; }
}
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1 id="title"></h1>
    <div class="sub" id="summary"></div>
  </div>
  <label class="me">Your name <input id="me" maxlength="40" placeholder="Discord name" autocomplete="nickname"></label>
</header>
<nav id="nav"></nav>
<div class="tools" id="tools">
  <input type="search" id="search" placeholder="Search a name, move or ability" aria-label="Search">
  <select id="type" aria-label="Type"><option value="">Any type</option></select>
  <select id="show" aria-label="Show">
    <option value="filled">All Pokemon</option>
    <option value="todo">Needs work</option>
    <option value="playable">Playable in the game</option>
    <option value="problems">Has warnings</option>
    <option value="open">Open slots</option>
  </select>
</div>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dialog"><div class="detail" id="detail"></div></dialog>
<datalist id="list-moves"></datalist>
<datalist id="list-abilities"></datalist>
<datalist id="list-methods"></datalist>
<script>
const DEX = /*DATA*/null;
DEX.ds_sprites = DEX.ds_sprites || {};
const TYPE_COLORS = {Normal:"#8a8a6a",Fire:"#e2622a",Water:"#4a7fe0",Grass:"#4f9a3a",Electric:"#c9a300",Ice:"#4fa9a9",
  Fighting:"#b0362e",Poison:"#93409a",Ground:"#b8963e",Flying:"#8d78d8",Psychic:"#e0457a",Bug:"#8a9a1e",Rock:"#a08a36",
  Ghost:"#65508c",Dragon:"#6a3be0",Dark:"#5e4a3c",Steel:"#7f7f96",Fairy:"#c96c8c"};
// attacker -> defender -> multiplier (Emerald's chart, plus Fairy as in the newer games)
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5}, Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5}, Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
  Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0,Fairy:2}, Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
  Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5}, Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
  Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5}, Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Dragon:{Dragon:2,Steel:.5,Fairy:0}, Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5,Fairy:.5},
  Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2}, Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5}};
const STATS = [["hp","HP"],["attack","Attack"],["defense","Defense"],["sp_attack","Sp. Atk"],["sp_defense","Sp. Def"],["speed","Speed"]];
const METHOD_LABELS = {level:"Reaches a level", item:"Item is used on it", trade:"Is traded", trade_item:"Is traded holding an item",
  friendship:"High friendship", friendship_day:"High friendship, by day", friendship_night:"High friendship, at night",
  level_attack_higher:"Level, Attack higher than Defense", level_attack_equal:"Level, Attack equals Defense",
  level_defense_higher:"Level, Defense higher than Attack", beauty:"Beauty reaches a value", other:"Something else (describe in note)"};
const LEVEL_METHODS = ["level", "level_attack_higher", "level_attack_equal", "level_defense_higher", "beauty"];
const ITEM_METHODS = ["item", "trade_item"];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
const typeChip = t => h("span", {class: "type", style: "background:" + (TYPE_COLORS[t] || "#777")}, t);
const filled = v => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length) && !(typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);
const show = v => filled(v) ? String(v) : h("span", {class: "empty"}, "not decided");
const norm = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, "");
const slugify = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const pad = n => String(n).padStart(3, "0");
// Two-tap confirmation instead of confirm(), which in-app browsers can block.
function sure(button, ask, action) {
  if (button.dataset.sure) { action(); return; }
  const label = button.textContent;
  button.dataset.sure = "1"; button.textContent = ask;
  setTimeout(() => { delete button.dataset.sure; button.textContent = label; }, 4000);
}
const remember = { get(k) { try { return localStorage.getItem("sigma-" + k) || ""; } catch (e) { return ""; } },
                   set(k, v) { try { localStorage.setItem("sigma-" + k, v); } catch (e) {} } };

function evolutionText(e) {
  const m = e.method;
  if (m === "level") return "Lv " + e.level;
  if (m === "level_attack_higher") return "Lv " + e.level + " (Attack > Defense)";
  if (m === "level_attack_equal") return "Lv " + e.level + " (Attack = Defense)";
  if (m === "level_defense_higher") return "Lv " + e.level + " (Attack < Defense)";
  if (m === "item") return String(e.item);
  if (m === "trade") return "Trade";
  if (m === "trade_item") return "Trade holding " + e.item;
  if (m === "friendship") return "Friendship";
  if (m === "friendship_day") return "Friendship (day)";
  if (m === "friendship_night") return "Friendship (night)";
  if (m === "beauty") return "Beauty " + e.level;
  return "Other: " + (e.note || "");
}

// Everything that is calculated from a Pokemon's data.
function derive(s) {
  const d = s.data, stats = d.base_stats || {};
  s.bst = STATS.every(([k]) => Number.isInteger(stats[k])) ? STATS.reduce((a, [k]) => a + stats[k], 0) : null;
  // Art is made in the sprite studio, not typed in, so the "still missing" list only counts what people fill in.
  const checks = DEX.checks.filter(([section]) => section !== "Art");
  s.missing = checks.filter(([, , path]) => {
    if (path === "base_stats.*") return s.bst === null;
    return !filled(path.split(".").reduce((v, k) => (v && typeof v === "object" ? v[k] : undefined), d));
  }).map(([section, label]) => label);
  s.complete = Math.round(100 * (checks.length - s.missing.length) / checks.length);
  s.evolutions = (d.evolutions || []).filter(e => e && typeof e === "object").map(e => ({into: e.into, how: evolutionText(e)}));
  s.problems = s.problems || [];
  s.gameNeeds = gameNeeds(s);
  return s;
}

// What a Pokemon still needs before it can be put into the game (same rule as the game export).
function gameNeeds(s) {
  const d = s.data, needs = [];
  const inGame = (kind, name) => name && (new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm)).has(norm(name))
    || DEX.custom[kind].some(c => norm(c.name) === norm(name) && c.implemented));
  if (s.bst === null) needs.push("all six base stats");
  if (!(d.types || []).length || (d.types || []).some(t => !DEX.types.includes(t))) needs.push("a type");
  if (!inGame("ability", (d.abilities || {}).primary)) needs.push("an ability that exists in the game");
  if (!((d.learnset || {}).level_up || []).some(m => inGame("move", m.move))) needs.push("a level-up move that exists in the game");
  if (String(d.name || "").length > DEX.lists.name_limit) needs.push("a name of at most " + DEX.lists.name_limit + " letters");
  return needs;
}

function calcStat(base, level, iv, ev, nature, isHp) {
  const core = Math.floor((2 * base + iv + Math.floor(ev / 4)) * level / 100);
  return isHp ? core + level + 10 : Math.floor((core + 5) * nature);
}

        h("tr", {}, h("td", {}, "Typical"), ...STATS.map(([k]) => h("td", {}, h("b", {}, String(calcStat(stats[k], level, 15, 0, 1, k === "hp")))))),
        h("tr", {}, h("td", {}, "Highest"), ...STATS.map(([k]) => h("td", {}, String(calcStat(stats[k], level, 31, 252, k === "hp" ? 1 : 1.1, k === "hp")))))));
    } else out.append(h("div", {class: "empty"}, "Base stats are not filled in yet."));

    const evolved = s.evolutions.filter(e => /^Lv (\d+)/.test(e.how) && Number(e.how.match(/^Lv (\d+)/)[1]) <= level);
    if (evolved.length) out.append(h("div", {class: "sub", style: "margin-top:6px"}, "By this level it can have evolved into " + evolved.map(e => nameOf(e.into)).join(" or ") + "."));

}

function matchups(types) {
  const known = types.filter(t => CHART[t]);
  if (!known.length) return h("div", {class: "empty"}, "No type yet.");
  const groups = {};
  for (const attacker of Object.keys(CHART)) {
    const mult = known.reduce((m, t) => m * (CHART[attacker][t] ?? 1), 1);
    if (mult !== 1) (groups[mult] ||= []).push(attacker);
  }
  const labels = [[4, "Takes 4x"], [2, "Takes 2x"], [.5, "Takes 1/2"], [.25, "Takes 1/4"], [0, "Immune to"]];
  return h("div", {class: "match"}, labels.filter(([m]) => groups[m]).flatMap(([m, label]) => [h("span", {}, label), h("div", {class: "types"}, groups[m].map(typeChip))]));
}

// Large pictures are scaled down in the browser so uploads stay small.
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error(file.name + " is not a PNG, JPG, WEBP or GIF image.");
  if (file.type === "image/gif" || file.size <= 400 * 1024) {
    if (file.size > 3 * 1024 * 1024) throw new Error(file.name + " is larger than 3 MB.");
    return file;
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const encode = (type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  let blob = await encode("image/webp", 0.85);
  if (!blob || blob.type !== "image/webp") blob = await encode("image/png");       // browsers that cannot write WEBP
  if (blob.size > 3 * 1024 * 1024) {                                               // still too big: flatten onto white as JPG
    const flat = Object.assign(document.createElement("canvas"), {width: canvas.width, height: canvas.height}), ctx = flat.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, flat.width, flat.height); ctx.drawImage(canvas, 0, 0);
    blob = await new Promise(resolve => flat.toBlob(resolve, "image/jpeg", 0.85));
  }
  if (!blob || blob.size > 3 * 1024 * 1024) throw new Error(file.name + " is too large even after shrinking.");
  return new File([blob], file.name, {type: blob.type});
}

async function postForm(fn, fields) {
  const form = new FormData();
  for (const [key, value] of Object.entries(fields)) if (value !== null && value !== undefined) form.append(key, value);
  let response;
  try { response = await fetch(DEX.web.url + "/functions/v1/" + fn, {method: "POST", body: form}); }
  catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || "That did not work (" + response.status + ").");
  return body;
}

function picturesTab(s, onChange) {
  const box = h("div", {});

  const caption = textInput("", {maxlength: 180, placeholder: "optional, e.g. front view, shiny idea"});
  const status = h("div", {class: "hint", role: "status"});
  const send = h("button", {class: "primary", type: "button"}, "Upload");
  function draw() {
    const list = imagesOf(s.id);
    box.replaceChildren(list.length ? h("div", {class: "gallery"}, list.map(image => h("figure", {},
      h("a", {href: image.src, target: "_blank", rel: "noopener"}, h("img", {src: image.src, alt: image.caption || "Picture of " + s.data.name, loading: "lazy"})),
      h("figcaption", {}, [image.caption, image.editor ? "by " + image.editor : null].filter(Boolean).join(" - ") || "", " ",
        DEX.web.url ? h("button", {type: "button", class: "small", onclick: ev => sure(ev.currentTarget, "Really remove?", () => remove(image))}, "Remove") : null))))
      : h("div", {class: "empty"}, "No pictures yet. Add the concept art here - the sprite studio draws from it."));
  }
  async function remove(image) {
    status.textContent = "Removing...";
    try {

    if (!files.files.length) { status.textContent = "Choose one or more pictures first."; return; }

        status.textContent = "Uploading " + (++done) + " of " + files.files.length + "...";
        const row = await postForm("species-image", {key: remember.get("key"), species_id: s.id, caption: caption.value, editor: me(), file: await prepareImage(file)});
        (DEX.images[s.id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
        draw();
      }
      files.value = ""; caption.value = ""; status.textContent = "Uploaded."; onChange && onChange(); render();
    } catch (err) { status.textContent = err.message; }
    send.disabled = false;
  });
  draw();
  return h("div", {}, box, DEX.web.url ? h("div", {class: "box"},
    h("div", {class: "fields"}, field("Add pictures: concept art, sketches (only art made by us)", files, "wide"), field("Caption", caption, "wide")),
    h("div", {style: "margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"}, send, status)) : null);
}

// Remove everything empty so only real content is saved.
function clean(value) {
  if (Array.isArray(value)) return value.map(clean).filter(filled);
  if (value && typeof value === "object") {
    const out = {};
    for (const [k, v] of Object.entries(value)) { const c = clean(v); if (filled(c) || c === 0 || c === false) out[k] = c; }
    return out;
  }
  return value;
}

  const credits = d.credits || {}, abilities = d.abilities || {}, stats = d.base_stats || {}, ev = d.ev_yield || {}, items = d.held_items || {}, learn = d.learnset || {}, design = d.design || {};
  const openSlots = Array.from({length: DEX.dex_size}, (_, i) => i + 1).filter(n => !bySlot.has(n));
  const f = {
    slot: isNew ? selectInput(String(d.dex), openSlots.map(n => [String(n), "#" + pad(n)])) : null,
    name: textInput(d.name, {required: true, maxlength: 20}),
    type1: selectInput((d.types || [])[0], DEX.types, "not decided"), type2: selectInput((d.types || [])[1], DEX.types, "none"),
    designer: textInput(credits.designer, {maxlength: 40}), artist: textInput(credits.artist, {maxlength: 40}),
    category: textInput(d.category, {maxlength: 20}),
    description: h("textarea", {rows: 3, maxlength: 400}, d.description || ""),
    height: numberInput(d.height_m, 0.1, 99, 0.1), weight: numberInput(d.weight_kg, 0.1, 999.9, 0.1),
    color: selectInput(d.body_color, L.body_colors, "not decided"),
    ability1: textInput(abilities.primary, {list: "list-abilities"}), ability2: textInput(abilities.secondary, {list: "list-abilities"}),
    hidden: textInput(abilities.hidden, {list: "list-abilities"}),
    stats: Object.fromEntries(STATS.map(([k]) => [k, numberInput(stats[k], 1, 255)])),
    ev: Object.fromEntries(STATS.map(([k]) => [k, numberInput(ev[k] || "", 0, 3)])),
    catchRate: numberInput(d.catch_rate, 1, 255), baseExp: numberInput(d.base_exp, 1, 700),
    growth: selectInput(d.growth_rate, L.growth_rates, "not decided"), friendship: numberInput(d.base_friendship, 0, 255),
    gender: selectInput(d.gender === undefined || d.gender === null ? "" : String(d.gender),
      [["87.5", "87.5% male (starters)"], ["50", "50% male"], ["100", "Always male"], ["75", "75% male"], ["25", "25% male"], ["12.5", "12.5% male"], ["0", "Always female"], ["genderless", "Genderless"]], "not decided"),
    egg1: selectInput((d.egg_groups || [])[0], L.egg_groups, "not decided"), egg2: selectInput((d.egg_groups || [])[1], L.egg_groups, "none"),
    eggCycles: numberInput(d.egg_cycles, 1, 120),
    itemCommon: textInput(items.common), itemRare: textInput(items.rare),
    concept: h("textarea", {rows: 2, maxlength: 600}, design.concept || ""), origin: textInput(design.name_origin, {maxlength: 300}),
    notes: h("textarea", {rows: 2, maxlength: 1000}, design.notes || ""),
    claudeFill: h("input", {type: "checkbox", checked: !!design.claude_fill}),
    wishes: h("textarea", {rows: 3, maxlength: 1000, placeholder: "E.g. a slow, bulky tank that walls physical attackers. Should learn Rock Slide and something with mud. Hidden ability: something about sleep."}, design.wishes || ""),
  };
  const total = h("b", {});
  const drawTotal = () => { const v = STATS.map(([k]) => readNumber(f.stats[k])); total.textContent = v.every(x => x !== null) ? "total " + v.reduce((a, b) => a + b, 0) : ""; };
  Object.values(f.stats).forEach(el => el.addEventListener("input", drawTotal)); drawTotal();
  const others = DEX.species.filter(o => o.id !== s.id).sort((a, b) => a.data.dex - b.data.dex).map(o => [o.id, "#" + o.data.dex + " " + o.data.name]);
  const evolutions = rowList([
    {key: "into", make: v => selectInput(v, others, "evolves into...")},
    {key: "method", make: v => selectInput(v || "level", L.evolution_methods.map(m => [m, METHOD_LABELS[m] || m]))},
    {key: "level", number: true, make: v => numberInput(v, 1, 255, 1, {class: "tiny", placeholder: "level"})},
    {key: "item", make: v => textInput(v, {placeholder: "item"})},
    {key: "note", make: v => textInput(v, {placeholder: "note"})}], d.evolutions, "Add an evolution");
  const levelUp = rowList([
    {key: "level", number: true, make: v => numberInput(v, 1, 100, 1, {class: "tiny", placeholder: "level"})},
    {key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}],
    (learn.level_up || []).filter(m => m.level !== 0).sort((a, b) => a.level - b.level), "Add a level-up move");
  const evoMoves = rowList([{key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}],
    (learn.level_up || []).filter(m => m.level === 0), "Add a move learned when evolving");
  const tmhm = checkGrid(L.tm_hm, learn.tm_hm);
  const tutor = rowList([{key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}], (learn.tutor || []).map(m => ({move: m})), "Add a tutor move");
  const egg = rowList([{key: "move", make: v => textInput(v, {list: "list-moves", placeholder: "move"})}], (learn.egg || []).map(m => ({move: m})), "Add an egg move");
  const encounters = rowList([
    {key: "location", make: v => textInput(v, {placeholder: "place, e.g. Route 1"})},
    {key: "method", make: v => textInput(v, {list: "list-methods", placeholder: "how"})},
    {key: "levels", make: v => textInput(v === undefined || v === null ? "" : String(v), {class: "tiny", placeholder: "levels"})},
    {key: "rate", number: true, make: v => numberInput(v, 1, 100, 1, {class: "tiny", placeholder: "%"})}], d.encounters, "Add a place");
  const error = h("div", {class: "error", role: "alert", style: "flex-basis:100%"});
  const save = h("button", {class: "primary", type: "submit"}, "Save");

  function collect() {
    const out = JSON.parse(JSON.stringify(d));   // keeps what the form does not show (art, sprite details, Claude's list)
    const types = [f.type1.value, f.type2.value].filter(Boolean);
    Object.assign(out, {
      name: readText(f.name), types: types.filter((t, i) => types.indexOf(t) === i),
      credits: {designer: readText(f.designer), artist: readText(f.artist)},
      category: readText(f.category), description: readText(f.description), height_m: readNumber(f.height), weight_kg: readNumber(f.weight), body_color: readText(f.color),
      abilities: {primary: readText(f.ability1), secondary: readText(f.ability2), hidden: readText(f.hidden)},
      base_stats: Object.fromEntries(STATS.map(([k]) => [k, readNumber(f.stats[k])])),
      ev_yield: Object.fromEntries(STATS.map(([k]) => [k, readNumber(f.ev[k])]).filter(([, v]) => v)),
      catch_rate: readNumber(f.catchRate), base_exp: readNumber(f.baseExp), growth_rate: readText(f.growth), base_friendship: readNumber(f.friendship),
      gender: f.gender.value === "" ? null : f.gender.value === "genderless" ? "genderless" : Number(f.gender.value),
      egg_groups: [f.egg1.value, f.egg2.value].filter((g, i, all) => g && all.indexOf(g) === i), egg_cycles: readNumber(f.eggCycles),
      held_items: {common: readText(f.itemCommon), rare: readText(f.itemRare)},
      evolutions: evolutions.read().filter(e => e.into).map(e => {
        const evo = {into: e.into, method: e.method};
        if (LEVEL_METHODS.includes(e.method)) evo.level = e.level;
        if (ITEM_METHODS.includes(e.method)) evo.item = e.item;
        if (e.note) evo.note = e.note;
        return evo; }),
      learnset: {level_up: evoMoves.read().filter(m => m.move).map(m => ({level: 0, move: m.move})).concat(levelUp.read().filter(m => m.move).sort((a, b) => a.level - b.level)), tm_hm: tmhm.read(), tutor: tutor.read().map(m => m.move).filter(Boolean), egg: egg.read().map(m => m.move).filter(Boolean)},
      encounters: encounters.read().filter(e => e.location).map(e => Object.assign({}, e, {levels: /^\d+$/.test(e.levels || "") ? Number(e.levels) : e.levels})),
      design: Object.assign({}, design, {concept: readText(f.concept), name_origin: readText(f.origin), notes: readText(f.notes),
        wishes: readText(f.wishes), claude_fill: f.claudeFill.checked || null}),
    });
    if (isNew) out.dex = Number(f.slot.value);
    const result = clean(out);
    if (out.gender === 0) result.gender = 0;
    return result;
  }
  function check(data) {
    const id = isNew ? slugify(data.name || "") : s.id;
    if (!id) return "Give it a name.";
    if (isNew && byId.has(id)) return "There is already a Pokemon with that name.";
    if (DEX.species.some(o => o.id !== s.id && norm(o.data.name) === norm(data.name))) return "Another Pokemon already has that name.";
    if (Object.values(data.ev_yield || {}).reduce((a, b) => a + b, 0) > 3) return "The EV yield can be at most 3 points in total.";
    for (const e of data.evolutions || []) {
      if (LEVEL_METHODS.includes(e.method) && !e.level) return "The evolution into " + nameOf(e.into) + " needs a level (or value).";
      if (ITEM_METHODS.includes(e.method) && !e.item) return "The evolution into " + nameOf(e.into) + " needs an item.";
      if (e.method === "other" && !e.note) return "Describe how it evolves into " + nameOf(e.into) + " in the note.";
    }
    for (const m of data.learnset && data.learnset.level_up || []) if (!m.level && m.level !== 0) return "The level-up move " + m.move + " needs a level.";
    return null;
  }
  async function submit(ev) {
    ev.preventDefault();
    const data = collect(), problem = check(data);
    error.textContent = problem || "";
    if (problem) return;
    const id = isNew ? slugify(data.name) : s.id;
    save.disabled = true; save.textContent = "Saving...";
    try {
      // _base = the Pokemon as it was when this form opened, so only what was changed here gets applied.
      await saveEdit("species", id, isNew ? data : Object.assign({}, data, {_base: d}));
      const entry = isNew ? {id, problems: []} : s;
      entry.data = data; entry.pending = {editor: me()}; entry.problems = [];
      if (isNew) DEX.species.push(entry);
      DEX.species.forEach(derive); index(); render(); openDetail(entry);
    } catch (err) {
      error.textContent = err.message;
      save.disabled = false; save.textContent = "Save";
    }
  }
  const cancel = () => isNew ? closeDialog() : openDetail(s);
  const statValues = STATS.map(([k]) => stats[k]);
  showDialog(h("form", {onsubmit: submit},
    h("div", {class: "top"}, h("div", {}, h("div", {class: "sub"}, isNew ? "New Pokemon" : "#" + pad(d.dex)), h("h3", {}, isNew ? "Add a Pokemon" : "Edit " + d.name)),
      h("div", {class: "actions"}, h("button", {type: "button", onclick: cancel}, "Cancel"))),
    h("div", {class: "hint"}, "Fill in what you know and leave the rest empty. Open a section to see more. A half-finished Pokemon is fine."),
    section("The basics", true, null,
      h("div", {class: "fields"}, isNew ? field("Number", f.slot) : null, field("Name (max " + L.name_limit + " letters)", f.name), field("Type", f.type1), field("Second type", f.type2),
        field("Designed by", f.designer), field("Art by", f.artist), field("What is it? (one or two sentences)", f.concept, "wide"))),
    section("Let Claude fill in the rest", !!design.claude_fill || filled(design.wishes), design.claude_fill ? "on" : null,
      h("div", {class: "hint"}, "Do not want to work out moves, stats and numbers? Tick the box and describe how it should feel to play. Claude goes through these every few days and fills in everything that is still empty - moves, abilities, stats and the rest - to match its design, types and family. What you filled in yourself is never changed, and you can change anything Claude wrote afterwards."),
      h("label", {style: "display:flex;gap:8px;align-items:center;margin-bottom:8px"}, f.claudeFill, "Let Claude fill in what is missing"),
      field("How should it play? Moves, role, anything you have in mind (optional)", f.wishes, "wide")),
    section("Pokedex page", false, countFilled([d.category, d.description, d.height_m, d.weight_kg, d.body_color]),
      h("div", {class: "fields"}, field("Category, e.g. Seed (max " + L.category_limit + " letters)", f.category), field("Height (m)", f.height), field("Weight (kg)", f.weight), field("Body color", f.color),
        field("Pokedex entry (4 short lines)", f.description, "wide"))),
    section("Abilities and stats", false, countFilled([abilities.primary, ...statValues]),
      h("div", {class: "fields"}, field("Ability", f.ability1), field("Second ability (optional)", f.ability2), field("Hidden ability (optional)", f.hidden)),
      h("h4", {}, "Base stats (1-255) ", total),
      h("div", {class: "fields narrow"}, STATS.map(([k, label]) => field(label, f.stats[k]))),
      h("h4", {}, "EVs given when defeated (0-3, at most 3 in total)"),
      h("div", {class: "fields narrow"}, STATS.map(([k, label]) => field(label, f.ev[k])))),
    section("Moves", false, ((learn.level_up || []).length || "no") + " level-up moves",
      h("div", {class: "hint"}, "Start typing to pick from the moves that exist in the game. A brand-new move can be typed in too; describe it under New moves."),
      levelUp.el,
      h("h4", {}, "Learned when it evolves into this Pokemon"), evoMoves.el,
      h("h4", {}, "TM and HM moves"), tmhm.el,
      h("h4", {}, "Move tutor moves"), tutor.el,
      h("h4", {}, "Egg moves"), egg.el),
    section("Evolution", false, (d.evolutions || []).length ? (d.evolutions || []).length + " set" : null,
      h("div", {class: "hint"}, "What THIS Pokemon turns into. Where it comes from is set on the earlier Pokemon."), evolutions.el),
    section("Catching, breeding and items", false, countFilled([d.catch_rate, d.base_exp, d.growth_rate, d.base_friendship, d.gender, (d.egg_groups || [])[0], d.egg_cycles]),
      h("div", {class: "fields"}, field("Catch rate (3 hard - 255 easy)", f.catchRate), field("Exp given (e.g. 64)", f.baseExp), field("Growth rate", f.growth), field("Starting friendship (70 normal)", f.friendship),
        field("Gender", f.gender), field("Egg group", f.egg1), field("Second egg group", f.egg2), field("Egg cycles (20 normal)", f.eggCycles),
        field("Held item, common", f.itemCommon), field("Held item, rare", f.itemRare))),
    section("Where it is found", false, (d.encounters || []).length ? (d.encounters || []).length + " places" : null, encounters.el),
    section("Design notes", false, null,
      h("div", {class: "fields"}, field("Where the name comes from", f.origin, "wide"), field("Notes", f.notes, "wide"))),
    h("div", {class: "savebar"}, error, save, h("button", {type: "button", onclick: cancel}, "Cancel"),
      h("span", {class: "sub"}, me() ? "Saved as " + me() : "Tip: write your name at the top of the page"))));
}

// ---------- new moves and abilities ----------
const KINDS = {
  move: {plural: "New moves", one: "move", used: s => { const l = s.data.learnset || {}; return [...(l.level_up || []).map(m => m.move), ...(l.tm_hm || []), ...(l.tutor || []), ...(l.egg || [])]; }},
  ability: {plural: "New abilities", one: "ability", used: s => Object.values(s.data.abilities || {})},
};
const existingNames = kind => new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm));
const usedBy = (kind, name) => DEX.species.filter(s => KINDS[kind].used(s).some(n => n && norm(n) === norm(name)));
// Names Pokemon use that exist neither in the game nor in our list of new ones.
function undescribed(kind) {
  const known = existingNames(kind), described = new Set(DEX.custom[kind].map(c => norm(c.name))), found = new Map();
  for (const s of DEX.species) for (const name of KINDS[kind].used(s))
    if (name && !known.has(norm(name)) && !described.has(norm(name)) && !found.has(norm(name))) found.set(norm(name), String(name));
  return [...found.values()].sort();
}
function refreshLists() {
  document.getElementById("list-moves").replaceChildren(...[...DEX.lists.moves, ...DEX.custom.move.map(c => c.name)].sort().map(m => h("option", {value: m})));
  document.getElementById("list-abilities").replaceChildren(...[...new Set([...DEX.lists.abilities, ...DEX.custom.ability.map(c => c.name)])].sort().map(m => h("option", {value: m})));
}

function openCustomEditor(kind, item) {
  const isNew = !item.id, K = KINDS[kind], L = DEX.lists, isMove = kind === "move";
  const users = item.name ? usedBy(kind, item.name) : [];
  const f = {
    name: textInput(item.name, {required: true, maxlength: isMove ? L.move_name_limit : L.ability_name_limit}),
    effect: h("textarea", {rows: 4, required: true, maxlength: 1500}, item.effect || ""),
    similar: textInput(item.similar_to, {list: isMove ? "list-moves" : "list-abilities", maxlength: 60}),
    notes: h("textarea", {rows: 2, maxlength: 1000}, item.notes || ""),
    designer: textInput(item.designer, {maxlength: 40}),
  };
  if (isMove) Object.assign(f, {
    type: selectInput(item.type, DEX.types, "choose..."), category: selectInput(item.category, L.move_categories, "choose..."),
    power: numberInput(item.power, 1, 250), accuracy: numberInput(item.accuracy, 1, 100), pp: numberInput(item.pp, 1, 40),
    priority: numberInput(item.priority, -7, 5), target: selectInput(item.target || "one opponent", L.move_targets),
    contact: h("input", {type: "checkbox", checked: !!item.contact}), chance: numberInput(item.effect_chance, 1, 100),
  });
  else f.description = textInput(item.description, {maxlength: 70});
  f.type && (f.type.required = true); f.category && (f.category.required = true); f.pp && (f.pp.required = true);
  const error = h("div", {class: "error", role: "alert", style: "flex-basis:100%"});
  const save = h("button", {class: "primary", type: "submit"}, "Save");
  async function send(data, id) {
    save.disabled = true; save.textContent = "Saving...";
    try {
      await saveEdit(kind, id, data);
      DEX.custom[kind] = DEX.custom[kind].filter(c => c.id !== id);
      if (!data.deleted) DEX.custom[kind].push(Object.assign({}, data, {id, pending: true, implemented: item.implemented}));
      refreshLists(); closeDialog(); render();
    } catch (err) { error.textContent = err.message; save.disabled = false; save.textContent = "Save"; }
  }
  function submit(ev) {
    ev.preventDefault();
    const data = clean(Object.assign({name: readText(f.name), effect: readText(f.effect), similar_to: readText(f.similar), notes: readText(f.notes), designer: readText(f.designer)},
      isMove ? {type: f.type.value, category: f.category.value, power: readNumber(f.power), accuracy: readNumber(f.accuracy), pp: readNumber(f.pp),
        priority: readNumber(f.priority), target: f.target.value, contact: f.contact.checked, effect_chance: readNumber(f.chance)} : {description: readText(f.description)}));
    if (!data.contact) delete data.contact;
    if (!data.priority) delete data.priority;
    const id = isNew ? slugify(data.name) : item.id;
    let problem = null;
    if (!id) problem = "Give it a name.";
    else if (existingNames(kind).has(norm(data.name))) problem = data.name + " already exists in the game, so it does not need to be described here.";
    else if (DEX.custom[kind].some(c => c.id !== item.id && (c.id === id || norm(c.name) === norm(data.name)))) problem = "There is already a new " + K.one + " with that name.";
    else if (isMove && data.category === "status" && data.power) problem = "A status move has no power - leave power empty.";
    else if (isMove && data.category !== "status" && !data.power) problem = "A " + data.category + " move needs a power. If the damage works in a special way, write 1 and explain it in the description.";
    error.textContent = problem || "";
    if (!problem) send(data, id);
  }
  showDialog(h("form", {onsubmit: submit},
    h("div", {class: "top"}, h("div", {}, h("div", {class: "sub"}, "New " + K.one + (item.implemented ? " - already programmed into the game" : " - has to be programmed into the game")),
        h("h3", {}, isNew ? (item.name ? "Describe " + item.name : "Add a new " + K.one) : "Edit " + item.name)),
      h("div", {class: "actions"}, h("button", {type: "button", onclick: closeDialog}, "Cancel"))),
    h("div", {class: "hint"}, "Only for " + K.plural.toLowerCase().replace("new ", "") + " that do not exist in any Pokemon game. Be exact: this text is what gets programmed."),
    users.length ? h("div", {class: "hint"}, "Used by: " + users.map(s => s.data.name).join(", ")) : null,
    isMove ? h("div", {class: "fields"}, field("Name (max " + L.move_name_limit + " letters)", f.name), field("Type", f.type), field("Category", f.category),
        field("Power (empty for status moves)", f.power), field("Accuracy % (empty = never misses)", f.accuracy), field("PP", f.pp))
      : h("div", {class: "fields"}, field("Name (max " + L.ability_name_limit + " letters)", f.name), field("Short text shown in the game", f.description, "wide")),
    h("h2", {}, "What exactly does it do?"),
    h("div", {class: "hint"}, isMove ? "Every detail: extra effects, how likely they are, stat changes and by how many stages, how many turns things last, special conditions."
      : "Every detail: when it triggers, what it changes and by how much, whether it works in doubles, what it does outside battle."),
    h("div", {class: "fields"}, field("Description", f.effect, "wide"), field("Works like this existing " + K.one + " (if any)", f.similar), field("Invented by", f.designer)),
    isMove ? section("More settings", false, null, h("div", {class: "fields"}, field("Chance of the extra effect, % (empty = always)", f.chance),
      field("Priority (empty = normal, +1 = like Quick Attack)", f.priority), field("Hits", f.target),
      h("label", {class: "field"}, h("span", {}, "Makes contact"), h("div", {}, f.contact, " yes")))) : null,
    h("div", {class: "fields", style: "margin-top:10px"}, field("Notes", f.notes, "wide")),
    h("div", {class: "savebar"}, error, save, h("button", {type: "button", onclick: closeDialog}, "Cancel"),
      !isNew ? h("button", {type: "button", style: "margin-left:auto", onclick: ev => sure(ev.currentTarget, "Really remove?", () => send({deleted: true}, item.id))}, "Remove") : null)));
}

function renderCustom(kind) {
  const K = KINDS[kind], grid = document.getElementById("grid"), query = document.getElementById("search").value.trim().toLowerCase();
  grid.replaceChildren(h("p", {class: "sub", style: "grid-column:1/-1;margin:0"}, kind === "move"
    ? "Moves that do not exist in any Pokemon game. Each one has to be programmed, so it needs an exact description. Existing moves are simply picked on a Pokemon's Edit page."
    : "Abilities that do not exist in any Pokemon game. Each one has to be programmed, so it needs an exact description."));
  if (DEX.web.url && !query) grid.append(h("button", {class: "card open", onclick: () => openCustomEditor(kind, {})}, h("div", {class: "name"}, "+ Add a new " + K.one)));
  for (const name of undescribed(kind)) {
    if (query && !name.toLowerCase().includes(query)) continue;
    grid.append(h("button", {class: "card", onclick: () => openCustomEditor(kind, {name})}, h("div", {}, h("span", {class: "badge need"}, "needs a description")),
      h("div", {class: "name"}, name), h("div", {class: "line"}, "Used by " + usedBy(kind, name).map(s => s.data.name).join(", ") + ", but nobody has described it yet.")));
  }
  for (const item of DEX.custom[kind].slice().sort((a, b) => a.name.localeCompare(b.name))) {
    if (query && !JSON.stringify(item).toLowerCase().includes(query)) continue;
    const users = usedBy(kind, item.name);
    grid.append(h("button", {class: "card", onclick: () => openCustomEditor(kind, item)},
      h("div", {}, item.implemented ? h("span", {class: "badge done"}, "in the game") : h("span", {class: "badge"}, "not programmed yet"), item.pending ? h("span", {class: "pending"}, " just edited") : null),
      h("div", {class: "name"}, item.name),
      kind === "move" ? h("div", {class: "types"}, item.type ? typeChip(item.type) : null, h("span", {class: "chip"}, [item.category, item.power ? item.power + " power" : null, item.pp ? item.pp + " PP" : null].filter(Boolean).join(" - "))) : null,
      h("div", {class: "line"}, item.effect || ""), h("div", {class: "line"}, users.length ? "Used by " + users.map(s => s.data.name).join(", ") : "Not used by any Pokemon yet")));
  }

  }}, "Ask the AI");

  const review = verdict => async () => {
    msg.textContent = "Saving...";
    try { await dbCall("review_sprite", {p_key: remember.get("key"), p_candidate: c.id, p_status: verdict, p_editor: me()}); msg.textContent = verdict === "approved" ? "Approved - it becomes the sprite within about 15 minutes." : ""; await hooks.reload(); }
    catch (err) { msg.textContent = err.message; }
  };
  const verdictEl = h("div", {class: "verdict"});
  function drawVerdict() {
    verdictEl.replaceChildren(...(c.status === "approved" ? [h("span", {class: "badge done"}, "approved"), h("button", {type: "button", class: "small", onclick: review("candidate")}, "Take back the approval")]
      : [h("button", {type: "button", class: "good", onclick: review("approved")}, "Approve - use this sprite"),
         c.status === "candidate" ? h("button", {type: "button", onclick: review("rejected")}, "Reject") : h("span", {class: "badge"}, c.status === "rejected" ? "rejected" : "replaced")]));
  }
  drawVerdict();

  const el = h("div", {class: "studio-ed"},
    h("div", {style: "font-weight:600"}, "Version #" + c.id), h("div", {class: "hint", style: "margin-top:0"}, versionLabel(c), c.editor && c.kind !== "drawn" ? " - asked by " + c.editor : ""),
    viewBar, h("div", {class: "canvaswrap"}, canvas), tools, swatches,
    h("div", {style: "display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"}, saveBtn, resetBtn),
    h("div", {class: "aibox"}, h("b", {}, "Ask the AI to change it"), areaNote, aiText,
      h("div", {class: "row"}, h("label", {class: "sub", style: "font-size:13px"}, "Change "), aiView, aiBtn)),
    msg, verdictEl);
  drawArea();
  canvas.parentElement && paint();
  Promise.all(views.map(load)).then(() => {
    const d = ed.data[ed.view];                       // the pencil starts with the sprite's darkest colour (its outline)
    let best = null;
    for (let i = 0; i < d.data.length; i += 4) if (d.data[i + 3]) {
      const lum = d.data[i] * 299 + d.data[i + 1] * 587 + d.data[i + 2] * 114;
      if (!best || lum < best[0]) best = [lum, [d.data[i], d.data[i + 1], d.data[i + 2], 255]];
    }
    if (best) ed.colour = best[1];
    ed.ready = true; drawViews(); drawTools(); paint(); })
    .catch(() => { msg.textContent = "Could not load this version's pictures."; });
  new ResizeObserver(() => ed.ready && paint()).observe(el);
  return {el, id: c.id, dirty: () => ed.dirty.size > 0 && !leaveOk, allowLeave: () => { leaveOk = true; setTimeout(() => leaveOk = false, 4000); },
    refresh: fresh => { c = Object.assign(c, fresh); drawVerdict(); }};
}

// How our type spread compares with the official games.
function renderBalance() {
  const grid = document.getElementById("grid"), shares = DEX.type_shares.shares;
  const typed = DEX.species.filter(s => (s.data.types || []).some(t => shares[t] !== undefined));
  // Ours have two types more often than official Pokemon do, which would make every type look
  // over-represented. So compare type slots with type slots: the gaps then add up to zero.
  const slots = typed.reduce((sum, s) => sum + new Set(s.data.types.filter(t => shares[t] !== undefined)).size, 0);
  const rows = DEX.types.map(type => {
    const ours = typed.filter(s => s.data.types.includes(type)).length, normal = shares[type] / (1 + DEX.type_shares.dual_type_share) * slots;
    return {type, ours, normal, gap: ours - normal, atFull: Math.round(shares[type] * DEX.dex_size)};
  }).sort((a, b) => a.gap - b.gap);
  const top = Math.max(...rows.map(r => Math.max(r.ours, r.normal)), 1);
  const verdict = r => r.gap <= -1.5 ? [h("b", {style: "color:var(--warn)"}, "too few"), " - about " + Math.round(-r.gap) + " short"]
    : r.gap >= 1.5 ? ["too many - about " + Math.round(r.gap) + " extra"] : ["about right"];
  const dual = typed.filter(s => new Set(s.data.types).size === 2).length;
  grid.replaceChildren(h("div", {style: "grid-column:1/-1"},
    h("p", {class: "sub", style: "margin-top:0"}, "How often each type appears in our dex, compared with the official games. The line on each bar is where it would normally be. Types at the top need new Pokemon the most."),
    h("div", {class: "scroll"}, h("table", {class: "balance"}, h("tr", {}, h("th", {}, "Type"), h("th", {}, "Ours"), h("th", {}, "Normal"), h("th", {}, ""), h("th", {}, "")),
      rows.map(r => h("tr", {}, h("td", {}, typeChip(r.type)), h("td", {}, h("b", {}, String(r.ours))), h("td", {}, r.normal.toFixed(1)),
        h("td", {style: "width:40%"}, h("div", {class: "track"}, h("i", {style: "width:" + (100 * r.ours / top) + "%;background:" + TYPE_COLORS[r.type]}), h("b", {style: "left:" + (100 * r.normal / top) + "%"}))),
        h("td", {}, verdict(r)))))),
    h("p", {class: "sub"}, dual + " of " + typed.length + " typed Pokemon have two types (" + Math.round(100 * dual / Math.max(typed.length, 1)) + "%; officially " + Math.round(100 * DEX.type_shares.dual_type_share) + "%). " +
      "Compared with all " + DEX.type_shares.species_counted + " official Pokemon; a Pokemon with two types counts for both.")));
}

// ---------- changing dex numbers ----------
// The same rules as dexlib.change_layout in scripts/dexlib.py (the import applies them for real). layout = ids per slot, null = empty.
function arrange(layout, ops) {
  layout = layout.slice();
  const size = layout.length;
  for (const op of ops) {
    const slot = op.to || op.at;
    if (!Number.isInteger(slot) || slot < 1 || slot > size) throw new Error("There is no slot #" + slot + ". Use a number from 1 to " + size + ".");
    if (op.op === "move") {
      const old = layout.indexOf(op.id);
      if (old < 0) throw new Error("That Pokemon is not in the dex.");
      if (layout[slot - 1] === null) { layout[old] = null; layout[slot - 1] = op.id; }
      else { layout.splice(old, 1); layout.splice(slot - 1, 0, op.id); }
    } else if (op.op === "insert") {
      if (layout[size - 1] !== null) throw new Error("The last slot (#" + size + ") is taken, so nothing can move down. Move that Pokemon first or remove an empty slot.");
      layout.splice(slot - 1, 0, null); layout.pop();
    } else if (op.op === "close") {
      if (layout[slot - 1] !== null) throw new Error("Slot #" + slot + " is not empty.");
      layout.splice(slot - 1, 1); layout.push(null);
    } else throw new Error("Unknown step.");
  }
  return layout;
}
const currentLayout = () => Array.from({length: DEX.dex_size}, (_, i) => bySlot.has(i + 1) ? bySlot.get(i + 1).id : null);
function applyLayout(layout) {
  layout.forEach((id, i) => { if (id && byId.has(id)) byId.get(id).data.dex = i + 1; });
  index();
}

let plan = null;   // {ops, layout, error} while the "Change numbers" screen is open
function renderReorder() {
  const grid = document.getElementById("grid"), base = currentLayout();
  const message = h("div", {class: "error", style: "flex-basis:100%"}, plan.error || "");
  const step = op => {
    try { plan.layout = arrange(plan.layout, [op]); plan.ops.push(op); plan.error = ""; } catch (err) { plan.error = err.message; }
    render();
  };
  const undo = () => { plan.ops.pop(); plan.layout = arrange(base, plan.ops); plan.error = ""; render(); };
  const save = h("button", {class: "primary", type: "button", disabled: !plan.ops.length}, plan.ops.length ? "Save new order (" + plan.ops.length + " step" + (plan.ops.length > 1 ? "s" : "") + ")" : "Save new order");
  save.addEventListener("click", async () => {
    save.disabled = true; save.textContent = "Saving...";
    try {
      await saveEdit("reorder", "reorder", {ops: plan.ops});
      applyLayout(plan.layout); plan = null; view = "species"; render();
    } catch (err) { plan.error = err.message; render(); }
  });
  const bar = h("div", {class: "bar"},
    h("div", {class: "grow"}, h("b", {}, "Changing dex numbers"), h("div", {class: "sub"}, plan.ops.length ? plan.ops.length + " step(s) not saved yet." : "Nothing changed yet.")),
    h("button", {type: "button", disabled: !plan.ops.length, onclick: undo}, "Undo last step"), save,
    h("button", {type: "button", onclick: () => { plan = null; view = "species"; render(); }}, "Cancel"), message);
  const help = h("details", {class: "hint"}, h("summary", {}, "How this works"),
    "Pokemon keep everything except their number. To MOVE one, type the number it should get and press Move: if that slot is empty it just goes there; if another Pokemon is there, ",
    "the Pokemon in between move up or down one number to make room. \"Up\" and \"Down\" swap with the neighbour. ",
    "\"Add empty slot here\" puts a new empty slot at this number and moves this Pokemon and everything after it down one (the last slot, #" + DEX.dex_size + ", must be empty). ",
    "\"Remove empty slot\" closes a gap. On a computer you can also drag a Pokemon onto another row. Nothing counts until you press Save; it is applied within about 15 minutes.");
  const rows = plan.layout.map((id, i) => {
    const n = i + 1, s = id && byId.get(id), was = s ? base.indexOf(id) + 1 : 0;
    const to = h("input", {type: "number", min: 1, max: DEX.dex_size, placeholder: "#", "aria-label": "New number"});
    const go = () => { if (to.value) step({op: "move", id, to: Number(to.value)}); };
    const row = h("div", {class: "rrow" + (s ? "" : " open") + (s && was !== n ? " moved" : "")},
      h("span", {class: "no"}, "#" + pad(n)),
      s ? h("span", {class: "who", draggable: matchMedia("(pointer: fine)").matches ? "true" : null, title: "Drag onto another row to move it there"}, s.data.name || id, " ", s.data.types ? s.data.types.map(typeChip) : null) : h("span", {class: "who", style: "font-weight:400;cursor:default"}, "Open slot"),
      s && was !== n ? h("span", {class: "sub"}, "was #" + pad(was)) : null,
      s ? [h("button", {type: "button", class: "small", disabled: n === 1, onclick: () => step({op: "move", id, to: n - 1})}, "Up"),
           h("button", {type: "button", class: "small", disabled: n === DEX.dex_size, onclick: () => step({op: "move", id, to: n + 1})}, "Down"),
           to, h("button", {type: "button", class: "small", onclick: go}, "Move")] : null,
      h("button", {type: "button", class: "small", onclick: () => step({op: "insert", at: n})}, "Add empty slot here"),
      s ? null : h("button", {type: "button", class: "small", onclick: () => step({op: "close", at: n})}, "Remove empty slot"));
    if (s) row.querySelector(".who").addEventListener("dragstart", ev => ev.dataTransfer.setData("text/plain", id));
    row.addEventListener("dragover", ev => { ev.preventDefault(); row.classList.add("over"); });
    row.addEventListener("dragleave", () => row.classList.remove("over"));
    row.addEventListener("drop", ev => { ev.preventDefault(); const dragged = ev.dataTransfer.getData("text/plain"); if (plan.layout.includes(dragged)) step({op: "move", id: dragged, to: n}); else row.classList.remove("over"); });
    return row;
  });
  grid.replaceChildren(h("div", {class: "reorder", style: "grid-column:1/-1"}, bar, help, rows));
}

// ---------- the front page ----------
let view = "species";
const MORE = [["move", "New moves"], ["ability", "New abilities"], ["balance", "Type balance"], ["reorder", "Change dex numbers"]];
function renderNav() {
  const count = kind => DEX.custom[kind].length + undescribed(kind).length;
  const label = id => id === "move" ? "New moves (" + count("move") + ")" : id === "ability" ? "New abilities (" + count("ability") + ")" : MORE.find(m => m[0] === id)[1];
  const go = id => () => { view = id; if (id === "reorder") plan = {ops: [], layout: currentLayout(), error: ""}; else plan = null; render(); window.scrollTo(0, 0); };
  const inMore = MORE.some(m => m[0] === view);
  const more = h("details", {}, h("summary", {"aria-pressed": String(inMore), style: inMore ? "background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600" : ""}, inMore ? label(view) + " ▾" : "More ▾"),
    h("div", {class: "menu"}, MORE.filter(([id]) => id !== "reorder" || DEX.web.url).map(([id]) => h("button", {type: "button", onclick: go(id)}, label(id)))));
  document.getElementById("nav").replaceChildren(
    h("button", {type: "button", "aria-pressed": String(view === "species"), onclick: go("species")}, "Pokemon"),
    h("button", {type: "button", "aria-pressed": String(view === "sprites"), onclick: go("sprites")}, "Sprites"), more);
  document.getElementById("tools").style.display = view === "species" || view === "move" || view === "ability" ? "" : "none";
  document.getElementById("type").style.display = view === "species" ? "" : "none";
  document.getElementById("show").style.display = view === "species" ? "" : "none";
}

function render() {
  renderNav();
  const playable = DEX.species.filter(s => !s.gameNeeds.length).length;
  document.getElementById("summary").textContent = DEX.species.length + " of " + DEX.dex_size + " Pokemon designed, " + playable + " playable. Tap one to see, edit or draw it.";
  if (view === "reorder" && plan) return renderReorder();
  if (view === "balance") return renderBalance();
  if (view === "sprites") return renderSprites();
  if (view === "move" || view === "ability") return renderCustom(view);
  const query = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("type").value, mode = document.getElementById("show").value;
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  const open = Array.from({length: DEX.dex_size}, (_, i) => i + 1).filter(n => !bySlot.has(n));
  if (mode === "open") {
    for (const slot of open) grid.append(h("button", {class: "card open", onclick: () => DEX.web.url && openEditor({data: {dex: slot}})},
      h("div", {class: "num"}, "#" + pad(slot)), DEX.web.url ? h("div", {class: "pending"}, "+ Add a Pokemon here") : "Open"));
    if (!open.length) grid.append(h("div", {class: "empty"}, "Every slot is taken."));
    return;
  }
  for (const s of DEX.species.slice().sort((a, b) => a.data.dex - b.data.dex)) {
    if ((mode === "todo" && s.complete === 100) || (mode === "problems" && !s.problems.length) || (mode === "playable" && s.gameNeeds.length)) continue;
    if (type && !(s.data.types || []).includes(type)) continue;
    if (query && !JSON.stringify(s.data).toLowerCase().includes(query)) continue;
    const pic = portrait(s);
    grid.append(h("button", {class: "card", onclick: () => openDetail(s)},
      h("div", {class: "pic"}, pic ? h("img", {class: pic.pixel ? "px" : null, src: pic.src, alt: "", loading: "lazy"}) : h("span", {class: "letter"}, (s.data.name || "?")[0])),
      h("div", {class: "num"}, "#" + pad(s.data.dex), s.problems.length ? h("span", {class: "badge need", style: "margin-left:6px", title: "Has warnings"}, "!") : null),
      h("div", {class: "name"}, s.data.name), h("div", {class: "types"}, (s.data.types || []).map(typeChip)),
      s.pending ? h("div", {class: "pending"}, "just edited") : null,
      h("div", {class: "meter", title: s.complete + "% filled in"}, h("i", {style: "width:" + s.complete + "%"}))));
  }
  if (DEX.web.url && open.length && !query && !type && mode === "filled") grid.append(h("button", {class: "card open", onclick: () => openEditor({data: {dex: open[0]}})},
    h("div", {class: "name"}, "+ Add a Pokemon"), h("div", {class: "num"}, open.length + " open slots")));
  if (!grid.children.length) grid.append(h("div", {class: "empty"}, "Nothing matches."));
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      if (row.kind === "reorder") {
        try { applyLayout(arrange(currentLayout(), Array.isArray(row.data.ops) ? row.data.ops : [])); } catch (e) { /* the import reports it */ }
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      delete row.data._base;
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Pictures uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const list = await fetch(DEX.web.url + "/rest/v1/species_images?select=id,species_id,path,caption,editor,removed&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (list.ok) {
      for (const row of await list.json()) {
        if (row.removed) DEX.images[row.species_id] = allImages(row.species_id).filter(i => i.id !== row.id);
        else if (!built.has(row.id)) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      if (!document.getElementById("dialog").open) render();
    }
  } catch (e) { /* the built data is still shown */ }
}

meBox.value = remember.get("editor");
meBox.addEventListener("input", () => remember.set("editor", meBox.value.trim()));
DEX.species.forEach(derive); index();

if (DEX.problems.length) document.getElementById("notice").append(h("details", {class: "notice"}, h("summary", {}, h("b", {}, DEX.problems.length + " saved edit(s) could not be used"), " - tap to see why"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) closeDialog(); });
document.getElementById("dialog").addEventListener("cancel", () => { if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("click", ev => { for (const d of document.querySelectorAll("nav details[open]")) if (!d.contains(ev.target)) d.open = false; });
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
loadRecentEdits();
