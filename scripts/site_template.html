  if (view === "reorder" && plan) return renderReorder();
  if (view === "balance") return renderBalance();
  if (view === "sprites") return renderSprites();
  if (view === "lost") return renderLost();
  if (view === "progress") return renderProgress();
  if (view === "board") return renderBoard();
  if (view === "move" || view === "ability") return renderCustom(view);
  const query = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("type").value, mode = document.getElementById("show").value;
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  const open = Array.from({length: DEX.dex_size}, (_, i) => i + 1).filter(n => !bySlot.has(n));
  if (mode === "open") {
    for (const slot of open) grid.append(h("button", {class: "card open", onclick: () => DEX.web.url && openEditor({data: {dex: slot}})},
      h("div", {class: "num"}, "#" + pad(slot)), DEX.web.url ? h("div", {class: "pending"}, "+ Add a Pokemon here") : "Open"));
    if (!open.length) grid.append(h("div", {class: "empty"}, "Every slot is taken."));
    return;
  }
  const matching = DEX.species.slice().sort((a, b) => a.data.dex - b.data.dex).filter(s =>
    !((mode === "todo" && s.complete === 100) || (mode === "problems" && !s.problems.length) || (mode === "playable" && s.gameNeeds.length))
    && (!type || (s.data.types || []).includes(type)) && (!query || JSON.stringify(s.data).toLowerCase().includes(query)));
  if (layout === "list" && matching.length) renderList(matching);
  for (const s of layout === "list" ? [] : matching) {
    const pic = portrait(s);
    grid.append(h("button", {class: "card", onclick: () => openDetail(s), onmouseenter: () => preview(s), onfocus: () => preview(s)},
      h("div", {class: "pic"}, pic ? h("img", {class: pic.pixel ? "px" : null, src: pic.src, alt: "", loading: "lazy"}) : h("span", {class: "letter"}, (s.data.name || "?")[0])),
      h("div", {class: "num"}, "No." + pad(s.data.dex), s.problems.length ? h("span", {class: "badge need", style: "margin-left:6px", title: "Has warnings"}, "!") : null),
      h("div", {class: "name"}, s.data.name), h("div", {class: "types"}, (s.data.types || []).map(typeChip)),
      s.pending ? h("div", {class: "pending"}, "just edited") : null,
      h("div", {class: "meter", title: s.complete + "% filled in"}, h("i", {style: "width:" + s.complete + "%"}))));
  }
  if (DEX.web.url && open.length && !query && !type && mode === "filled") grid.append(h("button", {class: "card open", style: layout === "list" ? "min-height:0;grid-column:1/-1;margin-top:8px" : null, onclick: () => openEditor({data: {dex: open[0]}})},
    h("div", {class: "name"}, "+ ADD A POKEMON"), h("div", {class: "num"}, open.length + " open slots")));
  if (!grid.children.length) grid.append(h("div", {class: "empty"}, "Nothing matches."));
}

// ---------- progress: how far the dex has come, as badges ----------
function renderProgress() {
  const c = counts(), size = c.size, shares = DEX.type_shares.shares;
  const stats = DEX.species.filter(s => s.bst !== null).length;
  const typeRows = DEX.types.map(type => {
    const ours = DEX.species.filter(s => (s.data.types || []).includes(type)).length, goal = Math.round((shares[type] || 0) * size);
    return {type, ours, goal, left: goal - ours};
  });
  const balanced = typeRows.filter(r => r.left <= 2).length;
  // [name, have, goal, colour of the badge]
  const BADGES = [["First 25", c.designed, 25, "#58c058"], ["Half the dex", c.designed, Math.ceil(size / 2), "#f2b630"], ["Full dex", c.designed, size, "#e0507a"],
    ["50 playable", c.playable, 50, "#58c058"], ["All playable", c.playable, Math.max(c.designed, 1), "#3fa0e8"], ["10 sprites", c.sprites, 10, "#8a6fe0"],
    ["All have stats", stats, Math.max(c.designed, 1), "#e2622a"], ["Type balance", balanced, DEX.types.length, "#4fa9a9"]];
  const next = BADGES.filter(([, have, goal]) => have < goal).sort((a, b) => (a[2] - a[1]) - (b[2] - b[1]))[0];
  document.querySelector("#topscreen .dlg").textContent = PAGE_HELP.progress + (next ? "\nNext badge: " + next[0].toUpperCase() + " - " + (next[2] - next[1]) + " to go!" : "\nEvery badge is won!");
  const medal = (colour, won) => h("div", {style: "width:40px;height:40px;background:" + (won ? colour : "#6d6680") + ";box-shadow:inset 0 0 0 3px rgba(0,0,0,.3), inset 0 8px 0 rgba(255,255,255,.35);" +
    "clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)"});
  const needs = typeRows.filter(r => r.left > 0).sort((a, b) => b.left - a.left).slice(0, 8);
  const top = Math.max(...needs.map(r => r.goal), 1);
  const almost = DEX.species.filter(s => s.gameNeeds.length === 1).sort((a, b) => a.data.dex - b.data.dex);
  const link = s => h("a", {href: "#" + s.id, onclick: ev => { ev.preventDefault(); openDetail(s); }}, s.data.name);
  document.getElementById("grid").replaceChildren(h("div", {style: "grid-column:1/-1"},
    h("h2", {style: "margin-top:4px"}, "Badges"),
    h("div", {class: "badges"}, BADGES.map(([name, have, goal, colour]) => h("div", {class: "b frame" + (have >= goal ? "" : " locked"), title: Math.min(have, goal) + " of " + goal},
      medal(colour, have >= goal), h("span", {}, name.toUpperCase()), h("span", {class: "sub"}, have >= goal ? "won!" : Math.min(have, goal) + " / " + goal)))),
    h("h2", {}, "Types the dex needs most"),
    h("div", {class: "hint"}, "Compared with a full dex of " + size + " that follows the official games. See More > Type balance for every type."),
    needs.length ? needs.map(r => h("div", {class: "needrow"}, typeChip(r.type), h("div", {class: "track"}, h("i", {style: "width:" + (100 * r.ours / top) + "%;background:" + TYPE_COLORS[r.type]})),
      h("span", {}, h("b", {}, r.left + " more")))) : h("div", {class: "ok"}, "Every type has reached its goal."),
    h("h2", {}, "Almost playable"),
    almost.length ? [h("div", {class: "hint"}, "These miss only one thing before they can go into the game."),
      h("ul", {style: "margin:4px 0 0;padding-left:20px"}, almost.map(s => h("li", {}, link(s), " - needs " + s.gameNeeds[0])))] : h("div", {class: "empty"}, "None right now."),
    h("h2", {}, "Open slots"),
    h("div", {}, (size - c.designed) + " of " + size + " numbers are still free. ", DEX.web.url && size > c.designed ? h("button", {type: "button", class: "small primary", onclick: () => {
      const slot = Array.from({length: size}, (_, i) => i + 1).find(n => !bySlot.has(n)); openEditor({data: {dex: slot}}); }}, "+ Add a Pokemon") : null)));
}

// ---------- the request board ----------
// Cards come from data/requests.yaml (what the story needs, written by the team) and from the
// website (species_edits rows of kind 'request'; the newest row of a card wins).
const BOARD = [["idea", "WISHES", "pink"], ["needed", "THE GAME NEEDS", "purple"], ["doing", "BEING MADE", "blue"], ["done", "DONE", "sky"]];
const AREAS = [["pokemon", "Pokemon"], ["sprites", "Sprites"], ["website", "Website"], ["other", "Other"]];
let boardCards = null;
async function loadBoard() {
  const cards = new Map((DEX.requests || []).map(r => [r.id, Object.assign({}, r)]));
  if (DEX.web.url) {
    const rows = await dbRead("species_edits?select=id,species_id,data,editor&kind=eq.request&order=id.asc");
    for (const row of rows) if (row.data && typeof row.data.title === "string") cards.set(row.species_id, Object.assign({}, cards.get(row.species_id) || {}, row.data, {id: row.species_id, by: row.data.by || row.editor}));
  }
  boardCards = [...cards.values()].filter(c => !c.deleted);
}
function renderBoard() {
  const grid = document.getElementById("grid");
  if (boardCards === null) {
    grid.replaceChildren(h("div", {class: "empty", style: "grid-column:1/-1"}, "Loading..."));
    loadBoard().catch(() => { boardCards = (DEX.requests || []).slice(); }).then(() => view === "board" && renderBoard());
    return;
  }
  const save = async (card, changes, status, isNew) => {
    const data = Object.assign({}, card, changes);
    delete data.id;
    status.textContent = "Saving...";
    try { await saveEdit("request", card.id, data); Object.assign(card, changes); if (isNew) boardCards.push(card); renderBoard(); }
    catch (err) { status.textContent = /check constraint|kind/i.test(err.message) ? "The board cannot save yet - Arvind has to switch it on first." : err.message; }
  };
  const columns = BOARD.map(([status, title, colour], col) => {
    const cards = boardCards.filter(c => (c.status || "idea") === status).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    const body = h("div", {class: "colbody"});
    if (status === "idea" && DEX.web.url) body.append(addRequest(save));
    body.append(...cards.map(card => {
      const note = h("div", {class: "hint", role: "status", style: "margin:0"});
      const area = AREAS.find(a => a[0] === card.area) ? card.area : "other";
      return h("article", {class: "req"},
        h("div", {}, h("span", {class: "area " + area}, (AREAS.find(a => a[0] === area) || [0, "Other"])[1].toUpperCase())),
        h("h4", {}, card.title),
        card.text ? h("div", {style: "font-size:14px;white-space:pre-line"}, card.text) : null,
        card.by ? h("div", {class: "meta"}, "from " + card.by) : null,
        DEX.web.url ? h("div", {class: "acts"},
          col > 0 ? h("button", {type: "button", class: "small", onclick: () => save(card, {status: BOARD[col - 1][0]}, note)}, "◀ " + BOARD[col - 1][1]) : null,
          col < BOARD.length - 1 ? h("button", {type: "button", class: "small", onclick: () => save(card, {status: BOARD[col + 1][0]}, note)}, BOARD[col + 1][1] + " ▶") : null) : null,
        note);
    }));
    if (!cards.length) body.append(h("div", {class: "empty"}, "Nothing here yet."));
    return h("section", {class: "boardcol"}, h("div", {class: "colhead", "data-c": colour}, title + " " + cards.length), body);
  });
  grid.replaceChildren(h("div", {class: "board", style: "grid-column:1/-1"}, columns));
}
function addRequest(save) {
  const wrap = h("div", {});
  const open = h("button", {type: "button", class: "primary", style: "width:100%", onclick: () => {
    const title = textInput("", {maxlength: 120, placeholder: "What should be added or changed?"});
    const text = h("textarea", {rows: 3, maxlength: 1000, placeholder: "Details (optional)"});
    const area = selectInput("pokemon", AREAS);
    const note = h("div", {class: "hint", role: "status", style: "margin:0"});
    wrap.replaceChildren(h("div", {class: "req"}, field("Request", title), field("Details", text), field("About", area),
      h("div", {class: "acts"}, h("button", {type: "button", class: "small primary", onclick: () => {
        const t = readText(title);
        if (!t || t.length < 3) { note.textContent = "Write what you would like first."; return; }
        const card = {id: "req-" + slugify(t).slice(0, 40) + "-" + Date.now().toString(36), title: t, text: readText(text) || "", area: area.value, status: "idea", by: me() || null};
        save(card, {}, note, true);
      }}, "ADD"), h("button", {type: "button", class: "small", onclick: () => wrap.replaceChildren(open)}, "CANCEL")), note));
    title.focus();
  }}, "+ ADD A REQUEST");
  wrap.append(open);
  return wrap;
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      if (row.kind === "request") continue;          // cards on the request board (loaded by loadBoard)
      if (row.kind === "reorder") {
        try { applyLayout(arrange(currentLayout(), Array.isArray(row.data.ops) ? row.data.ops : [])); } catch (e) { /* the import reports it */ }
        continue;
      }
      if (row.data.deleted) {                       // removed from the dex on the website
        DEX.species = DEX.species.filter(o => o.id !== row.species_id);
        delete DEX.images[row.species_id];
        DEX.species.forEach(derive); index();
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      delete row.data._base;
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Pictures uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const builtIn = new Map(Object.entries(DEX.images).flatMap(([sid, list]) => list.map(i => [i.id, sid])));
    const list = await fetch(DEX.web.url + "/rest/v1/species_images?select=id,species_id,path,caption,editor,removed&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (list.ok) {
      for (const row of await list.json()) {
        if (row.removed) DEX.images[row.species_id] = allImages(row.species_id).filter(i => i.id !== row.id);
        else if (builtIn.has(row.id) && builtIn.get(row.id) !== row.species_id) {         // moved to another Pokemon since the page was built
          const from = builtIn.get(row.id), image = allImages(from).find(i => i.id === row.id);
          DEX.images[from] = allImages(from).filter(i => i.id !== row.id);
          if (image && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push(image);
        }
        else if (!built.has(row.id) && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      if (!document.getElementById("dialog").open) render();
    }
  } catch (e) { /* the built data is still shown */ }
}

document.getElementById("title").textContent = DEX.project;
drawDayNight();
const meBox = document.getElementById("me");
meBox.value = remember.get("editor");
meBox.addEventListener("input", () => remember.set("editor", meBox.value.trim()));
DEX.species.forEach(derive); index();
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
refreshLists();
document.getElementById("list-methods").append(...["grass", "cave", "surf", "fishing", "rock smash", "gift", "trade", "static"].map(m => h("option", {value: m})));
if (DEX.problems.length) document.getElementById("notice").append(h("details", {class: "notice"}, h("summary", {}, h("b", {}, DEX.problems.length + " saved edit(s) could not be used"), " - tap to see why"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) closeDialog(); });
document.getElementById("dialog").addEventListener("cancel", () => { shown = null; if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("click", ev => { for (const d of document.querySelectorAll("nav details[open]")) if (!d.contains(ev.target)) d.open = false; });
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
loadRecentEdits();
if (DEX.web.url) loadLost().then(renderNav).catch(() => {});
</script>
