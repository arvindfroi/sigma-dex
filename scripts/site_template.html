<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2f6fde; --good: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --bar: #e6e9ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1f2329; --text: #e8eaed; --muted: #9aa3ae; --line: #323841;
    --accent: #6ea2ff; --good: #4cc27e; --warn: #e0a040; --bad: #ef6b5b; --bar: #2c323a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 12px; max-width: 1200px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); }
.totals { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
.total { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.total b { display: block; font-size: 20px; }
.total span { color: var(--muted); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1200px; margin: 0 auto; padding: 8px 16px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
input, select, button, a.button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 180px; min-width: 0; }
a { color: var(--accent); }
a.button, button { cursor: pointer; text-decoration: none; }
a.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
main { max-width: 1200px; margin: 0 auto; padding: 4px 16px 60px; }
.notice { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin: 8px 0 14px; }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; display: block; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.open { opacity: .5; cursor: default; border-style: dashed; }
.card .num { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
.card .name { font-weight: 650; font-size: 16px; margin: 2px 0 6px; overflow-wrap: anywhere; }
.flag { color: var(--warn); }
.types { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; }
.type { color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.meter { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(760px, calc(100vw - 20px)); max-height: calc(100vh - 20px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.detail { padding: 18px 20px 24px; }
.detail .top { display: flex; gap: 14px; align-items: flex-start; }
.detail .top img { width: 120px; height: 120px; object-fit: contain; border-radius: 10px; background: var(--bar); }
.detail h3 { margin: 0; font-size: 24px; }
.close { margin-left: auto; }
.entry { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-line; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.stat td:first-child { width: 86px; color: var(--muted); }
.stat td:nth-child(2) { width: 40px; text-align: right; font-weight: 600; }
.statbar { height: 10px; border-radius: 5px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.match { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; }
.sim { background: var(--bg); border-radius: 10px; padding: 12px; }
.sim input[type=range] { width: 100%; padding: 0; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 0; color: var(--muted); }
@media (max-width: 520px) { .todo { columns: 1; } .detail .top img { width: 84px; height: 84px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub">Every Pokemon as the game will use it. Click one to see its page, stats at any level, moves and what is still missing.</div>
  <div class="totals" id="totals"></div>
</header>
<div class="tools">
  <input type="search" id="search" placeholder="Search name, move, ability...">
  <select id="type"><option value="">All types</option></select>
  <select id="show">
    <option value="all">All slots</option>
    <option value="filled">Has a Pokemon</option>
    <option value="todo">Not complete</option>
    <option value="problems">Has warnings</option>
    <option value="open">Open slots</option>
  </select>
  <span id="edit"></span>
</div>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dialog"><div class="detail" id="detail"></div></dialog>
<script>
const DEX = /*DATA*/null;
const TYPE_COLORS = {Normal:"#8a8a6a",Fire:"#e2622a",Water:"#4a7fe0",Grass:"#4f9a3a",Electric:"#c9a300",Ice:"#4fa9a9",
  Fighting:"#b0362e",Poison:"#93409a",Ground:"#b8963e",Flying:"#8d78d8",Psychic:"#e0457a",Bug:"#8a9a1e",Rock:"#a08a36",
  Ghost:"#65508c",Dragon:"#6a3be0",Dark:"#5e4a3c",Steel:"#7f7f96",Fairy:"#c96c8c"};
// attacker -> defender -> multiplier (Emerald's chart, plus Fairy as in the newer games)
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5}, Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5}, Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
  Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0,Fairy:2}, Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
  Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5}, Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
  Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5}, Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Dragon:{Dragon:2,Steel:.5,Fairy:0}, Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5,Fairy:.5},
  Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2}, Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5}};
const STATS = [["hp","HP"],["attack","Attack"],["defense","Defense"],["sp_attack","Sp. Atk"],["sp_defense","Sp. Def"],["speed","Speed"]];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
const typeChip = t => h("span", {class: "type", style: "background:" + (TYPE_COLORS[t] || "#777")}, t);
const filled = v => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);
const show = v => filled(v) ? String(v) : h("span", {class: "empty"}, "not decided");
const bySlot = new Map(DEX.species.map(s => [s.data.dex, s]));
const byId = new Map(DEX.species.map(s => [s.id, s]));

function calcStat(base, level, iv, ev, nature, isHp) {
  const core = Math.floor((2 * base + iv + Math.floor(ev / 4)) * level / 100);
  return isHp ? core + level + 10 : Math.floor((core + 5) * nature);
}

function simulator(s) {
  const stats = s.data.base_stats || {};
  const moves = ((s.data.learnset || {}).level_up || []).slice().sort((a, b) => a.level - b.level);
  const out = h("div", {});
  const slider = h("input", {type: "range", min: 1, max: 100, value: 5});
  function draw() {
    const level = Number(slider.value);
    out.replaceChildren();
    out.append(h("div", {}, h("b", {}, "Level " + level)));
    if (STATS.every(([k]) => Number.isInteger(stats[k]))) {
      out.append(h("table", {}, h("tr", {}, h("th", {}, ""), ...STATS.map(([, label]) => h("th", {}, label))),
        h("tr", {}, h("td", {}, "Lowest"), ...STATS.map(([k]) => h("td", {}, String(calcStat(stats[k], level, 0, 0, k === "hp" ? 1 : .9, k === "hp"))))),
        h("tr", {}, h("td", {}, "Typical"), ...STATS.map(([k]) => h("td", {}, h("b", {}, String(calcStat(stats[k], level, 15, 0, 1, k === "hp")))))),
        h("tr", {}, h("td", {}, "Highest"), ...STATS.map(([k]) => h("td", {}, String(calcStat(stats[k], level, 31, 252, k === "hp" ? 1 : 1.1, k === "hp")))))));
    } else out.append(h("div", {class: "empty"}, "Base stats are not filled in yet."));
    const known = moves.filter(m => m.level <= level).slice(-4);
    out.append(h("div", {style: "margin-top:8px"}, "A wild one knows: ",
      known.length ? h("span", {class: "chips", style: "display:inline-flex"}, known.map(m => h("span", {class: "chip"}, m.move))) : h("span", {class: "empty"}, "no level-up moves yet")));
    const evolved = s.evolutions.filter(e => /^Lv (\d+)/.test(e.how) && Number(e.how.match(/^Lv (\d+)/)[1]) <= level);
    if (evolved.length) out.append(h("div", {class: "sub", style: "margin-top:6px"}, "By this level it can have evolved into " + evolved.map(e => e.name).join(" or ") + "."));
  }
  slider.addEventListener("input", draw);
  draw();
  return h("div", {class: "sim"}, slider, out);
}

function matchups(types) {
  const known = types.filter(t => CHART[t]);
  if (!known.length) return h("div", {class: "empty"}, "No type yet.");
  const groups = {};
  for (const attacker of Object.keys(CHART)) {
    const mult = known.reduce((m, t) => m * (CHART[attacker][t] ?? 1), 1);
    if (mult !== 1) (groups[mult] ||= []).push(attacker);
  }
  const labels = [[4, "Takes 4x"], [2, "Takes 2x"], [.5, "Takes 1/2"], [.25, "Takes 1/4"], [0, "Immune to"]];
  const rows = labels.filter(([m]) => groups[m]).flatMap(([m, label]) => [h("span", {}, label), h("div", {class: "types"}, groups[m].map(typeChip))]);
  return h("div", {class: "match"}, rows);
}

function openDetail(s) {
  const d = s.data, abilities = d.abilities || {}, learn = d.learnset || {}, design = d.design || {}, credits = d.credits || {};
  const from = DEX.species.filter(o => o.evolutions.some(e => e.into === s.id));
  const link = (o, text) => h("a", {href: "#" + o.id, onclick: ev => { ev.preventDefault(); openDetail(o); }}, text);
  const fact = (label, value) => h("div", {}, h("span", {}, label), show(value));
  const stats = d.base_stats || {};
  const gender = d.gender === "genderless" ? "Genderless" : filled(d.gender) ? d.gender + "% male" : null;
  const ev = d.ev_yield ? Object.entries(d.ev_yield).filter(([, v]) => v).map(([k, v]) => v + " " + (STATS.find(x => x[0] === k) || [0, k])[1]).join(", ") : null;
  const list = items => filled(items) ? h("div", {class: "chips"}, items.map(m => h("span", {class: "chip"}, m))) : h("div", {class: "empty"}, "none yet");
  const detail = document.getElementById("detail");
  detail.replaceChildren(...[
    h("div", {class: "top"},
      s.art ? h("img", {src: s.art, alt: "Concept art of " + d.name}) : null,
      h("div", {}, h("div", {class: "sub"}, "#" + String(d.dex).padStart(3, "0") + (filled(d.category) ? " - " + d.category + " Pokemon" : "")),
        h("h3", {}, d.name), h("div", {class: "types", style: "margin-top:6px"}, (d.types || []).map(typeChip))),
      h("button", {class: "close", onclick: () => document.getElementById("dialog").close()}, "Close")),
    h("div", {class: "entry"}, filled(d.description) ? d.description.trim() : h("span", {class: "empty"}, "No Pokedex entry yet.")),
    s.problems.length ? h("div", {}, h("h2", {}, "Warnings"), h("ul", {class: "problems"}, s.problems.map(p => h("li", {}, p)))) : null,
    h("h2", {}, "Base stats" + (s.bst ? " - total " + s.bst : "")),
    h("table", {class: "stat"}, STATS.map(([k, label]) => h("tr", {}, h("td", {}, label), h("td", {}, Number.isInteger(stats[k]) ? String(stats[k]) : "-"),
      h("td", {}, h("div", {class: "statbar", style: "width:" + Math.min(100, (stats[k] || 0) / 1.8) + "%"}))))),
    h("h2", {}, "Try it at any level"), simulator(s),
    h("h2", {}, "Damage it takes"), matchups(d.types || []),
    h("h2", {}, "Evolution"),
    h("div", {}, from.length ? ["Evolves from ", ...from.flatMap((o, i) => [i ? ", " : "", link(o, o.data.name), " (" + o.evolutions.find(e => e.into === s.id).how + ")"]), ". "] : null,
      s.evolutions.length ? ["Evolves into ", ...s.evolutions.flatMap((e, i) => [i ? ", " : "", byId.has(e.into) ? link(byId.get(e.into), e.name) : e.name, " (" + e.how + ")"]), "."] : null,
      !from.length && !s.evolutions.length ? h("span", {class: "empty"}, "No evolution recorded.") : null),
    h("h2", {}, "Details"),
    h("div", {class: "facts"}, fact("Ability", [abilities.primary, abilities.secondary].filter(filled).join(" / ")), fact("Hidden ability", abilities.hidden),
      fact("Height", filled(d.height_m) ? d.height_m + " m" : null), fact("Weight", filled(d.weight_kg) ? d.weight_kg + " kg" : null),
      fact("Catch rate", d.catch_rate), fact("Base exp", d.base_exp), fact("EV yield", ev), fact("Growth rate", filled(d.growth_rate) ? d.growth_rate.replace("_", " ") : null),
      fact("Gender", gender), fact("Egg groups", (d.egg_groups || []).join(", ").replaceAll("_", " ")), fact("Egg cycles", d.egg_cycles),
      fact("Base friendship", d.base_friendship), fact("Body color", d.body_color),
      fact("Found at", (d.encounters || []).map(e => e.location + (e.method ? " (" + e.method + ")" : "")).join(", ")),
      fact("Designer", credits.designer), fact("Artist", credits.artist)),
    h("h2", {}, "Level-up moves"),
    filled(learn.level_up) ? h("table", {}, learn.level_up.slice().sort((a, b) => a.level - b.level).map(m => h("tr", {}, h("td", {style: "width:60px;color:var(--muted)"}, "Lv " + m.level), h("td", {}, m.move)))) : h("div", {class: "empty"}, "none yet"),
    h("h2", {}, "TM / HM"), list(learn.tm_hm), h("h2", {}, "Move tutor"), list(learn.tutor), h("h2", {}, "Egg moves"), list(learn.egg),
    filled(design.concept) || filled(design.name_origin) || filled(design.notes) ? h("div", {}, h("h2", {}, "Design notes"),
      [design.concept, design.name_origin, design.notes].filter(filled).map(t => h("p", {style: "margin:4px 0"}, t))) : null,
    h("h2", {}, "Still missing - " + s.complete + "% complete"),
    s.missing.length ? h("ul", {class: "todo"}, s.missing.map(m => h("li", {}, m))) : h("div", {style: "color:var(--good)"}, "Complete!")].filter(Boolean));
  const dialog = document.getElementById("dialog");
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("type").value, mode = document.getElementById("show").value;
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  for (let slot = 1; slot <= DEX.dex_size; slot++) {
    const s = bySlot.get(slot);
    if (!s) {
      if ((mode === "all" || mode === "open") && !query && !type) grid.append(h("div", {class: "card open"}, h("div", {class: "num"}, "#" + String(slot).padStart(3, "0")), h("div", {class: "name"}, "Open slot")));
      continue;
    }
    if (mode === "open" || (mode === "todo" && s.complete === 100) || (mode === "problems" && !s.problems.length)) continue;
    if (type && !(s.data.types || []).includes(type)) continue;
    if (query && !JSON.stringify(s.data).toLowerCase().includes(query)) continue;
    grid.append(h("button", {class: "card", onclick: () => openDetail(s)},
      h("div", {class: "num"}, h("span", {}, "#" + String(slot).padStart(3, "0")), h("span", {}, s.problems.length ? h("span", {class: "flag", title: "Has warnings"}, "! ") : null, s.complete + "%")),
      h("div", {class: "name"}, s.data.name), h("div", {class: "types"}, (s.data.types || []).map(typeChip)),
      h("div", {class: "meter"}, h("i", {style: "width:" + s.complete + "%"}))));
  }
  if (!grid.children.length) grid.append(h("div", {class: "empty"}, "Nothing matches."));
}

document.getElementById("title").textContent = DEX.project;
const done = DEX.species.filter(s => s.complete === 100).length;
const average = DEX.species.length ? Math.round(DEX.species.reduce((a, s) => a + s.complete, 0) / DEX.species.length) : 0;
document.getElementById("totals").append(...[[DEX.species.length + " / " + DEX.dex_size, "slots filled"], [done, "fully complete"], [average + "%", "average completeness"],
  [DEX.species.filter(s => s.problems.length).length, "with warnings"]].map(([n, label]) => h("div", {class: "total"}, h("b", {}, String(n)), h("span", {}, label))));
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
if (DEX.sheet_url && /^https:\/\//.test(DEX.sheet_url)) document.getElementById("edit").append(h("a", {class: "button primary", href: DEX.sheet_url, target: "_blank", rel: "noopener"}, "Edit in Google Sheet"));
if (DEX.sheet_problems.length) document.getElementById("notice").append(h("div", {class: "notice"}, h("b", {}, "These rows in the Google Sheet could not be used - please fix them there:"),
  h("ul", {}, DEX.sheet_problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog") ev.target.close(); });
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
</script>
</body>
</html>
