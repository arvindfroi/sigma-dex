* { box-sizing: border-box; }
html { image-rendering: pixelated; }
body { margin: 0; background: var(--bg) var(--dots) repeat; background-size: 16px 16px; color: var(--ink); font: 16px/1.55 var(--body); }
img { image-rendering: auto; }
img.px, .px img, canvas { image-rendering: pixelated; }
h1, h2, h3, h4, button, th, summary, .tab, .plate, .type, .badge, .num, .pixfont { font-family: var(--display); font-weight: 400; letter-spacing: .3px; }
h2 { font-size: 17px; color: var(--pri); margin: 20px 0 8px; }
h3 { margin: 0; }
h4 { font-size: 15px; color: var(--muted); margin: 14px 0 6px; }
a { color: var(--blue); }
.sub { color: var(--muted); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* the pixel box: dark outline, light band, thin inner line, white (or night) inside, stepped corners */
.frame { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; }
.frame.sel { border-image: var(--box-sel) 5 fill / 15px stretch; }

/* header: a band of the dusk sky, the title in the DS face */
.topbar { background: linear-gradient(var(--shade), var(--shade)), var(--band) center / cover no-repeat; border-bottom: 3px solid var(--pri-edge); }
header { max-width: 1400px; margin: 0 auto; padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
header .titles { flex: 1 1 280px; min-width: 0; color: #ffffff; text-shadow: 2px 2px 0 rgba(40, 20, 80, .55); }
h1 { margin: 0; font-size: 28px; line-height: 1.15; }
header .sub { color: #fbefff; font-size: 15px; }
.me { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ffffff; font-family: var(--display); text-shadow: 1px 1px 0 rgba(40, 20, 80, .6); }
.me input { width: 170px; }
.daynight { display: flex; gap: 0; }
.daynight button { min-height: 0; padding: 4px 10px; font-size: 13px; border-width: 2px; border-bottom-width: 3px; }
.daynight button[aria-pressed=true] { background: var(--gold); color: #2c2000; border-color: #8a6a10; }
.spoilrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; margin: 4px 0; }
.spoilrow button { min-height: 0; padding: 3px 10px; font-size: 13px; }
/* the spoiler warning (2026-11-28): a trainer's or NPC's picture is blurred until it is tapped */
.spoilwrap { display: flex; align-items: center; gap: 8px; }
.spoillabel { font-family: var(--display); font-size: 13px; color: #ffffff; text-shadow: 1px 1px 0 rgba(40, 20, 80, .6); }
img.spoilblur { filter: blur(14px) saturate(.6); clip-path: inset(0); }
.card .spoiltap, .charcard.spoilcard .spoiltap { font-size: 13px; font-weight: bold; color: var(--pri); }
.spoilgate { text-align: center; }
.spoilgate .charpv { max-width: 320px; margin: 0 auto 10px; }

/* fields */
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 3px solid var(--edge2); border-radius: 0; padding: 6px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--pri); outline: none; }
textarea { width: 100%; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--pri); }
input[type=range] { accent-color: var(--pink); padding: 0; border: 0; background: none; }

/* buttons: a DS button with a pressable lower edge */
button { font-size: 15px; color: var(--ink); background: var(--panel); border: 3px solid var(--edge); border-bottom-width: 5px; border-radius: 0; padding: 6px 12px; cursor: pointer; line-height: 1.2; }
button:hover { background: var(--soft); }
button:active { border-bottom-width: 3px; transform: translateY(2px); }
button.primary { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); text-shadow: 1px 1px 0 var(--pri-edge); }
button.primary:hover { filter: brightness(1.08); background: var(--pri); }
button.good { border-color: var(--good); color: var(--good); }

/* main menu: tabs like the summary screen's */
nav { max-width: 1400px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 4px 6px; flex-wrap: wrap; align-items: flex-end; }
nav > button, nav summary { font-size: 16px; padding: 4px 6px 6px; border-style: solid; border-width: 12px 12px 0 12px; border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: #ffffff; text-shadow: 1px 1px 0 rgba(30, 10, 70, .6); background: none; transform: none; }
nav > button[aria-pressed=true], nav details[open] > summary, nav summary[aria-pressed=true] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR42mNkQAI2WhX/GfCAI9c6GGFsFmQNh6+249PHYKvN8B9mABNMcMeJJoavn3/jxTtONMENYbTRqviPLEAM8LCoY2BiIBOwMDAwMHx4941kjWTbOKpxUGkEANDOLnKYGqiaAAAAAElFTkSuQmCC) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: var(--pri-edge); text-shadow: none; }

nav .menu button:hover::before, nav .menu button:focus-visible::before { content: "▶"; position: absolute; left: 6px; color: var(--cursor); }
nav .menu button:hover { background: none; }
.navrule { max-width: 1240px; margin: 0 auto; border-top: 3px solid var(--pri-edge); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1400px; margin: 0 auto; padding: 12px 16px 6px; align-items: center; }
.tools input[type=search] { flex: 1 1 220px; }
main { max-width: 1400px; margin: 0 auto; padding: 6px 16px 70px; }
.notice { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 4px 4px; margin: 6px 0 14px; }
.notice.info b:first-child { color: var(--pri); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }

/* cards (the Cards layout) */
.card { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; background: none; padding: 0 2px 2px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; border-bottom-width: 15px; color: var(--ink); }
.card:hover, .card:focus-visible { border-image: var(--box-sel) 5 fill / 15px stretch; background: none; outline: none; }
.card:active { transform: none; }
.card.open { color: var(--muted); align-items: center; justify-content: center; min-height: 150px; text-align: center; }
.card .pic { height: 92px; display: flex; align-items: center; justify-content: center; }
.card .pic img { max-width: 100%; max-height: 90px; object-fit: contain; }
.card .pic img.px { image-rendering: pixelated; height: 80px; }
.card .pic .letter { font-size: 34px; color: var(--line); font-family: var(--display); }
.card .num { color: var(--muted); font-size: 13px; }
.card .name { font-family: var(--display); font-size: 17px; overflow-wrap: anywhere; line-height: 1.2; }
.pending { color: var(--pink); font-size: 12px; font-family: var(--display); }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.type, .plate { display: inline-block; color: #ffffff; padding: 1px 8px; font-size: 13px; text-transform: uppercase; text-shadow: 1px 1px 0 rgba(0, 0, 0, .45); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .28), inset 0 5px 0 rgba(255, 255, 255, .22);
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.meter { height: 9px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); margin: 6px 3px 2px; }
.meter i { display: block; height: 100%; background: linear-gradient(180deg, #a8f0a0 0 3px, #58c058 3px); }

/* the list, as a menu box */
.dexlist { width: 100%; border-collapse: collapse; font-size: 15px; }
.listbox { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0; }
.dexlist th { position: sticky; top: 0; background: var(--pri); color: #ffffff; text-shadow: 1px 1px 0 var(--pri-edge); text-align: left; padding: 6px 6px; cursor: pointer; user-select: none; white-space: nowrap; z-index: 1; font-size: 14px; }
.dexlist th.num, .dexlist td.num { text-align: right; width: 40px; }
.dexlist th[aria-sort] { background: var(--pink); text-shadow: 1px 1px 0 var(--pink-edge); }
.dexlist td { padding: 4px 6px; border-top: 2px dashed var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
.dexlist tr.mon { cursor: pointer; }
.dexlist tr.mon:hover td, .dexlist tr.mon:focus-visible td { background: var(--soft); }
.dexlist tr.mon td:first-child { position: relative; padding-left: 20px; }
.dexlist tr.mon:hover td:first-child::before, .dexlist tr.mon:focus-visible td:first-child::before { content: "▶"; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); color: var(--cursor); font-family: var(--display); }

.dexlist .ico { width: 40px; height: 40px; object-fit: contain; display: block; }

.dexlist .bst { font-family: var(--display); }

.dexlist .stat-lo { color: var(--bad); } .dexlist .stat-hi { color: var(--good); }
.viewtoggle { display: flex; }
.viewtoggle button[aria-pressed=true], .views button[aria-pressed=true], .toolbar button[aria-pressed=true], .filters button[aria-pressed=true] { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); }

/* ---------- the two screens ---------- */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); width: min(1280px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; }
dialog::backdrop { background: rgba(16, 8, 36, .72); }
.detail { padding: 6px; }
.ds { display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch; }
.screen { flex: 1 1 520px; min-width: 0; position: relative; border: 3px solid #241c3c; box-shadow: 0 0 0 3px #c9c0dc, 0 0 0 6px #241c3c; margin: 6px; }
.ds.wide .screen { flex-basis: 100%; }
.screen.top { background: var(--top) center top / cover no-repeat; padding: 16px; display: flex; flex-direction: column; min-height: 560px; }
.ds.wide .screen.top { min-height: 0; }
#detail .ds:not(.wide) > .screen.top { position: sticky; top: 6px; align-self: flex-start; z-index: 2; }
@media (max-width: 1100px) { #detail .ds:not(.wide) > .screen.top { position: static; align-self: stretch; } }
#detail .ds.wide > .screen.top { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 0 16px; }
#detail .ds.wide > .screen.top .namebar { flex-basis: 100%; }
#detail .ds.wide > .screen.top .stage { flex: 0 1 320px; min-height: 190px; }
#detail .ds.wide > .screen.top .viewbtns { flex-direction: column; align-self: center; }
#detail .ds.wide > .screen.top .dlg { flex: 1 1 300px; }
.screen.bottom { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 0; min-height: 560px; background: var(--bot-purple) center bottom / cover no-repeat; }
.screen.bottom[data-c=pink] { background-image: var(--bot-pink); } .screen.bottom[data-c=blue] { background-image: var(--bot-blue); } .screen.bottom[data-c=sky] { background-image: var(--bot-sky); }
.namebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.namebar .frame { padding: 0 6px; }
.namebar h3 { font-size: 28px; line-height: 1.1; }
.namebar .no { font-family: var(--display); font-size: 16px; }
.namebar .types { margin-left: auto; }
.namebar .type { font-size: 15px; padding: 3px 12px; }
.stage { flex: 1 1 auto; position: relative; min-height: 300px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 30px; }
.ds.wide .stage { min-height: 200px; }
.stage::before { content: ""; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(340px, 80%); height: 104px; background: var(--plat) center / 100% 100% no-repeat; }
.stage img { position: relative; max-width: 86%; max-height: 300px; object-fit: contain; }
.stage img.px { width: 240px; height: auto; }
.stage canvas { position: relative; margin-bottom: 18px; }
.stage img:not(.px) { border: 4px solid #ffffff; box-shadow: 0 0 0 3px #241c3c; max-height: 280px; margin-bottom: 24px; }
.stage img.px.icon { width: 128px; animation: iconbob .6s steps(1) infinite; }
/* A DS icon may hold HeartGold's two frames stacked (32x64): everywhere it shows the top frame, square; the big view
   on a Pokemon's page switches between the two like the party menu does (a 32x32 icon simply stays still). */
img[src$="ds-icon.png"] { aspect-ratio: 1 / 1; object-fit: cover !important; object-position: top; }   /* beats "contain" in lists */
@keyframes iconbob { 50% { object-position: bottom; } }
.stage .noart { position: relative; font-family: var(--display); color: #ffffff; text-shadow: 2px 2px 0 rgba(40, 20, 80, .6); font-size: 18px; margin-bottom: 40px; }
.viewbtns { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
.viewbtns button { border: 0; padding: 0 4px; background: none; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; min-height: 0; }
.viewbtns button[aria-pressed=true] { border-image: var(--box-sel) 5 fill / 15px stretch; }
.viewbtns button:active { transform: none; }
.dlg { position: relative; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 22px 2px 6px; font-family: var(--display); font-size: 17px; line-height: 1.85; min-height: 96px; white-space: pre-line; color: var(--ink); }
.dlg::after { content: "▼"; position: absolute; right: 0; bottom: -4px; color: var(--cursor); font-size: 13px; }
.dlg b { font-weight: 400; color: var(--pri); }
.screen-tabs { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
.screen-tabs button { font-size: 16px; padding: 3px 4px 6px; border-style: solid; border-width: 12px 12px 0 12px; color: #ffffff; text-shadow: 1px 1px 0 rgba(20, 10, 50, .65); background: none; }
.screen-tabs button:active { transform: none; }
.screen-tabs button[data-c=purple] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=pink] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJeIgb/GfCAbW8uMMLYjMgatt45hk8fg7eKFdwAuMZ1G1YxEAOCAsIgGknRhKyZiYFMwMLAwMDwats5kjWSbeOoxkGlEQAh/hkWEGxrUQAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=blue] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAICSn7/GfCAD/c2McLYjMgaHlzZiE8fg4KOP9wAuMYtW1YwEAN8fCIgGknRhKyZiYFMwMLAwMCwYt8zkjWSbeOoxkGlEQC5ORjmn/+rsAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[data-c=sky] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAI8Wi7/GfCAL9f2MMLYjMgaHl/YjU8fg6yBK9wAuMZtuzYxEAO83PwgGknRhKyZiYFMwMLAwMCw7sIbkjWSbeOoxkGlEQDqUxj+yNktrwAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.screen-tabs button[aria-selected=true] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR42mNkQAI2WhX/GfCAI9c6GGFsFmQNh6+249PHYKvN8B9mABNMcMeJJoavn3/jxTtONMENYbTRqviPLEAM8LCoY2BiIBOwMDAwMHx4941kjWTbOKpxUGkEANDOLnKYGqiaAAAAAElFTkSuQmCC) 4 4 0 4 fill / 12px 12px 0 12px stretch; color: var(--pri-edge); text-shadow: none; }
.screen-tabs .right { margin-left: auto; display: flex; gap: 6px; align-items: center; padding-bottom: 4px; }
.screen-tabs .right button { border-image: none; border: 3px solid var(--edge); border-bottom-width: 5px; padding: 4px 10px; background: var(--panel); color: var(--ink); text-shadow: none; }
.screen-tabs .right button.primary { background: var(--pri); color: #ffffff; border-color: var(--pri-edge); }
.page { flex: 1 1 auto; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 6px 6px; min-height: 0; overflow: auto; }
.page > h2:first-child, .page > div > h2:first-child { margin-top: 4px; }

/* inside the pages */
.entry { border-left: 6px solid var(--pink); background: var(--soft); padding: 8px 12px; margin-top: 10px; white-space: pre-line; }
.status { margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; }
.facts div span { color: var(--muted); font-size: 12px; display: block; font-family: var(--display); }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-size: 13px; }
.stat td:first-child { width: 96px; }
.stat td:first-child span { display: inline-block; background: var(--pri); color: #ffffff; font-family: var(--display); font-size: 13px; padding: 0 6px; text-shadow: 1px 1px 0 var(--pri-edge); }
.stat td:nth-child(2) { width: 44px; text-align: right; font-family: var(--display); font-size: 17px; }
.statbar { height: 10px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); background: linear-gradient(180deg, rgba(255, 255, 255, .45) 0 3px, transparent 3px), var(--sb, #58c058); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--soft); border: 2px solid var(--edge2); padding: 1px 8px; font-size: 14px; }
button.chip { font-family: var(--body); border-bottom-width: 2px; }
button.chip[aria-pressed=true] { border-color: var(--gold); background: var(--soft); box-shadow: inset 0 0 0 2px var(--gold); }
.match { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; }
.match > span { color: var(--muted); font-size: 13px; font-family: var(--display); }
.sim { background: var(--soft); padding: 12px; overflow-x: auto; border: 2px dashed var(--line); }
.sim input[type=range] { width: 100%; }
.problems li { color: var(--warn); }
.todo { columns: 2; padding-left: 18px; margin: 6px 0 0; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; }
.fields.narrow { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-family: var(--display); }
.field input, .field select, .field textarea { width: 100%; }
.field.wide { grid-column: 1 / -1; }
.statedit { display: grid; grid-template-columns: 90px 70px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.statedit > span { font-family: var(--display); font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; }
.row > .tiny { flex: 0 1 80px; }
.suggest { border: 2px dashed var(--line, #9b8bc4); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.section { border-top: 3px dashed var(--line); margin: 6px 0; }
.section > summary { cursor: pointer; padding: 10px 4px 10px 22px; display: flex; gap: 8px; align-items: center; list-style: none; position: relative; color: var(--pri); font-size: 16px; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: "▶"; position: absolute; left: 2px; color: var(--cursor); font-size: 13px; }
.section[open] > summary::before { content: "▼"; }
.section > summary .count { margin-left: auto; font-size: 13px; color: var(--muted); }
.section > .body { padding: 0 4px 12px; }
.savebar { position: sticky; bottom: 0; margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-style: solid; border-width: 15px; border-image: var(--box-sel) 5 fill / 15px stretch; padding: 0 4px 2px; z-index: 2; }
.savebar .ask { font-family: var(--display); }
.badge { font-size: 12px; padding: 0 7px; border: 2px solid var(--edge2); color: var(--muted); white-space: nowrap; font-family: var(--display); }
.badge.done { color: var(--good); border-color: var(--good); }
.badge.avail { color: var(--good); border-color: var(--good); }
.badge.taken { color: var(--muted); border-color: var(--edge2); }
.badge.mine { color: #f5c542; border-color: #f5c542; }
.charcard.avail { outline: 3px solid var(--good); outline-offset: -9px; }
.charcard.taken { opacity: 1; }
.charcard .badge { font-size: 13px; white-space: normal; max-width: 100%; }
.charcard.mine { outline: 3px solid #f5c542; outline-offset: -9px; }
.badge.need { color: var(--warn); border-color: var(--warn); }
.badge.nobattles { color: #ff6b6b; border-color: #ff6b6b; font-size: 13px; }   /* a story character that never battles (2026-11-28) */
.badge.ai { color: var(--blue); border-color: var(--blue); }
.card .line { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--soft); border: 2px solid var(--edge2); padding: 6px; font-size: 12px; color: var(--muted); }
.gallery img { width: 100%; height: 116px; object-fit: contain; display: block; }
.gallery figcaption { margin-top: 4px; overflow-wrap: anywhere; }
.box { background: var(--soft); border: 2px dashed var(--line); padding: 12px; margin-top: 10px; }
.dropzone { border: 3px dashed var(--edge2); background: var(--soft); padding: 16px; text-align: center; margin-top: 10px; }
.dropzone.over { border-color: var(--pink); background: var(--panel); }
.dropzone b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--pri); display: block; }
.error { color: var(--bad); }
.error:not(:empty) { margin: 0 0 8px; }
.ok { color: var(--good); }
.scroll { overflow-x: auto; }
.xclose { display: none; }

/* sprite studio (inside the bottom screen, which then spans the width) */
.step { display: flex; gap: 10px; align-items: baseline; margin: 18px 0 8px; }
.step b.n { flex: none; width: 26px; height: 26px; line-height: 26px; text-align: center; background: var(--pink); color: #fff; font-size: 14px; font-family: var(--display); font-weight: 400; clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.step .what { font-family: var(--display); font-size: 17px; color: var(--pri); }
.inspo { display: flex; gap: 8px; flex-wrap: wrap; }
.inspo button { position: relative; padding: 4px; background: var(--soft); }
.inspo button[aria-pressed=true] { border-color: var(--pink); }
.inspo img { width: 76px; height: 76px; object-fit: contain; display: block; }
.inspo .order { position: absolute; top: -8px; right: -8px; background: var(--pink); color: #fff; width: 22px; height: 22px; font-size: 12px; line-height: 22px; text-align: center; font-family: var(--display); }
.queue { background: var(--soft); border: 2px dashed var(--line); padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.queue ol { margin: 4px 0 0; padding-left: 22px; }
.queue li.mine { font-weight: 700; }
.spinner { display: inline-block; width: 10px; height: 10px; background: var(--pink); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .try .bar i { transition: none; } }
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.version { flex: none; width: 108px; padding: 4px; text-align: center; font-size: 12px; background: var(--panel); }
.version[aria-pressed=true] { border-color: var(--pink); }
.version img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto; background: var(--soft); }
.version .badge { display: inline-block; margin-top: 3px; }
.version.rejected { opacity: .5; }
.studio-ed { border: 2px dashed var(--line); padding: 12px; margin-top: 8px; }
.views { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.canvaswrap { display: flex; justify-content: center; background: var(--soft); padding: 8px; }
.pixcanvas { touch-action: none; image-rendering: pixelated; cursor: crosshair; max-width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.toolbar .sep { width: 3px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatch { width: 28px; height: 28px; padding: 0; border: 3px solid var(--edge); border-bottom-width: 3px; }
.swatch[aria-pressed=true] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.swatches input[type=color] { width: 36px; height: 30px; padding: 0 2px; }
.aibox { background: var(--soft); border: 2px dashed var(--line); padding: 10px 12px; margin-top: 10px; }
.aibox .row { margin: 6px 0 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.trio { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.trio figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.trio img { image-rendering: pixelated; background: var(--soft); display: block; }
.trystage { border-top: 3px dashed var(--line); margin-top: 14px; }
.tryctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 8px; font-size: 14px; }
.tryctl .from { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border: 2px solid var(--line); padding: 3px 8px; flex-wrap: wrap; max-width: 100%; }
.tryctl .from select { max-width: 100%; min-width: 0; }   /* MAP's "from" list ran off a phone screen (2026-11-27 night) */
.tryctl .from img { width: 36px; height: 36px; object-fit: contain; }
.trygroup { margin: 6px 0 10px; }
.tries { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.try { width: 140px; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.try.picked { border-image: var(--box-sel) 5 fill / 15px stretch; }
.try.current .trypic { box-shadow: 0 0 0 3px var(--pink); }
.try.broken .trypic, .try.failed .trypic { outline: 3px dashed var(--warn); outline-offset: -3px; }
.try.waiting { opacity: .75; }
.trypic { margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 4px;
  background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; }
.trypic img { width: 100%; height: 100%; object-fit: contain; }
.try .bar { height: 8px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel); overflow: hidden; }
.try .bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width 1s linear; }
.tryfoot { color: var(--muted); min-height: 16px; }
.tryfoot .warn { color: var(--warn); }
.tryact { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tryact button { font-size: 12px; padding: 2px 7px; border-width: 2px; border-bottom-width: 4px; }
.together { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
canvas.battle { width: 512px; max-width: 100%; image-rendering: pixelated; border: 3px solid var(--edge); }
.drawbox { margin: 6px 0 10px; }
canvas.drawpad { width: 480px; max-width: 100%; touch-action: none; cursor: crosshair; background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 24px 24px; }
canvas.drawpad.px { image-rendering: pixelated; }
canvas.pcbox { width: 360px; max-width: 100%; image-rendering: pixelated; border: 3px solid var(--edge); display: block; margin-bottom: 6px; }

/* type balance, reorder */
.balance { width: 100%; max-width: 780px; }
.balance td { padding: 5px 6px; vertical-align: middle; }
.balance .track { position: relative; height: 14px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); min-width: 120px; }
.balance .track i { position: absolute; left: 0; top: 0; bottom: 0; }
.balance .track b { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--ink); }
.reorder .bar { border-style: solid; border-width: 15px; border-image: var(--box-sel) 5 fill / 15px stretch; padding: 0 4px; margin: 4px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reorder .bar .grow { flex: 1 1 200px; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.rtile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; min-height: 104px; background: var(--panel); border: 2px solid var(--line); color: inherit; }
.rtile img { width: 48px; height: 48px; object-fit: contain; }
.rtile .letter { width: 48px; height: 48px; display: grid; place-items: center; font-family: var(--display); font-size: 22px; color: var(--muted); }
.rtile .no { font-family: var(--display); font-size: 12px; color: var(--muted); }
.rtile .nm { font-family: var(--display); font-size: 12px; text-align: center; overflow-wrap: anywhere; line-height: 1.15; }
.rtile .was { font-size: 11px; color: var(--pink); }
.rtile.open { border-style: dashed; color: var(--muted); }
.rtile.moved { border-color: var(--pink); }
.rtile.sel { outline: 3px solid var(--pri); background: var(--soft); }
.rtile.target:hover, .rtile.over { outline: 3px solid var(--pink); }
.rtile .gapx { position: absolute; top: 2px; right: 4px; font-size: 12px; color: var(--muted); cursor: pointer; }
.rrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; background: var(--panel); border: 2px solid var(--line); padding: 5px 10px; margin-bottom: 4px; }
.rrow.open { border-style: dashed; color: var(--muted); }
.rrow.moved { border-color: var(--pink); }
.rrow.over { outline: 3px solid var(--pink); }
.rrow .no { width: 44px; font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--display); }
.rrow .who { flex: 1 1 140px; font-family: var(--display); cursor: grab; }
.rrow input[type=number] { width: 70px; padding: 3px 6px; }
@media (min-width: 760px) { .reorder .bar { position: sticky; top: 8px; z-index: 1; } }

/* progress and the request board */
.split { display: flex; flex-wrap: wrap; gap: 22px; }
.split > .screen { min-height: 0; }
.counter { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: flex-end; }
.counter .big { font-family: var(--display); font-size: 54px; line-height: 1; color: #ffffff; text-shadow: 3px 3px 0 rgba(40, 20, 80, .55); }
.counter .lbl { font-family: var(--display); color: #ffffff; text-shadow: 2px 2px 0 rgba(40, 20, 80, .55); font-size: 17px; }
.exp { display: flex; align-items: center; gap: 14px; font-family: var(--display); }
.exp .track { flex: 1; height: 14px; background: #3a3450; box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #241c3c; }
.exp .track i { display: block; height: 100%; background: linear-gradient(180deg, #a8d8ff 0 4px, #4a90e0 4px); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.badges .b { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: 13px; padding: 6px 2px; }
.badges .b.locked { opacity: .55; }
.badges .b span:first-of-type { font-family: var(--display); font-size: 14px; }
.needrow { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 76px; gap: 10px; align-items: center; padding: 4px 0; }
.needrow .track { height: 12px; background: #3a3450; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--edge); }
.needrow .track i { display: block; height: 100%; }
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 18px; overflow-x: auto; padding: 4px 6px 10px; }
.boardcol { min-width: 230px; display: flex; flex-direction: column; }
.boardcol .colbody { flex: 1; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 2px 4px; display: flex; flex-direction: column; gap: 10px; min-height: 360px; }
.boardcol .colhead { align-self: flex-start; margin-left: 10px; font-family: var(--display); font-size: 16px; padding: 3px 6px 6px; border-style: solid; border-width: 12px 12px 0 12px; color: #ffffff; text-shadow: 1px 1px 0 rgba(20, 10, 50, .65); }
.boardcol .colhead[data-c=purple] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJKYn7/GfCAe682McLYjMgaLt3aiE8fg56aP9wAuMa1a1YwEAOCQyIgGknRhKyZiYFMwMLAwMBwYNszkjWSbeOoxkGlEQDkkRj8Jus9RAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=pink] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAJeIgb/GfCAbW8uMMLYjMgatt45hk8fg7eKFdwAuMZ1G1YxEAOCAsIgGknRhKyZiYFMwMLAwMDwats5kjWSbeOoxkGlEQAh/hkWEGxrUQAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=blue] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAICSn7/GfCAD/c2McLYjMgaHlzZiE8fg4KOP9wAuMYtW1YwEAN8fCIgGknRhKyZiYFMwMLAwMCwYt8zkjWSbeOoxkGlEQC5ORjmn/+rsAAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.boardcol .colhead[data-c=sky] { border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAT0lEQVR42mNkQAI8Wi7/GfCAL9f2MMLYjMgaHl/YjU8fg6yBK9wAuMZtuzYxEAO83PwgGknRhKyZiYFMwMLAwMCw7sIbkjWSbeOoxkGlEQDqUxj+yNktrwAAAABJRU5ErkJggg==) 4 4 0 4 fill / 12px 12px 0 12px stretch; }
.req { background: var(--soft); border: 2px solid var(--edge2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.req h4 { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.35; }
.req .meta { font-size: 13px; color: var(--muted); }
.req .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.area { display: inline-block; font-family: var(--display); font-size: 12px; color: #ffffff; padding: 0 7px; text-shadow: 1px 1px 0 rgba(0, 0, 0, .35); }
.area.pokemon { background: var(--pink); } .area.sprites { background: var(--pri); } .area.website { background: var(--blue); } .area.other { background: #6d6680; }

@media (max-width: 760px), (pointer: coarse) {
  input, select, textarea { font-size: 16px; min-height: 44px; }
  input[type=range] { min-height: 32px; }
  input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; }
  button { min-height: 44px; }
  button.small { min-height: 40px; padding: 6px 12px; }
  .swatch { width: 36px; height: 36px; min-height: 0; }
  .checks label { min-height: 40px; }
}
@media (max-width: 760px) {
  #home[data-view=species] > .screen.top .dlg, #home[data-view=species] > .screen.top .screen-title { display: none; }
  #home > .screen.top { padding: 10px; }
  #home > .screen.top .ctr { margin-top: 0; }
  nav > button, nav summary { font-size: 14px; }
  header { padding: 12px 16px 8px; }
  h1 { font-size: 22px; }
  .me { flex-basis: 100%; }
  .me input { flex: 1; width: auto; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  dialog { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0; overscroll-behavior: contain; background: var(--bg) var(--dots); background-size: 16px 16px; }
  .screen { flex-basis: 100%; margin: 6px 4px; }
  .screen.top { min-height: 0; padding: 10px; }
  .screen.bottom { min-height: 0; padding: 10px 8px; }
  .stage { min-height: 190px; padding-bottom: 22px; }
  .stage::before { height: 80px; bottom: 10px; }
  .stage img.px { width: 160px; }
  .stage img:not(.px) { max-height: 200px; }
  .dlg { min-height: 0; font-size: 15px; }
  .namebar h3 { font-size: 22px; }
  .todo { columns: 1; }
  .xclose { display: block; position: sticky; bottom: 14px; margin: 14px 4px -10px auto; min-width: 96px; z-index: 3; }
  .balance { min-width: 560px; }
  .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .needrow { grid-template-columns: minmax(0, 1fr) 70px; }
  .needrow .track { grid-column: 1 / -1; grid-row: 2; }
}

/* pickers */
.cat { font-size: 11px; padding: 1px 5px; color: #fff; white-space: nowrap; font-family: var(--display); }
.cat.Physical { background: #c4492f; } .cat.Special { background: #4a63b8; } .cat.Status { background: #7d7690; }
.picker { flex-basis: 100%; width: 100%; max-height: 340px; overflow: auto; border: 3px solid var(--pri); background: var(--panel); margin: 2px 0 8px; }
.picker table { width: 100%; border-collapse: collapse; font-size: 13px; }
.picker th { position: sticky; top: 0; background: var(--pri); color: #ffffff; text-align: left; padding: 5px 6px; cursor: pointer; white-space: nowrap; z-index: 1; }
.picker th[aria-sort] { background: var(--pink); }
.picker td { padding: 4px 6px; border-top: 2px dashed var(--line); vertical-align: top; }
.picker tr.opt { cursor: pointer; } .picker tr.opt:hover td, .picker tr.opt.hot td { background: var(--soft); }
.picker .nm { font-family: var(--display); white-space: nowrap; }
.picker .ds { color: var(--muted); }
.picker.wide { position: absolute; z-index: 40; margin: 0; box-shadow: 0 6px 18px rgba(20, 10, 50, .3); }
.picker .why { color: var(--pri); font-weight: normal; }
.picker .filters { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px; border-bottom: 2px dashed var(--line); position: sticky; left: 0; }
.picker .filters button { padding: 1px 7px; font-size: 12px; min-height: 0; border-width: 2px; }
.movetable td { padding: 4px 6px; border-top: 2px dashed var(--line); vertical-align: top; }
.movetable .ds { color: var(--muted); font-size: 13px; }

/* ---------- the page itself as two screens: top = what you look at, bottom = what you do ---------- */
.home { margin-top: 4px; }
.home > .screen.top { flex: 0 1 340px; position: sticky; top: 10px; align-self: flex-start; min-height: 600px; }
.home > .screen.bottom { flex: 1 1 620px; min-height: 600px; gap: 10px; }
.home.wide > .screen.top { flex-basis: 100%; position: static; min-height: 0; flex-direction: row; flex-wrap: wrap; gap: 14px; align-items: stretch; }
.home.wide > .screen.top > * { flex: 1 1 300px; }
.home.wide > .screen.top .stage { flex: 0 1 300px; min-height: 190px; }
.home .tools { padding: 0; max-width: none; margin: 0; }
.home .tools select, .home .tools input { border-color: var(--edge); }
.home .viewtoggle button { border-color: var(--edge); }
.home .page { flex: 1 1 auto; }
.home .page.bare { border: 0; border-image: none; padding: 0; }
.home .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.home .grid > .scroll { margin: 0 -6px; }
.screen-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.screen-title .frame { padding: 0 8px; font-family: var(--display); font-size: 22px; line-height: 1.3; }
.screen-title .frame.small { font-size: 15px; padding: 0 6px; }
.ctr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.ctr .frame { padding: 0 4px; text-align: center; }
.ctr b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.1; color: var(--pri); }
.ctr b small { font-size: 13px; color: var(--muted); }
.ctr span { font-family: var(--display); font-size: 12px; color: var(--muted); }
.home > .screen.top .exp { margin: 14px 2px 4px; color: #ffffff; text-shadow: 2px 2px 0 #3c2a78, -1px -1px 0 #3c2a78, 1px -1px 0 #3c2a78, -1px 1px 0 #3c2a78; font-size: 15px; }
.home > .screen.top .dlg { margin-top: auto; }
.home.wide > .screen.top .dlg { margin-top: 0; align-self: flex-end; }
.home > .screen.top .open-mon { margin-top: 8px; align-self: center; }
.preview-types { display: flex; gap: 6px; justify-content: center; margin-top: 6px; min-height: 24px; }
@media (max-width: 1000px) {
  .home > .screen.top { flex-basis: 100%; position: static; min-height: 0; }
  .home > .screen.top .stage { display: none; }
  .home > .screen.top .dlg { margin-top: 12px; }
  .home > .screen.bottom { min-height: 0; }
}

/* the Pokemon page */
.namebar .frame.cat { font-family: var(--display); font-size: 14px; color: var(--muted); }
.dlg .say-title { color: var(--pri); }
.page[hidden] { display: none; }
.pagehead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 2px 0 6px; }
.pagehead h2 { margin: 0; }
.abilitybtns { display: flex; flex-wrap: wrap; gap: 6px; }
.abilitybtns button { font-family: var(--display); border: 0; padding: 0 4px; background: none; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; font-size: 15px; }
.abilitybtns button[aria-pressed=true], .abilitybtns button:hover, .abilitybtns button:focus-visible { border-image: var(--box-sel) 5 fill / 15px stretch; outline: none; }
.abilitybtns button:active { transform: none; }
.abilitybtns small { display: block; font-size: 11px; color: var(--muted); line-height: 1; margin-top: -2px; }
.stattotal { display: flex; justify-content: space-between; gap: 10px; border-top: 3px dashed var(--line); padding-top: 6px; margin-top: 8px; font-family: var(--display); }
.stattotal span:first-child b { font-weight: 400; color: var(--pri); }
.factrows { display: flex; flex-direction: column; }
.factrows > div { display: grid; grid-template-columns: 22px minmax(110px, 160px) 1fr; gap: 4px; padding: 4px 0; border-bottom: 2px dashed var(--line); align-items: baseline; }
.factrows > div:last-child { border-bottom: 0; }
.factrows > div::before { content: "▶"; color: var(--cursor); visibility: hidden; font-size: 12px; }
.factrows > div:hover::before { visibility: visible; }
.factrows > div > span:first-child { font-family: var(--display); color: var(--muted); font-size: 14px; }

/* stat sliders: a bar like the HP bar, a number to type in, arrows for small steps */
.statrow { display: grid; grid-template-columns: 84px 64px 26px minmax(0, 1fr) 26px; gap: 8px; align-items: center; margin-bottom: 8px; }
.statrow > label { font-family: var(--display); font-size: 14px; }
.statrow input[type=number] { padding: 4px 6px; text-align: right; font-family: var(--display); }
.statrow .arrow { border: 0; background: none; padding: 0; color: var(--pink); font-size: 16px; min-height: 0; }
.statrow .arrow:active { transform: none; }
.hpbar { position: relative; height: 14px; background: #3a3450; box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--edge); margin: 0 4px; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; }
.hpbar input[type=range] { position: absolute; inset: -10px 0; width: 100%; height: auto; margin: 0; opacity: 0; cursor: pointer; }
.hpbar:focus-within { box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--gold); }
@media (max-width: 760px) { .statrow { grid-template-columns: 70px 64px 30px minmax(0, 1fr) 30px; gap: 6px; } }

/* body colour swatches */
.colours { display: flex; flex-wrap: wrap; gap: 8px; }
.colours button { width: 30px; height: 30px; padding: 0; border: 3px solid var(--edge); border-bottom-width: 3px; min-height: 0; }
.colours button[aria-checked=true] { box-shadow: 0 0 0 3px var(--gold); }
.colours button:active { transform: none; }

/* save: "Save the changes?" with a YES / NO box, as the games ask */
.yesno { position: sticky; bottom: 0; z-index: 3; display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
.yesno .ask { flex: 1; min-width: 0; border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 6px; font-family: var(--display); line-height: 1.8; white-space: pre-line; max-height: 140px; overflow: auto; }
.yesno .ask .error { font-family: var(--body); }
.yesno .menu { border-style: solid; border-width: 15px; border-image: var(--box-sel) 5 fill / 15px stretch; display: flex; flex-direction: column; min-width: 96px; padding: 0; }
.yesno .menu button { border: 0; background: none; text-align: left; padding: 2px 4px 2px 22px; position: relative; font-size: 17px; min-height: 0; }
.yesno .menu button:active { transform: none; }
.yesno .menu button:hover::before, .yesno .menu button:focus-visible::before, .yesno .menu button.hot::before { content: "▶"; position: absolute; left: 2px; color: var(--cursor); }
.yesno .menu button:focus-visible { outline: none; }
.yesno .who { font-family: var(--body); font-size: 13px; color: var(--muted); }

/* a custom move / ability form keeps a plain box */
.detail > form:not(.ds) { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 6px 6px; }
.detail .top:not(.screen) { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.detail .top:not(.screen) h3 { font-size: 22px; }
.actions { margin-left: auto; display: flex; gap: 8px; }

/* paste or drop pictures */
.dropzone.small { padding: 10px; }

/* ---------- sprite studio v4: the set on the top screen, one step at a time on the bottom one ---------- */
#detail .ds.studio > .screen.top { position: sticky; top: 6px; align-self: flex-start; flex: 0 1 430px; min-height: 0; z-index: 2; }
#detail .ds.studio > .screen.bottom { flex: 1 1 600px; }
@media (max-width: 1100px) { #detail .ds.studio > .screen.top { position: static; flex-basis: 100%; } }
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 2px 4px; }
.slotpic { border: 0; width: 100%; min-height: 132px; display: flex; align-items: center; justify-content: center; padding: 4px;
  background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; }
.slotpic:hover { background-color: var(--soft); }
.slotpic:active { transform: none; }
.slotempty { font-size: 30px; color: var(--edge2); font-family: var(--display); }
.slotname { font-family: var(--display); display: flex; gap: 8px; align-items: baseline; }
.slotname small { font-size: 11px; color: var(--muted); }
.slot.live .slotname small { color: var(--good); }
.studio-bottom { display: flex; flex-direction: column; gap: 0; flex: 1 1 auto; }
.stepbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 8px; }
.stepbar button { border-width: 2px 2px 4px; padding: 3px 9px 3px 4px; font-size: 14px; display: inline-flex; gap: 5px; align-items: center; }
.stepbar button b { font-weight: 400; display: inline-block; min-width: 20px; height: 20px; line-height: 20px; text-align: center; background: var(--pink); color: #fff;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.stepbar button[aria-selected=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.stepbar button[aria-selected=true] b { background: #fff; color: var(--pri); }
.stepbar .tick { color: var(--good); }
.stepbar button[aria-selected=true] .tick { color: #fff; }
.stepbar .spinner { margin: 0 0 0 2px; }
.studio-page { min-height: 420px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; margin-top: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; }
.tilepic { position: relative; height: 136px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 4px;
  background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; border: 3px solid var(--edge2); border-bottom-width: 3px; }
button.tilepic:hover { border-color: var(--pri); }
button.tilepic:active { transform: none; }
.tilepic img { max-width: 100%; max-height: 124px; object-fit: contain; }
.tile.inuse .tilepic { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
.tile.broken .tilepic { border-style: dashed; border-color: var(--warn); }
.tile.wait .tilepic { border-style: dashed; }
.tag { position: absolute; top: 3px; left: 3px; background: var(--gold); color: #2c2000; font-family: var(--display); font-size: 11px; padding: 0 5px; }
.warnmark.broke { width: auto; padding: 0 4px; font-size: 11px; }
.warnmark { position: absolute; top: 3px; right: 3px; background: var(--warn); color: #fff; width: 18px; height: 18px; line-height: 18px; text-align: center; font-family: var(--display); font-size: 13px; }
.tilenote { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.3; }
.tileact { display: flex; justify-content: center; gap: 4px; }
.tryctl select { padding: 4px 6px; }
.tryctl .from img { width: 40px; height: 40px; object-fit: contain; }
.bodybox { background: var(--soft); border: 2px dashed var(--line); padding: 8px 10px; margin: 6px 0 8px; font-size: 14px; }
.grass { display: flex; gap: 18px; align-items: flex-end; justify-content: center; background: #c8e098; padding: 14px; border: 3px solid var(--edge); min-width: 180px; }
canvas.walker { image-rendering: pixelated; }
.pixeditor { border-style: solid; border-width: 15px; border-image: var(--box) 5 fill / 15px stretch; padding: 0 4px 4px; display: flex; flex-direction: column; gap: 8px; }
.edhead { display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--pri); }
.edgrid { display: grid; grid-template-columns: 76px minmax(0, 1fr) 196px; gap: 10px; align-items: start; }
.toolcol { display: flex; flex-direction: column; gap: 4px; }
.tool { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; font-size: 12px; border-width: 2px 2px 4px; min-height: 0; }
.tool .ic { font-size: 18px; line-height: 1.1; font-family: var(--body); }
.tool[aria-pressed=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.edcanvas { display: flex; justify-content: center; align-items: center; background: var(--soft); padding: 4px; min-height: 260px; border: 3px solid var(--edge2); }
.edswatches { display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 4px; margin-top: 6px; }
.sidecol input[type=color] { flex: none; width: 44px; height: 34px; padding: 0 2px; }
.pixeditor .yesno .ask input { width: 100%; font-size: 14px; padding: 4px 6px; }
@media (max-width: 760px) {
  .edgrid { grid-template-columns: 1fr; }
  .toolcol { flex-direction: row; flex-wrap: wrap; }
  .tool { flex: 1 0 58px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .tilepic { height: 112px; }
  .setgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 0; }
  .slot { padding: 0 0 2px; }
  .slotpic { min-height: 64px; padding: 2px; }
  .slotpic img { width: 100% !important; max-width: 72px; }
  .slotpic canvas.walker { width: 48px !important; height: 48px !important; }
  .slotname { font-size: 12px; flex-direction: column; align-items: center; gap: 0; }
  .slot button.small { min-height: 30px; padding: 2px 6px; font-size: 12px; }
  /* phones: the studio's top screen filled the first screen, so the steps were out of sight (2026-11-27 night) */
  .studio-top .namebar .frame.cat { display: none; }
  .studio-top .namebar h3 { font-size: 18px; }
  .studio-top .dlg { font-size: 13px; padding: 6px 10px; min-height: 0; }
}

/* the guided first time */
.guided h2 { font-size: 20px; }
.track { display: flex; flex-wrap: wrap; gap: 4px 2px; margin: 0 0 10px; font-family: var(--display); font-size: 13px; color: var(--muted); }
.track span { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; }
.track span + span::before { content: "\25b8"; margin-right: 4px; color: var(--edge2); }
.track b { font-weight: 400; display: inline-block; min-width: 20px; height: 20px; line-height: 20px; text-align: center; background: var(--line); color: var(--muted);
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.track .past b { background: var(--good); color: #fff; }
.track .now { color: var(--pri); }
.track .now b { background: var(--pink); color: #fff; }
.howmany { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.howmany button { min-width: 44px; font-size: 18px; }
.howmany button[aria-pressed=true] { background: var(--pri); color: #fff; border-color: var(--pri-edge); }
.eta { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 2px dashed var(--line); padding: 8px 10px; margin: 8px 0; font-family: var(--display); }
button.big { font-size: 22px; padding: 10px 24px; margin-top: 10px; }
.guided h4 .tick { color: var(--good); }

.req .acts .trash { margin-left: auto; color: var(--bad); border-color: var(--bad); }

/* the sprite tray */
.tray { position: fixed; right: 14px; bottom: 14px; z-index: 50; width: min(360px, calc(100vw - 28px)); border-style: solid; border-width: 15px;
  border-image: var(--box-sel) 5 fill / 15px stretch; padding: 0 2px 2px; box-shadow: 0 6px 18px rgba(20, 10, 50, .25); }
.tray[hidden] { display: none; }
.trayhead { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 2px; font-size: 15px; color: var(--pri); min-height: 0; }
.trayhead:active { transform: none; }
.trayhead .chev { margin-left: auto; color: var(--muted); }
.traybody { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; max-height: 46vh; overflow: auto; }
.traybody > * { flex-shrink: 0; }
.trayrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "i who when" "i what when"; gap: 0 8px; align-items: center;
  text-align: left; border: 0; border-top: 2px dashed var(--line); background: none; padding: 5px 2px; font-family: var(--body); font-size: 14px; min-height: 0; }
.trayrow:active { transform: none; }
.trayrow:hover { background: var(--soft); }
.trayrow > :first-child { grid-area: i; }
.trayrow .who { grid-area: who; font-family: var(--display); }
.trayrow .what { grid-area: what; color: var(--muted); font-size: 13px; }
.trayrow .when { grid-area: when; font-family: var(--display); font-size: 13px; white-space: nowrap; }
.trayrow.mine .who { color: var(--pink); }
.trayrow.ready .when { color: var(--good); }
.trayrow .dot { width: 8px; height: 8px; background: var(--edge2); display: inline-block; }
.tray .tick { color: var(--good); font-family: var(--display); }
.trayoff { color: var(--warn); font-size: 13px; padding: 4px 2px; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 6px 0; }
.qhead .grow { flex: 1; }
.qpc { font-family: var(--display); font-size: 14px; }
.qpc.on { color: var(--good); } .qpc.off { color: var(--warn); }
.qtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.qtable th { text-align: left; font-family: var(--display); font-weight: 400; color: var(--muted); padding: 4px 6px; border-bottom: 2px solid var(--line); }
.qtable td { padding: 5px 6px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
.qtable tr.run td { background: var(--soft); }
.qtable tr.mine .qmon { color: var(--pink); }
.qtable .when { font-family: var(--display); white-space: nowrap; }
.qtable .star { color: var(--pink); }
.qmon { border: 0; background: none; padding: 0; min-height: 0; display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); color: inherit; text-align: left; }
.qmon .ico { width: 32px; height: 32px; }
.qbar { height: 8px; background: var(--line); width: 120px; max-width: 100%; }
.qbar i { display: block; height: 100%; background: var(--good); }
.qpast { margin-top: 10px; } .qpast summary { cursor: pointer; font-family: var(--display); }
.linkish { border: 0; background: none; padding: 0; min-height: 0; color: var(--pri); text-decoration: underline; font-size: 12px; }
.teams { display: grid; gap: 10px; }
.tbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tbar .grow { flex: 1; }
.tpanel { display: grid; gap: 6px; background: var(--panel); border: 2px solid var(--line); padding: 10px; }
.libgrid { display: grid; gap: 6px; }
.libteam { border: 2px solid var(--line); padding: 6px 8px; }
.libhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; cursor: pointer; }
.libmons { display: flex; gap: 2px; margin-left: auto; }
.libmons img { width: 56px; height: 56px; object-fit: contain; }
.libmons img.px { image-rendering: pixelated; }
.libmons .letter { width: 32px; text-align: center; }
.libbody { display: grid; gap: 6px; margin-top: 6px; }
.libtext { white-space: pre-wrap; font-size: 12px; margin: 0; max-height: 260px; overflow: auto; }
.libnote { border-left: 3px solid var(--line); padding-left: 6px; }
.libadd { display: grid; gap: 4px; }
.spoiler summary { cursor: pointer; color: var(--pri); }
.clickrow { cursor: pointer; } .clickrow:hover td, .clickrow.open td { background: var(--panel2, rgba(128,128,255,.12)); }
.charbar .charname { font-family: var(--display); font-size: 18px; }
.charstatus { margin: 0; position: sticky; top: 0; z-index: 3; background: var(--panel); }
.charstatus:empty { display: none; }
.charcols { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .charcols { grid-template-columns: 1fr; } }   /* below this the battles table had no room */
.charside, .charmain { background: var(--panel); border: 2px solid var(--line); padding: 10px 12px; min-width: 0; }
.charstage { height: 180px; display: flex; align-items: center; justify-content: center; background: var(--soft); border: 2px solid var(--line); margin-bottom: 8px; }
.charstage .charsil { font-family: var(--display); font-size: 48px; color: var(--muted); }
.charmain .tslot { min-height: 150px; }
.tslot .slotbtns { display: flex; gap: 2px; margin-top: auto; }
.storyslots .storyadd { cursor: pointer; justify-content: center; font: inherit; }
.storyadd .plus { font-family: var(--display); font-size: 44px; line-height: 1; color: var(--muted); }
.storyadd:hover .plus { color: var(--pink); }
.storycard { cursor: pointer; position: relative; }
.storycard.star { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); background: var(--soft); }
.storycard .crown { font-size: 22px; line-height: 1; }
.storycard .lvl { font-size: 11px; }
.storycard .whenbtn { font-size: 11px; }
.storycard.when { grid-column: span 2; }
.whenrows { display: flex; flex-direction: column; gap: 2px; align-self: stretch; }
.whenrow { display: grid; grid-template-columns: 58px 24px 1fr; align-items: center; gap: 3px; padding: 1px 3px; min-height: 0; font-size: 11px; border-width: 1px; text-align: left; }
.whenrow.on { border-color: var(--gold); }
.whenrow .mini { width: 24px; height: 24px; object-fit: contain; }
.storyview { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.storypick { margin-top: 8px; border: 2px solid var(--line); background: var(--panel); padding: 6px; }
.storyset { margin-top: 8px; display: grid; gap: 8px; }
.storyset .tedit { border: 0; padding: 0; grid-template-columns: minmax(150px, 190px) minmax(200px, 1fr) minmax(0, 1.3fr); }
.storyset .tright { min-width: 0; overflow-x: auto; }
.storyset .tstats input[type=range] { width: 100%; min-width: 60px; }
.storyset .tstats tr > :nth-child(3) { display: none; }      /* the base-stat bar: the stat at its last battle needs the room */
@media (max-width: 900px) { .storyset .tedit { grid-template-columns: 1fr; } }
.storycard .setline { font-size: 11px; text-align: center; }
.storysetplan td, .storysetplan th { vertical-align: top; white-space: normal; }
.balance.storysetplan { min-width: 0; }                      /* three columns fit a phone (other .balance tables scroll there) */
.storypickhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.storypickhead input { flex: 1 1 200px; }
.storypicklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px; max-height: 340px; overflow: auto; }
.storypickrow { display: grid; grid-template-columns: 48px 1fr; grid-template-rows: auto auto auto; column-gap: 6px; align-items: center; text-align: left; padding: 4px; border: 2px solid var(--line); background: var(--field); color: inherit; font: inherit; cursor: pointer; }
.storypickrow img, .storypickrow .letter { grid-row: 1 / 4; width: 48px; height: 48px; object-fit: contain; }
.storypickrow img.px { image-rendering: pixelated; }
.storypickrow.on { border-color: var(--gold); }
.storypickrow .types { display: flex; gap: 2px; transform: scale(.8); transform-origin: left; }
.storypickrow { grid-template-rows: none; grid-auto-rows: auto; align-content: start; }
.storypickrow img, .storypickrow .letter { grid-row: 1 / span 6; grid-column: 1; align-self: start; }
.storypickrow > :not(img):not(.letter) { grid-column: 2; }
.storypickrow .statline { font-size: 11px; overflow-wrap: anywhere; }
.storypicklist { grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
.storypickrow { min-width: 0; }
.storypickrow > * { min-width: 0; }
.storypickrow .why { font-size: 11px; color: var(--pri); }
.storyfilters { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; align-items: center; }
.storyfilters button { padding: 1px 7px; font-size: 12px; min-height: 0; border-width: 2px; }
.storyfilters button.type { color: #ffffff; }
.tslot .slotbtns button { padding: 0 6px; min-height: 0; font-size: 12px; }
.charpics { display: flex; gap: 8px; flex-wrap: wrap; } .charpics img { max-height: 160px; max-width: 160px; object-fit: contain; border: 2px solid var(--line); }
.chardetail h4 { margin: 10px 0 4px; }
.chargrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.charcard { align-items: center; text-align: center; }
/* the characters page (2026-11-26, Arvind: "bruk vs trainer sprites for å preview de ... den siden er litt clunky"): each card shows
   the VS portrait (96x64, so a 3:2 box), a filter row on top, and every sprite of a trainer on its page */
.charpv { width: 100%; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; background: var(--soft); border: 2px solid var(--line); overflow: hidden; }
.charpv img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.charpv img.front { width: auto; }
.charpv img.photo { object-fit: cover; image-rendering: auto; }
.charpv .charsil { font-size: 40px; }
.charpv.empty { --tint: #8a8aa0; background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 30%, var(--soft)), var(--soft) 75%); }
.charinfo { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
@media (max-width: 560px) {      /* phones: a compact row per trainer, the picture on the left */
  .chargrid { grid-template-columns: 1fr; gap: 6px; }
  .charcard { flex-direction: row; align-items: center; text-align: left; gap: 10px; }
  .charcard .charpv { width: 120px; flex: none; }
  .charinfo { align-items: flex-start; flex: 1; }
}
#welcomebar { max-width: 1400px; margin: 0 auto; padding: 10px 16px 0; }
.welcome { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.welcomehi { font-family: var(--display); font-size: 17px; padding: 2px 12px; }
.mytrainers { display: flex; flex-wrap: wrap; gap: 8px; }
.mytrainer { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; background: var(--panel); border: 2px solid var(--line); text-align: left; min-height: 0; color: var(--ink); }
.mytrainer:hover, .mytrainer:focus-visible { border-color: var(--pri); }
.mytrainer .charpv { width: 120px; flex: none; }
.mytrainer .txt { display: flex; flex-direction: column; gap: 2px; }
.mytrainer .go { font-family: var(--display); font-size: 12px; color: var(--pri); }
@media (max-width: 560px) { .mytrainers, .mytrainer { width: 100%; } .mytrainer .charpv { width: 96px; } }
#home[data-page=detail] > .screen.top { display: none; }
.tanimbase { margin-top: 8px; }
.tanimshape { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-top: 6px; }
.tanimcells { display: flex; gap: 10px; align-items: flex-end; }
.tanimcell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; background: var(--soft); border: 2px solid var(--line); overflow: hidden; }
.tanimcell canvas, .tanimcell img { image-rendering: pixelated; }
.charhero { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: 18px; align-items: center; padding: 12px; margin: 10px 0 12px; background: var(--panel); border: 2px solid var(--line); }
@media (max-width: 700px) { .charhero { grid-template-columns: 1fr; } }
.heropic { width: 100%; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; background: var(--soft); border: 2px solid var(--line); overflow: hidden; }
.heropic img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.heropic img.photo { object-fit: cover; image-rendering: auto; }
.heropic .charsil { font-size: 56px; }
.herotext { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.charstage { height: 140px; display: flex; align-items: center; justify-content: center; }
/* the trainer studio (2026-11-21) */
.tstudio { display: grid; gap: 10px; }

.tbases { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; max-height: 360px; overflow: auto; padding: 2px; border: 2px solid var(--line); background: var(--soft); }
.tbase { padding: 0; border: 3px solid transparent; background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; display: grid; justify-items: center; cursor: pointer; }

/* trainer studio steps ANIM and BACK (2026-11-22) */
.tanims { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; max-height: 420px; overflow: auto; padding: 2px; border: 2px solid var(--line); background: var(--soft); }
.tanim { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 6px 8px; border: 3px solid var(--line); background: var(--field); cursor: pointer; font: inherit; color: var(--ink); }

.tanim .tag { position: static; }
.tanimpv { display: flex; gap: 6px; align-self: stretch; justify-content: center; background: var(--soft); padding: 2px 0; }
.tanimpv > span { display: flex; flex-direction: column; align-items: center; }
.tanimpv i { font-style: normal; font-size: 11px; color: var(--muted); }
.twide { display: inline-block; width: 80px; height: 80px; overflow: visible; }
.twide i { display: block; image-rendering: pixelated; transform-origin: 50% 100%; }
.basecell.flipped { transform: scaleX(-1); }
.tanimtop { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.battlewrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
.battleanim, .battleback { position: absolute; width: 43.75%; pointer-events: none; }
.battleanim { left: 53.125%; top: -6.25%; }
.battleback { left: 4.7%; top: 25%; }   /* the back's 80x80 ends on the text box (y 64-144), as in the game's throw (kast_*_i_kamp.gif); 50% hid all but the head (Arvind, 2026-11-26) */
.battleanim canvas, .battleback canvas, .battleback img { width: 100% !important; height: auto !important; image-rendering: pixelated; }
.battleback img { width: 71.4% !important; margin: 16.7% 0 0 14.3%; }
.battlebox { position: absolute; left: 0; right: 0; top: 75%; bottom: 0; background: #484048; border: 4px solid #484048; line-height: 1.3;
  box-shadow: inset 0 0 0 3px #f8f8f8; outline: 0; font-family: var(--display); font-size: 13px; color: #303030; padding: 6px 12px; }
.battlebox:empty { padding: 0; }
.battlebox { background: #f8f8f8; border-color: #484048; box-shadow: none; }
.edgewarn { display: inline-block; font-size: 12px; color: #fff; background: var(--warn, #c03030); padding: 1px 6px; margin: 2px 0; }
.edgewarn[hidden] { display: none; }
.tfields { margin-top: 14px; }
.tphotos { gap: 8px; }
.tphoto { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tfields h3 { margin: 0 0 4px; }
.tmore { margin-top: 8px; }
.tmore summary { cursor: pointer; color: var(--muted); }
.tfieldgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 10px; }
.tfieldgrid .field { display: flex; flex-direction: column; gap: 2px; }

@media (max-width: 760px) { .tfieldgrid .field.wide { grid-column: auto; } }

.typo { font-size: 13px; color: var(--warn, #e0a030); }

.tbasewrap { position: relative; display: flex; }

.animothers { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0 8px; }
.animothers canvas { background: var(--field); border: 2px solid var(--line); image-rendering: pixelated; }
.animothers canvas.cur { border-color: var(--gold); }
.tset { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tsetbox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; background: var(--soft); border: 2px solid var(--line); min-width: 120px; }
.tsetpic { min-height: 120px; display: flex; align-items: center; justify-content: center; }
.tbase i { display: block; width: 80px; height: 80px; image-rendering: pixelated; }
.tbase span { font-size: 10px; line-height: 1.1; color: #333; max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tstrength { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tstrength input { flex: 1; min-width: 160px; }
.tjob { border: 2px solid var(--line); padding: 6px 8px; background: var(--soft); }
.ttries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.ttry { padding: 0; border: 3px solid var(--line); background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; width: 166px; height: 166px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
.ttry img { width: 160px; height: 160px; image-rendering: pixelated; }
.ttry.on { border-color: var(--pri); }
.ttry.inuse::after { content: "IN USE"; position: absolute; top: 2px; left: 2px; background: var(--good); color: #fff; font-size: 11px; padding: 0 4px; font-family: var(--display); }
.ttry.wait { cursor: default; color: #555; font-size: 13px; }
.flip { position: relative; display: inline-block; line-height: 0; }
.flip .f2 { position: absolute; left: 0; top: 0; animation: f2flip 1.2s steps(1) infinite; }
@keyframes f2flip { 0% { opacity: 0; } 50% { opacity: 1; } }
/* frame 1 must go away while frame 2 shows, or parts that moved show twice (2026-11-23: Abyssys had two eyes) */
.flip .f1 { animation: f1flip 1.2s steps(1) infinite; }
@keyframes f1flip { 0% { opacity: 1; } 50% { opacity: 0; } }
.swipe { max-width: 560px; margin: 0 auto; }
.swipe .shead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 8px; }
.swipe .sbar { flex: 1 1 100%; height: 8px; background: var(--line); }
.swipe .sbar i { display: block; height: 100%; background: var(--good); }
.swipecard { position: relative; border: 3px solid var(--edge); background: var(--panel); padding: 10px; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .18s ease-out, opacity .18s; }
.swipecard.drag { transition: none; }
.swipecard .stitle { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-family: var(--display); }
.swipecard .stitle .chip { font-size: 12px; padding: 0 6px; border: 2px solid var(--line); }
.swipecard .sstage { margin: 8px 0; display: flex; justify-content: center; align-items: center; min-height: 260px; background: linear-gradient(#b0d8f8, #d8ecf8 70%, #c8e098 70%); }
.swipecard .sstage.back { background: linear-gradient(#d8ecf8, #c8e098 45%, #a8c870); }
.swipecard .spair { display: flex; gap: 10px; justify-content: center; }
.swipecard .spair figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.swipecard .spair img { width: 120px; height: 120px; image-rendering: pixelated; background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; display: block; }
.swipecard .snote { min-height: 1.4em; margin-top: 6px; }
.swipecard .snote.bad { color: var(--warn); }
.swipecard .sstamp { position: absolute; top: 18px; padding: 2px 10px; border: 4px solid; font-family: var(--display); font-size: 28px; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
.swipecard .sstamp.yes { left: 18px; color: var(--good); }
.swipecard .sstamp.no { right: 18px; color: var(--bad); transform: rotate(12deg); }
.swipe .sbtns { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 10px; }
.swipe .sbtns button { font-size: 18px; padding: 10px 6px; }
.swipe .sbtns .no { border-color: var(--bad); color: var(--bad); }
.swipe .sbtns .yes { border-color: var(--good); color: var(--good); }
.ttile .tilepic { flex-direction: row; gap: 8px; height: 140px; }
.ttile .nomap { width: 64px; font-size: 11px; }
.tiles:has(.ttile) { grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); }
.tspritebox .tpic { align-items: flex-end; }
.tryctl .from .basecell { display: inline-block; }
.spritebig { width: 160px; height: 160px; image-rendering: pixelated; background: repeating-conic-gradient(#eef1f6 0% 25%, #dde2ea 0% 50%) 50% / 16px 16px; }
.storyline { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.storyteam { display: grid; gap: 4px; }
.storymon { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.storymon img { width: 64px; height: 64px; object-fit: contain; } .storymon img.px { image-rendering: pixelated; }
.storymon .sub:last-child { flex-basis: 100%; }
.rlist { display: grid; gap: 6px; }
.rblock { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center; border: 2px solid var(--line); padding: 2px 6px; background: var(--panel); }
.rmon .types .type { font-size: 10px; padding: 0 4px; }
.rblock.moved { border-color: var(--pri); }
.rblock.flash { animation: rflash 1.6s ease-out; border-color: var(--warn, #f5c542); }
@keyframes rflash { from { background: rgba(245, 197, 66, .45); } to { background: var(--panel); } }
.rblock.over { outline: 3px dashed var(--pri); }
.rblock.rdragging { opacity: .35; }
.rghost { position: fixed; z-index: 1000; pointer-events: none; opacity: .9; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.rhandle { cursor: grab; font-size: 22px; text-align: center; user-select: none; }
.rmembers { display: grid; gap: 2px; }
.rmon { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rmon .no { font-variant-numeric: tabular-nums; min-width: 38px; }
.rmon img { width: 32px; height: 32px; object-fit: contain; } .rmon img.px { image-rendering: pixelated; }
.rmon .was { font-size: 11px; color: var(--pri); }
.ractions { display: flex; gap: 3px; align-items: center; }
.ractions button { padding: 2px 8px; }
.rto { width: 58px; }
.rbar { position: sticky; top: 0; z-index: 5; background: var(--bg, #1b1630); }
.rconfirm .chips { margin: 6px 0; }
.rgap { border-style: dashed; opacity: .8; }
.rsplit { padding: 0 4px; font-size: 11px; line-height: 1.2; opacity: .7; }

.tslots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.tslot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; min-height: 92px; background: var(--panel); border: 2px solid var(--line); color: inherit; }
.tslot[aria-selected="true"] { border-color: var(--pink); background: var(--soft); }
.tslot.empty { border-style: dashed; background: none; }
.tslot img { width: 80px; height: 80px; object-fit: contain; }
.tslot img.px { image-rendering: pixelated; }
.tslot .letter { width: 80px; height: 80px; display: grid; place-items: center; font-family: var(--display); font-size: 20px; color: var(--muted); }
.tslot .nm { font-family: var(--display); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
.tslot .types { display: flex; gap: 2px; transform: scale(.8); }
.tslot.dragslot { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tslot.dragslot img { -webkit-user-drag: none; pointer-events: none; }
.tslot.dragging { opacity: .45; cursor: grabbing; }
.tslot.dropto { border-color: var(--pink); outline: 2px dashed var(--pink); outline-offset: 2px; }
.tedit { display: grid; grid-template-columns: minmax(170px, 220px) minmax(220px, 1fr) minmax(280px, 1.3fr); gap: 14px; background: var(--panel); border: 2px solid var(--line); padding: 12px; align-items: start; }
.tleft, .tmid, .tright { display: grid; gap: 6px; min-width: 0; }
/* the team builder's picture; scoped, since the trainer studio's picture row is also .tpic (2026-11-24: this rule made that row a
   120x120 box, so the upload and paste area spilled over the rest of the PICTURE step) */
.tedit .tpic { width: 120px; height: 120px; object-fit: contain; justify-self: center; }
.tedit .tpic.noart { display: grid; place-items: center; font-family: var(--display); font-size: 40px; color: var(--muted); background: var(--soft); }
.trow { display: flex; gap: 8px; }
.flabel { font-family: var(--display); font-size: 13px; color: var(--muted); margin-top: 4px; }
.tmove { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.tmove input { flex: 1 1 140px; }
.tmove .mv { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
.tstats { width: 100%; border-collapse: collapse; font-size: 14px; }
.tstats th, .tstats td { padding: 3px 4px; }
.tstats th { text-align: left; font-weight: 400; color: var(--muted); }
.tstats th.up { color: var(--good); } .tstats th.down { color: var(--bad); }
.tstats .track { width: 70px; height: 8px; background: var(--line); } .tstats .track i { display: block; height: 100%; }
.tstats .evc { display: flex; gap: 4px; align-items: center; } .tstats .evc input[type=range] { width: 90px; }
.tstats .tot { font-family: var(--display); }
.treport h2 { margin: 12px 0 6px; }
.tdef { border-collapse: collapse; font-size: 13px; }
.tdef th, .tdef td { padding: 3px 6px; border-bottom: 1px dashed var(--line); text-align: center; }
.tdef th:first-child { text-align: left; }
.tdef .mx.weak, .tdef td.weak { color: var(--bad); font-weight: 700; } .tdef .mx.res { color: var(--good); } .tdef .mx.imm { color: var(--pri); font-weight: 700; }
.tdef tr.hot { background: var(--soft); }
.cov { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; margin: 2px 6px 2px 0; }
.cov.good { font-weight: 700; } .cov.bad { opacity: .6; }
@media (max-width: 900px) { .tedit { grid-template-columns: 1fr; } .tslots { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* damage calc (TEAMS > Damage calc), laid out like wispcoach.com/calc */
.calc { display: grid; gap: 12px; background: var(--panel); border: 2px solid var(--line); padding: 14px 16px; min-width: 0; }
.ctabs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctab { padding: 6px 16px; border: 2px solid var(--line); background: none; color: inherit; font-family: var(--display); }
.ctab[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }
.ctabs .sub { margin-left: 8px; }
.csentence { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 26px; line-height: 1.25; }
.csentence .cfill { color: var(--muted); }
.csentence .chpic { width: 56px; height: 56px; object-fit: contain; } .csentence .chpic.px { image-rendering: pixelated; }
.csentence .cdot { width: 40px; height: 40px; }
.csentence input.cname { font: inherit; font-weight: 800; background: none; border: none; border-bottom: 2px dotted var(--muted); color: inherit; padding: 0 2px; min-width: 4ch; max-width: 100%; }
