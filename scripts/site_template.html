// The same rules as dexlib.change_layout in scripts/dexlib.py (the import applies them for real). layout = ids per slot, null = empty.
function arrange(layout, ops) {
  layout = layout.slice();
  const size = layout.length;
  for (const op of ops) {
    if (op.op === "set") {                                  // the whole order at once (same checks as dexlib.set_layout)
      const used = layout.slice(0, layout.reduce((m, id, i) => id ? i + 1 : m, 0));
      if (op.from && JSON.stringify(op.from) !== JSON.stringify(used)) throw new Error("The dex changed while you were working. Close this and open Change dex numbers again.");
      const ids = op.layout.filter(Boolean), had = layout.filter(Boolean);
      if (new Set(ids).size !== ids.length || ids.length !== had.length || ids.some(id => !had.includes(id))) throw new Error("The new order does not hold exactly the Pokemon of the dex.");
      layout = op.layout.concat(Array(size - op.layout.length).fill(null));
      continue;
    }
    const slot = op.to || op.at;
    if (!Number.isInteger(slot) || slot < 1 || slot > size) throw new Error("There is no slot #" + slot + ". Use a number from 1 to " + size + ".");
    if (op.op === "move") {
      const old = layout.indexOf(op.id);
      if (old < 0) throw new Error("That Pokemon is not in the dex.");
      if (layout[slot - 1] === null) { layout[old] = null; layout[slot - 1] = op.id; }
      else { layout.splice(old, 1); layout.splice(slot - 1, 0, op.id); }
    } else if (op.op === "insert") {
      if (layout[size - 1] !== null) throw new Error("The last slot (#" + size + ") is taken, so nothing can move down. Move that Pokemon first or remove an empty slot.");
      layout.splice(slot - 1, 0, null); layout.pop();
    } else if (op.op === "close") {
      if (layout[slot - 1] !== null) throw new Error("Slot #" + slot + " is not empty.");
      layout.splice(slot - 1, 1); layout.push(null);
    } else throw new Error("Unknown step.");
  }
  return layout;
}

}

// ---------- the sprite tray: the drawing line, always in view (Arvind, 15 Oct: "it would be cool to see a queue and minimize
// windows while sprites are being built; it feels a bit scary to leave it while it works"). Bottom right of every page:
// what the drawing PC does, everyone's requests in line with the time until each is done (yours marked), and the
// Pokemon whose new pictures are ready to be picked. A tap opens that Pokemon's SPRITES.
const tray = {open: remember.get("tray") !== "closed", jobs: [], tries: [], worker: null, ready: [], timer: null, el: null};
function mySprites() { try { return JSON.parse(remember.get("my-sprites") || "{}"); } catch (e) { return {}; } }
function noteMine(sid, seen) {                    // seen: the studio of this Pokemon was opened (its ready pictures are seen)
  const m = mySprites();
  if (seen) { if (m[sid]) m[sid].seen = Date.now(); } else m[sid] = {asked: Date.now(), seen: Date.now()};
  remember.set("my-sprites", JSON.stringify(m));
  if (!seen) trayLoad();
}
async function trayLoad() {
  if (!DEX.web.url) return;
  clearTimeout(tray.timer);
  try {
    const mine = mySprites(), recent = Object.entries(mine).filter(([, v]) => Date.now() - v.asked < 12 * 3600000).map(([k]) => k);
    [tray.jobs, tray.worker] = await Promise.all([
      dbRead("sprite_jobs?status=in.(queued,running)&order=id.asc&select=id,species_id,status,mode,stage,count,started_at"),
      dbRead("sprite_worker?select=seen_at,state,timings").then(r => r[0] || null)]);
    const ids = tray.jobs.map(j => j.id);
    tray.tries = ids.length ? await dbRead("sprite_tries?job_id=in.(" + ids.join(",") + ")&select=job_id,status") : [];
    // ready: my Pokemon with pictures finished after I last looked, and nothing of them still in line
    tray.ready = [];
    if (recent.length) {
      const since = new Date(Math.min(...recent.map(k => mine[k].seen))).toISOString();
      const done = await dbRead("sprite_tries?species_id=in.(" + recent.join(",") + ")&status=eq.done&finished_at=gt." + since + "&select=species_id,stage,finished_at");
      for (const sid of recent) {
        if (tray.jobs.some(j => j.species_id === sid)) continue;
        const fresh = done.filter(d => d.species_id === sid && new Date(d.finished_at).getTime() > mine[sid].seen);
        if (fresh.length) tray.ready.push({sid, n: fresh.length});
      }
    }
  } catch (e) { /* the tray waits for the next round */ }
  drawTray();
  tray.timer = setTimeout(trayLoad, tray.jobs.length ? 8000 : 60000);
}
function drawTray() {
  if (!tray.el) { tray.el = h("aside", {class: "tray", "aria-label": "Sprites being drawn"}); document.body.append(tray.el); }
  const mine = mySprites(), timings = tray.worker && tray.worker.timings;
  if (!tray.jobs.length && !tray.ready.length) { tray.el.hidden = true; return; }
  tray.el.hidden = false;
  const online = tray.worker && Date.now() - new Date(tray.worker.seen_at).getTime() < 90000;
  const names = {art: "cut-out", front: "front", back: "back", icon: "icon", follower: "walking sprite"};
  let total = 0;
  const rows = tray.jobs.map(j => {
    const n = j.count || 1, done = tray.tries.filter(x => x.job_id === j.id && x.status !== "drawing").length, each = secondsFor(timings, j.stage || "front");
    total += Math.max(5, (n - done) * each);
    const s = byId.get(j.species_id), who = s ? s.data.name : j.species_id, isMine = !!mine[j.species_id];
    return h("button", {type: "button", class: "trayrow" + (isMine ? " mine" : ""), onclick: () => s && openDetail(s, "sprite")},
      j.status === "running" ? h("span", {class: "spinner"}) : h("span", {class: "dot"}),
      h("span", {class: "who"}, (isMine ? "\u2605 " : "") + who), h("span", {class: "what"}, n + " " + (names[j.stage] || j.stage || "sprite") + (n > 1 ? "s" : "")),
      h("span", {class: "when"}, j.status === "running" ? done + "/" + n : "in line", " \u00b7 ", online ? aboutMinutes(total).replace("about ", "~") : "waits for the PC"));
  });
  const readyRows = tray.ready.map(r => {
    const s = byId.get(r.sid);
    return h("button", {type: "button", class: "trayrow ready", onclick: () => s && openDetail(s, "sprite")},
      h("span", {class: "tick"}, "\u2713"), h("span", {class: "who"}, s ? s.data.name : r.sid), h("span", {class: "what"}, r.n + " new picture" + (r.n > 1 ? "s" : "")), h("span", {class: "when"}, "PICK \u25b6"));
  });
  const running = tray.jobs.find(j => j.status === "running");
  const head = h("button", {type: "button", class: "trayhead", "aria-expanded": String(tray.open), onclick: () => { tray.open = !tray.open; remember.set("tray", tray.open ? "" : "closed"); drawTray(); }},
    tray.jobs.length ? h("span", {class: "spinner"}) : h("span", {class: "tick"}, "\u2713"),
    tray.jobs.length ? "DRAWING " + tray.jobs.length + " \u00b7 " + (online ? aboutMinutes(total).replace("about ", "~") : "PC is off") : tray.ready.length + " READY TO PICK",
    h("span", {class: "chev"}, tray.open ? "\u25bc" : "\u25b2"));
  tray.el.replaceChildren(...[head, tray.open ? h("div", {class: "traybody"},
    !online && tray.jobs.length ? h("div", {class: "trayoff"}, "The drawing PC is off. The line waits until it is back.") : null,
    running && !tray.open ? null : null, readyRows, rows,
    h("div", {class: "traynote"}, "You can leave the page: it keeps drawing. \u2605 = yours. ",
      h("button", {type: "button", class: "linkish", onclick: () => { view = "sprites"; plan = null; render(); window.scrollTo(0, 0); }}, "See the whole line \u25b6"))) : null].filter(Boolean));
}

// ---------- the request board ----------
// Cards come from data/requests.yaml (what the story needs, written by the team) and from the
// website (species_edits rows of kind 'request'; the newest row of a card wins).
const BOARD = [["idea", "WISHES", "pink"], ["needed", "THE GAME NEEDS", "purple"], ["doing", "BEING MADE", "blue"], ["done", "DONE", "sky"]];
const AREAS = [["pokemon", "Pokemon"], ["sprites", "Sprites"], ["website", "Website"], ["other", "Other"]];
let boardCards = null;
async function loadBoard() {
  const cards = new Map((DEX.requests || []).map(r => [r.id, Object.assign({}, r)]));
  if (DEX.web.url) {
    const rows = await dbRead("species_edits?select=id,species_id,data,editor&kind=eq.request&order=id.asc");
    for (const row of rows) if (row.data && typeof row.data.title === "string") cards.set(row.species_id, Object.assign({}, cards.get(row.species_id) || {}, row.data, {id: row.species_id, by: row.data.by || row.editor}));
  }
  boardCards = [...cards.values()].filter(c => !c.deleted);
}
function renderBoard() {
  const grid = document.getElementById("grid");
  if (boardCards === null) {
    grid.replaceChildren(h("div", {class: "empty", style: "grid-column:1/-1"}, "Loading..."));
    loadBoard().catch(() => { boardCards = (DEX.requests || []).slice(); }).then(() => view === "board" && renderBoard());
    return;
  }
  const save = async (card, changes, status, isNew) => {
    const data = Object.assign({}, card, changes);
    delete data.id;
    status.textContent = "Saving...";
    try {
      await saveEdit("request", card.id, data); Object.assign(card, changes);
      if (isNew) boardCards.push(card);

  };
  const columns = BOARD.map(([status, title, colour], col) => {
    const cards = boardCards.filter(c => (c.status || "idea") === status).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));

          col < BOARD.length - 1 ? h("button", {type: "button", class: "small", onclick: () => save(card, {status: BOARD[col + 1][0]}, note)}, BOARD[col + 1][1] + " ▶") : null,
          status !== "done" ? h("button", {type: "button", class: "small good", title: "Done", onclick: () => save(card, {status: "done"}, note)}, "\u2713 DONE") : null,
          h("button", {type: "button", class: "small trash", title: "Not relevant: remove it from the board",

    for (const r of rows) {

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    const response = await fetch(DEX.web.url + "/rest/v1/species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (!response.ok) return;
    for (const row of await response.json()) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      if (row.kind === "request") continue;          // cards on the request board (loaded by loadBoard)
      if (row.kind === "shiny" || row.kind === "cry") {   // a shiny or a cry saved since the build
        const store = row.kind === "shiny" ? DEX.shinies : DEX.cries;
        if (row.data.deleted) delete store[row.species_id]; else store[row.species_id] = Object.assign({}, row.data, {by: row.editor});
        continue;
      }
      if (row.kind === "reorder") {
        try { applyLayout(arrange(currentLayout(), Array.isArray(row.data.ops) ? row.data.ops : [])); } catch (e) { /* the import reports it */ }
        continue;
      }
      if (row.data.deleted) {                       // removed from the dex on the website
        DEX.species = DEX.species.filter(o => o.id !== row.species_id);
        delete DEX.images[row.species_id];
        DEX.species.forEach(derive); index();
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      delete row.data._base;
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Pictures uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const builtIn = new Map(Object.entries(DEX.images).flatMap(([sid, list]) => list.map(i => [i.id, sid])));
    const list = await fetch(DEX.web.url + "/rest/v1/species_images?select=id,species_id,path,caption,editor,removed&order=id.asc", {headers: {apikey: DEX.web.key}});
    if (list.ok) {
      for (const row of await list.json()) {
        if (row.removed) DEX.images[row.species_id] = allImages(row.species_id).filter(i => i.id !== row.id);
        else if (builtIn.has(row.id) && builtIn.get(row.id) !== row.species_id) {         // moved to another Pokemon since the page was built
          const from = builtIn.get(row.id), image = allImages(from).find(i => i.id === row.id);
          DEX.images[from] = allImages(from).filter(i => i.id !== row.id);
          if (image && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push(image);
        }
        else if (!built.has(row.id) && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      if (!document.getElementById("dialog").open) render();
    }
  } catch (e) { /* the built data is still shown */ }
}

document.getElementById("title").textContent = DEX.project;
drawDayNight();
const meBox = document.getElementById("me");
meBox.value = remember.get("editor");
meBox.addEventListener("input", () => remember.set("editor", meBox.value.trim()));
DEX.species.forEach(derive); index();
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
refreshLists();
document.getElementById("list-methods").append(...["grass", "cave", "surf", "fishing", "rock smash", "gift", "trade", "static"].map(m => h("option", {value: m})));
if (DEX.problems.length) document.getElementById("notice").append(h("details", {class: "notice"}, h("summary", {}, h("b", {}, DEX.problems.length + " saved edit(s) could not be used"), " - tap to see why"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show", "stage", "designer", "lacks"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("sort").addEventListener("input", ev => {
  const v = ev.target.value, m = v.match(/^([a-z]+)(-?1)?$/);
  if (m) { listSort = {key: m[1], dir: Number(m[2] || 1)}; render(); }
});
learnPeople();
document.getElementById("designer").append(...[...new Set(DEX.species.flatMap(designersOf))].sort((a, b) => a.localeCompare(b)).map(d => h("option", {value: d}, d)));
// The name box suggests the group's names, so everyone writes theirs the same way; the browser remembers it.
document.body.append(h("datalist", {id: "people"}, people().map(n => h("option", {value: n}))));
meBox.setAttribute("list", "people");
meBox.addEventListener("change", () => { const n = person(meBox.value); if (n && n !== meBox.value.trim()) { meBox.value = n; remember.set("editor", n); } });
document.getElementById("lacks").append(h("option", {value: "*game"}, "Not playable in the game yet"), h("option", {value: "*sprite"}, "No sprite yet"),
  ...DEX.checks.filter(([section]) => section !== "Art").map(([, label]) => h("option", {value: label}, "Missing " + label)));
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) closeDialog(); });
document.getElementById("dialog").addEventListener("cancel", () => { shown = null; if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("click", ev => { for (const d of document.querySelectorAll("nav details[open]")) if (!d.contains(ev.target)) d.open = false; });
if (takeSharedTeam()) view = "teams";
const charFromHash = () => { const m = location.hash.match(/^#char=([a-z0-9-]+)$/); return m && (DEX.characters || []).some(c => c.id === m[1]) ? m[1] : ""; };
if (charFromHash() && (CLAIMS_OPEN || CHARS_PREVIEW)) { view = "chars"; charOpen = charFromHash(); }
window.addEventListener("popstate", () => {      // the browser's back button: from a trainer's page back to the list, and forward again
  const id = charFromHash();
  if (id) { view = "chars"; charOpen = id; render(); }
  else if (charOpen) { charOpen = ""; render(); }
});
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
loadRecentEdits();
if (DEX.web.url) loadLost().then(renderNav).catch(() => {});
trayLoad();
loadApprovedSprites();
</script>
</body>
</html>
