.csentence .cmovebox { color: var(--pri) !important; }
.csentence .cword b { font-weight: 800; }
.csentence select.cpool { font: inherit; font-weight: 800; color: inherit; background: none; border: none; border-bottom: 2px dotted var(--muted); padding: 0 2px; max-width: 100%; cursor: pointer; }
.csentence select.cpool option { font-size: 15px; font-weight: 400; background: var(--panel); }
.csentence button.small { font-size: 13px; }
.cset { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; color: var(--muted); }
.cset .cdotsep { opacity: .6; }
.cset select { font-size: 13px; }
.cstep { display: inline-flex; align-items: center; border: 1px solid var(--line); }
.cstep button { padding: 0 8px; border: none; background: none; color: inherit; font-weight: 700; }
.cstep b { padding: 0 4px; color: var(--good); font-size: 13px; }
.clink { background: none; border: none; color: var(--pri); padding: 0; text-decoration: underline; cursor: pointer; font-size: 14px; }
.cmini { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: end; padding: 8px; border: 1px dashed var(--line); }
.cmevs { display: flex; flex-wrap: wrap; gap: 6px; }
.cchips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }

.cchip:hover { border-color: var(--line); color: inherit; }
.cchip[aria-pressed="true"] { border-color: var(--pink); background: var(--soft); color: inherit; }
.csep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.cchart { position: relative; padding-top: 18px; padding-bottom: 20px; user-select: none; }
.czlabels span, .cticks span { position: absolute; font-size: 11px; color: var(--muted); }
.czlabels span { top: 0; text-align: center; overflow: hidden; white-space: nowrap; }
.czlabels span.ko, .czlabels span.bad { color: var(--bad); font-weight: 700; } .czlabels span.good { color: var(--good); font-weight: 700; }
.cticks span { bottom: 2px; transform: translateX(-50%); } .cticks span:first-child { transform: none; }
.cplot { position: relative; border-bottom: 2px solid var(--line); overflow: hidden; }
.czone { position: absolute; top: 0; bottom: 0; background: rgba(127, 127, 160, .06); border-left: 1px solid rgba(127, 127, 160, .18); }
.czone.alt { background: rgba(127, 127, 160, .11); }
.czone.ko, .czone.bad { background: rgba(230, 70, 90, .13); border-left: 1px solid var(--bad); }
.czone.good { background: rgba(80, 200, 120, .08); }
.cline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--pri); z-index: 2; }
.cline span { position: absolute; top: 2px; left: 6px; font-size: 11px; white-space: nowrap; background: var(--panel); padding: 0 4px; }
.csprite { position: absolute; padding: 0; border: none; background: none; cursor: pointer; z-index: 1; transition: transform .1s; }

// Large pictures are scaled down in the browser so uploads stay small.
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error(file.name + " is not a PNG, JPG, WEBP or GIF image.");
  if (file.type === "image/gif" || file.size <= 400 * 1024) {
    if (file.size > 3 * 1024 * 1024) throw new Error(file.name + " is larger than 3 MB.");
    return file;
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const encode = (type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  let blob = await encode("image/webp", 0.85);
  if (!blob || blob.type !== "image/webp") blob = await encode("image/png");       // browsers that cannot write WEBP
  if (blob.size > 3 * 1024 * 1024) {                                               // still too big: flatten onto white as JPG
    const flat = Object.assign(document.createElement("canvas"), {width: canvas.width, height: canvas.height}), ctx = flat.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, flat.width, flat.height); ctx.drawImage(canvas, 0, 0);
    blob = await new Promise(resolve => flat.toBlob(resolve, "image/jpeg", 0.85));
  }
  if (!blob || blob.size > 3 * 1024 * 1024) throw new Error(file.name + " is too large even after shrinking.");
  return new File([blob], file.name, {type: blob.type});
}

  catch (err) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || "That did not work (" + response.status + ").");

  const views = [["front", ds.front], ["shiny", ds.front && s.id && DEX.shinies[s.id] ? "shiny" : null], ["back", ds.back], ["icon", ds.icon], ["follower", ds.follower], ["art", art && art.src]].filter(([, src]) => src);
  let view = views.length ? views[0][0] : null, rest = () => dexEntry(d);
  const name = h("h3", {}, String(d.name || "New Pokemon").toUpperCase());
  const types = h("div", {class: "types"}, (d.types || []).map(typeChip));
  const stage = h("div", {class: "stage"}), buttons = h("div", {class: "viewbtns", role: "group", "aria-label": "Which picture"});
  const box = h("div", {class: "dlg", role: "status"});

    const src = (views.find(([v]) => v === view) || [])[1];
    const shinyImg = view === "shiny" ? h("img", {class: "px", alt: "shiny " + d.name}) : null;
    if (shinyImg && hiddenPic(ds.front)) shinyImg.src = HIDDEN_PIC;
    else if (shinyImg) shinyPicture(s.id, "front").then(url => { if (url) shinyImg.src = url; });
    stage.replaceChildren(!src ? h("div", {class: "noart"}, "NO PICTURE YET") : shinyImg ? shinyImg : view === "follower" ? walker(src, 5)
      : h("img", {class: view === "art" ? null : "px" + (view === "icon" ? " icon" : ""), src, alt: VIEW_LABELS[view].toLowerCase() + " of " + d.name}));
    buttons.replaceChildren(...(views.length > 1 ? views.map(([v]) => h("button", {type: "button", "aria-pressed": String(v === view), onclick: () => { view = v; drawStage(); }}, VIEW_LABELS[v])) : []));
  }
  const top = {
    el: h("section", {class: "screen top", "aria-label": d.name || "New Pokemon"},
      h("div", {class: "namebar"}, s.id ? h("div", {class: "frame no"}, "No." + pad(d.dex)) : null, h("div", {class: "frame"}, name), types),
      stage, buttons, views.length ? spoilerButton(s) : null, box),
    say(title, text) { box.replaceChildren(title ? h("span", {class: "say-title"}, title + "\n") : "", text || ""); },
    rest() { top.say("", rest()); },
    setRest(fn) { rest = fn; top.rest(); },
    setName(n) { name.textContent = String(n || "New Pokemon").toUpperCase(); },
    setTypes(list) { types.replaceChildren(...list.map(typeChip)); },
    setArt(src) {                                  // a new Pokemon's first picture, before it is saved
      const i = views.findIndex(([v]) => v === "art");
      if (i >= 0) views.splice(i, 1);
      if (src) { views.push(["art", src]); view = view || "art"; } else if (view === "art") view = views.length ? views[0][0] : null;
      drawStage();

// Pointing at something (or tapping it) explains it in the top screen's dialog box.
function explains(el, top, title, text) {
  const say = () => top.say(typeof title === "function" ? title() : title, typeof text === "function" ? text() : text);
  for (const on of ["mouseenter", "focus", "click"]) el.addEventListener(on, say);
  for (const off of ["mouseleave", "blur"]) el.addEventListener(off, () => top.rest());
  return el;
}

// Pictures pasted anywhere on a Pokemon's page (Ctrl+V / Cmd+V) are uploaded to it.
async function uploadPictures(s, files, caption, report) {
  let done = 0;
  for (const file of files) {
    report("Uploading " + (++done) + " of " + files.length + "...");
    const row = await postForm("species-image", {key: remember.get("key"), species_id: s.id, caption: caption || "", editor: me(), file: await prepareImage(file)});
    (DEX.images[s.id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
  }
}
let newPictureSink = null;        // the "new Pokemon" form, while it is open: pasted pictures wait there until it is saved
let trainerPictureSink = null;    // the trainer studio's PICTURE step, while it is open: a pasted picture is the private photo
document.addEventListener("paste", async ev => {
  if (trainerPictureSink && trainerPictureSink.form.isConnected) {    // never let it fall through to the public picture upload
    const file = [...((ev.clipboardData || {}).files || [])].find(f => /^image\//.test(f.type));
    if (file) { ev.preventDefault(); trainerPictureSink.add(file); }
    return;
  }
  if (newPictureSink && newPictureSink.form.isConnected && document.getElementById("dialog").open) {
    const files = [...((ev.clipboardData || {}).files || [])].filter(f => /^image\//.test(f.type));
    if (files.length) { ev.preventDefault(); newPictureSink.add(files); }
    return;
  }
  if (!shown || !shown.s.id || !DEX.web.url || !document.getElementById("dialog").open) return;
  const files = [...((ev.clipboardData || {}).files || [])].filter(f => /^image\//.test(f.type));
  if (!files.length) return;
  ev.preventDefault();
  const {s, top} = shown, editing = !!document.querySelector("#detail form");
  try {
    await uploadPictures(s, files, "pasted", text => top.say("PICTURE", text));
    top.say("PICTURE", files.length === 1 ? "The picture was added to " + s.data.name + "." : files.length + " pictures were added to " + s.data.name + ".");
    render();
    if (!editing) openDetail(s, "pictures");
  } catch (err) { top.say("PICTURE", err.message); }
});

const SD = DEX.showdown || {moves: {}, abilities: {}};
const SD_MOVES = new Map(Object.entries(SD.moves).map(([n, m]) => [norm(n), Object.assign({name: n}, m)]));
function moveInfo(name) {
  const known = SD_MOVES.get(norm(name));
  if (known) return known;
  const c = DEX.custom.move.find(x => norm(x.name) === norm(name));
  if (c) return {name: c.name, type: c.type, category: c.category ? c.category[0].toUpperCase() + c.category.slice(1) : null, power: c.power, accuracy: c.accuracy, pp: c.pp, desc: c.effect || "", custom: true};
  return {name, desc: "Not a move in the game yet - describe it under New moves.", unknown: true};
}
function abilityDesc(name) {
  const key = Object.keys(SD.abilities).find(n => norm(n) === norm(name));
  if (key) return SD.abilities[key];
  const c = DEX.custom.ability.find(x => norm(x.name) === norm(name));
  return c ? (c.effect || c.description || "New ability") : "";
}
const catBadge = cat => cat ? h("span", {class: "cat " + cat}, cat === "Physical" ? "Phys" : cat === "Special" ? "Spec" : "Status") : "";

  return Object.entries(SD.abilities).map(([name, desc]) => ({name, desc}))
    .concat(DEX.custom.ability.filter(c => !Object.keys(SD.abilities).some(n => norm(n) === norm(c.name))).map(c => ({name: c.name, desc: c.effect || "", custom: true})));
}

        DEX.types.map(t => h("button", {type: "button", class: "type", style: "background:" + TYPE_COLORS[t] + ";border-color:" + TYPE_COLORS[t], "aria-pressed": String(type === t),

// Remove everything empty so only real content is saved.
function clean(value) {
  if (Array.isArray(value)) return value.map(clean).filter(filled);
  if (value && typeof value === "object") {

    return out;
  }
  return value;
}

// Removing a Pokemon from the dex: its pictures go to Lost and found, then the removal is saved
// (the import deletes its file within about 15 minutes; git and the edit log keep everything).
function removalSection(s) {
  const name = String(s.data.name || s.id);
  const typed = h("input", {type: "text", placeholder: name, "aria-label": "Type the name to confirm", autocomplete: "off"});
  const status = h("div", {class: "hint", role: "status"});
  const go = h("button", {type: "button", disabled: true, style: "border-color:var(--bad);color:var(--bad);font-weight:600"}, "Remove " + name + " from the dex");
  typed.addEventListener("input", () => { go.disabled = norm(typed.value) !== norm(name); });
  const evolvesFrom = DEX.species.filter(o => o.evolutions.some(e => e.into === s.id)).map(o => o.data.name);
  go.addEventListener("click", async () => {
    go.disabled = true;
    try {
      const pictures = imagesOf(s.id).filter(i => Number.isInteger(i.id));
      for (const [n, image] of pictures.entries()) {
        status.textContent = "Moving picture " + (n + 1) + " of " + pictures.length + " to Lost and found...";
        await moveImage(image, s.id, LOST);
      }
      status.textContent = "Removing...";
      await saveEdit("species", s.id, {deleted: true, name});
      DEX.species = DEX.species.filter(o => o !== s);
      delete DEX.images[s.id];
      DEX.species.forEach(derive); index(); closeDialog(); render();
      document.getElementById("notice").prepend(h("div", {class: "notice info"}, name + " was removed from the dex" + (pictures.length ? "; its " + pictures.length + " picture(s) are in Lost and found." : ".")));
    } catch (err) { status.textContent = err.message; go.disabled = false; }
  });
  return section("Remove this Pokemon from the dex", false, null,
    h("div", {class: "hint"}, "For a Pokemon that was dropped, or added twice. Its pictures are moved to Lost and found (More > Lost and found), so nothing is lost and they can be given to another Pokemon. ",
      evolvesFrom.length ? "It is also removed as the evolution of " + evolvesFrom.join(", ") + ". " : "",
      "The removal is stored within about 15 minutes; Arvind can bring it back from the history if it was a mistake."),
    field("Type its name to confirm", typed), h("div", {style: "margin-top:8px"}, go), status);
}

// ---------- new moves and abilities ----------
const KINDS = {
  move: {plural: "New moves", one: "move", used: s => { const l = s.data.learnset || {}; return [...(l.level_up || []).map(m => m.move), ...(l.tm_hm || []), ...(l.tutor || []), ...(l.egg || [])]; }},
  ability: {plural: "New abilities", one: "ability", used: s => Object.values(s.data.abilities || {})},
};
const existingNames = kind => new Set(DEX.lists[kind === "move" ? "moves" : "abilities"].map(norm));
const usedBy = (kind, name) => DEX.species.filter(s => KINDS[kind].used(s).some(n => n && norm(n) === norm(name)));
// Names Pokemon use that exist neither in the game nor in our list of new ones.
function undescribed(kind) {
  const known = existingNames(kind), described = new Set(DEX.custom[kind].map(c => norm(c.name))), found = new Map();
  for (const s of DEX.species) for (const name of KINDS[kind].used(s))
    if (name && !known.has(norm(name)) && !described.has(norm(name)) && !found.has(norm(name))) found.set(norm(name), String(name));
  return [...found.values()].sort();
}
function refreshLists() {
  document.getElementById("list-moves").replaceChildren(...[...DEX.lists.moves, ...DEX.custom.move.map(c => c.name)].sort().map(m => h("option", {value: m})));
  document.getElementById("list-abilities").replaceChildren(...[...new Set([...DEX.lists.abilities, ...DEX.custom.ability.map(c => c.name)])].sort().map(m => h("option", {value: m})));
}

function openCustomEditor(kind, item) {
  const isNew = !item.id, K = KINDS[kind], L = DEX.lists, isMove = kind === "move";
  const users = item.name ? usedBy(kind, item.name) : [];
  const f = {
    name: textInput(item.name, {required: true, maxlength: isMove ? L.move_name_limit : L.ability_name_limit}),
    effect: h("textarea", {rows: 4, required: true, maxlength: 1500}, item.effect || ""),
    similar: attachPicker(textInput(item.similar_to, {maxlength: 60}), isMove ? "move" : "ability"),
    notes: h("textarea", {rows: 2, maxlength: 1000}, item.notes || ""),
    designer: textInput(item.designer, {maxlength: 40}),
  };
  if (isMove) Object.assign(f, {
    type: selectInput(item.type, DEX.types, "choose..."), category: selectInput(item.category, L.move_categories, "choose..."),
    power: numberInput(item.power, 1, 250), accuracy: numberInput(item.accuracy, 1, 100), pp: numberInput(item.pp, 1, 40),
    priority: numberInput(item.priority, -7, 5), target: selectInput(item.target || "one opponent", L.move_targets),
    contact: h("input", {type: "checkbox", checked: !!item.contact}), chance: numberInput(item.effect_chance, 1, 100),
  });
  else f.description = textInput(item.description, {maxlength: 70});
  f.type && (f.type.required = true); f.category && (f.category.required = true); f.pp && (f.pp.required = true);
  const error = h("div", {class: "error", role: "alert"});
  const save = h("button", {type: "submit"}, "YES");
  async function send(data, id) {
    save.disabled = true; save.textContent = "Saving...";
    try {
      await saveEdit(kind, id, data);
      DEX.custom[kind] = DEX.custom[kind].filter(c => c.id !== id);
      if (!data.deleted) DEX.custom[kind].push(Object.assign({}, data, {id, pending: true, implemented: item.implemented}));
      refreshLists(); closeDialog(); render();
    } catch (err) { error.textContent = err.message; save.disabled = false; save.textContent = "Save"; }
  }
  function submit(ev) {
    ev.preventDefault();
    const bad = firstInvalid(ev.target);
    if (bad) { error.textContent = bad.text; bad.show(); return; }
    const data = clean(Object.assign({name: readText(f.name), effect: readText(f.effect), similar_to: readText(f.similar), notes: readText(f.notes), designer: readText(f.designer)},
      isMove ? {type: f.type.value, category: f.category.value, power: readNumber(f.power), accuracy: readNumber(f.accuracy), pp: readNumber(f.pp),
        priority: readNumber(f.priority), target: f.target.value, contact: f.contact.checked, effect_chance: readNumber(f.chance)} : {description: readText(f.description)}));
    if (!data.contact) delete data.contact;
    if (!data.priority) delete data.priority;
    const id = isNew ? slugify(data.name) : item.id;
    let problem = null;
    if (!id) problem = "Give it a name.";
    else if (existingNames(kind).has(norm(data.name))) problem = data.name + " already exists in the game, so it does not need to be described here.";
    else if (DEX.custom[kind].some(c => c.id !== item.id && (c.id === id || norm(c.name) === norm(data.name)))) problem = "There is already a new " + K.one + " with that name.";
    else if (isMove && data.category === "status" && data.power) problem = "A status move has no power - leave power empty.";
    else if (isMove && data.category !== "status" && !data.power) problem = "A " + data.category + " move needs a power. If the damage works in a special way, write 1 and explain it in the description.";
    error.textContent = problem || "";

  showDialog(h("form", {novalidate: true, onsubmit: submit},
    h("div", {class: "top"}, h("div", {}, h("div", {class: "sub"}, "New " + K.one + (item.implemented ? " - already programmed into the game" : " - has to be programmed into the game")),
        h("h3", {}, isNew ? (item.name ? "Describe " + item.name : "Add a new " + K.one) : "Edit " + item.name)),
      h("div", {class: "actions"}, h("button", {type: "button", onclick: closeDialog}, "Cancel"))),
    h("div", {class: "hint"}, "Only for " + K.plural.toLowerCase().replace("new ", "") + " that do not exist in any Pokemon game. Be exact: this text is what gets programmed."),
    users.length ? h("div", {class: "hint"}, "Used by: " + users.map(s => s.data.name).join(", ")) : null,
    isMove ? h("div", {class: "fields"}, field("Name (max " + L.move_name_limit + " letters)", f.name), field("Type", f.type), field("Category", f.category),
        field("Power (empty for status moves)", f.power), field("Accuracy % (empty = never misses)", f.accuracy), field("PP", f.pp))
      : h("div", {class: "fields"}, field("Name (max " + L.ability_name_limit + " letters)", f.name), field("Short text shown in the game", f.description, "wide")),
    h("h2", {}, "What exactly does it do?"),
    h("div", {class: "hint"}, isMove ? "Every detail: extra effects, how likely they are, stat changes and by how many stages, how many turns things last, special conditions."
      : "Every detail: when it triggers, what it changes and by how much, whether it works in doubles, what it does outside battle."),
    h("div", {class: "fields"}, field("Description", f.effect, "wide"), field("Works like this existing " + K.one + " (if any)", f.similar), field("Invented by", f.designer)),
    isMove ? section("More settings", false, null, h("div", {class: "fields"}, field("Chance of the extra effect, % (empty = always)", f.chance),
      field("Priority (empty = normal, +1 = like Quick Attack)", f.priority), field("Hits", f.target),
      h("label", {class: "field"}, h("span", {}, "Makes contact"), h("div", {}, f.contact, " yes")))) : null,
    h("div", {class: "fields", style: "margin-top:10px"}, field("Notes", f.notes, "wide")),

function cryMaker(s) {
  const d = s.data;
  const top = h("section", {class: "screen top", "aria-label": "Cry of " + d.name});
  const page = h("div", {class: "page"});
  const hello = "Press CREATE to make a cry, use your own sound, or design one yourself. RETRY makes another one.";
  const say = h("div", {class: "dlg", role: "status"}, hello);
  const wave = h("canvas", {class: "crywave", "aria-hidden": "true"});
  const bigPlay = h("button", {type: "button", class: "cryplay", disabled: true, "aria-label": "Play"}, "▶");
  const st = {tries: [], at: -1, busy: false, error: "", made: 0, rec: null, ownNote: "", design: false};
  top.append(h("div", {class: "namebar"}, h("div", {class: "frame no"}, "No." + pad(d.dex)), h("div", {class: "frame"}, h("h3", {}, String(d.name || "").toUpperCase())), h("div", {class: "types"}, (d.types || []).map(typeChip))),
    h("div", {class: "crystage"}, (DEX.ds_sprites[s.id] || {}).front ? h("img", {class: "px", src: DEX.ds_sprites[s.id].front, alt: ""}) : null, wave, bigPlay), say);
  drawWave(wave, null);
  let anim = null;
  function play(samples) {
    const secs = playSamples(samples, CryEngine.OUT_RATE), start = performance.now();
    cancelAnimationFrame(anim);
    const tick = () => { const p = (performance.now() - start) / 1000 / secs; drawWave(wave, samples, Math.min(1, p)); if (p < 1) anim = requestAnimationFrame(tick); else drawWave(wave, samples); };
    tick();
  }
  // A try: orig = the recipe it started as (UNDO goes back to it), base = the same with the voices someone changed,
  // knobs = the sliders, recipe/samples = what they give, own = an uploaded or recorded sound.
  async function makeTry(start, label, own) {
    st.busy = true; st.error = ""; draw();
    try {
      if (!own && start.layers.some(l => l.own)) own = await ownAudio(start.audio);
      const samples = await renderCry(start, own);
      st.tries.push({orig: clone(start), base: clone(start), knobs: CryEngine.knobsOf(start), recipe: start, samples, label, own: own || null, changed: false}); st.at = st.tries.length - 1;
      play(samples);
    } catch (err) { st.error = err.message; }
    st.busy = false; draw();
  }
  async function remake(t) {
    t.recipe = CryEngine.tweak(t.base, t.knobs);
    t.changed = JSON.stringify(t.recipe) !== JSON.stringify(t.orig);
    if (t.label === "SAVED" && t.changed) t.label = "";
    try { t.samples = await renderCry(t.recipe, t.own); if (st.tries[st.at] === t) play(t.samples); }
    catch (err) { st.error = err.message; }
    draw();
  }
  async function useOwn(blob) {
    st.busy = true; st.error = ""; st.ownNote = ""; draw();
    try {
      const got = await ownSound(blob);
      st.ownNote = got.long ? "Your sound was longer than a cry can be, so the end is cut. Length, Pitch or Glide can make room." : "";
      st.busy = false;
      await makeTry(OWN_RECIPE(), "OWN", got.data);
    } catch (err) { st.error = err.message; st.busy = false; draw(); }
  }
  const fileIn = h("input", {type: "file", accept: "audio/*,.wav,.mp3,.m4a,.ogg,.aac,.flac", style: "display:none"});
  fileIn.addEventListener("change", () => { const f = fileIn.files[0]; fileIn.value = ""; if (f) useOwn(f); });
  async function record() {
    if (st.rec) { st.rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { st.error = "This browser cannot record. Upload a sound file instead."; draw(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
    catch (e) { st.error = "The microphone is not allowed. Allow it in the browser, or upload a sound file instead."; draw(); return; }
    const chunks = [], rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { clearTimeout(rec.cap); stream.getTracks().forEach(t => t.stop()); st.rec = null; useOwn(new Blob(chunks, {type: rec.mimeType || "audio/webm"})); };
    rec.cap = setTimeout(() => rec.state === "recording" && rec.stop(), 4000);     // at most 4 seconds; the silence is cut after
    st.rec = rec; st.error = ""; rec.start(); draw();
  }
  function slider(label, min, max, step, value, words, onSet) {
    const shown = h("span", {class: "sub"}, words(value));
    const el = h("input", {type: "range", min, max, step, value, "aria-label": label});
    el.addEventListener("input", () => { shown.textContent = words(Number(el.value)); });
    el.addEventListener("change", () => onSet(Number(el.value)));
    return h("label", {class: "shslider"}, h("span", {}, label), el, shown);
  }
  function knobRows(t) {
    return h("div", {class: "shsliders crysliders"}, CRY_KNOBS.map(([k, label, min, max, step, words]) => slider(label, min, max, step, t.knobs[k], words, v => { t.knobs[k] = v; remake(t); })));
  }
  // DESIGN IT YOURSELF: the voices of the current try, each from any official Pokemon (or your own sound).
  const OFFICIAL = () => DEX.official_species || [];
  const voiceName = l => l.own ? "Your own sound" : (OFFICIAL().find(o => o.n === l.dex) || {}).name || "#" + l.dex;
  const names = h("datalist", {id: "cry-voices-" + s.id});
  function fillNames(t) {
    const first = CryEngine.likest(cryFacts(s), OFFICIAL(), 12), rest = OFFICIAL().filter(o => !first.includes(o)).sort((a, b) => a.name.localeCompare(b.name));
    names.replaceChildren(...(t && t.own ? [h("option", {value: "Your own sound"})] : []), ...first.concat(rest).map(o => h("option", {value: o.name})));
  }
  function voiceRows(t) {
    const rows = t.base.layers.map((l, i) => {
      const pick = h("input", {type: "text", list: names.id, value: voiceName(l), "aria-label": "Voice " + (i + 1), class: "cryvoice"});
      pick.addEventListener("focus", () => pick.select());
      pick.addEventListener("change", () => {
        const v = pick.value.trim().toLowerCase(), o = OFFICIAL().find(x => x.name.toLowerCase() === v);
        if (v === "your own sound" && t.own) { delete l.dex; l.own = true; }
        else if (o) { delete l.own; l.dex = o.n; }
        else { pick.value = voiceName(l); return; }
        remake(t);
      });
      const back = h("input", {type: "checkbox", checked: l.rev ? "" : null});
      back.addEventListener("change", () => { l.rev = back.checked; remake(t); });
      const drop = t.base.layers.length > 1 ? h("button", {type: "button", class: "small", "aria-label": "Remove voice " + (i + 1)}, "✕") : null;
      if (drop) drop.onclick = () => { t.base.layers.splice(i, 1); remake(t); };
      return h("div", {class: "shgroup cryvoicerow"},
        h("div", {class: "shhead"}, h("b", {}, "Voice " + (i + 1)), pick, h("label", {class: "sub"}, back, " backwards"), h("span", {class: "grow"}), drop),
        h("div", {class: "shsliders crysliders"},
          slider("Pitch", -12, 7, 0.5, l.semi || 0, v => (v > 0 ? "+" : "") + v, v => { l.semi = v; remake(t); }),
          slider("Volume", 0, 1.5, 0.05, l.gain == null ? 1 : l.gain, v => Math.round(v * 100) + "%", v => { l.gain = v; remake(t); }),
          slider("Starts", 0, 0.5, 0.01, l.at || 0, v => v ? "+" + v + " s" : "at once", v => { l.at = v; remake(t); })));
    });
    const add = t.base.layers.length < 3 ? h("button", {type: "button", class: "small"}, "+ ADD A VOICE") : null;
    if (add) add.onclick = () => {
      const used = t.base.layers.map(l => l.dex), o = CryEngine.likest(cryFacts(s), OFFICIAL(), 12).find(x => !used.includes(x.n)) || OFFICIAL()[0];
      t.base.layers.push({dex: o.n, semi: (t.base.layers[0] || {}).semi || 0, gain: 0.5, at: 0, rev: false}); remake(t);
    };
    return [rows, add];
  }
  function startDesign() {
    const o = CryEngine.likest(cryFacts(s), OFFICIAL(), 1)[0] || OFFICIAL()[0];
    st.design = true;
    makeTry({v: CryEngine.VERSION, seed: 0, layers: [{dex: o.n, semi: 0, gain: 1, at: 0, rev: false}], stretch: 1, sweep: 0, vib: null, ring: null, echo: null, tone: 0, drive: 0,
      len: CryEngine.MAX_LEN, reasons: ["Designed by hand"]}, "DESIGN");
  }
  function draw() {
    const cur = st.tries[st.at], saved = DEX.cries[s.id];
    bigPlay.disabled = !cur;
    bigPlay.onclick = () => cur && play(cur.samples);
    const name = t => (TRY_NAMES[t.label] || ["TRY"])[0] + (t.label === "SAVED" || t.label === "AUTO" ? "" : " " + (st.tries.indexOf(t) + 1));
    say.replaceChildren(st.rec ? h("span", {}, h("span", {class: "say-title"}, "RECORDING\n"), "Make the sound now. Press STOP when you are done (it stops by itself after 4 seconds).")
      : cur ? h("span", {}, h("span", {class: "say-title"}, name(cur) + (cur.changed ? " (changed)" : "") + "\n"), "Press ▶ to hear it again. Change it with the sliders below.")
      : st.busy ? "Making the cry..." : hello);
    if (cur) drawWave(wave, cur.samples);
    const off = st.busy || st.rec || null;
    const create = h("button", {type: "button", class: st.tries.length ? null : "primary", disabled: off}, st.busy ? "MAKING..." : st.made ? "RETRY" : "CREATE");
    create.onclick = () => (st.made++, makeTry(CryEngine.suggest(cryFacts(s), OFFICIAL(), Math.floor(Math.random() * 1e9))));
    const upload = h("button", {type: "button", disabled: off}, "UPLOAD A SOUND");
    upload.onclick = () => fileIn.click();
    const rec = h("button", {type: "button", class: st.rec ? "primary" : null, disabled: st.busy || null}, st.rec ? "■ STOP" : "● RECORD");
    rec.onclick = record;
    const save = h("button", {type: "button", class: "primary", disabled: !cur || cur.label === "SAVED" || st.rec || null}, "SAVE THIS CRY");
    const note = h("span", {class: "sub"});
    save.onclick = async () => {
      const r = cur.recipe, plain = r.layers.length === 1 && !r.layers[0].own && Math.abs(r.layers[0].semi || 0) < 1 && !r.layers[0].rev
        && !r.vib && !r.echo && !r.ring && !r.drive && Math.abs(r.tone || 0) < 0.15 && Math.abs(r.sweep || 0) < 1 && Math.abs((r.stretch || 1) - 1) < 0.08;
      if (plain) { note.textContent = "This is still one official cry as it is. Change it a little first (pitch, a second voice or an effect), so it is its own."; return; }
      save.disabled = true; note.textContent = "Saving...";
      const was = CryEngine.knobsOf(cur.orig);           // the voices change only the layers, so the sliders compare with the start
      const changes = CRY_KNOBS.filter(([k]) => cur.knobs[k] !== was[k]).map(([k, label]) => label.toLowerCase() + " " + cur.knobs[k]);
      if (JSON.stringify(cur.base.layers) !== JSON.stringify(cur.orig.layers)) changes.push("the voices");
      const data = Object.assign({}, cur.recipe, {reasons: (cur.recipe.reasons || []).concat(changes.length ? ["Changed by hand: " + changes.join(", ")] : []).slice(0, 8), at: new Date().toISOString()});
      if (cur.own && data.layers.some(l => l.own)) data.audio = ownToBase64(cur.own); else delete data.audio;
      try {
        await saveEdit("cry", s.id, data);
        DEX.cries[s.id] = Object.assign({}, data, {by: me()});
        Object.assign(cur, {orig: clone(cur.recipe), base: clone(cur.recipe), knobs: CryEngine.knobsOf(cur.recipe), label: "SAVED", changed: false});
        note.textContent = "Saved. It is stored in the dex within about 15 minutes. It can always be changed later."; draw();
      } catch (err) { note.textContent = /check constraint/i.test(err.message) ? "Own sounds are not switched on in the database yet." : err.message; save.disabled = false; }
    };
    const reuse = label => st.tries.findIndex(t => t.label === label);
    const playSaved = saved ? h("button", {type: "button", class: "small"}, "▶ PLAY THE SAVED CRY") : null;
    if (playSaved) playSaved.onclick = () => { const i = reuse("SAVED"); if (i >= 0) { st.at = i; play(st.tries[i].samples); draw(); } else makeTry(saved, "SAVED"); };
    const playAuto = saved ? null : h("button", {type: "button", class: "small", disabled: off}, "▶ PLAY THE AUTOMATIC CRY");
    if (playAuto) playAuto.onclick = () => { const i = reuse("AUTO"); if (i >= 0) { st.at = i; play(st.tries[i].samples); draw(); } else makeTry(autoCry(s), "AUTO"); };
    const undo = cur && cur.changed ? h("button", {type: "button", class: "small"}, "UNDO THE CHANGES") : null;
    if (undo) undo.onclick = () => { cur.base = clone(cur.orig); cur.knobs = CryEngine.knobsOf(cur.orig); remake(cur); };
    const fam = familyOf(s).filter(x => x.s !== s && DEX.cries[x.s.id]);
    const design = h("details", {class: "crydesign", open: st.design ? "" : null},
      h("summary", {}, "DESIGN IT YOURSELF"),
      h("p", {class: "sub", style: "margin:4px 0 8px"}, "Build the cry from up to three voices. Each voice is the cry of an official Pokemon (the ones most like this one come first in the list) or your own sound, with its own pitch, volume and start. The sliders above work on top of it."),
      cur ? voiceRows(cur) : null,
      h("div", {style: "display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"},
        h("button", {type: "button", class: "small", disabled: off, onclick: startDesign}, cur ? "START A NEW DESIGN" : "START WITH ONE VOICE")));
    design.addEventListener("toggle", () => { st.design = design.open; if (design.open) fillNames(st.tries[st.at]); });
    if (st.design) fillNames(cur);
    page.replaceChildren(h("div", {},
      h("div", {class: "status"}, saved ? [h("span", {class: "badge done"}, "has a cry"), " Saved" + (saved.by ? " by " + saved.by : "") + ". A new one saved here replaces it. ", playSaved]
        : [h("span", {class: "badge need"}, "no cry saved"), " Until someone saves one, it has an automatic cry: a blend of the official Pokemon most like it. ", playAuto]),
      h("div", {style: "display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0"}, create, upload, rec, fileIn, cur ? h("button", {type: "button", onclick: () => play(cur.samples)}, "▶ PLAY") : null, save, note),
      st.error ? h("div", {class: "notice info"}, st.error) : null,
      st.ownNote && cur && cur.label === "OWN" ? h("div", {class: "notice info"}, st.ownNote) : null,
      cur ? [h("h2", {}, "Change " + name(cur).toLowerCase()), knobRows(cur), undo] : null,
      design, names,
      st.tries.length > 1 ? [h("h2", {}, "Your tries"), h("div", {class: "chips crytries"}, st.tries.map((t, i) => h("button", {type: "button", class: "chip", "aria-pressed": String(i === st.at),
        onclick: () => { st.at = i; play(t.samples); draw(); }}, (TRY_NAMES[t.label] || ["", "Try"])[1] + (t.label === "SAVED" || t.label === "AUTO" ? "" : " " + (i + 1)) + (t.changed ? " ✎" : ""))))] : null,
      fam.length ? [h("h2", {}, "Its line"), h("div", {class: "chips"}, fam.map(x => { const b = h("button", {type: "button", class: "chip"}, "▶ " + x.s.data.name);
        b.onclick = async () => { b.disabled = true; try { play(await renderCry(DEX.cries[x.s.id])); } catch (err) { st.error = err.message; draw(); } b.disabled = false; }; return b; })),
        h("p", {class: "sub", style: "margin:4px 0 0"}, "The saved cries of its relatives, to compare. CREATE makes this one sound related.")] : null,
      h("p", {class: "sub", style: "margin-top:14px"}, "Every try is random, so RETRY gives another. Earlier tries stay in the list. Nothing is saved until SAVE, and a saved cry can always be replaced."),
      h("p", {class: "sub"}, "Your own sound: upload a short sound file or record one with the microphone. The silence before and after is cut, and it is made as clear as HeartGold's cries (13 kHz, at most 1.6 seconds). "
        + "Use only a sound you made yourself or may use freely, not a sound from a game or a show: a saved sound is public in the dex.")));
  }
  draw();
  return {top, bottom: page};
}

function spriteStudio(s, startStep) {
  const st = {step: startStep || null, tries: [], line: [], worker: null, versions: [], loaded: false, editing: null, showAll: false, busyMsg: ""};
  const pictures = imagesOf(s.id).concat(s.form ? imagesOf(s.form.base.id) : []).filter(i => Number.isInteger(i.id));   // a form may draw from its base's pictures
  let chosen = (remember.get("refs-" + s.id) || "").split(",").map(Number).filter(id => pictures.some(p => p.id === id));
  if (!chosen.length) chosen = pictures.slice(0, 1).map(p => p.id);
  const top = h("section", {class: "screen top studio-top", "aria-label": "The sprite of " + s.data.name});
  const steps = h("div", {class: "stepbar", role: "tablist", "aria-label": "Steps"});
  const page = h("div", {class: "page studio-page"});
  const say = h("div", {class: "dlg", role: "status"});
  let timer = null;

  const picked = stage => st.tries.filter(t => t.stage === stage && t.picked).sort((a, b) => String(b.picked_at).localeCompare(String(a.picked_at)))[0] || null;
  const approved = () => st.versions.find(v => v.status === "approved") || null;
  // What each slot of the set shows: the picked try, else the sprite in the game now.
  function inSet(view) {
    const t = picked(view);
    if (t && t.image) return {src: artUrl(t.image), tryRow: t, live: false};
    const v = approved();
    if (v && v[view]) return {src: artUrl(v[view]), version: v, live: true};
    const ds = DEX.ds_sprites[s.id] || {};
    return ds[view] ? {src: ds[view], live: true} : null;
  }
  const mine = () => st.line.filter(j => j.species_id === s.id && j.mode === "tries");
  // Seconds until all of this Pokemon's requests are drawn: everything ahead in the line, then its own.
  function secondsLeft() {
    let total = 0, last = 0;
    for (const j of st.line) {
      const each = secondsFor(st.worker && st.worker.timings, j.stage === "art" && (j.recipe === "sketch" || j.recipe === "pose") ? "art:" + j.recipe : j.stage || "front"), n = j.mode === "tries" ? (j.count || 1) : 6;
      const done = st.tries.filter(t => t.job_id === j.id && t.status !== "drawing").length;
      let left = (n - done) * each;
      const drawing = st.tries.find(t => t.job_id === j.id && t.status === "drawing");
      if (drawing) left -= Math.min(each, (Date.now() - new Date(drawing.started_at).getTime()) / 1000);
      total += Math.max(j.status === "running" ? 5 : each, left);
      if (j.species_id === s.id) last = total;
    }
    return last;
  }
  function status() {
    const jobs = mine(), online = st.worker && Date.now() - new Date(st.worker.seen_at).getTime() < 90000;
    if (st.busyMsg) return st.busyMsg;
    if (jobs.length) {
      const names = {art: "cut-outs", front: "fronts", back: "backs", icon: "icons", follower: "walking sprites", front2: "front 2s", back2: "back 2s"};
      const what = jobs.map(j => (j.count || 1) + " " + (names[j.stage] || j.stage)).join(", then ");
      const ahead = st.line.findIndex(j => j.species_id === s.id);
      if (!online) return "WAITING\nThe drawing PC is off right now. Your request (" + what + ") waits in line until it is back.";
      return (jobs.some(j => j.status === "running") ? "DRAWING " : "IN LINE ") + "\n" + what[0].toUpperCase() + what.slice(1) + ".\nReady in " + aboutMinutes(secondsLeft()) +
        (ahead > 0 ? " (" + ahead + " request" + (ahead > 1 ? "s" : "") + " from others first)." : ".");
    }
    if (st.loaded && guided()) return {start: "LET'S MAKE ITS SPRITES\nChoose its pictures and how many to choose from, then press START.",
      front: "PICK A FRONT\nTap the one you like best.", backicon: "PICK A BACK AND AN ICON\nTap the ones you like best.",
      walk: "PICK A WALKING SPRITE\nTap the one that walks best.", done: "ALL DONE!\nSave them as its sprite below."}[phase()];
    if (!picked("front") && !inSet("front")) return "LET'S MAKE ITS SPRITE\n" + (pictures.length ? "Start with 1 PICTURE, or go straight to 2 FRONT and press MAKE." : "Add its concept art first (the ART tab).");
    const missing = ["front", "back", "icon", "follower"].filter(v => !picked(v));
    if (missing.length === 4) return "THIS IS ITS SPRITE NOW\nTap EDIT under a picture to change it, or make new ones in the steps below.";
    if (missing.length) return "NEXT\nPick " + missing.map(v => SLOT_NAMES[v]).join(", ") + (missing.includes("follower") || missing.includes("icon") ? ", or go to SAVE: the icon and the walking sprite can come later." : ".");
    return "ALL PICKED\nGo to SAVE to make these its sprite.";
  }

  function drawTop() {
    const slot = view => {
      const it = inSet(view), big = view === "front" || view === "back", one = {front2: "front", back2: "back"}[view];
      const pic = !it ? h("div", {class: "slotempty"}, "—")
        : view === "follower" ? walker(it.src, 3)
        : one ? flipPair(inSet(one) ? inSet(one).src : it.src, it.src, 96)
        : h("img", {class: "px", src: it.src, alt: SLOT_NAMES[view].toLowerCase() + " of " + s.data.name, style: "width:" + (big ? 160 : 96) + "px"});
      return h("div", {class: "slot frame" + (it && it.live ? " live" : "")},
        h("button", {type: "button", class: "slotpic", title: "Go to " + SLOT_NAMES[view], onclick: () => go(view)}, pic),
        h("div", {class: "slotname"}, SLOT_NAMES[view], it ? h("small", {}, it.live ? "in the game" : "picked") : null),
        it && DEX.web.url ? h("button", {type: "button", class: "small", onclick: () => openPixelEditor(view, it)}, "EDIT") : null);
    };
    top.replaceChildren(
      h("div", {class: "namebar"}, h("div", {class: "frame no"}, "No." + pad(s.data.dex)), h("div", {class: "frame"}, h("h3", {}, String(s.data.name).toUpperCase())),
        h("div", {class: "frame cat"}, "SPRITES")),
      h("div", {class: "setgrid"}, ["front", "back", "icon", "follower", "front2", "back2"].map(slot)),
      say);
    say.textContent = status();
  }

  function drawSteps() {
    steps.replaceChildren(...STUDIO_STEPS.map(stp => {
      const busy = mine().some(j => j.stage === stp.id), done = stp.id !== "save" && stp.id !== "art" && picked(stp.id);
      return h("button", {type: "button", role: "tab", "data-c": stp.c, "aria-selected": String(st.step === stp.id), onclick: () => go(stp.id)},
        h("b", {}, stp.n), " " + stp.label, busy ? h("span", {class: "spinner", "aria-label": "drawing"}) : done ? h("span", {class: "tick"}, "✓") : null);
    }));
  }
  function go(stepId) { if (st.editing) return; st.step = stepId; st.showAll = false; draw(); }

  // The text about its body, shown where the PC uses it (back, icon, walk): one line, or the form when it is empty.
  function bodyBox(open) {
    const b = bodyOf(s), box = h("div", {class: "bodybox"});

const STAGE_WORDS = {animprev: "animation preview", art: "cut-out", front: "front", back: "back", icon: "icon", follower: "walking sprite", trainer: "trainer sprite", vs: "VS portrait", map: "map figure", anim: "animation", tback: "back", throw: "throw"};

    const each = j.mode === "tries" ? secondsFor(timings, j.stage || "front") : j.mode === "edit" ? 90 : 420;
    let left = Math.max(5, (n - done) * each);

// The same rules as dexlib.change_layout in scripts/dexlib.py (the import applies them for real). layout = ids per slot, null = empty.
function arrange(layout, ops) {
  layout = layout.slice();
  const size = layout.length;
  for (const op of ops) {
    if (op.op === "set") {                                  // the whole order at once (same checks as dexlib.set_layout)
      const used = layout.slice(0, layout.reduce((m, id, i) => id ? i + 1 : m, 0));
      if (op.from && JSON.stringify(op.from) !== JSON.stringify(used)) throw new Error("The dex changed while you were working. Close this and open Change dex numbers again.");
      const ids = op.layout.filter(Boolean), had = layout.filter(Boolean);
      if (new Set(ids).size !== ids.length || ids.length !== had.length || ids.some(id => !had.includes(id))) throw new Error("The new order does not hold exactly the Pokemon of the dex.");
      layout = op.layout.concat(Array(size - op.layout.length).fill(null));
      continue;
    }
    const slot = op.to || op.at;
    if (!Number.isInteger(slot) || slot < 1 || slot > size) throw new Error("There is no slot #" + slot + ". Use a number from 1 to " + size + ".");
    if (op.op === "move") {
      const old = layout.indexOf(op.id);
      if (old < 0) throw new Error("That Pokemon is not in the dex.");
      if (layout[slot - 1] === null) { layout[old] = null; layout[slot - 1] = op.id; }
      else { layout.splice(old, 1); layout.splice(slot - 1, 0, op.id); }
    } else if (op.op === "insert") {
      if (layout[size - 1] !== null) throw new Error("The last slot (#" + size + ") is taken, so nothing can move down. Move that Pokemon first or remove an empty slot.");
      layout.splice(slot - 1, 0, null); layout.pop();
    } else if (op.op === "close") {
      if (layout[slot - 1] !== null) throw new Error("Slot #" + slot + " is not empty.");
      layout.splice(slot - 1, 1); layout.push(null);
    } else throw new Error("Unknown step.");
  }
  return layout;
}

// Drag a filled team slot onto another to change the order (Arvind, 2026-11-17). With a mouse the drag starts at once;
// on a touch screen, hold the Pokemon a moment and then drag, so a normal swipe still scrolls the page.
// onMove(from, to): the Pokemon at "from" is taken out and put in at "to".
function dragSlots(row, count, onMove) {
  const slots = [...row.children];
  const slotAt = (x, y) => { const t = document.elementFromPoint(x, y), s = t && t.closest(".tslot"), i = slots.indexOf(s); return i >= 0 && i < count ? i : -1; };
  slots.slice(0, count).forEach((el, from) => {
    let st = null;
    el.classList.add("dragslot"); el.title = "Drag to change the order";
    const clear = () => slots.forEach(s => s.classList.remove("dragging", "dropto"));
    el.addEventListener("dragstart", ev => ev.preventDefault());
    // While a press lasts, moves and the release are read on the whole window, so a fast drag is not lost.
    const move = ev => {
      if (!st || ev.pointerId !== st.id) return;
      const far = Math.hypot(ev.clientX - st.x, ev.clientY - st.y);
      if (!st.armed) { if (far > 8) stop(); return; }   // touch moved early: it is a scroll
      if (!st.on && far < 6) return;
      if (!st.on) { st.on = true; el.classList.add("dragging"); }
      st.to = slotAt(ev.clientX, ev.clientY);
      slots.forEach((s, i) => s.classList.toggle("dropto", i === st.to && i !== from));
    };
    const end = ev => {
      if (!st || ev.pointerId !== st.id) return;
      if (ev.type === "pointerup") move(ev);

      if (!was || !was.on) return;

      if (ev.type === "pointerup" && was.to >= 0 && was.to !== from) onMove(from, was.to);
    };

      if (st) clearTimeout(st.timer);
      st = null; clear();
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
    };
    el.addEventListener("pointerdown", ev => {
      if (ev.button !== 0 || ev.target.closest(".slotbtns")) return;
      stop();
      st = {x: ev.clientX, y: ev.clientY, id: ev.pointerId, armed: ev.pointerType === "mouse", on: false, to: -1};
      if (!st.armed) st.timer = setTimeout(() => { if (st) { st.armed = true; el.classList.add("dragging"); } }, 300);
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
    });
    el.addEventListener("click", ev => { if (el.dataset.dragged) { ev.stopImmediatePropagation(); ev.preventDefault(); } }, true);
    el.addEventListener("touchmove", ev => { if (st && st.armed) ev.preventDefault(); }, {passive: false});   // no scrolling while dragging
    el.addEventListener("contextmenu", ev => { if (st) ev.preventDefault(); });
  });
  return row;
}

// ---------- the sprite tray: the drawing line, always in view (Arvind, 15 Oct: "it would be cool to see a queue and minimize
// windows while sprites are being built; it feels a bit scary to leave it while it works"). Bottom right of every page:
// what the drawing PC does, everyone's requests in line with the time until each is done (yours marked), and the
// Pokemon whose new pictures are ready to be picked. A tap opens that Pokemon's SPRITES.
const tray = {open: remember.get("tray") !== "closed", jobs: [], tries: [], worker: null, ready: [], timer: null, el: null};
function mySprites() { try { return JSON.parse(remember.get("my-sprites") || "{}"); } catch (e) { return {}; } }
function noteMine(sid, seen) {                    // seen: the studio of this Pokemon was opened (its ready pictures are seen)

  remember.set("my-sprites", JSON.stringify(m));

async function trayLoad() {
  if (!DEX.web.url) return;
  clearTimeout(tray.timer);
  try {
    const mine = mySprites(), recent = Object.entries(mine).filter(([, v]) => Date.now() - v.asked < 12 * 3600000).map(([k]) => k);
    [tray.jobs, tray.worker] = await Promise.all([
      dbRead("sprite_jobs?status=in.(queued,running)&order=status.desc,batch.asc,id.asc&select=batch,id,species_id,status,mode,stage,count,started_at"),
      dbRead("sprite_worker?select=seen_at,state,timings").then(r => r[0] || null)]);
    tray.jobs = tray.jobs.filter(j => !j.batch);             // Claude's whole-dex batch stays out of the tray (the SPRITES page shows it)
    const ids = tray.jobs.map(j => j.id);
    tray.tries = ids.length ? await dbRead("sprite_tries?job_id=in.(" + ids.join(",") + ")&select=job_id,status") : [];
    // ready: my Pokemon with pictures finished after I last looked, and nothing of them still in line
    tray.ready = [];
    if (recent.length) {
      const since = new Date(Math.min(...recent.map(k => mine[k].seen))).toISOString();
      const done = await dbRead("sprite_tries?species_id=in.(" + recent.join(",") + ")&status=eq.done&finished_at=gt." + since + "&select=species_id,stage,finished_at");
      for (const sid of recent) {
        if (tray.jobs.some(j => j.species_id === sid)) continue;
        const fresh = done.filter(d => d.species_id === sid && new Date(d.finished_at).getTime() > mine[sid].seen);
        if (fresh.length) tray.ready.push({sid, n: fresh.length, stage: fresh.reduce((a, b) => new Date(b.finished_at) > new Date(a.finished_at) ? b : a).stage});
      }
    }
    // an NPC's name before the characters page has loaded them (else the row says "An NPC")
    if (!npcs.size && tray.jobs.concat(tray.ready.map(r => ({species_id: r.sid}))).some(j => /^npc-/.test(j.species_id))) await loadNpcs().catch(() => {});
  } catch (e) { /* the tray waits for the next round */ }

  tray.timer = setTimeout(trayLoad, tray.jobs.length ? 8000 : 60000);
}

  return s ? s.data.name : role ? (mineToo ? lookOf(role.id).name || charName(role) : "A trainer") : npc ? (!mineToo && npcSecret(npc) === "all" ? "An NPC" : npc.name || "An NPC") : /^npc-/.test(sid) ? "An NPC" : sid;

  });
  const running = tray.jobs.find(j => j.status === "running");
  const head = h("button", {type: "button", class: "trayhead", "aria-expanded": String(tray.open), onclick: () => { tray.open = !tray.open; remember.set("tray", tray.open ? "" : "closed"); drawTray(); }},
    tray.jobs.length ? h("span", {class: "spinner"}) : h("span", {class: "tick"}, "\u2713"),
    tray.jobs.length ? "DRAWING " + tray.jobs.length + " \u00b7 " + (online ? aboutMinutes(total).replace("about ", "~") : "PC is off") : tray.ready.length + " READY TO PICK",
    h("span", {class: "chev"}, tray.open ? "\u25bc" : "\u25b2"));
  tray.el.replaceChildren(...[head, tray.open ? h("div", {class: "traybody"},
    !online && tray.jobs.length ? h("div", {class: "trayoff"}, "The drawing PC is off. The line waits until it is back.") : null,
    running && !tray.open ? null : null, readyRows, rows,
    h("div", {class: "traynote"}, "You can leave the page: it keeps drawing. \u2605 = yours. ",
      h("button", {type: "button", class: "linkish", onclick: () => { view = "sprites"; plan = null; render(); window.scrollTo(0, 0); }}, "See the whole line \u25b6"))) : null].filter(Boolean));
}

// ---------- the request board ----------
// Cards come from data/requests.yaml (what the story needs, written by the team) and from the
// website (species_edits rows of kind 'request'; the newest row of a card wins).
const BOARD = [["idea", "WISHES", "pink"], ["needed", "THE GAME NEEDS", "purple"], ["doing", "BEING MADE", "blue"], ["done", "DONE", "sky"]];
const AREAS = [["pokemon", "Pokemon"], ["sprites", "Sprites"], ["website", "Website"], ["other", "Other"]];
let boardCards = null;
async function loadBoard() {
  const cards = new Map((DEX.requests || []).map(r => [r.id, Object.assign({}, r)]));
  if (DEX.web.url) {
    const rows = await dbRead("species_edits?select=id,species_id,data,editor&kind=eq.request&order=id.asc");
    for (const row of rows) if (row.data && typeof row.data.title === "string") cards.set(row.species_id, Object.assign({}, cards.get(row.species_id) || {}, row.data, {id: row.species_id, by: row.data.by || row.editor}));
  }
  boardCards = [...cards.values()].filter(c => !c.deleted);
}
function renderBoard() {
  const grid = document.getElementById("grid");
  if (boardCards === null) {
    grid.replaceChildren(h("div", {class: "empty", style: "grid-column:1/-1"}, "Loading..."));
    loadBoard().catch(() => { boardCards = (DEX.requests || []).slice(); }).then(() => view === "board" && renderBoard());
    return;
  }
  const save = async (card, changes, status, isNew) => {
    const data = Object.assign({}, card, changes);
    delete data.id;
    status.textContent = "Saving...";
    try {
      await saveEdit("request", card.id, data); Object.assign(card, changes);
      if (isNew) boardCards.push(card);
      if (changes.deleted) boardCards = boardCards.filter(c => c !== card);
      renderBoard();
    } catch (err) { status.textContent = err.message; }
  };
  const columns = BOARD.map(([status, title, colour], col) => {
    const cards = boardCards.filter(c => (c.status || "idea") === status).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    const body = h("div", {class: "colbody"});
    if (status === "idea" && DEX.web.url) body.append(addRequest(save));
    body.append(...cards.map(card => {
      const note = h("div", {class: "hint", role: "status", style: "margin:0"});
      const area = AREAS.find(a => a[0] === card.area) ? card.area : "other";
      return h("article", {class: "req"},
        h("div", {}, h("span", {class: "area " + area}, (AREAS.find(a => a[0] === area) || [0, "Other"])[1].toUpperCase())),
        h("h4", {}, card.title),
        card.text ? h("div", {style: "font-size:14px;white-space:pre-line"}, card.text) : null,
        card.by ? h("div", {class: "meta"}, "from " + card.by) : null,
        DEX.web.url ? h("div", {class: "acts"},
          col > 0 ? h("button", {type: "button", class: "small", onclick: () => save(card, {status: BOARD[col - 1][0]}, note)}, "◀ " + BOARD[col - 1][1]) : null,
          col < BOARD.length - 1 ? h("button", {type: "button", class: "small", onclick: () => save(card, {status: BOARD[col + 1][0]}, note)}, BOARD[col + 1][1] + " ▶") : null,
          status !== "done" ? h("button", {type: "button", class: "small good", title: "Done", onclick: () => save(card, {status: "done"}, note)}, "\u2713 DONE") : null,
          h("button", {type: "button", class: "small trash", title: "Not relevant: remove it from the board",
            onclick: ev => sure(ev.currentTarget, "REALLY?", () => save(card, {deleted: true}, note))}, "\ud83d\uddd1")) : null,
        note);
    }));
    if (!cards.length) body.append(h("div", {class: "empty"}, "Nothing here yet."));
    return h("section", {class: "boardcol"}, h("div", {class: "colhead", "data-c": colour}, title + " " + cards.length), body);
  });
  grid.replaceChildren(h("div", {class: "board", style: "grid-column:1/-1"}, columns));
}
function addRequest(save) {
  const wrap = h("div", {});
  const open = h("button", {type: "button", class: "primary", style: "width:100%", onclick: () => {
    const title = textInput("", {maxlength: 120, placeholder: "What should be added or changed?"});
    const text = h("textarea", {rows: 3, maxlength: 1000, placeholder: "Details (optional)"});
    const area = selectInput("pokemon", AREAS);
    const note = h("div", {class: "hint", role: "status", style: "margin:0"});
    wrap.replaceChildren(h("div", {class: "req"}, field("Request", title), field("Details", text), field("About", area),
      h("div", {class: "acts"}, h("button", {type: "button", class: "small primary", onclick: () => {
        const t = readText(title);
        if (!t || t.length < 3) { note.textContent = "Write what you would like first."; return; }
        const words = slugify(t).slice(0, 24).replace(/-+$/, "") || "card";          // ids are at most 40 characters
        const card = {id: "req-" + words + "-" + Date.now().toString(36), title: t, text: readText(text) || "", area: area.value, status: "idea", by: me() || null};
        save(card, {}, note, true);
      }}, "ADD"), h("button", {type: "button", class: "small", onclick: () => wrap.replaceChildren(open)}, "CANCEL")), note));
    title.focus();
  }}, "+ ADD A REQUEST");
  wrap.append(open);
  return wrap;
}

// Sprites approved in the studio are shown at once, for everyone: the approved versions are read from the database and
// laid over the built ones (the build copies them into the repo within about 15 minutes). Arvind, 16 Oct: "when I am done
// with a Pokemon I want its icon on the website immediately".
async function loadApprovedSprites() {
  if (!DEX.web.url) return;
  try {
    const rows = await dbRead("sprite_candidates?status=eq.approved&gen=eq.4&select=species_id,front,back,icon,follower,front2,back2");
    for (const r of rows) {
      const ds = {};
      for (const view of ["front", "back", "icon", "follower", "front2", "back2"]) if (r[view]) ds[view] = artUrl(r[view]);
      if (ds.front) DEX.ds_sprites[r.species_id] = ds;
    }
    if (!document.getElementById("dialog").open) render();
  } catch (e) { /* the built sprites are still shown */ }
}
function useApproved(sid, version) {                  // right after SAVE in the studio
  const ds = {};
  for (const view of ["front", "back", "icon", "follower", "front2", "back2"]) if (version[view]) ds[view] = artUrl(version[view]);
  DEX.ds_sprites[sid] = ds;
  render();
}

// Saves made on the website since this page was built are laid over the built data.
async function loadRecentEdits() {
  if (!DEX.web.url) return;
  try {
    for (const row of await dbRead("species_edits?select=id,kind,species_id,data,editor&id=gt." + DEX.web.cursor + "&order=id.asc")) {
      if (!row.data || typeof row.data !== "object" || slugify(row.species_id) !== row.species_id) continue;
      if (row.kind === "move" || row.kind === "ability") {
        const old = DEX.custom[row.kind].find(c => c.id === row.species_id);
        DEX.custom[row.kind] = DEX.custom[row.kind].filter(c => c.id !== row.species_id);
        if (!row.data.deleted && typeof row.data.name === "string") DEX.custom[row.kind].push(Object.assign({}, row.data, {id: row.species_id, pending: true, implemented: old && old.implemented}));
        continue;
      }
      if (row.kind === "request") continue;          // cards on the request board (loaded by loadBoard)
      if (row.kind === "npc") continue;              // NPCs made in CREATE NPC (loaded by loadNpcs)
      if (row.kind === "shiny" || row.kind === "cry") {   // a shiny or a cry saved since the build
        const store = row.kind === "shiny" ? DEX.shinies : DEX.cries;
        if (row.data.deleted) delete store[row.species_id]; else store[row.species_id] = Object.assign({}, row.data, {by: row.editor});
        continue;
      }
      if (row.kind === "reorder") {
        try { applyLayout(arrange(currentLayout(), Array.isArray(row.data.ops) ? row.data.ops : [])); } catch (e) { /* the import reports it */ }
        continue;
      }
      if (row.data.deleted) {                       // removed from the dex on the website
        DEX.species = DEX.species.filter(o => o.id !== row.species_id);
        delete DEX.images[row.species_id];
        DEX.species.forEach(derive); index();
        continue;
      }
      let entry = byId.get(row.species_id);
      if (entry) row.data = Object.assign({}, row.data, {dex: entry.data.dex, assets: entry.data.assets, engine: entry.data.engine});
      else {
        if (!Number.isInteger(row.data.dex) || bySlot.has(row.data.dex) || !row.data.name) continue;
        entry = {id: row.species_id}; DEX.species.push(entry);
      }
      delete row.data._base;
      entry.data = row.data; entry.pending = {editor: row.editor}; entry.problems = [];
      DEX.species.forEach(derive); index();
    }
    refreshLists(); render();
    // Pictures uploaded since this page was built, and ones removed since.
    const built = new Set(Object.values(DEX.images).flat().map(i => i.id));
    const builtIn = new Map(Object.entries(DEX.images).flatMap(([sid, list]) => list.map(i => [i.id, sid])));
    {
      for (const row of await dbRead("species_images?select=id,species_id,path,caption,editor,removed&order=id.asc")) {
        if (row.removed) DEX.images[row.species_id] = allImages(row.species_id).filter(i => i.id !== row.id);
        else if (builtIn.has(row.id) && builtIn.get(row.id) !== row.species_id) {         // moved to another Pokemon since the page was built
          const from = builtIn.get(row.id), image = allImages(from).find(i => i.id === row.id);
          DEX.images[from] = allImages(from).filter(i => i.id !== row.id);
          if (image && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push(image);
        }
        else if (!built.has(row.id) && row.species_id !== LOST) (DEX.images[row.species_id] ||= []).push({id: row.id, src: DEX.web.url + "/storage/v1/object/public/art/" + row.path, caption: row.caption, editor: row.editor});
      }
      if (!document.getElementById("dialog").open) render();
    }
  } catch (e) { /* the built data is still shown */ }
}

document.getElementById("title").textContent = DEX.project;
drawDayNight();
drawSpoilers();
if (NOSPOIL.names) {
  new MutationObserver(list => { for (const m of list) { if (m.type === "childList") m.addedNodes.forEach(maskNode); else if (m.type === "characterData") maskNode(m.target); else maskNode(m.target); } })
    .observe(document.body, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: MASK_ATTRS});
  maskNode(document.body);
}
const meBox = document.getElementById("me");
meBox.value = remember.get("editor");
let meRedraw = null;
meBox.addEventListener("input", () => { remember.set("editor", meBox.value.trim());
  clearTimeout(meRedraw); meRedraw = setTimeout(drawWelcome, 500); });
DEX.species.forEach(derive); index();
document.getElementById("type").append(...DEX.types.map(t => h("option", {value: t}, t)));
refreshLists();
document.getElementById("list-methods").append(...["grass", "cave", "surf", "fishing", "rock smash", "gift", "trade", "static"].map(m => h("option", {value: m})));
if (DEX.problems.length) document.getElementById("notice").append(h("details", {class: "notice"}, h("summary", {}, h("b", {}, DEX.problems.length + " saved edit(s) could not be used"), " - tap to see why"),
  h("ul", {}, DEX.problems.map(p => h("li", {}, h("b", {}, p.row + ": "), p.problem)))));
for (const id of ["search", "type", "show", "stage", "designer", "lacks"]) document.getElementById(id).addEventListener("input", render);
document.getElementById("sort").addEventListener("input", ev => {
  const v = ev.target.value, m = v.match(/^([a-z]+)(-?1)?$/);
  if (m) { listSort = {key: m[1], dir: Number(m[2] || 1)}; render(); }
});
learnPeople();
document.getElementById("designer").append(...[...new Set(DEX.species.flatMap(designersOf))].sort((a, b) => a.localeCompare(b)).map(d => h("option", {value: d}, d)));
// The name box suggests the group's names, so everyone writes theirs the same way; the browser remembers it.
document.body.append(h("datalist", {id: "people"}, people().map(n => h("option", {value: n}))));
meBox.setAttribute("list", "people");
meBox.addEventListener("change", () => { const n = person(meBox.value); if (n && n !== meBox.value.trim()) { meBox.value = n; remember.set("editor", n); } });
document.getElementById("lacks").append(h("option", {value: "*game"}, "Not playable in the game yet"), h("option", {value: "*sprite"}, "No sprite yet"), h("option", {value: "*unsure"}, "Claude is unsure about something"),
  ...DEX.checks.filter(([section]) => section !== "Art").map(([, label]) => h("option", {value: label}, "Missing " + label)));
document.getElementById("dialog").addEventListener("click", ev => { if (ev.target.id === "dialog" && !document.querySelector("#detail form")) closeDialog(); });
document.getElementById("dialog").addEventListener("cancel", () => { shown = null; if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("click", ev => { for (const d of document.querySelectorAll("nav details[open]")) if (!d.contains(ev.target)) d.open = false; });
if (takeSharedTeam()) view = "teams";
if (location.hash === "#swipe" && DEX.web.url) view = "swipe";
const charFromHash = () => { const m = location.hash.match(/^#char=([a-z0-9-]+)$/); return m && (DEX.characters || []).some(c => c.id === m[1]) ? m[1] : ""; };
if (charFromHash() && (CLAIMS_OPEN || CHARS_PREVIEW)) { view = "chars"; charOpen = charFromHash(); }
const npcFromHash = () => { const m = location.hash.match(/^#npc=(npc-[a-z0-9-]+)$/); return m ? m[1] : ""; };
if (npcFromHash() && (CLAIMS_OPEN || CHARS_PREVIEW)) { view = "chars"; npcOpen = npcFromHash(); }
window.addEventListener("popstate", () => {      // the browser's back button: from a trainer's page back to the list, and forward again
  const id = charFromHash(), nid = npcFromHash();
  if (id) { view = "chars"; charOpen = id; npcOpen = ""; render(); }
  else if (nid) { view = "chars"; npcOpen = nid; charOpen = ""; render(); }
  else if (charOpen || npcOpen) { charOpen = ""; npcOpen = ""; render(); }
});
render();
if (location.hash && byId.has(location.hash.slice(1))) openDetail(byId.get(location.hash.slice(1)));
else if (location.hash && formOf(location.hash.slice(1))) { const f = formOf(location.hash.slice(1)); openForm(f.base, f.index, "info"); }
loadRecentEdits();
if (DEX.web.url) loadLost().then(renderNav).catch(() => {});
trayLoad();
loadApprovedSprites();
