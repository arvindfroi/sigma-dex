# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 111
name: Oraclaw

credits:
  designer: Johannes     # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Psychic, Flying] # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 2.1            # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Anticipation
  secondary: Forewarn    # optional
  hidden: Magic Guard    # optional

base_stats:              # each 1-255
  hp: 90
  attack: 75
  defense: 70
  sp_attack: 110
  sp_defense: 100
  speed: 80

ev_yield: {sp_attack: 2} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Air Slash}
    - {level: 1, move: Growl}
    - {level: 1, move: Peck}
    - {level: 1, move: Tackle}
    - {level: 1, move: Tailwind}
    - {level: 1, move: Teleport}
    - {level: 5, move: Confusion}
    - {level: 6, move: Imprison}
    - {level: 10, move: Withdraw}
    - {level: 16, move: Charm}
    - {level: 18, move: Psybeam}
    - {level: 21, move: Slash}
    - {level: 22, move: Reflect}
    - {level: 24, move: Confuse Ray}
    - {level: 25, move: Recover}
    - {level: 27, move: Headbutt}
    - {level: 28, move: Psycho Shift}
    - {level: 31, move: Psyshock}
    - {level: 42, move: Wing Attack}
    - {level: 46, move: Take Down}
    - {level: 50, move: Psychic}
    - {level: 51, move: Uproar}
    - {level: 56, move: Roost}
    - {level: 66, move: Hypnosis}
    - {level: 68, move: Future Sight}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Hidden Power, Sunny Day, Hyper Beam, Light Screen, Protect, Rain Dance,
          Safeguard, Return, Psychic, Shadow Ball, Double Team, Reflect, Aerial Ace, Facade,
          Rest, Attract, Thief, Steel Wing, Skill Swap, Roost, Energy Ball, Endure,
          Giga Impact, Flash, Thunder Wave, Psych Up, Sleep Talk, Grass Knot, Swagger,
          Pluck, Substitute, Trick Room, Psyshock, Expanding Force, Dual Wingbeat, Fly,
          Rock Tomb, Rock Slide]
  # moves a move tutor can teach it
  tutor: [Air Slash, Hurricane, Sky Attack, Zen Headbutt]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves]
  body_shape: a body with one pair of wings
  movement: "It flies, flapping its wings."
  look: "It is a large bird of prey with white head and chest, a pointed feather crest and a yellow hooked beak. Its huge wings and long tail feathers are purple and lilac with golden eye-shaped markings, and it has yellow legs with black claws. A ring of pink sparkles floats above its head."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/oraclaw/579.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:397"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
