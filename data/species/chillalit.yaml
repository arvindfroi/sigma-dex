# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 45
name: Chillalit

credits:
  designer: Joar         # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Fire, Water]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Flame Surf     # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "Chillalit is a laid-back Pokémon that rides a surfboard made of fluid water. It controls the shape and sharpness of the board to outmaneuver opponents. Its flames never burn it—or its board."
height_m: 1.1            # e.g. 0.7
weight_kg: 26.5          # e.g. 6.9
body_color: black        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Swift Swim
  secondary: Solar Power # optional
  hidden: Battle Bond    # optional

base_stats:              # each 1-255
  hp: 50
  attack: 95
  defense: 55
  sp_attack: 109
  sp_defense: 67
  speed: 119

ev_yield: {speed: 2}     # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 173            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [water_1]    # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Hydro Steam}
    - {level: 1, move: Boiling Downpour}
    - {level: 1, move: Ember}
    - {level: 1, move: Quick Attack}
    - {level: 6, move: Whirlpool}
    - {level: 12, move: Aqua Jet}
    - {level: 13, move: Incinerate}
    - {level: 13, move: Water Pulse}
    - {level: 15, move: Flame Charge}
    - {level: 20, move: Flame Wheel}
    - {level: 22, move: Fire Fang}
    - {level: 24, move: Lava Plume}
    - {level: 26, move: Aqua Cutter}
    - {level: 29, move: Agility}
    - {level: 35, move: Fire Spin}
    - {level: 40, move: Flamethrower}
    - {level: 41, move: Aqua Tail}
    - {level: 42, move: Surf}
    - {level: 54, move: Inferno}
    - {level: 56, move: Flare Blitz}
    - {level: 57, move: Hydro Pump}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hidden Power, Sunny Day, Taunt, Ice Beam, Blizzard,
          Hyper Beam, Protect, Rain Dance, Frustration, Solar Beam, Return, Double Team,
          Flamethrower, Fire Blast, Facade, Secret Power, Rest, Attract, Overheat, Brine,
          Endure, Will-O-Wisp, Giga Impact, Captivate, Sleep Talk, Natural Gift, Swagger,
          Substitute, Flame Charge, Scald, Mystical Fire, Liquidation, Flip Turn, Surf,
          Strength, Whirlpool, Rock Smash, Waterfall, Brick Break, Scorching Sands]
  # moves a move tutor can teach it
  tutor: [Aqua Tail, Body Slam, Fire Fang, Fire Punch, Flare Blitz, Heat Wave, Icy Wind]
  egg: [Bubble Beam]     # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (**Joe**, 2026-05-15): evolution on the card: Battle Bond transformation: defeating an opponent with Battle Bond transforms it into its blue-red Battle Bond Form; also on the card: Normal form stats shown; Battle Bond Form stats HP 47, Atk 118, Def 66, SpA 150, SpD 80, Spe 138, total 599; Battle Bond is the hidden ability; signature moves Scalding Surf and Aqua Slash."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: an upright body on two legs without a tail
  movement: It walks upright on two legs.
  look: "It is a chubby penguin with a black and white body, orange beak and feet, and dark sunglasses. A tall crest of orange and yellow flames burns on top of its head, and it stands on a surfboard made of blue water."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/chillalit/203.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:394"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
