# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 63
name: Julius

credits:
  designer: "Thomas & Ragna" # who came up with it (Discord name)
  artist: "Thomas & Ragna" # who drew the concept art

types: [Fighting, Normal] # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Sheer Force
  secondary: Rocky Payload # optional
  hidden: Gorilla Tactics # optional

base_stats:              # each 1-255
  hp: 85
  attack: 95
  defense: 75
  sp_attack: 30
  sp_defense: 40
  speed: 80

ev_yield: {speed: 1}     # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: yanklet
    method: trade_item
    item: Metal Coat
  - into: harambe
    method: friendship

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Covet}
    - {level: 1, move: Focus Energy}
    - {level: 1, move: Leer}
    - {level: 1, move: Scratch}
    - {level: 3, move: Fury Swipes}
    - {level: 5, move: Low Kick}
    - {level: 8, move: Seismic Toss}
    - {level: 12, move: Cross Chop}
    - {level: 14, move: Assurance}
    - {level: 17, move: Thrash}
    - {level: 19, move: Rock Throw}
    - {level: 22, move: Rock Smash}
    - {level: 24, move: Brick Break}
    - {level: 25, move: Slash}
    - {level: 26, move: Close Combat}
    - {level: 31, move: Screech}
    - {level: 35, move: Stomping Tantrum}
    - {level: 40, move: Outrage}
    - {level: 41, move: Body Slam}
    - {level: 48, move: Double-Edge}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Focus Punch, Toxic, Bulk Up, Hidden Power, Sunny Day, Taunt, Protect, Rain Dance,
          Frustration, Iron Tail, Thunderbolt, Earthquake, Return, Dig, Brick Break,
          Double Team, Rock Tomb, Facade, Secret Power, Rest, Attract, Thief, Overheat,
          Focus Blast, Fling, Endure, Drain Punch, Shadow Claw, Payback, Giga Impact,
          Stone Edge, Captivate, Rock Slide, Sleep Talk, Natural Gift, Poison Jab, Swagger,
          U-turn, Substitute, Low Sweep, Bulldoze, Strength, Rock Smash, Rock Climb]
  # moves a move tutor can teach it
  tutor: [Body Slam, Close Combat, Counter, Curse, Endeavor, Fire Punch, Ice Punch, Outrage,
          Power-Up Punch, Seed Bomb, Thunder Punch]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: Aggresive monkey from Kristiansand
  name_origin:
  notes:
  wishes: This pokemon can have fighting moves where it throws bottles at the foe. It can learn mostly fighting moves
  claude_fill: true      # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [level-up moves, "TM/HM moves", tutor moves]
  body_shape: an upright body on two legs without a tail
  movement: Like a Chimpanzee # e.g. It walks on four legs. / It floats in the air.
  look: Its a black aggresive Chimpanzee # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/julius/1126.jpg"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
