# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 142
name: Moosus

credits:
  designer: Arvind       # who came up with it (Discord name)
  artist: Arvind         # who drew the concept art

types: [Flying, Fairy]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: white        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Aurora Dancer
  secondary:             # optional
  hidden: Regenerator    # optional

base_stats:              # each 1-255
  hp: 130
  attack: 110
  defense: 100
  sp_attack: 70
  sp_defense: 100
  speed: 70

ev_yield: {hp: 3}        # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 3            # 3 (legendary) to 255 (very easy)
base_exp: 262            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 0       # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles: 120          # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Focus Energy}
    - {level: 1, move: Harden}
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 8, move: Howl}
    - {level: 9, move: Horn Attack}
    - {level: 10, move: Disable}
    - {level: 18, move: Stomp}
    - {level: 30, move: Taunt}
    - {level: 31, move: Aurora Beam}
    - {level: 40, move: Play Rough}
    - {level: 40, move: Roost}
    - {level: 48, move: Iron Defense}
    - {level: 54, move: Thrash}
    - {level: 60, move: Moonblast}
    - {level: 70, move: Megahorn}
    - {level: 70, move: Sky Attack}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Toxic, Hidden Power, Sunny Day, Hyper Beam, Light Screen, Protect,
          Rain Dance, Frustration, Earthquake, Return, Double Team, Reflect, Aerial Ace,
          Facade, Secret Power, Rest, Steel Wing, Roost, Endure, Giga Impact, Psych Up,
          Sleep Talk, Swagger, Substitute, Draining Kiss, Play Rough, Body Press, Fly,
          Aurora Veil]
  # moves a move tutor can teach it
  tutor: [Air Slash, Body Slam, Brave Bird, Dazzling Gleam, Hurricane, Sky Attack,
          Zen Headbutt]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: Legendary moose from old mythology. its altlers and fur glitters and shines like nordic light. once in a while it gallops in the sky it attracts many onlookers
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, EV yield, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a moose with a brown head and long snout, and wide flat antlers that glow in aurora colours of purple, green and blue. Its body and long legs are white shaded with lilac and blue, with a small brown hump on its back and dark curled hooves."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/moosus/686.png"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:234"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
