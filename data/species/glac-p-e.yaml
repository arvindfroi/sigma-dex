# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 131
name: "Glacépée"

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ice, Fighting]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 1.7            # e.g. 0.7
weight_kg: 52            # e.g. 6.9
body_color: blue         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Long Reach
  secondary: Weak Armor  # optional
  hidden: Sniper         # optional

base_stats:              # each 1-255
  hp: 80
  attack: 125
  defense: 85
  sp_attack: 60
  sp_defense: 75
  speed: 100

ev_yield: {attack: 2}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 184            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [human_like] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Icicle Thrust}
    - {level: 1, move: Ice Shard}
    - {level: 1, move: Leer}
    - {level: 1, move: Powder Snow}
    - {level: 1, move: Rock Smash}
    - {level: 1, move: Tackle}
    - {level: 1, move: Taunt}
    - {level: 10, move: Focus Energy}
    - {level: 19, move: Feint}
    - {level: 21, move: Slash}
    - {level: 25, move: Agility}
    - {level: 28, move: Reversal}
    - {level: 32, move: Ice Fang}
    - {level: 34, move: Brick Break}
    - {level: 37, move: Icicle Crash}
    - {level: 40, move: Sacred Sword}
    - {level: 42, move: Iron Defense}
    - {level: 49, move: Ice Spinner}
    - {level: 52, move: Close Combat}
    - {level: 56, move: Mountain Gale}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Focus Punch, Hail, Bulk Up, Hidden Power, Sunny Day, Taunt, Ice Beam, Blizzard,
          Hyper Beam, Protect, Rain Dance, Earthquake, Return, Dig, Brick Break,
          Double Team, Rock Tomb, Facade, Rest, Attract, Thief, Focus Blast, Fling, Endure,
          Drain Punch, Payback, Giga Impact, Stone Edge, Avalanche, Swords Dance,
          Rock Slide, X-Scissor, Sleep Talk, Poison Jab, Swagger, Substitute, Low Sweep,
          Bulldoze, Lunge, Brutal Swing, Coaching, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Close Combat, Endeavor, Ice Fang, Ice Punch, Icicle Spear, Icy Wind,
          Power-Up Punch, Thunder Punch, Zen Headbutt]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles, weight]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    level-up moves: 55
    "TM/HM moves": 60
    tutor moves: 50
    body color: 80
    catch rate: 60
    base exp: 85
    growth rate: 57
    base friendship: 90
    gender: 75
    egg groups: 55
    egg cycles: 65
    weight: 65
  body_shape: an upright body on two legs without a tail
  movement: It walks upright on two legs.
  look: "It is a tall, slim, smooth pale-blue humanoid figure with a black fencing mask with glowing blue eyes. It has crystal ice shoulder pads, ice crystal boots shaped like pointed cones, and a long thin ice sword in one hand."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/glac-p-e/1109.png"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:475"  # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/glac-p-e.json"
  cry: "assets/cries/glac-p-e.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Gallade     # the official Pokemon whose battle animation it borrows
