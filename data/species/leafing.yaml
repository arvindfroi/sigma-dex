# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 1
name: Leafing

credits:
  designer:              # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Grass]           # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Sprout         # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: |           # the Pokedex entry text: max 4 lines of about 40 characters
  LEAFING hides among fallen leaves to
  nap in the sun. The leaf on its head
  hardens a little each time it battles,
  until the edge shines like metal.
height_m: 0.5            # e.g. 0.7
weight_kg: 5.8           # e.g. 6.9
body_color: green        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Overgrow
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 45
  attack: 60
  defense: 55
  sp_attack: 45
  sp_defense: 50
  speed: 55

ev_yield: {attack: 1}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 64             # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 87.5             # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field, grass] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: leafsteel
    method: level
    level: 16

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]
  level_up:
    - {level: 1, move: Tackle}
    - {level: 1, move: Leer}
    - {level: 6, move: Absorb}
    - {level: 10, move: Fury Cutter}
    - {level: 15, move: Razor Leaf}
    - {level: 20, move: Metal Claw}
    - {level: 25, move: Mega Drain}
    - {level: 30, move: Slash}
    - {level: 35, move: Iron Defense}
    - {level: 40, move: Leaf Blade}
    - {level: 45, move: Swords Dance}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Bullet Seed, Hidden Power, Sunny Day, Protect, Giga Drain, Frustration,
          Solar Beam, Iron Tail, Return, Double Team, Aerial Ace, Facade, Secret Power,
          Rest, Attract, Cut, Strength, Flash, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Swords Dance, Body Slam, Double-Edge, Mimic, Substitute, Snore, Endure, Mud-Slap,
          Swagger, Sleep Talk, Fury Cutter]
  # only needed for the first stage of an evolution line
  egg: [Leech Seed, Synthesis, Grass Whistle, Metal Sound]

# --- Where it is found ---
# e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]
encounters:
  - {location: Starter Pokemon, method: gift, levels: 5}

# --- Design ---
design:
  concept: Grass starter. A small creature with a leaf that slowly turns to steel as it evolves.
  name_origin:
  notes: "PROOF OF CONCEPT - every value in this file except name, type and evolution is a draft proposed by Claude on 2026-10-02. The Council should review and replace them."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art:           # e.g. assets/concept-art/leafing.png
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
