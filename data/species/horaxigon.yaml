# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 158
name: Horaxigon

credits:
  designer: Ivar         # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Steel, Dragon]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.6            # e.g. 0.7
weight_kg: 12            # e.g. 6.9
body_color: gray         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Mold Breaker
  secondary: Download    # optional
  hidden: Sheer Force    # optional

base_stats:              # each 1-255
  hp: 45
  attack: 45
  defense: 80
  sp_attack: 85
  sp_defense: 50
  speed: 35

ev_yield: {sp_attack: 1} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 90           # 3 (legendary) to 255 (very easy)
base_exp: 68             # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral, dragon] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: horaxander
    method: level
    level: 45

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 3, move: Protect}
    - {level: 12, move: Hone Claws}
    - {level: 18, move: Metal Sound}
    - {level: 24, move: Dragon Breath}
    - {level: 33, move: Screech}
    - {level: 36, move: Iron Defense}
    - {level: 42, move: Focus Energy}
    - {level: 48, move: Dragon Pulse}
    - {level: 54, move: Flash Cannon}
    - {level: 55, move: Lock-On}
    - {level: 60, move: Metal Burst}
    - {level: 66, move: Hyper Beam}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Roar, Toxic, Hidden Power, Sunny Day, Protect, Rain Dance,
          Frustration, Thunderbolt, Return, Double Team, Sandstorm, Facade, Secret Power,
          Rest, Attract, Endure, Dragon Pulse, Thunder Wave, Gyro Ball, Stealth Rock,
          Sleep Talk, Swagger, Substitute, Flash Cannon, Heavy Slam]
  # moves a move tutor can teach it
  tutor: [Body Slam, Draco Meteor, Iron Head, Outrage]
  egg: [Curse, Dragon Rush] # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [height, weight, body color, EV yield, catch rate, base exp,
                     growth rate, base friendship, gender, egg groups, egg cycles,
                     level-up moves, "TM/HM moves", tutor moves, egg moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    height: 35
    weight: 55
    body color: 90
    EV yield: 85
    catch rate: 55
    base exp: 85
    growth rate: 67
    base friendship: 90
    gender: 68
    egg groups: 46
    egg cycles: 65
    level-up moves: 61
    "TM/HM moves": 66
    tutor moves: 56
    egg moves: 56
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/horaxigon/2158.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/horaxigon.json"
  cry: "assets/cries/horaxigon.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
