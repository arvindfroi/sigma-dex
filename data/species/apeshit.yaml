# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 152
name: Apeshii

credits:
  designer: Arvind       # who came up with it (Discord name)
  artist: Arvind         # who drew the concept art

types: [Normal, Fighting] # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.4            # e.g. 0.7
weight_kg: 6             # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary:
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 60
  attack: 65
  defense: 55
  sp_attack: 20
  sp_defense: 30
  speed: 60

ev_yield:                # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: julius
    method: level
    level: 15

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 3, move: Low Kick}
    - {level: 4, move: Quick Attack}
    - {level: 7, move: Focus Energy}
    - {level: 8, move: Bite}
    - {level: 9, move: Rock Smash}
    - {level: 10, move: Scratch}
    - {level: 10, move: Rock Throw}
    - {level: 23, move: Take Down}
    - {level: 23, move: Karate Chop}
    - {level: 24, move: Play Rough}
    - {level: 25, move: Brick Break}
    - {level: 26, move: Hammer Arm}
    - {level: 26, move: Headbutt}
    - {level: 30, move: Recover}
    - {level: 31, move: Dynamic Punch}
    - {level: 35, move: Double-Edge}
    - {level: 40, move: Body Slam}
    - {level: 47, move: Giga Impact}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Focus Punch, Toxic, Bulk Up, Hidden Power, Sunny Day, Taunt, Protect, Rain Dance,
          Frustration, Return, Dig, Brick Break, Double Team, Rock Tomb, Facade,
          Secret Power, Rest, Attract, Thief, Focus Blast, Fling, Endure, Drain Punch,
          Payback, Captivate, Rock Slide, Sleep Talk, Natural Gift, Swagger, Substitute,
          Low Sweep, Strength, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Close Combat, Counter, Endeavor, Fire Punch, Hyper Voice, Ice Punch,
          Power-Up Punch, Thunder Punch]
  # only needed for the first stage of an evolution line
  egg: [Counter, Power-Up Punch, Smelling Salts, Mach Punch, Thunder Punch, Ice Punch,
        Fake Out, Revenge, Last Resort, Bullet Punch]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: A baby chimpanzee that is wearing a sweater and a diaper
  name_origin:
  notes:
  wishes: Weak physical attacker. baby mon
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [height, weight, level-up moves, "TM/HM moves", tutor moves, egg moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    height: 65
    weight: 65
    level-up moves: 55
    "TM/HM moves": 60
    tutor moves: 50
    egg moves: 50
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement: It crawls along the ground on its legs.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/apeshit/1539.png"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/apeshit.json"
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
