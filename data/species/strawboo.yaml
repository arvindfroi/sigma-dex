# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 139
name: Strawboo

credits:
  designer: Ruben        # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Water]           # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.4            # e.g. 0.7
weight_kg: 8             # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Lightning Rod
  secondary: Enticing Lure # optional
  hidden: Marvel Scale   # optional

base_stats:              # each 1-255
  hp: 40
  attack: 53
  defense: 67
  sp_attack: 25
  sp_defense: 35
  speed: 20

ev_yield: {defense: 1}   # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 48             # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 87.5             # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [dragon, water_2] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: wreckingboo
    method: level
    level: 30

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 1, move: Water Gun}
    - {level: 4, move: Withdraw}
    - {level: 10, move: Bubble Beam}
    - {level: 10, move: Supersonic}
    - {level: 15, move: Bite}
    - {level: 19, move: Aqua Jet}
    - {level: 19, move: Bubble}
    - {level: 19, move: Spike Cannon}
    - {level: 22, move: Protect}
    - {level: 24, move: Razor Shell}
    - {level: 31, move: Ice Fang}
    - {level: 32, move: Flail}
    - {level: 35, move: Rain Dance}
    - {level: 39, move: Crunch}
    - {level: 44, move: Liquidation}
    - {level: 47, move: Aqua Tail}
    - {level: 53, move: Wave Crash}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hail, Hidden Power, Ice Beam, Blizzard, Protect, Rain Dance,
          Frustration, Return, Dig, Double Team, Rock Tomb, Facade, Secret Power, Rest,
          Attract, Brine, Endure, Flash, Captivate, Sleep Talk, Natural Gift, Swagger,
          Substitute, Scald, Liquidation, Flip Turn, Surf, Whirlpool, Waterfall]
  tutor: [Aqua Tail, Body Slam, Icy Wind]
  # only needed for the first stage of an evolution line
  egg: [Mud Sport, Aqua Ring, Counter, Hydro Pump, Haze]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    level-up moves: 62
    "TM/HM moves": 67
    tutor moves: 57
    egg moves: 57
    body color: 90
    catch rate: 60
    base exp: 85
    growth rate: 56
    base friendship: 90
    gender: 56
    egg groups: 40
    egg cycles: 65
  body_shape: a body with fins # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement: "It floats in the air, swimming with its fins."
  look: "It is a small round dark red creature with a black zigzag crack down its middle, blue oval spots, and white spikes around its body. It has two mismatched eyes, one blue target-ringed and one tall blue oval, and a black mouth with a green tongue. Four pointed red fins stick out, two at the sides and two at the bottom, and a green stalk on top ends in a glowing yellow ball."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/strawboo/1103.jpg"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/strawboo.json"
  cry: "assets/cries/strawboo.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
