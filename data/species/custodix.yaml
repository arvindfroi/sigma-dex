# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 200
name: Custodix

credits:
  designer: Casper       # who came up with it (Discord name)
  artist: Casper         # who drew the concept art

types: [Fire, Rock]      # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Solar lion evolution # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: |           # the Pokedex entry text: max 4 lines of about 40 characters
  Custodix guards the sunny shores of Kristiansand.
  Its celestial forehead symbol draws in sunlight and drives away storm clouds.
  Though fur conceals its eyes, it senses movement through warmth and vibrations in stone.
  Despite its divine stature, it is notoriously weak to pop-up religions and sand.
height_m: 2.2            # e.g. 0.7
weight_kg: 100           # e.g. 6.9
body_color: yellow       # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Fire Mane
  secondary: Drought     # optional
  hidden: Intimidate     # optional

base_stats:              # each 1-255
  hp: 90
  attack: 90
  defense: 100
  sp_attack: 130
  sp_defense: 90
  speed: 100

ev_yield: {sp_attack: 3} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 270            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral, undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles: 40           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
