# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 58
name: Unknighted

credits:
  designer:              # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Electric, Psychic] # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Closed Circuit # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "When four Unown attune to compatible energies, they form a closed circuit. Their connection stabilizes energy flow and prevents dissipation, allowing power to cycle endlessly within their loop. They appear where strong currents convene."
height_m: 1.4            # e.g. 0.7
weight_kg: 22.8          # e.g. 6.9
body_color: black        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Battery
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 67
  attack: 77
  defense: 67
  sp_attack: 77
  sp_defense: 67
  speed: 112

ev_yield: {speed: 2}     # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 75           # 3 (legendary) to 255 (very easy)
base_exp: 164            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Confusion}
    - {level: 1, move: Growl}
    - {level: 1, move: Nuzzle}
    - {level: 1, move: Tackle}
    - {level: 1, move: Thunder Shock}
    - {level: 1, move: Thunder Wave}
    - {level: 1, move: Leer}
    - {level: 10, move: Quick Attack}
    - {level: 16, move: Shock Wave}
    - {level: 20, move: Parabolic Charge}
    - {level: 20, move: Psybeam}
    - {level: 22, move: Electro Ball}
    - {level: 24, move: Spark}
    - {level: 30, move: Volt Switch}
    - {level: 36, move: Agility}
    - {level: 37, move: Magnet Rise}
    - {level: 40, move: Discharge}
    - {level: 41, move: Charge}
    - {level: 41, move: Psychic}
    - {level: 42, move: Wild Charge}
    - {level: 47, move: Thunder}
    - {level: 48, move: Thunderbolt}
    - {level: 52, move: Magnetic Flux}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Toxic, Hidden Power, Sunny Day, Hyper Beam, Light Screen, Protect,
          Rain Dance, Safeguard, Frustration, Thunderbolt, Thunder, Return, Psychic,
          Shadow Ball, Double Team, Reflect, Shock Wave, Facade, Secret Power, Rest,
          Attract, Thief, Skill Swap, Charge Beam, Endure, Giga Impact, Flash, Thunder Wave,
          Psych Up, Sleep Talk, Natural Gift, Swagger, Substitute, Trick Room, Psyshock,
          Electroweb, Eerie Impulse, Electric Terrain, Expanding Force, U-turn]
  # moves a move tutor can teach it
  tutor: [Body Slam, Volt Switch, Zen Headbutt]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Google Doc: unknighted (unknown thunder stone?)\nFrom the Discord concept card (BUST, 2026-05-02): card name: UNOWN — CIRCUIT FORM; also on the card: Habitat: power plants, energy facilities, abandoned labs and ancient ruins. Behavior: maintains perfect energy circulation; disturbing the balance makes it disassemble and scatter. Cry: bzzztt-krrm...."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: several bodies joined together
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is four separate black glossy shapes, each with one big white eye, joined in a square loop by glowing yellow wires. The shapes are a triangle with a bar, a coil, a round disc with plus and minus signs, and an H-shaped bar, all crackling with yellow electricity."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/united/322.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:82"   # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
