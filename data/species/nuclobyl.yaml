# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 62
name: Nuclobyl

credits:
  designer: Magnus       # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Poison, Steel]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Hazard Core    # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "Its core has grown dangerously unstable. It lumbers through wastelands, venting corrosive fumes while its reinforced body shields the toxin within."
height_m: 1.7            # e.g. 0.7
weight_kg: 188.4         # e.g. 6.9
body_color: gray         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Innards Out
  secondary: Corrosion   # optional
  hidden: Filter         # optional

base_stats:              # each 1-255
  hp: 90
  attack: 59
  defense: 103
  sp_attack: 108
  sp_defense: 120
  speed: 45

ev_yield: {sp_defense: 2} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 60           # 3 (legendary) to 255 (very easy)
base_exp: 184            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral]    # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Acid}
    - {level: 1, move: Growl}
    - {level: 1, move: Sludge}
    - {level: 1, move: Tackle}
    - {level: 1, move: Toxic Spikes}
    - {level: 1, move: Tri Attack}
    - {level: 1, move: Poison Gas}
    - {level: 4, move: Smog}
    - {level: 16, move: Gyro Ball}
    - {level: 20, move: Flash Cannon}
    - {level: 22, move: Venoshock}
    - {level: 24, move: Poison Jab}
    - {level: 26, move: Acid Spray}
    - {level: 31, move: Sludge Bomb}
    - {level: 34, move: Sludge Wave}
    - {level: 35, move: Iron Defense}
    - {level: 37, move: Toxic}
    - {level: 42, move: Corrosive Gas}
    - {level: 44, move: Withdraw}
    - {level: 46, move: Metal Sound}
    - {level: 46, move: Gunk Shot}
    - {level: 50, move: Lock-On}
    - {level: 56, move: Flash Cannon}
    - {level: 60, move: Steel Beam}
    - {level: 64, move: Belch}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hidden Power, Sunny Day, Hyper Beam, Protect, Rain Dance, Frustration,
          Iron Tail, Thunderbolt, Return, Shadow Ball, Double Team, Sludge Bomb, Sandstorm,
          Facade, Secret Power, Rest, Attract, Thief, Endure, Payback, Giga Impact,
          Thunder Wave, Gyro Ball, Stealth Rock, Captivate, Sleep Talk, Natural Gift,
          Poison Jab, Swagger, Substitute, Flash Cannon, Venoshock, Heavy Slam, Acid Spray]
  # moves a move tutor can teach it
  tutor: [Body Slam, Curse, Iron Head, Metal Claw, Earth Power]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (BUST, 2026-05-07): also on the card: Its shell is forged from reinforced alloys and unstable radioactive sludge.."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: a head and arms # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It walks on its legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a big, heavy robot-like creature with a grey metal domed head with two green glowing eyes. Its metal chest has a glowing green and yellow radiation symbol, and its huge arms are made of bundled black cables ending in spiked yellow and black striped cuffs, with green slime dripping from it."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/nuclobyl/278.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:377"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
