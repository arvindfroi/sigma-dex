# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 150
name: Maagamad

credits:
  designer: Arvind       # who came up with it (Discord name)
  artist: Arvind         # who drew the concept art

types: [Flying, Poison]  # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Weather Switch # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "It stores three swords made of gaseous matter within its body. The oily coating on its wings and tail lets it glide through any weather. It flips the weather at will, bringing balance to the skies above the sea."
height_m: 1.9            # e.g. 0.7
weight_kg: 82.4          # e.g. 6.9
body_color: white        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Weather Switch
  secondary:             # optional
  hidden: Technician     # optional

base_stats:              # each 1-255
  hp: 120
  attack: 140
  defense: 100
  sp_attack: 100
  sp_defense: 120
  speed: 100

ev_yield: {attack: 3}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 3            # 3 (legendary) to 255 (very easy)
base_exp: 306            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 0       # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles: 120          # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Ancient Power}
    - {level: 1, move: Gust}
    - {level: 1, move: Scary Face}
    - {level: 1, move: Whirlwind}
    - {level: 10, move: Wing Attack}
    - {level: 20, move: Cross Poison}
    - {level: 25, move: Tailwind}
    - {level: 29, move: Hone Claws}
    - {level: 30, move: Roost}
    - {level: 35, move: Drill Peck}
    - {level: 35, move: Double Hit}
    - {level: 40, move: Crunch}
    - {level: 45, move: Recover}
    - {level: 54, move: Sky Attack}
    - {level: 60, move: Fly}
    - {level: 72, move: Brave Bird}
    - {level: 75, move: Poison Jab}
    - {level: 99, move: Gunk Shot}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hidden Power, Sunny Day, Hyper Beam, Protect, Rain Dance, Frustration,
          Earthquake, Return, Double Team, Sludge Bomb, Sandstorm, Aerial Ace, Facade,
          Secret Power, Rest, Steel Wing, Roost, Endure, Giga Impact, Sleep Talk,
          Natural Gift, Poison Jab, Swagger, U-turn, Substitute, Venoshock, Acid Spray,
          Dual Wingbeat, Fly, Surf]
  # moves a move tutor can teach it
  tutor: [Air Slash, Body Slam, Brave Bird, Heat Wave, Hurricane, Iron Head, Sky Attack,
          Zen Headbutt, Weather Ball, Night Slash]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Google Doc: Maagamad/gullmire (Flying, Poison)\nFrom the Discord concept card (Arvind Frøiland, 2026-09-30): card name: Gullmire; also on the card: Weather Switch switches rain to drought and drought to rain, random Drizzle or Drought otherwise; Technician is the hidden ability; signature move Oily Arsenal (Drought Physical, Poison, BP 60x2; Rain Special, Poison, BP 40x3)."
  wishes: Mixed attacker that makes use of technician.
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, EV yield, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: an upright body on two legs with a tail
  movement: It walks on two legs with its wings folded.
  look: "It is a big, plump seagull-like bird with a white body and head, an orange beak and orange webbed feet. It has dark wings with a green and purple oily sheen, a grey sash across its chest holding three sheathed green-crossguard swords on its back, and a small anchor mark on one wing."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/maagamad/263.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:279"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
