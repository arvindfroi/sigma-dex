    - {level: 1, move: Tackle}
    - {level: 9, move: Icy Wind}
    - {level: 12, move: Ice Shard}
    - {level: 15, move: Ice Fang}
    - {level: 15, move: Rest}
    - {level: 15, move: Aurora Beam}
    - {level: 16, move: Slash}
    - {level: 19, move: Bite}
    - {level: 23, move: Snowscape}
    - {level: 25, move: Flail}
    - {level: 25, move: Take Down}
    - {level: 27, move: Avalanche}
    - {level: 36, move: Body Slam}
    - {level: 40, move: Amnesia}
    - {level: 44, move: Icicle Crash}
    - {level: 48, move: Blizzard}
    - {level: 49, move: Double-Edge}
    - {level: 54, move: Screech}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
