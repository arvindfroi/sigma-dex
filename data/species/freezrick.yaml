          Frustration, Earthquake, Return, Dig, Brick Break, Double Team, Facade,
          Secret Power, Rest, Attract, Endure, Giga Impact, Stone Edge, Avalanche,
          Rock Slide, Sleep Talk, Swagger, Substitute, Heavy Slam, Bulldoze, Liquidation,
          Body Press, Rock Smash, Rock Tomb, Strength]
