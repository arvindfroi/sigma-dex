# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 48
name: Tomaternader

credits:
  designer: Casper       # who came up with it (Discord name)
  artist: Casper         # who drew the concept art

types: [Poison, Grass]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Toxic Burger   # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "An urban plain-sight stealth specialist, often found hiding in bins and picnic leftovers. Its leafy eyes reveal its mood."
height_m: 0.8            # e.g. 0.7
weight_kg: 24.5          # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Pickle Armor
  secondary: Chlorophyll # optional
  hidden: Defiant        # optional

base_stats:              # each 1-255
  hp: 80
  attack: 85
  defense: 75
  sp_attack: 50
  sp_defense: 70
  speed: 40

ev_yield: {attack: 1}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 120          # 3 (legendary) to 255 (very easy)
base_exp: 96             # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [grass]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: crappy-meal
    method: other
    note: "Link found from the group's cards, art and names on 8 Nov 2026; how it evolves is not decided yet."

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Mortal Spin}
    - {level: 1, move: Tackle}
    - {level: 7, move: Growth}
    - {level: 8, move: Stun Spore}
    - {level: 8, move: Sweet Scent}
    - {level: 9, move: Poison Fang}
    - {level: 15, move: Head Smash}
    - {level: 16, move: Cross Poison}
    - {level: 16, move: Leech Seed}
    - {level: 16, move: Razor Leaf}
    - {level: 22, move: Poison Sting}
    - {level: 28, move: Seed Bomb}
    - {level: 29, move: Slash}
    - {level: 30, move: Toxic}
    - {level: 33, move: Poison Jab}
    - {level: 40, move: Gunk Shot}
    - {level: 53, move: Power Whip}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Bullet Seed, Hidden Power, Sunny Day, Protect, Rain Dance, Giga Drain,
          Frustration, Solar Beam, Return, Dig, Double Team, Sludge Bomb, Facade,
          Secret Power, Rest, Attract, Thief, Energy Ball, Endure, Payback, Flash,
          Swords Dance, Captivate, Sleep Talk, Natural Gift, Poison Jab, Grass Knot,
          Swagger, Substitute, Venoshock, Acid Spray, Grassy Terrain]
  # moves a move tutor can teach it
  tutor: [Body Slam, Curse, Leaf Storm, Magical Leaf, Seed Bomb, Synthesis]
  # only needed for the first stage of an evolution line
  egg: [Worry Seed, Curse, Stockpile, Amnesia, Magical Leaf, Leaf Storm, Defense Curl,
        Clear Smog]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: "Burger with an attitude, consist of a burger with a massive and vengeful tomato in the center."
  name_origin:
  notes: "From the Discord concept card (Casse, 2026-10-01): card name: Tomadernader; also on the card: Pickle Armor: its sour coating deters any healing effects of any attack from opponents; Chlorophyll is hidden ability; signature move Onion Cyclone (Poison Physical, Power 85, Accuracy 100, 30% chance to poison); Head Smash 70 damage, 30 damage to itself; No. ???."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: true      # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, EV yield, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a head and arms # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It crawls along the ground on its legs.
  look: "It is a living hamburger with a sesame seed bun on top, lettuce, a red tomato face with angry yellow eyes, pickles, and melted yellow cheese dripping down. Two large curved purple onion rings stick out from the sides like claws."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/tomaterdander/317.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:108"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
