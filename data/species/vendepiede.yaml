# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 150
name: Vendepiede

credits:
  designer: Michael      # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Poison, Fire]    # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.9            # e.g. 0.7
weight_kg: 20.2          # e.g. 6.9
body_color: green        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Color Change
  secondary: Spicy Spray # optional
  hidden: Protean        # optional

base_stats:              # each 1-255
  hp: 60
  attack: 80
  defense: 55
  sp_attack: 65
  sp_defense: 75
  speed: 85

ev_yield: {sp_defense: 2} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 147            # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field, water_1] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: venorax
    method: level
    level: 38

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Ember}
    - {level: 1, move: Growl}
    - {level: 1, move: Leer}
    - {level: 1, move: Poison Sting}
    - {level: 1, move: Scratch}
    - {level: 1, move: Wrap}
    - {level: 5, move: Peck}
    - {level: 8, move: Poison Fang}
    - {level: 10, move: Focus Energy}
    - {level: 12, move: Fury Swipes}
    - {level: 13, move: Quick Attack}
    - {level: 15, move: Bite}
    - {level: 15, move: Flame Charge}
    - {level: 17, move: Screech}
    - {level: 20, move: Acid}
    - {level: 20, move: Toxic Spikes}
    - {level: 20, move: Venoshock}
    - {level: 24, move: Agility}
    - {level: 25, move: Fire Fang}
    - {level: 26, move: Lava Plume}
    - {level: 30, move: Scary Face}
    - {level: 31, move: Acid Spray}
    - {level: 35, move: Fire Spin}
    - {level: 39, move: Gastro Acid}
    - {level: 40, move: Flamethrower}
    - {level: 41, move: Gunk Shot}
    - {level: 43, move: Sludge Bomb}
    - {level: 44, move: Haze}
    - {level: 48, move: Inferno}
    - {level: 48, move: Poison Jab}
    - {level: 52, move: Flare Blitz}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Focus Punch, Toxic, Hidden Power, Sunny Day, Taunt, Protect, Rain Dance,
          Giga Drain, Frustration, Solar Beam, Iron Tail, Return, Dig, Brick Break,
          Double Team, Flamethrower, Sludge Bomb, Fire Blast, Facade, Secret Power, Rest,
          Attract, Thief, Overheat, Energy Ball, Endure, Will-O-Wisp, Payback, Captivate,
          Dark Pulse, Sleep Talk, Natural Gift, Poison Jab, Swagger, Substitute, Venoshock,
          Flame Charge, Acid Spray, Cut, Strength]
  # moves a move tutor can teach it
  tutor: [Body Slam, Fire Fang, Fire Punch, Flare Blitz, Heat Wave, Leaf Storm, Seed Bomb]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: Venofrib second evolution # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [height, weight, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    height: 45
    weight: 35
    body color: 90
    catch rate: 60
    base exp: 85
    growth rate: 57
    base friendship: 90
    gender: 56
    egg groups: 44
    egg cycles: 65
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/vendepiede/2126.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/vendepiede.json"
  cry: "assets/cries/vendepiede.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Combusken   # the official Pokemon whose battle animation it borrows
