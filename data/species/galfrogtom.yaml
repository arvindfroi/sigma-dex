                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: an upright body on two legs without a tail
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a frog-like creature with two long green legs and a translucent pale-blue glass-like capsule body with a gold coil and wires inside. It has two thin light-blue arms with spread fingers, small round battery-like terminals marked plus and minus on its body, and yellow sparks around it."

