# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 242
name: Felk

credits:
  designer: Ruben        # who came up with it (Discord name)
  artist: Ruben          # who drew the concept art

types: [Grass, Flying]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 2              # e.g. 0.7
weight_kg: 230           # e.g. 6.9
body_color: brown        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Wind Master
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 100
  attack: 80
  defense: 85
  sp_attack: 120
  sp_defense: 85
  speed: 110

ev_yield: {sp_attack: 3} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 3            # 3 (legendary) to 255 (very easy)
base_exp: 261            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 35      # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles: 120          # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Air Cutter}
    - {level: 1, move: Gust}
    - {level: 1, move: Leer}
    - {level: 1, move: Mega Drain}
    - {level: 7, move: Roar}
    - {level: 10, move: Light Screen}
    - {level: 10, move: Fairy Wind}
    - {level: 14, move: Magical Leaf}
    - {level: 18, move: Wing Attack}
    - {level: 21, move: Aromatherapy}
    - {level: 25, move: Agility}
    - {level: 25, move: Ancient Power}
    - {level: 30, move: Tailwind}
    - {level: 35, move: Giga Drain}
    - {level: 40, move: Roost}
    - {level: 45, move: Hurricane}
    - {level: 54, move: Heal Pulse}
    - {level: 55, move: Solar Beam}
    - {level: 56, move: Air Slash}
    - {level: 60, move: Rain Dance}
    - {level: 70, move: Energy Ball}
    - {level: 91, move: Hyper Beam}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Bullet Seed, Hidden Power, Sunny Day, Taunt, Hyper Beam, Light Screen,
          Protect, Rain Dance, Giga Drain, Frustration, Solar Beam, Return, Double Team,
          Aerial Ace, Facade, Secret Power, Rest, Roost, Focus Blast, Energy Ball, Endure,
          Giga Impact, Sleep Talk, Grass Knot, Swagger, U-turn, Substitute, Dual Wingbeat,
          Fly]
  # moves a move tutor can teach it
  tutor: [Air Slash, Body Slam, Brave Bird, Heat Wave, Hurricane, Leaf Storm, Magical Leaf,
          Seed Bomb, Sky Attack, Moonblast, Dazzling Gleam]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, height, weight, body color, catch rate,
                     base exp, growth rate, base friendship, gender, egg groups, egg cycles,
                     level-up moves, "TM/HM moves", tutor moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    height: 65
    weight: 65
    body color: 90
    catch rate: 90
    base exp: 85
    growth rate: 90
    base friendship: 54
    gender: 75
    egg groups: 90
    egg cycles: 90
    level-up moves: 64
    "TM/HM moves": 69
    tutor moves: 59
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a deer-like creature with a cream face and legs, a shaggy brown and cream mane, one blue eye and black hooves with brown leaf-like tufts above them. It has large pale antlers topped with green leaf shapes with golden rings floating around them, and a big wing of green, cream and brown leaf-feathers on its back."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/felk/1108.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/felk.json"
  cry: "assets/cries/felk.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Dialga      # the official Pokemon whose battle animation it borrows
