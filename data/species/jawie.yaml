# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 122
name: Jawie

credits:
  designer: Ivar         # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Fire, Dragon]    # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.7            # e.g. 0.7
weight_kg: 19.4          # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Strong Jaw
  secondary: Intimidate  # optional
  hidden: Dragonize      # optional

base_stats:              # each 1-255
  hp: 60
  attack: 90
  defense: 60
  sp_attack: 50
  sp_defense: 40
  speed: 50

ev_yield: {attack: 1}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 70             # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [dragon]     # 1 or 2, e.g. [field, grass]
egg_cycles: 25           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: jawbreaker
    method: level
    level: 42

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Ember}
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 8, move: Dragon Tail}
    - {level: 9, move: Bite}
    - {level: 9, move: Flame Charge}
    - {level: 15, move: Horn Attack}
    - {level: 21, move: Headbutt}
    - {level: 21, move: Slash}
    - {level: 26, move: Flame Wheel}
    - {level: 26, move: Scary Face}
    - {level: 32, move: Dragon Claw}
    - {level: 34, move: Crunch}
    - {level: 36, move: Take Down}
    - {level: 40, move: Focus Energy}
    - {level: 41, move: Dragon Rush}
    - {level: 54, move: Outrage}
    - {level: 56, move: Flare Blitz}
    - {level: 61, move: Double-Edge}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Roar, Toxic, Hidden Power, Sunny Day, Protect, Rain Dance,
          Frustration, Iron Tail, Return, Dig, Brick Break, Double Team, Flamethrower,
          Fire Blast, Rock Tomb, Aerial Ace, Facade, Secret Power, Rest, Attract, Overheat,
          Endure, Dragon Pulse, Will-O-Wisp, Rock Slide, Sleep Talk, Swagger, Substitute,
          Flame Charge, Strength, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Draco Meteor, Dragon Dance, Endeavor, Fire Fang, Fire Punch,
          Flare Blitz, Iron Head, Outrage, Thunder Fang, Zen Headbutt]
  # only needed for the first stage of an evolution line
  egg: [Fire Fang, Dragon Breath, Thunder Fang, Dragon Dance, Fire Spin, Dragon Rage,
        Reversal, Curse]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, height, weight, body color, catch rate,
                     base exp, growth rate, base friendship, gender, egg groups, egg cycles,
                     level-up moves, "TM/HM moves", tutor moves, egg moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    height: 45
    weight: 55
    body color: 90
    catch rate: 60
    base exp: 85
    growth rate: 51
    base friendship: 90
    gender: 65
    egg groups: 48
    egg cycles: 65
    level-up moves: 59
    "TM/HM moves": 64
    tutor moves: 54
    egg moves: 54
  body_shape: an upright body on two legs with a tail
  movement: It walks upright on two legs.
  look: "It is a plump orange dragon-like creature with two large curved horns, a wide toothy grin, orange eyes and a big round cream belly. It wears an iron chain around its neck and has two short arms with cream claws, two clawed feet and a short curled tail with red scale patches."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/jawie/765.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:408"  # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/jawie.json"
  cry: "assets/cries/jawie.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
