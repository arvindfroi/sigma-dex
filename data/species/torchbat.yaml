# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 7
name: Torchbat

credits:
  designer: "Emil & Arvind" # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Fire]            # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.8            # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Blaze
  secondary:             # optional
  hidden: No Guard       # optional

base_stats:              # each 1-255
  hp: 45
  attack: 50
  defense: 45
  sp_attack: 60
  sp_defense: 50
  speed: 70

ev_yield: {speed: 1}     # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 64             # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 87.5             # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field, dragon] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: heatbat
    method: level
    level: 16

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Scratch}
    - {level: 1, move: Growl}
    - {level: 6, move: Ember}
    - {level: 10, move: Supersonic}
    - {level: 10, move: Wing Attack}
    - {level: 11, move: Gust}
    - {level: 12, move: Fury Swipes}
    - {level: 13, move: Quick Attack}
    - {level: 14, move: Flame Charge}
    - {level: 17, move: Incinerate}
    - {level: 19, move: Lava Plume}
    - {level: 20, move: Slash}
    - {level: 24, move: Fire Fang}
    - {level: 28, move: Scary Face}
    - {level: 30, move: Flamethrower}
    - {level: 32, move: Fire Spin}
    - {level: 36, move: Inferno}
    - {level: 40, move: Fire Blast}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Roar, Toxic, Hidden Power, Sunny Day, Protect, Frustration,
          Iron Tail, Return, Double Team, Flamethrower, Fire Blast, Aerial Ace, Facade,
          Secret Power, Rest, Attract, Overheat, Endure, Will-O-Wisp, Shadow Claw,
          Captivate, Rock Slide, Sleep Talk, Natural Gift, Swagger, Substitute,
          Flame Charge, Cut, Rock Smash, Fly]
  # moves a move tutor can teach it
  tutor: [Body Slam, Fire Fang, Fire Punch, Flare Blitz, Heat Wave, Outrage, Thunder Punch,
          Flame Wheel]
  # only needed for the first stage of an evolution line
  egg: [Flare Blitz, Fire Punch, Fake Out, Counter, Crunch, Focus Punch, Crush Claw,
        Double Kick, Sucker Punch, Helping Hand]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: DRAFT level-up moves added by Claude on 2026-10-03 so the starter can be tested in the game - replace them with the real ones.
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a body with one pair of wings
  movement: "It flies, flapping its wings."
  look: "It is a small, round, red-orange creature with a cream belly patch, a cream pig-like snout with small fangs and big ears burning with flames. It has very long thin arms with white claws at the tips, small round feet and a long thin tail ending in a flame."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/torchbat/469.png"
  front_sprite: "assets/sprites/torchbat/front.png"
  front_anim: "assets/sprites/torchbat/anim_front.png"
  back_sprite: "assets/sprites/torchbat/back.png"
  icon: "assets/sprites/torchbat/icon.png"
  footprint: "hgss:4"    # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset: 11     # pixels the front sprite is moved down
  back_y_offset: 11      # pixels the back sprite is moved down
  icon_palette: 5        # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
