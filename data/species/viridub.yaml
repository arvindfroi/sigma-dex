# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 118
name: Viridub

credits:
  designer: Rebekka      # who came up with it (Discord name)
  artist: Rebekka        # who drew the concept art

types: [Grass]           # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.5            # e.g. 0.7
weight_kg: 9             # e.g. 6.9
body_color: yellow       # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Leaf Mane
  secondary: Grass Pelt  # optional
  hidden: Chlorophyll    # optional

base_stats:              # each 1-255
  hp: 62
  attack: 73
  defense: 58
  sp_attack: 50
  sp_defense: 54
  speed: 72

ev_yield: {attack: 1}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 120          # 3 (legendary) to 255 (very easy)
base_exp: 74             # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field, grass] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: viridub-utvikling
    method: item
    item: Leaf Stone
    note: "Link found from the group's cards, art and names on 8 Nov 2026; how it evolves is not decided yet."

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leafage}
    - {level: 1, move: Scratch}
    - {level: 1, move: Tail Whip}
    - {level: 7, move: Bite}
    - {level: 12, move: Razor Leaf}
    - {level: 13, move: Vine Whip}
    - {level: 15, move: Leech Seed}
    - {level: 15, move: Quick Attack}
    - {level: 22, move: Seed Bomb}
    - {level: 28, move: Synthesis}
    - {level: 30, move: Slam}
    - {level: 36, move: Leaf Blade}
    - {level: 42, move: Wood Hammer}
    - {level: 46, move: Power Whip}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Bullet Seed, Hidden Power, Sunny Day, Protect, Giga Drain, Frustration,
          Solar Beam, Return, Double Team, Facade, Secret Power, Rest, Attract, Energy Ball,
          Endure, Flash, Swords Dance, Sleep Talk, Grass Knot, Swagger, Substitute,
          Grassy Terrain]
  # moves a move tutor can teach it
  tutor: [Body Slam, Endeavor, Leaf Storm, Magical Leaf, Seed Bomb, Solar Blade, Synthesis]
  # only needed for the first stage of an evolution line
  egg: [Worry Seed, Magical Leaf, Leaf Storm, Fake Out, Nature Power]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [look, level-up moves, "TM/HM moves", tutor moves, egg moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles, height, weight]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    look: 80
    level-up moves: 59
    "TM/HM moves": 64
    tutor moves: 54
    egg moves: 54
    body color: 80
    catch rate: 60
    base exp: 85
    growth rate: 56
    base friendship: 90
    gender: 56
    egg groups: 50
    egg cycles: 65
    height: 65
    weight: 65
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a cute golden-tan lion cub with a leafy green mane, round ears and green eyes. It has a leaf-shaped tail on a thin stem, small leaf marks on its body and a green sprout on top of its head."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/viridub/714.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:403"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
