# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 145
name: Sealma

credits:
  designer: Arvind       # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ice, Ground]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 0.7            # e.g. 0.7
weight_kg: 35            # e.g. 6.9
body_color: brown        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Slush Rush
  secondary: Sand Rush   # optional
  hidden: Thick Fat      # optional

base_stats:              # each 1-255
  hp: 75
  attack: 45
  defense: 40
  sp_attack: 25
  sp_defense: 30
  speed: 65

ev_yield: {hp: 1}        # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 225          # 3 (legendary) to 255 (very easy)
base_exp: 50             # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: whaldrill
    method: level
    level: 25

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Mud-Slap}
    - {level: 1, move: Tackle}
    - {level: 4, move: Powder Snow}
    - {level: 8, move: Flail}
    - {level: 9, move: Bulldoze}
    - {level: 10, move: Rollout}
    - {level: 12, move: Ice Shard}
    - {level: 15, move: Mist}
    - {level: 19, move: Endure}
    - {level: 23, move: Icy Wind}
    - {level: 24, move: Ice Fang}
    - {level: 25, move: Stomping Tantrum}
    - {level: 27, move: Amnesia}
    - {level: 32, move: Take Down}
    - {level: 37, move: Earthquake}
    - {level: 40, move: Icicle Crash}
    - {level: 42, move: Blizzard}
    - {level: 65, move: Thrash}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hail, Hidden Power, Sunny Day, Ice Beam, Blizzard, Light Screen, Protect,
          Rain Dance, Frustration, Earthquake, Return, Dig, Double Team, Sandstorm,
          Rock Tomb, Facade, Secret Power, Rest, Attract, Endure, Stone Edge, Avalanche,
          Stealth Rock, Captivate, Rock Slide, Sleep Talk, Natural Gift, Swagger,
          Substitute, Bulldoze, High Horsepower, Strength, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Charm, Curse, Earth Power, Endeavor, Ice Fang, Ice Punch, Icicle Spear,
          Icy Wind]
  # only needed for the first stage of an evolution line
  egg: [Icicle Spear, Mud Shot, Double-Edge, Freeze-Dry, Curse, Bite, Ancient Power,
        Mud Bomb, Rock Climb, Heavy Slam]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [level-up moves, "TM/HM moves", tutor moves, egg moves, body color,
                     catch rate, base exp, growth rate, base friendship, gender, egg groups,
                     egg cycles, height, weight]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    level-up moves: 80
    "TM/HM moves": 85
    tutor moves: 75
    egg moves: 75
    body color: 35
    catch rate: 60
    base exp: 55
    growth rate: 69
    base friendship: 90
    gender: 80
    egg groups: 61
    egg cycles: 65
    height: 65
    weight: 65
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/whaldrill0/2622.png"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/whaldrill0.json"
  cry: "assets/cries/whaldrill0.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Sealeo      # the official Pokemon whose battle animation it borrows
