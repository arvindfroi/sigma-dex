# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 82
name: Goatjo

credits:
  designer: Ruben        # who came up with it (Discord name)
  artist: Ruben          # who drew the concept art

types: [Psychic, Dragon] # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: black        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Wonder Guard
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 1
  attack: 100
  defense: 67
  sp_attack: 100
  sp_defense: 67
  speed: 100

ev_yield: {attack: 1, sp_attack: 1, speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 152            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Confusion}
    - {level: 1, move: Leer}
    - {level: 1, move: Tackle}
    - {level: 1, move: Teleport}
    - {level: 5, move: Bite}
    - {level: 8, move: Dragon Tail}
    - {level: 12, move: Helping Hand}
    - {level: 16, move: Protect}
    - {level: 18, move: Psybeam}
    - {level: 18, move: Psycho Cut}
    - {level: 18, move: Horn Attack}
    - {level: 24, move: Dragon Claw}
    - {level: 25, move: Dragon Breath}
    - {level: 40, move: Calm Mind}
    - {level: 40, move: Dragon Pulse}
    - {level: 40, move: Psychic}
    - {level: 42, move: Dragon Dance}
    - {level: 44, move: Zen Headbutt}
    - {level: 50, move: Future Sight}
    - {level: 54, move: Dragon Rush}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Calm Mind, Toxic, Hidden Power, Sunny Day, Hyper Beam, Light Screen,
          Protect, Rain Dance, Safeguard, Frustration, Return, Psychic, Shadow Ball,
          Double Team, Reflect, Aerial Ace, Facade, Secret Power, Attract, Thief,
          Focus Blast, Energy Ball, Dragon Pulse, Giga Impact, Flash, Thunder Wave,
          Psych Up, Sleep Talk, Grass Knot, Swagger, Trick Room, Psyshock, Psychic Terrain,
          Expanding Force]
  # moves a move tutor can teach it
  tutor: [Body Slam, Draco Meteor, Dragon Dance, Iron Head, Outrage, Zen Headbutt, Headbutt]
  # only needed for the first stage of an evolution line
  egg: [Extrasensory, Stored Power, Fake Out]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a goat-like creature with a long white and lilac shaggy mane and bushy tail, a pale face with a black band over its brow, a blue eye and a pink nose, and two long purple horns curving back. Its body and four legs are dark charcoal, with red and blue bands on the lower legs and black paws. A glowing purple orb floats at the tip of its tail."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/goatjo/1111.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
