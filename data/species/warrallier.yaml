          Rest, Attract, Thief, Snatch, False Swipe, Fling, Endure, Drain Punch, Embargo,
          Shadow Claw, Payback, Giga Impact, Stone Edge, Swords Dance, Psych Up, Captivate,
          Dark Pulse, Rock Slide, X-Scissor, Sleep Talk, Natural Gift, Poison Jab,
          Grass Knot, Swagger, Pluck, U-turn, Substitute, Low Sweep, Foul Play, Scald,
          Play Rough, Lunge, Smart Strike, Brutal Swing, Aurora Veil, Liquidation, Coaching,
          Flip Turn, Triple Axel, Cut, Surf, Strength, Whirlpool, Rock Smash, Waterfall,
