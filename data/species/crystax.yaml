# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 152
name: Crystax

credits:
  designer: michael      # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Steel, Rock]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 1.3            # e.g. 0.7
weight_kg: 62.6          # e.g. 6.9
body_color: gray         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Crystal Body
  secondary: Tough Claws # optional
  hidden: Sand Force     # optional

base_stats:              # each 1-255
  hp: 65
  attack: 125
  defense: 85
  sp_attack: 45
  sp_defense: 75
  speed: 115

ev_yield: {attack: 3}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 60           # 3 (legendary) to 255 (very easy)
base_exp: 178            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leer}
    - {level: 1, move: Quick Attack}
    - {level: 1, move: Rollout}
    - {level: 1, move: Sand Attack}
    - {level: 1, move: Scratch}
    - {level: 1, move: Tackle}
    - {level: 7, move: Taunt}
    - {level: 12, move: Bite}
    - {level: 13, move: Rock Tomb}
    - {level: 13, move: Smack Down}
    - {level: 17, move: Metal Claw}
    - {level: 19, move: Assurance}
    - {level: 21, move: Headbutt}
    - {level: 24, move: Slash}
    - {level: 25, move: Screech}
    - {level: 31, move: Roar}
    - {level: 31, move: Scary Face}
    - {level: 32, move: Agility}
    - {level: 32, move: Rock Slide}
    - {level: 35, move: Iron Head}
    - {level: 36, move: Crunch}
    - {level: 40, move: Iron Tail}
    - {level: 44, move: Swords Dance}
    - {level: 47, move: Stealth Rock}
    - {level: 60, move: Stone Edge}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hidden Power, Sunny Day, Hyper Beam, Protect, Rain Dance, Frustration,
          Iron Tail, Earthquake, Return, Dig, Brick Break, Double Team, Sandstorm,
          Rock Tomb, Aerial Ace, Facade, Secret Power, Rest, Attract, Endure, Giga Impact,
          Rock Polish, Stone Edge, Swords Dance, Stealth Rock, Rock Slide, Sleep Talk,
          Swagger, Substitute, Flash Cannon, Heavy Slam, Bulldoze, High Horsepower,
          Body Press, Strength, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Earth Power, Iron Head, Metal Claw, Endeavor]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: Crysteel second evolution # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [height, weight, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles, level-up moves,
                     "TM/HM moves", tutor moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    height: 45
    weight: 55
    body color: 90
    catch rate: 60
    base exp: 85
    growth rate: 63
    base friendship: 90
    gender: 71
    egg groups: 48
    egg cycles: 65
    level-up moves: 55
    "TM/HM moves": 60
    tutor moves: 50
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/crystax/2128.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/crystax.json"
  cry: "assets/cries/crystax.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Sneasel     # the official Pokemon whose battle animation it borrows
