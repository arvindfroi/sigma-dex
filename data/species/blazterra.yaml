# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 9
name: Monarkhan

credits:
  designer: "Emil & Arvind" # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Fire, Flying]    # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Blaze
  secondary:             # optional
  hidden: No Guard       # optional

base_stats:              # each 1-255
  hp: 76
  attack: 80
  defense: 72
  sp_attack: 108
  sp_defense: 72
  speed: 122

ev_yield: {speed: 3}     # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 238            # exp yield when defeated, e.g. 64
growth_rate: medium_slow # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 87.5             # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field, dragon] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms:
  - name: Mega Monarkhan
    changes: battle
    abilities: {primary: No Guard}
    base_stats: {hp: 76, attack: 85, defense: 82, sp_attack: 138, sp_defense: 82, speed: 167}

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Heat Wave}
    - {level: 0, move: Air Slash}
    - {level: 1, move: Heat Wave}
    - {level: 1, move: Ember}
    - {level: 1, move: Growl}
    - {level: 1, move: Quick Attack}
    - {level: 1, move: Scratch}
    - {level: 10, move: Supersonic}
    - {level: 12, move: Dragon Breath}
    - {level: 12, move: Fury Swipes}
    - {level: 12, move: Gust}
    - {level: 15, move: Wing Attack}
    - {level: 19, move: Incinerate}
    - {level: 23, move: Slash}
    - {level: 24, move: Lava Plume}
    - {level: 27, move: Air Cutter}
    - {level: 27, move: Fire Fang}
    - {level: 29, move: Agility}
    - {level: 30, move: Flamethrower}
    - {level: 31, move: Flame Charge}
    - {level: 39, move: Scary Face}
    - {level: 40, move: Work Up}
    - {level: 43, move: Acrobatics}
    - {level: 46, move: Fire Spin}
    - {level: 48, move: Tailwind}
    - {level: 54, move: Inferno}
    - {level: 62, move: Fire Blast}
    - {level: 66, move: Roost}
    - {level: 75, move: Hurricane}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Roar, Toxic, Hidden Power, Sunny Day, Taunt, Hyper Beam, Protect,
          Rain Dance, Frustration, Solar Beam, Iron Tail, Return, Shadow Ball, Double Team,
          Flamethrower, Fire Blast, Aerial Ace, Facade, Secret Power, Rest, Attract, Thief,
          Steel Wing, Overheat, Roost, Focus Blast, Fling, Endure, Dragon Pulse,
          Will-O-Wisp, Shadow Claw, Giga Impact, Captivate, Rock Slide, Sleep Talk,
          Natural Gift, Swagger, U-turn, Substitute, Flame Charge, Mystical Fire,
          Dual Wingbeat, Scorching Sands, Cut, Fly, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Air Slash, Blast Burn, Body Slam, Brave Bird, Fire Fang, Fire Punch, Flare Blitz,
          Heat Wave, Hurricane, Sky Attack, Defog, Dragon Cheer]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: a body with one pair of wings
  movement: "It flies, flapping its wings."
  look: "It is a slender, bat-like dragon with red-orange scaly skin and a tan belly. It has two huge fire-patterned orange wings with yellow claws at the tips, large pointed ears with flames on top, a yellow crest on its head, two clawed legs and a long thin pointed tail."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/blazterra/1117.jpg"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:6"    # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
