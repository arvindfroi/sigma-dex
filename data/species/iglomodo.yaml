# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 77
name: Iglomodo

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ice, Poison]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Frost Arena    # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "It hunts in frozen wetlands and icy rivers, using its frost breath and venomous tongue to immobilize prey. When it feels safe or needs to conserve energy, it curls its body into an iglo, using its own icy scales as a protective shell."
height_m: 2.5            # e.g. 0.7
weight_kg: 280           # e.g. 6.9
body_color: blue         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Ice Body
  secondary: Merciless   # optional
  hidden: Ice Scales     # optional

base_stats:              # each 1-255
  hp: 85
  attack: 125
  defense: 70
  sp_attack: 85
  sp_defense: 100
  speed: 65

ev_yield: {attack: 2}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 60           # 3 (legendary) to 255 (very easy)
base_exp: 186            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral]    # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Icicle Crash}
    - {level: 1, move: Growl}
    - {level: 1, move: Ice Shard}
    - {level: 1, move: Leer}
    - {level: 1, move: Poison Sting}
    - {level: 1, move: Tackle}
    - {level: 8, move: Poison Fang}
    - {level: 9, move: Icy Wind}
    - {level: 14, move: Cross Poison}
    - {level: 17, move: Ice Fang}
    - {level: 20, move: Bite}
    - {level: 29, move: Toxic}
    - {level: 32, move: Poison Jab}
    - {level: 39, move: Crunch}
    - {level: 39, move: Slash}
    - {level: 39, move: Withdraw}
    - {level: 40, move: Blizzard}
    - {level: 42, move: Gunk Shot}
    - {level: 45, move: Ice Spinner}
    - {level: 49, move: Superpower}
    - {level: 54, move: Gunk Shot}
    - {level: 60, move: Baneful Bunker}
    - {level: 64, move: Haze}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hail, Hidden Power, Sunny Day, Taunt, Ice Beam, Blizzard, Hyper Beam,
          Protect, Rain Dance, Frustration, Earthquake, Return, Dig, Double Team,
          Sludge Bomb, Facade, Secret Power, Rest, Attract, Thief, Endure, Giga Impact,
          Avalanche, Captivate, Sleep Talk, Natural Gift, Poison Jab, Swagger, Substitute,
          Venoshock, Acid Spray, Bulldoze, Body Press]
  # moves a move tutor can teach it
  tutor: [Body Slam, Curse, Ice Fang, Icicle Spear, Icy Wind]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (SLOTHBABY, 2026-10-01): also on the card: Ice Scales is hidden ability; panels for Ice Shards, Frosty Breath, Venomous Tongue, Resting/Sleeping form and size comparison."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a long crocodile-like creature made of light-blue ice blocks, with a big domed igloo-shaped back, a long pointed tail and strong legs with dark claws. It has a long toothy snout, yellow eyes, ice crystals on its head, a purple underside and a long forked purple tongue."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/iglomodo/256.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:160"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
