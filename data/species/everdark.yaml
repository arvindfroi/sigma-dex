# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 133
name: Everdark

credits:
  designer: Ivar         # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Dark, Psychic]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 1.5            # e.g. 0.7
weight_kg: 55            # e.g. 6.9
body_color: red          # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Armor Tail
  secondary:             # optional
  hidden: Dark Aura      # optional

base_stats:              # each 1-255
  hp: 95
  attack: 145
  defense: 100
  sp_attack: 120
  sp_defense: 100
  speed: 120

ev_yield: {attack: 3}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 182            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [amorphous]  # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Nasty Plot}
    - {level: 1, move: Dark Pulse}
    - {level: 1, move: Psychic}
    - {level: 1, move: Swords Dance}
    - {level: 1, move: Knock Off}
    - {level: 1, move: Psycho Cut}
    - {level: 1, move: Leer}
    - {level: 10, move: Hone Claws}
    - {level: 18, move: Aerial Ace}
    - {level: 20, move: Taunt}
    - {level: 21, move: Slash}
    - {level: 22, move: Scary Face}
    - {level: 24, move: Protect}
    - {level: 28, move: Imprison}
    - {level: 30, move: Fury Swipes}
    - {level: 32, move: Agility}
    - {level: 37, move: Foul Play}
    - {level: 42, move: Sacred Sword}
    - {level: 49, move: Sucker Punch}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Toxic, Hidden Power, Sunny Day, Taunt, Hyper Beam, Light Screen,
          Protect, Rain Dance, Safeguard, Frustration, Return, Psychic, Shadow Ball,
          Brick Break, Double Team, Reflect, Rock Tomb, Aerial Ace, Torment, Facade,
          Secret Power, Rest, Attract, Thief, Skill Swap, Fling, Endure, Drain Punch,
          Shadow Claw, Payback, Giga Impact, Flash, Thunder Wave, Swords Dance, Psych Up,
          Dark Pulse, Rock Slide, X-Scissor, Sleep Talk, Natural Gift, Grass Knot, Swagger,
          U-turn, Substitute, Trick Room, Psyshock, Foul Play, Brutal Swing, Psychic Fangs,
          Body Press, Expanding Force, Cut, Rock Smash]
  # moves a move tutor can teach it
  tutor: [Body Slam, Close Combat, Nasty Plot, Snarl, Zen Headbutt, Night Slash]
  # only needed for the first stage of an evolution line
  egg: [Sucker Punch, Feint Attack, Mirror Coat, Pursuit, Future Sight]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes: "Its a fast frail mixed attacker. It gets both nasty plot and swords dance. When facing it, you are never sure if its running a physical, special or mixed set. Its move pool should be diverse, but mostly psychic and dark type moves"
  claude_fill: true      # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles, height, weight]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    level-up moves: 57
    "TM/HM moves": 62
    tutor moves: 52
    egg moves: 52
    body color: 80
    catch rate: 55
    base exp: 55
    growth rate: 55
    base friendship: 55
    gender: 55
    egg groups: 55
    egg cycles: 55
    height: 55
    weight: 55
  body_shape: an upright body on two legs with a tail
  movement: It walks upright on two legs.
  look: "It is a slender upright dark maroon creature with red glowing vein lines and grey-lavender armour plates. Its head has a yellow slit eye and a crown of tube-like red-ringed tendrils; its hands have large curved grey claws with yellow eyes in the palms, and it has a long segmented scorpion-like tail ending in a claw."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/everdark/626.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:461"  # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/everdark.json"
  cry: "assets/cries/everdark.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Mewtwo      # the official Pokemon whose battle animation it borrows
