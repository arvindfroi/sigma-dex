# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 4
name: Waffy

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Water]           # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Torrent
  secondary:             # optional
  hidden: Defiant        # optional

base_stats:              # each 1-255
  hp: 55
  attack: 65
  defense: 50
  sp_attack: 45
  sp_defense: 50
  speed: 55

ev_yield: {attack: 1}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: wealther
    method: level
    level: 16

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Tackle}
    - {level: 1, move: Growl}
    - {level: 4, move: Peck}
    - {level: 6, move: Water Gun}
    - {level: 7, move: Work Up}
    - {level: 10, move: Bite}
    - {level: 10, move: Scratch}
    - {level: 10, move: Tail Whip}
    - {level: 10, move: Quick Attack}
    - {level: 12, move: Protect}
    - {level: 14, move: Aqua Jet}
    - {level: 17, move: Double Hit}
    - {level: 19, move: Slash}
    - {level: 21, move: Aqua Cutter}
    - {level: 28, move: Focus Energy}
    - {level: 30, move: Aqua Tail}
    - {level: 35, move: Liquidation}
    - {level: 39, move: Wave Crash}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hail, Hidden Power, Ice Beam, Protect, Rain Dance,
          Frustration, Return, Dig, Double Team, Facade, Secret Power, Rest, Attract,
          Endure, Captivate, Sleep Talk, Natural Gift, Swagger, Substitute, Scald,
          Liquidation, Flip Turn, Surf, Whirlpool, Waterfall]
  tutor: [Aqua Tail, Body Slam] # moves a move tutor can teach it
  # only needed for the first stage of an evolution line
  egg: [Double-Edge, Counter, Mud Sport]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: DRAFT level-up moves added by Claude on 2026-10-03 so the starter can be tested in the game - replace them with the real ones.
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves]
  body_shape: a quadruped body # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a small platypus-like creature with deep blue feathers, a small tuft on its head, a big yellow duck bill, and a white round belly. It has short legs with black webbed claws and a flat black beaver-like tail with a grid pattern."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/waffy/336.webp"
  front_sprite: "assets/sprites/waffy/front.png"
  front_anim: "assets/sprites/waffy/anim_front.png"
  back_sprite: "assets/sprites/waffy/back.png"
  icon: "assets/sprites/waffy/icon.png" # icon.png       32x64, two frames stacked
  footprint: "hgss:258"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset: 12     # pixels the front sprite is moved down
  back_y_offset: 10      # pixels the back sprite is moved down
  icon_palette: 3        # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
