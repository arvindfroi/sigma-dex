# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 138
name: Wreckingboo

credits:
  designer: Ruben        # who came up with it (Discord name)
  artist: Ruben          # who drew the concept art

types: [Water]           # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 1              # e.g. 0.7
weight_kg: 35            # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Lightning Rod
  secondary: Glowing Lure # optional
  hidden: Marvel Scale   # optional

base_stats:              # each 1-255
  hp: 55
  attack: 75
  defense: 90
  sp_attack: 40
  sp_defense: 55
  speed: 25

ev_yield: {attack: 1, defense: 2} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: wreckingdrake
    method: trade_item
    item: Dragon Scale

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Leer}
    - {level: 1, move: Scratch}
    - {level: 1, move: Water Gun}
    - {level: 1, move: Tackle}
    - {level: 4, move: Withdraw}
    - {level: 10, move: Bubble Beam}
    - {level: 10, move: Supersonic}
    - {level: 15, move: Aqua Jet}
    - {level: 15, move: Bite}
    - {level: 18, move: Protect}
    - {level: 19, move: Bubble}
    - {level: 19, move: Spike Cannon}
    - {level: 20, move: Aqua Cutter}
    - {level: 24, move: Razor Shell}
    - {level: 25, move: Scary Face}
    - {level: 29, move: Flail}
    - {level: 33, move: Rain Dance}
    - {level: 34, move: Ice Fang}
    - {level: 34, move: Spikes}
    - {level: 34, move: Toxic Spikes}
    - {level: 40, move: Crunch}
    - {level: 41, move: Aqua Tail}
    - {level: 46, move: Slash}
    - {level: 50, move: Wave Crash}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hail, Hidden Power, Ice Beam, Blizzard, Protect, Rain Dance,
          Frustration, Iron Tail, Return, Dig, Brick Break, Double Team, Rock Tomb, Facade,
          Secret Power, Rest, Attract, Fling, Endure, Captivate, Sleep Talk, Natural Gift,
          Swagger, Substitute, Scald, Liquidation, Flip Turn, Surf, Strength, Whirlpool,
          Rock Smash, Waterfall, Brine]
  # moves a move tutor can teach it
  tutor: [Aqua Tail, Body Slam, Ice Punch, Icy Wind, Power-Up Punch]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: Wrecking is the a pokemon. It lives on the surface of the water because it cant breathe under. Tries to lure its pray in with the smily face on its forhead
  name_origin:
  notes:
  wishes: Bulky Physical attacker.  Ability Rough skin.
  claude_fill: true      # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, height, weight, level-up moves,
                     "TM/HM moves", tutor moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    height: 65
    weight: 65
    level-up moves: 61
    "TM/HM moves": 66
    tutor moves: 56
  body_shape: a body with fins # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement: "It floats in the air, swimming with its fins."
  look: "It is a round spiky creature with a body split in a zigzag between dark blue-purple and crimson, ringed with white spikes. It has one red eye and one blue eye, a wide mouth full of sharp white teeth, and five small green clawed hands on its body. Two long crimson blue-spotted fins stick out from its sides, and a green stalk on top ends in a yellow smiley-faced lure."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/wreckingboo/1098.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
