# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 199
name: Cindreon

credits:
  designer: Casper       # who came up with it (Discord name)
  artist: Casper         # who drew the concept art

types: [Fire, Rock]      # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Lion           # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "Heat builds deep within Cindreon’s stone-armored shoulders. When threatened, it rises onto its hind legs and releases twin streams of flame from its kilns. The rocks along its back remain warm long after sunset. Master of fire and roasting unsuspecting prey. Freakishly sneaky."
height_m: 1.5            # e.g. 0.7
weight_kg: 100           # e.g. 6.9
body_color: yellow       # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Flash Fire
  secondary:             # optional
  hidden: Intimidate     # optional

base_stats:              # each 1-255
  hp: 65
  attack: 80
  defense: 85
  sp_attack: 65
  sp_defense: 50
  speed: 45

ev_yield:                # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral, undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Flamethrower}
    - {level: 0, move: Rock Slide}
    - {level: 1, move: Ember}
    - {level: 1, move: Harden}
    - {level: 1, move: Rock Tomb}
    - {level: 1, move: Tackle}
    - {level: 6, move: Bite}
    - {level: 9, move: Smack Down}
    - {level: 10, move: Fire Fang}
    - {level: 12, move: Roar}
    - {level: 16, move: Headbutt}
    - {level: 20, move: Protect}
    - {level: 30, move: Stone Edge}
    - {level: 40, move: Take Down}
    - {level: 52, move: Flame Wheel}
    - {level: 52, move: Rock Blast}
    - {level: 58, move: Iron Defense}
    - {level: 70, move: Double-Edge}
    - {level: 76, move: Fire Spin}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Hidden Power, Sunny Day, Protect, Rain Dance, Iron Tail, Earthquake, Return, Dig,
          Double Team, Flamethrower, Sandstorm, Fire Blast, Rock Tomb, Facade, Rest,
          Attract, Overheat, Endure, Will-O-Wisp, Rock Polish, Stone Edge, Stealth Rock,
          Rock Slide, Sleep Talk, Swagger, Substitute, Heavy Slam, Flame Charge, Bulldoze,
          Body Press, Meteor Beam, Strength, Rock Smash, Roar]
  # moves a move tutor can teach it
  tutor: [Ancient Power, Body Slam, Curse, Earth Power, Endeavor, Fire Punch, Flare Blitz,
          Heat Wave, Iron Head]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: "Cindreon is a Fire/Rock-type lion Pokémon that evolves from Santrock. Its rocky armor protects it in battle, while furnace-like openings in its shoulders unleash powerful streams of fire."
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [level-up moves, "TM/HM moves", tutor moves]
  body_shape: an upright body on two legs with a tail
  movement: It walks on four legs. # e.g. It walks on four legs. / It floats in the air.
  look: "Cindreon is a muscular, sand-gold lion with a short red-orange mane and a flame-tipped tail. Large rocky plates cover its shoulders, each with a glowing furnace opening. Smaller stones run along its back and protect its legs, giving it a rugged, armored appearance."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/cindreon/1544.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
