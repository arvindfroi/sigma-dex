# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 160
name: Whaldrill

credits:
  designer: Emil         # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ice, Ground]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: brown        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Slush Rush
  secondary: Sand Rush   # optional
  hidden: Thick Fat      # optional

base_stats:              # each 1-255
  hp: 125
  attack: 125
  defense: 95
  sp_attack: 60
  sp_defense: 80
  speed: 45

ev_yield: {hp: 2, attack: 1} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 239            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [field]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Double Hit}
    - {level: 1, move: Flail}
    - {level: 1, move: Ice Fang}
    - {level: 1, move: Mud-Slap}
    - {level: 1, move: Powder Snow}
    - {level: 1, move: Tackle}
    - {level: 12, move: Bulldoze}
    - {level: 13, move: Rollout}
    - {level: 15, move: Ice Shard}
    - {level: 15, move: Freeze-Dry}
    - {level: 20, move: Mist}
    - {level: 24, move: Stomping Tantrum}
    - {level: 25, move: Endure}
    - {level: 30, move: Icy Wind}
    - {level: 35, move: Dig}
    - {level: 35, move: Drill Run}
    - {level: 37, move: Amnesia}
    - {level: 40, move: Icicle Crash}
    - {level: 44, move: Body Slam}
    - {level: 51, move: Earthquake}
    - {level: 54, move: Ice Spinner}
    - {level: 58, move: Blizzard}
    - {level: 62, move: Headlong Rush}
    - {level: 65, move: Thrash}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hail, Hidden Power, Sunny Day, Ice Beam, Blizzard, Hyper Beam,
          Light Screen, Protect, Rain Dance, Frustration, Earthquake, Return, Dig,
          Double Team, Reflect, Sandstorm, Rock Tomb, Facade, Secret Power, Rest, Attract,
          Endure, Giga Impact, Stone Edge, Avalanche, Swords Dance, Stealth Rock, Captivate,
          Rock Slide, Sleep Talk, Natural Gift, Swagger, Substitute, Heavy Slam, Bulldoze,
          Play Rough, High Horsepower, Liquidation, Body Press, Flip Turn, Surf, Strength,
          Rock Smash, Waterfall]
  # moves a move tutor can teach it
  tutor: [Body Slam, Charm, Curse, Earth Power, Endeavor, Ice Fang, Ice Punch, Icicle Spear,
          Icy Wind, Iron Head, Ancient Power, Haze, Dive]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [level-up moves, "TM/HM moves", tutor moves, body color, catch rate,
                     base exp, growth rate, base friendship, gender, egg groups, egg cycles]
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/whaldrill3/1580.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette: "assets/shiny/whaldrill3.json"
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
