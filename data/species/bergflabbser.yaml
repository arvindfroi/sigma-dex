    - {level: 35, move: Thrash}
    - {level: 36, move: Hammer Arm}
    - {level: 45, move: Crunch}
    - {level: 49, move: Earthquake}
    - {level: 62, move: Rain Dance}
    - {level: 72, move: Wave Crash}
