# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 149
name: Bergflabbser

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Water, Ground]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Fjellfisk      # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "Bergflabbser is a rare Pokémon that dwells in the fjords of Bergen. The seven mountains on its back form a living ecosystem, and the Ulriken pillar serves as its guiding beacon. It summons rain with its Drizzle and moves silently through the deep, using its wide mouth to catch prey."
height_m: 2.4            # e.g. 0.7
weight_kg: 285           # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Drizzle
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 150
  attack: 130
  defense: 130
  sp_attack: 110
  sp_defense: 110
  speed: 50

ev_yield:                # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Moves ---
learnset:
  level_up: []           # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  tm_hm: []              # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tutor: []              # moves a move tutor can teach it
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept: "Legendary concept: a giant fish carrying Bergen's seven mountains, Bryggen and the Ulriken tower on its back."
  name_origin:
  notes: "From Discord (#official-sigma-pokedex, Slothbaby, 29 Sep 2026, \"Legendary konsept\"): sketch and concept card. The card numbers it Nr. 1027; in our dex it is #99."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  filled_by_claude: []   # fields Claude filled in (people can change them)

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/bergflabbser/4.png"
  front_sprite: "assets/sprites/bergflabbser/front.png"
  front_anim: "assets/sprites/bergflabbser/anim_front.png"
  back_sprite: "assets/sprites/bergflabbser/back.png"
  icon: "assets/sprites/bergflabbser/icon.png"
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset: 8      # pixels the front sprite is moved down
  back_y_offset: 10      # pixels the back sprite is moved down
  icon_palette: 5        # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
