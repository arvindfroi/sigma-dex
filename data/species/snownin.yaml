# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 85
name: Snownin

credits:
  designer: Arvind       # who came up with it (Discord name)
  artist: Arvind         # who drew the concept art

types: [Ice, Ghost]      # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: white        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Snow Warning
  secondary: Snow Cloak  # optional
  hidden: Levitate       # optional

base_stats:              # each 1-255
  hp: 60
  attack: 75
  defense: 40
  sp_attack: 135
  sp_defense: 40
  speed: 125

ev_yield: {sp_attack: 2} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 75           # 3 (legendary) to 255 (very easy)
base_exp: 166            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [amorphous]  # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Aurora Veil}
    - {level: 1, move: Leer}
    - {level: 1, move: Powder Snow}
    - {level: 1, move: Protect}
    - {level: 8, move: Astonish}
    - {level: 12, move: Mist}
    - {level: 15, move: Ice Shard}
    - {level: 16, move: Spite}
    - {level: 20, move: Curse}
    - {level: 20, move: Draining Kiss}
    - {level: 24, move: Hex}
    - {level: 25, move: Icy Wind}
    - {level: 30, move: Aurora Beam}
    - {level: 30, move: Night Shade}
    - {level: 35, move: Confuse Ray}
    - {level: 36, move: Freeze-Dry}
    - {level: 40, move: Snowscape}
    - {level: 44, move: Ice Beam}
    - {level: 47, move: Will-O-Wisp}
    - {level: 61, move: Shadow Ball}
    - {level: 68, move: Blizzard}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hail, Hidden Power, Sunny Day, Taunt, Ice Beam, Blizzard,
          Hyper Beam, Light Screen, Protect, Rain Dance, Safeguard, Frustration,
          Thunderbolt, Thunder, Return, Psychic, Shadow Ball, Double Team, Reflect, Torment,
          Facade, Secret Power, Rest, Attract, Snatch, Fling, Endure, Will-O-Wisp, Embargo,
          Payback, Giga Impact, Flash, Avalanche, Thunder Wave, Psych Up, Captivate,
          Sleep Talk, Natural Gift, Swagger, Substitute, Aurora Veil, Triple Axel,
          Focus Blast, Energy Ball]
  # moves a move tutor can teach it
  tutor: [Body Slam, Charm, Curse, Haze, Ice Fang, Icicle Spear, Icy Wind, Poltergeist,
          Weather Ball, Nasty Plot]
  # only needed for the first stage of an evolution line
  egg: [Frost Breath, Grudge, Shadow Sneak, Icicle Crash]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a head and a base # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a ghost-like creature draped in a large white and pale blue cloak shaped like a snow mound, with a pointed brown straw hat topped with snow and icicles on the brim. It has a dark shadowed face, a glowing blue emblem near its face, and a white gloved hand floating separate from the cloak."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/snownin/621.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:478"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
