# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 73
name: Roostasaur

credits:
  designer:              # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Dragon, Normal]  # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m: 1.5            # e.g. 0.7
weight_kg: 40            # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Big Pecks
  secondary: Super Luck  # optional
  hidden: Hustle         # optional

base_stats:              # each 1-255
  hp: 85
  attack: 120
  defense: 70
  sp_attack: 60
  sp_defense: 65
  speed: 100

ev_yield: {attack: 2}    # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Growl}
    - {level: 1, move: Leer}
    - {level: 1, move: Scratch}
    - {level: 1, move: Tackle}
    - {level: 6, move: Quick Attack}
    - {level: 12, move: Taunt}
    - {level: 12, move: Peck}
    - {level: 14, move: Breaking Swipe}
    - {level: 16, move: Wing Attack}
    - {level: 21, move: Slash}
    - {level: 22, move: Bite}
    - {level: 35, move: Take Down}
    - {level: 36, move: Dragon Claw}
    - {level: 40, move: Body Slam}
    - {level: 45, move: Dragon Rush}
    - {level: 48, move: Outrage}
    - {level: 50, move: Thrash}
    - {level: 51, move: Double-Edge}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Dragon Claw, Toxic, Hidden Power, Sunny Day, Taunt, Hyper Beam, Protect,
          Rain Dance, Frustration, Return, Brick Break, Double Team, Aerial Ace, Facade,
          Secret Power, Rest, Attract, Thief, Endure, Dragon Pulse, Shadow Claw,
          Giga Impact, Sleep Talk, Natural Gift, Swagger, U-turn, Substitute, Cut, Strength,
          Fire Blast, Flamethrower, Fly, Roost]
  # moves a move tutor can teach it
  tutor: [Body Slam, Close Combat, Draco Meteor, Endeavor, Fire Fang, Fire Punch,
          Hyper Voice, Iron Head, Outrage, Zen Headbutt]
  # only needed for the first stage of an evolution line
  egg: [Endeavor, Flail, Fury Swipes, Crush Claw]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, height, weight, level-up moves,
                     "TM/HM moves", tutor moves, egg moves]
  claude_sure:             # how sure Claude is about each field it filled in, 0-100 (docs/DEX_DATA.md#letting-claude-fill-in-a-pokemon)
    body shape: 80
    look: 80
    movement: 80
    height: 65
    weight: 65
    level-up moves: 59
    "TM/HM moves": 64
    tutor moves: 54
    egg moves: 54
  body_shape: an upright body on two legs with a tail
  movement: It walks upright on two legs.
  look: "It is a white rooster-like bird standing upright, with a red comb, yellow beak and yellow clawed feet. It has two raised bone arms, each coming out of a giant brown drumstick-shaped lump on its shoulder, lavender shading along its back and a long tapering lavender tail with red spikes. In flight it spreads feathered wings and flames burst from the drumsticks."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/roostasaur/291.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:257"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
