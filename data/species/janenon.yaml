# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 66
name: Janenon

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Dark, Fairy]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Cursed Cannon  # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "It's said that when it fires its cannon, the sound is like the curse a thousand spirits let loose in a single scream."
height_m: 1.8            # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: blue         # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Tangling Hair
  secondary: Mega Launcher # optional
  hidden: Misty Surge    # optional

base_stats:              # each 1-255
  hp: 41
  attack: 67
  defense: 100
  sp_attack: 167
  sp_defense: 85
  speed: 25

ev_yield: {sp_attack: 3} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 60           # 3 (legendary) to 255 (very easy)
base_exp: 170            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [fairy]      # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 0, move: Dark Pulse}
    - {level: 1, move: Dark Pulse}
    - {level: 1, move: Charm}
    - {level: 1, move: Disarming Voice}
    - {level: 1, move: Growl}
    - {level: 1, move: Heal Pulse}
    - {level: 6, move: Confuse Ray}
    - {level: 8, move: Snarl}
    - {level: 10, move: Sweet Scent}
    - {level: 15, move: Draining Kiss}
    - {level: 15, move: Fake Tears}
    - {level: 17, move: Fairy Wind}
    - {level: 17, move: Hex}
    - {level: 20, move: Protect}
    - {level: 24, move: Sucker Punch}
    - {level: 35, move: Dazzling Gleam}
    - {level: 35, move: Misty Terrain}
    - {level: 40, move: Nasty Plot}
    - {level: 40, move: Recover}
    - {level: 45, move: Moonblast}
    - {level: 48, move: Aura Sphere}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Toxic, Hidden Power, Sunny Day, Taunt, Hyper Beam, Light Screen,
          Protect, Rain Dance, Safeguard, Frustration, Return, Psychic, Shadow Ball,
          Double Team, Reflect, Facade, Secret Power, Rest, Attract, Thief, Energy Ball,
          Fling, Endure, Payback, Giga Impact, Psych Up, Dark Pulse, Sleep Talk, Swagger,
          Substitute, Trick Room, Psyshock, Foul Play, Draining Kiss, Misty Terrain,
          Play Rough, Solar Beam, Flash Cannon]
  # moves a move tutor can teach it
  tutor: [Body Slam, Charm, Dazzling Gleam, Nasty Plot, Snarl, Hyper Voice, Curse]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (SLOTHBABY, 2026-05-07): evolution on the card: ??? -> (Lv. 24) ??? -> (Lv. 48) Janenon; also on the card: Height 5'11\", weight 143 lbs; signature move Hex Burst; role Trick Room Sweeper."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: a head and legs # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It walks on its legs. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a huge mass of dark navy, wavy hair that curls over a small purple creature with pointed ears sitting inside. The hair forms a long cannon-like tube with a glowing pink-white opening at the front, and two rounded dark lumps at the bottom serve as feet."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/janenon/259.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:40"   # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
