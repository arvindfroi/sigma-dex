# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 59
name: Hairyen

credits:
  designer: Magnus       # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Grass, Water]    # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Ambush         # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "It hides in marshes beneath curtains of swamp grass. In heavy rain, it sinks low into the water, causing attacks from above to pass harmlessly by."
height_m: 0.6            # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: brown        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Diver
  secondary: Tangling Hair # optional
  hidden: Rain Dish      # optional

base_stats:              # each 1-255
  hp: 45
  attack: 46
  defense: 90
  sp_attack: 34
  sp_defense: 80
  speed: 15

ev_yield: {defense: 1}   # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 190          # 3 (legendary) to 255 (very easy)
base_exp: 62             # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral, field] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: panzerien
    method: trade_item
    item: Metal Coat
    note: "Link found from the group's cards, art and names on 8 Nov 2026; how it evolves is not decided yet."

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Absorb}
    - {level: 1, move: Tackle}
    - {level: 4, move: Withdraw}
    - {level: 6, move: Razor Leaf}
    - {level: 10, move: Mud-Slap}
    - {level: 12, move: Mega Drain}
    - {level: 12, move: Mud Shot}
    - {level: 15, move: Aqua Cutter}
    - {level: 23, move: Leech Seed}
    - {level: 24, move: Giga Drain}
    - {level: 25, move: Rain Dance}
    - {level: 30, move: Curse}
    - {level: 32, move: Seed Bomb}
    - {level: 35, move: Horn Leech}
    - {level: 35, move: Iron Defense}
    - {level: 40, move: Leaf Blade}
    - {level: 41, move: Energy Ball}
    - {level: 48, move: Crabhammer}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Toxic, Hail, Bullet Seed, Hidden Power, Sunny Day, Ice Beam,
          Blizzard, Rain Dance, Giga Drain, Frustration, Solar Beam, Return, Double Team,
          Sludge Bomb, Facade, Secret Power, Rest, Attract, Energy Ball, Brine, Flash,
          Captivate, Sleep Talk, Natural Gift, Grass Knot, Swagger, Substitute, Scald,
          Grassy Terrain, Liquidation, Surf, Whirlpool, Waterfall]
  # moves a move tutor can teach it
  tutor: [Aqua Tail, Body Slam, Icy Wind, Leaf Storm, Magical Leaf, Seed Bomb, Synthesis,
          Yawn]
  # only needed for the first stage of an evolution line
  egg: [Leaf Storm, Magical Leaf, Aqua Tail, Slam, Worry Seed, Vine Whip, Grass Whistle,
        Bubble Beam, Stockpile]

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (BUST, 2026-05-02): also on the card: Diver: Can't be hit by Flying-type moves in rain. Habitat: Swamps, Marshes. Flavor: It lies motionless for days, letting swamp grass grow over it. Those who know the marshes step carefully. Size comparison with a 1.2 m human silhouette.."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     egg moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: a head and a base # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It crawls along the ground on its legs.
  look: "It is a low, round, dome-shaped creature with a brown cracked shell-like top, half sunk in water. Long curtains of green swamp grass hang over both sides, and two sleepy cream-coloured eyes peek out from the dark gap under the dome."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/hairyen/242.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:114"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
