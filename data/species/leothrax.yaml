# Sigma Dex species file. What every field means: docs/DEX_DATA.md#field-guide
dex: 193
name: Leothrax

credits:
  designer: Ludvig       # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ice, Dragon]     # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color:              # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Arctic Swimmer
  secondary: Marvel Scale # optional
  hidden: Thick Fat      # optional

base_stats:              # each 1-255
  hp: 95
  attack: 70
  defense: 72
  sp_attack: 125
  sp_defense: 88
  speed: 80

ev_yield: {sp_attack: 3} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate:              # 3 (legendary) to 255 (very easy)
base_exp:                # exp yield when defeated, e.g. 64
growth_rate:             # erratic fast medium_fast medium_slow slow fluctuating
base_friendship:         # 70 is the standard value

# --- Breeding ---
gender:                  # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: []           # 1 or 2, e.g. [field, grass]
egg_cycles:              # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/DEX_DATA.md#field-guide
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Copycat}
    - {level: 1, move: Growl}
    - {level: 1, move: Helping Hand}
    - {level: 1, move: Powder Snow}
    - {level: 12, move: Icy Wind}
    - {level: 12, move: Mist}
    - {level: 17, move: Dragon Breath}
    - {level: 20, move: Twister}
    - {level: 24, move: Aurora Beam}
    - {level: 30, move: Chilling Water}
    - {level: 35, move: Dragon Pulse}
    - {level: 36, move: Flip Turn}
    - {level: 40, move: Freeze-Dry}
    - {level: 42, move: Nasty Plot}
    - {level: 44, move: Ice Beam}
    - {level: 45, move: Mirror Coat}
    - {level: 48, move: Hydro Pump}
    - {level: 52, move: Blizzard}
    - {level: 58, move: Draco Meteor}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Water Pulse, Roar, Toxic, Hail, Hidden Power, Sunny Day, Taunt, Ice Beam,
          Blizzard, Hyper Beam, Light Screen, Protect, Rain Dance, Frustration, Iron Tail,
          Return, Shadow Ball, Double Team, Facade, Secret Power, Rest, Attract,
          Focus Blast, Endure, Dragon Pulse, Giga Impact, Avalanche, Dark Pulse, Sleep Talk,
          Swagger, Substitute, Play Rough, Psychic Fangs, Liquidation, Flip Turn, Surf,
          Whirlpool, Waterfall]
  # moves a move tutor can teach it
  tutor: [Body Slam, Draco Meteor, Dragon Dance, Heat Wave, Hyper Voice, Icicle Spear,
          Icy Wind, Outrage, Aqua Jet, Chilling Water, Water Pledge, Hydro Cannon,
          Glaive Rush]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  filled_by_claude: []   # fields Claude filled in (people can change them)
  body_shape:            # for the sprite studio, e.g. a quadruped body (docs/ART.md#the-sprite-studio)
  movement:              # e.g. It walks on four legs. / It floats in the air.
  look:                  # what it looks like, a few plain sentences: It is a ...

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/leothrax/6031.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint:             # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry: "assets/cries/leothrax.json" # sound file

# --- Game engine details (only matter once sprites exist, see docs/GAME_TECH.md#the-game-we-build-on) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
  anim_from: Walrein     # the official Pokemon whose battle animation it borrows
