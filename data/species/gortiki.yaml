# --- Pokedex page ---
category: Tiki Gorilla   # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "A powerful Pokémon that leads its tribe with fiery passion. Gortiki’s burning torch can incinerate thick trees in an instant. It performs intense dances to inspire allies and intimidate foes. When its flames die down, it retreats to the jungle to meditate and rekindle its inner fire."
