# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 134
name: Seraphinnen

credits:
  designer: Magnus       # who came up with it (Discord name)
  artist: Magnus         # who drew the concept art

types: [Flying]          # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category:                # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description:             # the Pokedex entry text: max 4 lines of about 40 characters
height_m:                # e.g. 0.7
weight_kg:               # e.g. 6.9
body_color: yellow       # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Soul-Heart
  secondary: Mind's Eye  # optional
  hidden: Aerilate       # optional

base_stats:              # each 1-255
  hp: 81
  attack: 60
  defense: 79
  sp_attack: 125
  sp_defense: 100
  speed: 95

ev_yield: {sp_attack: 3} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 45           # 3 (legendary) to 255 (very easy)
base_exp: 189            # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [flying, fairy] # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Air Slash}
    - {level: 1, move: Growl}
    - {level: 1, move: Gust}
    - {level: 1, move: Supersonic}
    - {level: 1, move: Wish}
    - {level: 1, move: Tackle}
    - {level: 6, move: Quick Attack}
    - {level: 10, move: Confusion}
    - {level: 12, move: Whirlwind}
    - {level: 15, move: Air Cutter}
    - {level: 16, move: Wing Attack}
    - {level: 17, move: Screech}
    - {level: 19, move: Roost}
    - {level: 23, move: Tailwind}
    - {level: 28, move: Hurricane}
    - {level: 31, move: Agility}
    - {level: 36, move: Giga Drain}
    - {level: 37, move: Safeguard}
    - {level: 41, move: Brave Bird}
    - {level: 43, move: Esper Wing}
    - {level: 46, move: Fly}
    - {level: 50, move: Heal Pulse}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hidden Power, Sunny Day, Hyper Beam, Protect, Rain Dance, Giga Drain,
          Frustration, Solar Beam, Return, Psychic, Shadow Ball, Double Team, Aerial Ace,
          Facade, Secret Power, Rest, Attract, Thief, Steel Wing, Roost, Endure,
          Giga Impact, Flash, Psych Up, Captivate, Sleep Talk, Natural Gift, Swagger,
          U-turn, Substitute, Dual Wingbeat, Fly, Pluck, Calm Mind]
  # moves a move tutor can teach it
  tutor: [Air Slash, Brave Bird, Heat Wave, Hurricane, Icy Wind, Sky Attack, Extrasensory,
          Dazzling Gleam]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes:
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: a body with two or more pairs of wings
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a floating golden ring with a row of small open eyes set around its rim, and a cream dove-shaped mark in the middle of the ring. Two pairs of white feathered wings, four in all, spread out from its sides, with a soft golden glow around it."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/seraphinnen/977.png"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:468"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
