# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 61
name: Nucloid

credits:
  designer: Magnus       # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Poison, Steel]   # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Nano Waste     # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "It stores unstable waste in its core. When alarmed, it releases toxic fumes and skitters away on cable-like legs."
height_m: 0.5            # e.g. 0.7
weight_kg: 12.3          # e.g. 6.9
body_color: black        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Innards Out
  secondary: Corrosion   # optional
  hidden: Run Away       # optional

base_stats:              # each 1-255
  hp: 35
  attack: 25
  defense: 60
  sp_attack: 40
  sp_defense: 78
  speed: 67

ev_yield: {defense: 1}   # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 190          # 3 (legendary) to 255 (very easy)
base_exp: 61             # exp yield when defeated, e.g. 64
growth_rate: medium_fast # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 70      # 70 is the standard value

# --- Breeding ---
gender: 50               # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [mineral]    # 1 or 2, e.g. [field, grass]
egg_cycles: 20           # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions:
  - into: nuclobyl
    method: level
    level: 40
    note: "Link found from the group's cards, art and names on 8 Nov 2026; how it evolves is not decided yet."

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: Poison Gas}
    - {level: 1, move: Tackle}
    - {level: 4, move: Acid}
    - {level: 4, move: Smog}
    - {level: 7, move: Acid Spray}
    - {level: 17, move: Toxic Spikes}
    - {level: 20, move: Sludge}
    - {level: 24, move: Poison Jab}
    - {level: 28, move: Flash Cannon}
    - {level: 30, move: Sludge Bomb}
    - {level: 31, move: Venoshock}
    - {level: 33, move: Toxic}
    - {level: 35, move: Iron Defense}
    - {level: 37, move: Belch}
    - {level: 43, move: Gunk Shot}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Toxic, Hidden Power, Sunny Day, Protect, Rain Dance, Frustration, Return,
          Double Team, Sludge Bomb, Facade, Secret Power, Rest, Attract, Thief, Endure,
          Payback, Thunder Wave, Gyro Ball, Stealth Rock, Captivate, Sleep Talk,
          Natural Gift, Poison Jab, Swagger, Substitute, Flash Cannon, Venoshock,
          Heavy Slam, Acid Spray]
  # moves a move tutor can teach it
  tutor: [Body Slam, Iron Head, Metal Claw]
  egg: [Clear Smog, Haze, Curse] # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (BUST, 2026-05-07): card name: Nucleoid; also on the card: It is composed of recycled alloys and unknown organic matter.."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", egg moves,
                     tutor moves, body color, catch rate, base exp, growth rate,
                     base friendship, gender, egg groups, egg cycles]
  body_shape: tentacles or many legs # for the sprite studio, e.g. a quadruped body (docs/STUDIO.md)
  movement: It crawls along the ground on its many legs.
  look: "It is a dark grey metal barrel-shaped creature with a domed top, a single glowing green eye and a yellow warning triangle. It has a window showing glowing green liquid in front, and eight black cable-like legs underneath, with green toxic drips and gas puffs around it."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/nucloid/279.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:345"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
