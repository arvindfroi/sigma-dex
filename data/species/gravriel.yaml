# Sigma Dex species file. What every field means: docs/FIELDS.md
dex: 145
name: Gravriel

credits:
  designer: Emil Venge-Kvamme # who came up with it (Discord name)
  artist:                # who drew the concept art

types: [Ghost, Grass]    # 1 or 2 types, e.g. [Grass, Steel]

# --- Pokedex page ---
category: Ghost Ship     # e.g. Seed  (shown in game as "Seed Pokemon"), max 12 characters
description: "Long ago, Gravriel was the first mate of a cruel pirate. After betrayal, he was cast into the ocean, left to rot with his ship. Now, he haunts the seabed, seeking those who dare to steal from the deep."
height_m: 2.1            # e.g. 0.7
weight_kg: 78.6          # e.g. 6.9
body_color: black        # red blue yellow green black brown purple gray white pink

# --- Battle data ---
abilities:
  primary: Sea Ghost Emperor
  secondary:             # optional
  hidden:                # optional

base_stats:              # each 1-255
  hp: 89
  attack: 181
  defense: 104
  sp_attack: 181
  sp_defense: 104
  speed: 21

ev_yield: {attack: 1, sp_attack: 1} # EVs given when defeated, 1-3 points total, e.g. {speed: 1}
catch_rate: 3            # 3 (legendary) to 255 (very easy)
base_exp: 261            # exp yield when defeated, e.g. 64
growth_rate: slow        # erratic fast medium_fast medium_slow slow fluctuating
base_friendship: 0       # 70 is the standard value

# --- Breeding ---
gender: genderless       # percent male: 0, 12.5, 25, 50, 75, 87.5, 100 - or genderless
egg_groups: [undiscovered] # 1 or 2, e.g. [field, grass]
egg_cycles: 120          # hatch time, 20 is typical

held_items:              # items wild ones can hold (optional)
  common:
  rare:

# --- Evolution: what THIS Pokemon evolves INTO ---
evolutions: []
# evolutions:
#   - into: leafsteel    # file name of the target, without .yaml
#     method: level      # level | item | trade | friendship | ... full list in docs/FIELDS.md
#     level: 16          # for method: level
#     item:              # for method: item, e.g. Thunder Stone
#     note:              # anything else worth knowing

# --- Forms: other forms of this Pokemon (only what differs from the normal form) ---
forms: []
# forms:
#   - name: Winter form    # what the form is called
#     changes: looks       # looks = only its pictures | battle = its type, stats or ability too
#     how: It turns white when it snows.   # how and when it changes form
#     types: [Ice]         # only if they differ
#     look: It is white with ...           # what it looks like in this form

# --- Moves ---
learnset:
  # e.g. [{level: 1, move: Tackle}, {level: 7, move: Vine Whip}]; level 0 = learned when evolving into this Pokemon
  level_up:
    - {level: 1, move: "Gravirel’s Curse"}
    - {level: 1, move: Soul Slash}
    - {level: 1, move: Astonish}
    - {level: 1, move: Shadow Sneak}
    - {level: 8, move: Razor Leaf}
    - {level: 12, move: Ancient Power}
    - {level: 12, move: Mega Drain}
    - {level: 16, move: Growth}
    - {level: 16, move: Slash}
    - {level: 19, move: Magical Leaf}
    - {level: 30, move: Giga Drain}
    - {level: 32, move: Slam}
    - {level: 35, move: Leaf Blade}
    - {level: 35, move: Phantom Force}
    - {level: 45, move: Shadow Ball}
    - {level: 45, move: Swords Dance}
    - {level: 50, move: Nasty Plot}
    - {level: 56, move: Energy Ball}
    - {level: 61, move: Wood Hammer}
    - {level: 65, move: Solar Beam}
    - {level: 68, move: Solar Blade}
    - {level: 72, move: Poltergeist}
    - {level: 85, move: Hex}
  # e.g. [Cut, Solar Beam] - only the game's TMs and HMs
  tm_hm: [Calm Mind, Toxic, Bullet Seed, Hidden Power, Sunny Day, Hyper Beam, Light Screen,
          Protect, Rain Dance, Giga Drain, Safeguard, Frustration, Solar Beam, Return,
          Psychic, Shadow Ball, Brick Break, Double Team, Aerial Ace, Facade, Secret Power,
          Rest, Thief, Energy Ball, Fling, Endure, Shadow Claw, Giga Impact, Swords Dance,
          Psych Up, Rock Slide, Sleep Talk, Grass Knot, Swagger, Substitute, Grassy Terrain,
          Flip Turn, Cut, Surf, Waterfall]
  # moves a move tutor can teach it
  tutor: [Body Slam, Curse, Leaf Storm, Magical Leaf, Nasty Plot, Poltergeist, Seed Bomb,
          Solar Blade, Synthesis, Zen Headbutt, Night Slash, Liquidation, Aqua Cutter,
          Last Respects, Fishious Rend, Wave Crash]
  egg: []                # only needed for the first stage of an evolution line

# --- Where it is found ---
encounters: []           # e.g. [{location: Route 1, method: grass, levels: 2-4, rate: 20}]

# --- Design ---
design:
  concept:               # what is it? one or two sentences
  name_origin:
  notes: "From the Discord concept card (SLOTHBABY, 2026-05-02): also on the card: Sap Sipper (regular), Grim Neigh (hidden). Signature moves: Gabriel's Curse (Ghost, 85 BP, 100%), Haunted Slash (Ghost, 85 BP, 100%).."
  wishes:                # for Claude: how it should play, move ideas
  claude_fill: false     # true = Claude may fill in what is missing
  # fields Claude filled in (people can change them)
  filled_by_claude: [body shape, look, movement, level-up moves, "TM/HM moves", tutor moves,
                     body color, catch rate, base exp, growth rate, base friendship, gender,
                     egg groups, egg cycles]
  body_shape: an upright body on two legs without a tail
  movement: It floats in the air. # e.g. It walks on four legs. / It floats in the air.
  look: "It is a tall ghostly figure in a ragged black pirate coat and tricorn hat covered in barnacles and shells. Its face has a beak-like nose and blue eyes, hidden behind a hanging beard of green seaweed, with tattered seaweed draping its sleeves and a clawed hand holding a rusty cutlass."

# --- Assets (paths inside this repo, leave empty until the file exists) ---
assets:
  concept_art: "assets/concept-art/gravriel/240.webp"
  front_sprite:          # front.png      64x64, 16 colors
  front_anim:            # anim_front.png 64x128, two frames stacked
  back_sprite:           # back.png       64x64, same 16 colors as the front
  icon:                  # icon.png       32x64, two frames stacked
  footprint: "hgss:355"  # footprint.png  16x16, black and white
  shiny_palette:         # shiny.pal      the 16 colors of the shiny version
  cry:                   # sound file

# --- Game engine details (only matter once sprites exist, see docs/ENGINE.md) ---
engine:
  no_flip: false         # true if the sprite must never be mirrored
  elevation: 0           # pixels it floats above the ground in battle
  front_y_offset:        # pixels the front sprite is moved down
  back_y_offset:         # pixels the back sprite is moved down
  icon_palette:          # 0, 1 or 2 - which shared icon palette fits best
  safari_flee_rate: 0
