# New abilities invented for this project (abilities that do not exist in the game yet,
# see data/engine/expansion.yaml for the 319 that do). Edit them on the website.
# Each one has to be programmed into the game; 'implemented: true' marks the ones that are.
abilities:
- id: catch-master
  name: Catch Master
  description: Weakens wild Pokémon's resistance to Poké Balls
  effect: 'Trigger: Passive. It activates when the player throws a Poké Ball at a wild Pokémon while the
    holder is on the field and not fainted. There is no activation message, but the ability pop-up shows
    on switch-in like other battle abilities.'
  designer: Emil
- id: cold-hearted
  name: Cold-hearted
  description: Raises the Attack of this Pokémon when Snowscape is active
  effect: When this Pokémon enters battle during Snowscape, or when Snowscape begins while it is on the
    field, its Attack rises by one stage. This happens once per Snowscape activation. If the snow ends
    and a new one starts, it triggers again. The boost is a normal stat stage, so Intimidate, Haze, and
    switching out remove it.
- id: drunken-rage
  name: Drunken Rage
  description: Raises Attack by two stages upon entering battle, but become confused
  effect: When a Pokémon with Drunken Rage enters battle, its Attack rises by two stages and it becomes
    confused, as though it had been hit by Swagger. The effect triggers every time the Pokémon switches
    in, so it can be reused by switching out and back in. Since the confusion is self-inflicted, each
    turn while confused the Pokémon has a 33% chance of hurting itself instead of attacking, and the confusion
    wears off after a few turns (or immediately upon switching out). The Attack boost, however, stays
    until the Pokémon leaves the field or the stat is changed by another effect.
  designer: Emil
- id: fog-of-war
  name: Fog Of War
  description: Shrouds the field in fog for 1 turn, raising all Pokémon's evasiveness
  effect: When this Pokémon enters battle, a thick fog covers the field for one turn. During that turn,
    every Pokémon on the field (allies and opponents) has its evasiveness raised by one stage, making
    moves 25% less likely to hit than normal (accuracy drops to about 75%, since a +1 evasion stage is
    a 3/4 multiplier). The effect ends at the end of the turn it was activated. Moves that never miss,
    like Aerial Ace or Swift, and moves with perfect accuracy are not affected. Fog of War can only trigger
    once per switch-in.
  designer: Casper & Emil
- id: trash-talker
  name: Heckler
  description: On switch-in, lower the Special Attack of all adjacent opponents
  effect: When this Pokémon enters battle, it hurls insults at the opposing side, lowering the Special
    Attack of every adjacent opponent by one stage. It works exactly like Intimidate, but for Special
    Attack. It triggers once per switch-in. Pokémon with Clear Body, White Smoke, Full Metal Body, Hyper
    Cutter-style protections against stat drops, Mirror Armor, Oblivious, Own Tempo, Inner Focus, and
    Scrappy-style immunity to Intimidate-like effects are not affected, and Contrary, Defiant, Competitive,
    and Guard Dog react as they would to any stat drop. Substitute does not block it.
  designer: Emil
- id: leaf-mane
  name: Leaf Mane
  description: Raises the user’s Attack by one stage when harsh sunlight is active
  effect: When this Pokémon enters battle during harsh sunlight, or when harsh sunlight begins while it
    is on the field, its Attack rises by one stage. This happens once per sun activation. If the sun ends
    and a new one starts, it triggers again. Sunny Day, Drought, and Desolate Land all count. The boost
    is a normal stat stage, so Intimidate, Haze, and switching out remove it. It does not boost Special
    Attack.
  designer: Emil
- id: ol-no-reliable
  name: Ol' No Reliable
  description: Changes form when HP is above 25%
  effect: When this Pokémon enters battle at level 20 or higher with more than 25% of its max HP, it rolls
    out of its tank and shifts into its battle form, Rolling Out Form. When its HP drops to 25% or below
    at the end of a turn, it retreats into its tank and reverts to its base form. It then returns to the
    battle form at the end of a turn if it has recovered above 25% HP, or when it switches back in with
    enough HP. This works exactly like Schooling. Like Schooling, the form change cannot be suppressed
    by a Pokémon other than the holder's own side, and the ability cannot be swapped away or copied by
    Skill Swap, Role Play, Entrainment, or similar moves. Gastro Acid and Mold Breaker do not remove the
    form.
  similar_to: Schooling
  designer: Emil
- id: parry-stance
  name: Parry Stance
  description: The first hit the user takes each battle is parried, dealing no damage
  effect: When this Pokémon enters battle, it holds a parry stance. The first damaging move that would
    hit it is deflected completely, so it takes no damage. The stance then breaks and the Pokémon takes
    1/8 of its max HP in recoil from the shock. Once broken, Parry Stance stays down for the rest of the
    battle, even if the Pokémon switches out and back in. Like Disguise, it is bypassed by moves that
    ignore abilities (Mold Breaker and similar), and it does not block status moves, Sheer Cold-style
    effects that bypass it, or indirect damage like weather, poison, or hazards. Against multi-hit moves,
    only the first hit is parried.
  designer: Emil
- id: punchable-face
  name: Punchable Face
  description: On switch-in, taunts every other Pokémon on the field for 2 turns.
  effect: 'When this Pokémon enters battle, its smug expression provokes every other Pokémon on the field,
    opponents and its own allies alike. Affected Pokémon are Taunted for 2 turns and can only use damaging
    moves. The holder is not affected and can use status moves normally. The effect otherwise works like
    the move Taunt: switching a Pokémon out clears it, and Pokémon with Oblivious, Aroma Veil, or Own
    Tempo are immune. It only triggers once per switch-in.'
  designer: Emil
- id: sloth-combat
  name: Sloth Combat
  description: Doubles the user's Attack stat while it is asleep.
  effect: Sloth Combat doubles the Attack stat of a Pokémon while it is asleep, the same multiplier Huge
    Power gives. The boost only applies while the sleep status is active, so it disappears as soon as
    the Pokémon wakes up. Since a sleeping Pokémon can't normally attack, the ability is only useful with
    moves that can be used during sleep, such as Sleep Talk and Snore, or if the Pokémon is put to sleep
    by Rest, which guarantees a short nap.
  designer: Emil
- id: toxic-voice
  name: Toxic Voice
  description: Sound-based moves become Poison type. They may also badly poison the t
  effect: 'Toxic Voice turns the user''s sound-based moves into Poison-type moves, and they receive the
    usual same-type attack bonus (STAB). Any target hit by one of these moves has a chance of being badly
    poisoned, with damage that grows worse each turn. Because the moves are still sound-based, they bypass
    Substitute, and the type change applies to every sound move the user knows, such as Hyper Voice, Bug
    Buzz, and Boomburst.

    Poison type Pokémon also gain STAB from those moves.'
  similar_to: Liquid Voice
  designer: Emil
