# New abilities invented for this project (abilities that do not exist in the game yet,
# see data/engine/expansion.yaml for the 319 that do). Edit them on the website.
# Each one has to be programmed into the game; 'implemented: true' marks the ones that are.
abilities:
- id: catch-master
  name: Catch Master
  description: Weakens wild Pokémon's resistance to Poké Balls. Wild Pokémon that fac
  effect: 'Trigger: Passive. It activates when the player throws a Poké Ball at a wild Pokémon while the
    holder is on the field and not fainted. There is no activation message, but the ability pop-up shows
    on switch-in like other battle abilities.'
- id: drunken-rage
  name: Drunken Rage
  description: Raises Attack by two stages upon entering battle, but become confused
  effect: When a Pokémon with Drunken Rage enters battle, its Attack rises by two stages and it becomes
    confused, as though it had been hit by Swagger. The effect triggers every time the Pokémon switches
    in, so it can be reused by switching out and back in. Since the confusion is self-inflicted, each
    turn while confused the Pokémon has a 33% chance of hurting itself instead of attacking, and the confusion
    wears off after a few turns (or immediately upon switching out). The Attack boost, however, stays
    until the Pokémon leaves the field or the stat is changed by another effect.
  designer: Emil
- id: sloth-combat
  name: Sloth Combat
  description: Doubles the user's Attack stat while it is asleep.
  effect: Sloth Combat doubles the Attack stat of a Pokémon while it is asleep, the same multiplier Huge
    Power gives. The boost only applies while the sleep status is active, so it disappears as soon as
    the Pokémon wakes up. Since a sleeping Pokémon can't normally attack, the ability is only useful with
    moves that can be used during sleep, such as Sleep Talk and Snore, or if the Pokémon is put to sleep
    by Rest, which guarantees a short nap.
  designer: Emil
- id: toxic-voice
  name: Toxic Voice
  description: Sound-based moves become Poison type. They may also badly poison the t
  effect: 'Toxic Voice turns the user''s sound-based moves into Poison-type moves, and they receive the
    usual same-type attack bonus (STAB). Any target hit by one of these moves has a chance of being badly
    poisoned, with damage that grows worse each turn. Because the moves are still sound-based, they bypass
    Substitute, and the type change applies to every sound move the user knows, such as Hyper Voice, Bug
    Buzz, and Boomburst.

    Poison type Pokémon also gain STAB from those moves.'
  similar_to: Liquid Voice
  designer: Emil
