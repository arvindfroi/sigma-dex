# Project-wide settings for the Sigma Dex.
project: Council of the Sigmas Pokedex
region:            # name of the region, once decided
dex_size: 254      # slots in the regional dex. Our mons are added to the game next to the existing ones (like Black and White: only ours until the postgame), so the limit is the 254 free species slots in Origin HG. Lower it or raise it here.

# The three Pokemon in Professor Birch's bag, in the order grass, fire, water (file names
# without .yaml). Used by scripts/apply_to_expansion.py once all three are in the game.
starters: [leafing, torchbat, waffy]

