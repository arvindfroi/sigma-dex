# What the AI is told when it draws sprites (scripts/ai_sprites.py, see docs/SPRITES.md).
# `style` is the same for every Pokemon, so the whole dex gets one look. Each Pokemon has a
# `look`: a short caricature of it - a sprite is 64 pixels wide, so say what to keep and
# exaggerate, not every detail. `refs` are pictures in this repository the AI looks at.
# Changing a `look` or a `seed` and running the script again gives a new attempt.
style: >-
  Pixel art battle sprite for a Game Boy Advance monster-collecting RPG, drawn on a 64x64 pixel
  grid and shown enlarged so every pixel is a big crisp square. Bold readable silhouette,
  exaggerated expressive face, clean dark outline, flat cel shading with at most three tones per
  color, about 12 colors in total, strong contrast, light from the upper left. No anti-aliasing,
  no gradients, no dithering, no texture noise, no text, no border, no ground, no shadow, one
  creature only, centered with a small margin.
front: >-
  The creature is seen from the front, facing the viewer, simplified like a caricature:
back: >-
  View: a back sprite pose for a monster battle game. The camera is behind the creature and a
  little to its left, looking over its shoulder. The creature's body faces away from the viewer
  and its head is turned toward the upper right, so we see the back of its body, its tail, the
  back of its head, one cheek and one eye in profile. It leans forward into a battle stance.
  Drawn large, filling the picture. Clear two-tone shading: a darker shade on the lower and
  right side of every body part, dark outlines around every part, the limbs and tail clearly
  separated from the body. The creature is

# Poses people can choose for the front view. The key is what the website stores.
poses:
  front: >-
    The creature is seen from the front, facing the viewer, simplified like a caricature:
  three-quarter: >-
    View: three-quarter front view, as the opponent's sprite in a monster battle game. The
    creature stands turned toward the left side of the picture, its body angled diagonally, its
    head turned so that both eyes are visible, in a lively ready-for-battle stance. The whole
    body is visible. The creature is
  rearing: >-
    Rearing up tall and imposing in three-quarter view turned slightly to the left, the whole
    body visible, simplified like a caricature:
  flying: >-
    Hovering in mid-air in three-quarter view turned slightly to the left, wings or fins
    spread, the whole body visible, simplified like a caricature:
  crouching: >-
    Crouched low and ready to pounce in three-quarter view turned slightly to the left, the
    whole body visible, simplified like a caricature:

# For the "Pokemon sprite style" the AI first draws a clean illustration (this text instead of
# `style`), which a second model then repaints as a sprite.
illustration: >-
  Clean creature illustration for a monster-collecting RPG, the creature drawn alone on a
  transparent background. Flat cel shading with only two tones per color, bold dark outlines,
  simple chunky shapes with no fine texture, big expressive eyes with a white highlight. No text,
  no border, no shadow, no ground, no scenery, exactly one creature, centered with a margin.
  Keep the creature's design and colors exactly as in the reference pictures.
emerald_strength: {emerald-light: 0.4, emerald-medium: 0.55}

# The "clean" sprite style (sprite-clean), the one the group liked on 2026-10-03. Most concept
# art is a plain, static drawing, and a sprite needs more character than that: the AI *redraws*
# the reference pictures with freedom (bigger head and eyes, attitude, a dynamic pose);
# telling it to "keep the design exactly" makes it copy the reference instead. {look} is the
# Pokemon's look, {others} names the other reference pictures. A fixed grin overrode grumpy
# designs (Autuman), so the expression now comes from the references. The result is shrunk to a rough sprite at official size, and `cleanup` has the
# AI repaint that rough sprite at exactly its size and place; this is snapped to the 64 grid.
# Tried and worse: asking the cleanup to stay pixel art, and a Sprite XL LoRA finish on top.
redesign_front: >-
  Redraw the creature from <image1> as new official artwork.{others} Clean official artwork of a
  starter monster from a Game Boy Advance era monster-collecting RPG: bold dark outlines, flat
  two-tone cel shading, vivid colors, simple chunky shapes, thick limbs. Drawn alone on a
  transparent background: no text, no border, no shadow, no ground, no scenery, exactly one
  creature, centered with a margin. Keep its species, colors and signature features ({look}),
  but change its pose and proportions: give it an oversized round head, very large expressive
  eyes with big black pupils and bright white highlights, the same expression and personality as
  in the reference pictures but exaggerated and full of attitude, chunkier rounder body and
  thicker limbs, big simple rounded hands and feet, any pattern drawn as a few big shapes, and put
  it in an energetic, dynamic battle pose, crouched and leaning forward toward the left side of
  the picture, one arm raised, in three-quarter view, the whole body visible.
redesign_back: >-
  Redraw the creature from <image1> as new official artwork.{others} Clean official artwork of a
  starter monster from a Game Boy Advance era monster-collecting RPG: bold dark outlines, flat
  two-tone cel shading, vivid colors, simple chunky shapes, thick limbs. Drawn alone on a
  transparent background: no text, no border, no shadow, no ground, no scenery, exactly one
  creature, centered with a margin. Keep its species, colors and signature features ({look}),
  with a big round head, chunky limbs, big simple rounded hands and feet, and any pattern drawn
  as a few big shapes. View: seen from behind, as the player's own creature in a monster
  battle game. The camera is behind it and a little above, looking over its shoulder: we see its
  back, the back of its head and its tail, and its head is turned toward the upper right so one
  eye and the side of its face show in profile. It leans forward toward the opponent, tense and
  ready to fight.
cleanup: >-
  <image1> is a rough pixel art battle sprite of a creature for a Game Boy Advance
  monster-collecting RPG, shown enlarged so each pixel is a big square; <image2> is the artwork
  it was made from. Repaint <image1> as the finished sprite a professional pixel artist would
  make, exactly as large as in <image1>, with the same pose, silhouette, position and colors, on
  the same coarse pixel grid with big crisp square pixels. Clean, readable shapes: replace noisy
  texture with a few clear shapes, three or four shades per color with light from the upper
  left, a dark outline one pixel wide around the creature and its parts, no dithering, no
  anti-aliasing. Make the face readable: each visible eye is a clear dark pupil with one white
  highlight pixel, the mouth a clean dark line. Plain white background.

# The "official" sprite style (sprite-official, the default since 2026-10-03): Qwen draws the
# creature as Ruby/Sapphire-style official artwork (chosen by the group over three other styles) (clean outlines, flat cel shading, sprite proportions), then
# scripts/pixel_render.py builds the sprite from it pixel by pixel. {look} is the Pokemon's look,
# {others} names the other reference pictures, {pose} comes from official_poses, {signature} from the
# Pokemon's `signature`: the features that must be big and clear on the sprite (a spriter's detail
# hierarchy: what makes it recognisable is exaggerated, the rest simplified).
official_front: >-
  Redraw the creature from <image1> as official artwork from Pokemon Ruby and Sapphire (2002), Ken
  Sugimori's Game Boy Advance era style: thick confident dark outlines, large flat areas of color,
  chunky simple readable shapes with few small details (no muscle lines, no fine texture), a big
  head and big expressive eyes. Shading like a Game Boy
  Advance battle sprite: light from the upper left, a crisp shadow tone on the lower right of every
  part and a few bold, clearly shaped highlight patches on the head and body; no thin rim light
  lines along the edges.{others} Keep its design, colors and signature features: {look}; the same
  expression as in the reference, stronger.{signature} Pose: {pose} Three-quarter view turned toward the
  lower left, the whole body visible. Compose it for a small square battle sprite, as the game's own
  sprites are: a compact silhouette about as tall as it is wide, with wings, capes, fins and long
  tails raised up behind the body or held close to it rather than spread out to the sides, so the
  head and face can be drawn big. Exactly one creature, full body, plain white background, no
  text, no shadow on the ground.
official_back: >-
  Draw the creature from <image1>{others} from behind, as official artwork from Pokemon Ruby and
  Sapphire (2002), Ken Sugimori's Game Boy Advance era style: thick confident dark outlines, large
  flat areas of color, chunky simple readable shapes. Shading like a Game Boy Advance battle sprite:
  light from the upper left, a crisp shadow tone on the lower right of every part and a few bold
  highlight patches; no rim light and no glossy shine. It is {look}. View: seen
  from behind, as the player's own creature in a battle: the camera is behind it and a little
  above, looking over its shoulder. We see its back, the back of its head and its tail; its face
  is turned away from the viewer, toward the upper right, so at most one eye and the side of its
  face show in profile, never both eyes. It leans
  forward toward the opponent, ready to fight. Exactly one creature, plain white background, no
  text, no shadow on the ground.
official_poses:
  three-quarter: a lively, confident pose full of personality, standing tall with its head held high and looking at the viewer, one arm or paw raised if it has one, limbs a little away from the body.
  front: standing facing the viewer, confident, ready to fight.
  rearing: rearing up and roaring with its mouth open, chest out, arms or front legs raised, fierce and proud.
  flying: hovering in mid-air, wings or fins spread wide, ready to dive at the opponent.
  crouching: crouched low and ready to pounce, head lowered, glaring at the opponent with a determined frown.

