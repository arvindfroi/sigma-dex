# What the AI is told when it draws sprites (scripts/ai_sprites.py, see docs/SPRITES.md).
# `style` is the same for every Pokemon, so the whole dex gets one look. Each Pokemon has a
# `look`: a short caricature of it - a sprite is 64 pixels wide, so say what to keep and
# exaggerate, not every detail. `refs` are pictures in this repository the AI looks at.
# Changing a `look` or a `seed` and running the script again gives a new attempt.
style: >-
  Pixel art battle sprite for a Game Boy Advance monster-collecting RPG, drawn on a 64x64 pixel
  grid and shown enlarged so every pixel is a big crisp square. Bold readable silhouette,
  exaggerated expressive face, clean dark outline, flat cel shading with at most three tones per
  color, about 12 colors in total, strong contrast, light from the upper left. No anti-aliasing,
  no gradients, no dithering, no texture noise, no text, no border, no ground, no shadow, one
  creature only, centered with a small margin.
front: >-
  The creature is seen from the front, facing the viewer, simplified like a caricature:
back: >-
  The creature is seen from behind and slightly above, as the player's own monster in battle,
  its face not visible, simplified like a caricature:

# Poses people can choose for the front view. The key is what the website stores.
poses:
  front: >-
    The creature is seen from the front, facing the viewer, simplified like a caricature:
  three-quarter: >-
    Classic battle pose: the whole body is visible, standing in three-quarter view turned
    slightly to the left, looking toward the viewer, simplified like a caricature:
  rearing: >-
    Rearing up tall and imposing in three-quarter view turned slightly to the left, the whole
    body visible, simplified like a caricature:
  flying: >-
    Hovering in mid-air in three-quarter view turned slightly to the left, wings or fins
    spread, the whole body visible, simplified like a caricature:
  crouching: >-
    Crouched low and ready to pounce in three-quarter view turned slightly to the left, the
    whole body visible, simplified like a caricature:

# For the "Emerald" styles the AI first draws a clean illustration (this text instead of
# `style`), which a second model with the Pokemon Emerald sprite LoRA then repaints as a sprite.
illustration: >-
  Creature artwork for a monster-collecting RPG, the creature drawn alone on a transparent
  background. Simple clean cartoon style with bold dark outlines and flat colors, simplified
  chunky shapes that stay readable when shrunk to 64 pixels, strong contrast. No text, no
  border, no shadow, no ground, no scenery, one creature only, centered with a small margin.
emerald_strength: {emerald-light: 0.4, emerald-medium: 0.55}

pokemon:
  bergflabbser:
    refs: [assets/concept-art/bergflabbser/4.png]
    look: >-
      a round brown fish with two stubby fins, a huge grinning open mouth with a few big white
      triangle teeth and a pink tongue, two large fierce white eyes with black pupils and heavy
      brows, and on its back three chunky green mountain peaks with grey rock tips, a tiny grey
      tower on the tallest peak and four tiny colored houses in a row between the peaks.
    back_look: >-
      a round brown fish with two stubby fins and a tail fin, and on its back three chunky green
      mountain peaks with grey rock tips, a tiny grey tower on the tallest peak and four tiny
      colored houses in a row between the peaks.
    seeds: {front: 21, back: 22}
  leafing:
    look: >-
      a small green long-necked dinosaur covered in overlapping leaf scales, one big leaf sprouting
      from the top of its head, big friendly brown eyes, grey claws, and a tail tipped with a
      silver axe blade.
  waffy:
    look: >-
      a chubby blue platypus with a big yellow duck bill, big round eyes, an open happy mouth, a
      white belly, black clawed feet and a flat dark beaver tail.
  torchbat:
    look: >-
      a small orange-red lizard standing upright, with huge pointed bat-like ears, a yellow
      flame-shaped tuft on its head, a cream belly, yellow claws and a flame burning on the tip
      of its tail.
