# What the AI is told when it draws sprites (scripts/ai_sprites.py, see docs/SPRITES.md).
# `style` is the same for every Pokemon, so the whole dex gets one look. Each Pokemon has a
# `look`: a short caricature of it - a sprite is 64 pixels wide, so say what to keep and
# exaggerate, not every detail. `refs` are pictures in this repository the AI looks at.
# Changing a `look` or a `seed` and running the script again gives a new attempt.
style: >-
  Pixel art battle sprite for a Game Boy Advance monster-collecting RPG, drawn on a 64x64 pixel
  grid and shown enlarged so every pixel is a big crisp square. Bold readable silhouette,
  exaggerated expressive face, clean dark outline, flat cel shading with at most three tones per
  color, about 12 colors in total, strong contrast, light from the upper left. No anti-aliasing,
  no gradients, no dithering, no texture noise, no text, no border, no ground, no shadow, one
  creature only, centered with a small margin.
front: >-
  The creature is seen from the front, facing the viewer, simplified like a caricature:
back: >-
  View: a back sprite pose for a monster battle game. The camera is behind the creature and a
  little to its left, looking over its shoulder. The creature's body faces away from the viewer
  and its head is turned toward the upper right, so we see the back of its body, its tail, the
  back of its head, one cheek and one eye in profile. It leans forward into a battle stance.
  Drawn large, filling the picture. Clear two-tone shading: a darker shade on the lower and
  right side of every body part, dark outlines around every part, the limbs and tail clearly
  separated from the body. The creature is

# Poses people can choose for the front view. The key is what the website stores.
poses:
  front: >-
    The creature is seen from the front, facing the viewer, simplified like a caricature:
  three-quarter: >-
    View: three-quarter front view, as the opponent's sprite in a monster battle game. The
    creature stands turned toward the left side of the picture, its body angled diagonally, its
    head turned so that both eyes are visible, in a lively ready-for-battle stance. The whole
    body is visible. The creature is
  rearing: >-
    Rearing up tall and imposing in three-quarter view turned slightly to the left, the whole
    body visible, simplified like a caricature:
  flying: >-
    Hovering in mid-air in three-quarter view turned slightly to the left, wings or fins
    spread, the whole body visible, simplified like a caricature:
  crouching: >-
    Crouched low and ready to pounce in three-quarter view turned slightly to the left, the
    whole body visible, simplified like a caricature:

# For the "Pokemon sprite style" the AI first draws a clean illustration (this text instead of
# `style`), which a second model then repaints as a sprite.
illustration: >-
  Clean creature illustration for a monster-collecting RPG, the creature drawn alone on a
  transparent background. Flat cel shading with only two tones per color, bold dark outlines,
  simple chunky shapes with no fine texture, big expressive eyes with a white highlight. No text,
  no border, no shadow, no ground, no scenery, exactly one creature, centered with a margin.
  Keep the creature's design and colors exactly as in the reference pictures.
emerald_strength: {emerald-light: 0.4, emerald-medium: 0.55}

# The "clean" sprite style (sprite-clean). Most concept art is a plain, static drawing, and a
# sprite needs more character than that: the AI may redesign proportions, face and pose while
# keeping the creature recognisable (`redesign`, then the pose and the `look`). Asking it to
# "redraw with changes" frees it; telling it to "keep the design exactly" makes it copy the
# reference. The result is shrunk to a rough sprite, and `cleanup` then has the AI repaint it at
# exactly that size and place, the way spriters clean up a shrunk reference: it is shown only the
# rough sprite (plus the artwork as a look-up), so it stays pixel art; given the artwork as the
# thing to repaint, it draws a smooth picture again and the face turns to mud when snapped. Comparison: docs/SPRITES.md.
redesign: >-
  Redraw the creature from <image1> as new official artwork of a starter-style monster from a
  Game Boy Advance era monster-collecting RPG: bold dark outlines, flat two-tone cel shading,
  vivid colors, simple chunky shapes, thick limbs. Drawn alone on a transparent background: no
  text, no border, no shadow, no ground, no scenery, exactly one creature, centered with a
  margin. Keep its species, colors and signature features, but change its pose and proportions
  to give it much more personality: an oversized round head, very large expressive eyes with big
  black pupils and bright white highlights, a cheeky confident face full of attitude, a chunkier
  body. Any pattern such as scales, leaves, feathers or spots is drawn as only a few big simple
  shapes, readable on a tiny sprite.
clean_poses:
  three-quarter: >-
    It strikes an energetic, dynamic battle pose, crouched and leaning forward toward the left
    side of the picture, one arm or front leg raised, in three-quarter view, the whole body
    visible. The creature is
cleanup: >-
  Edit the pixel art sprite in <image1> from a Game Boy Advance monster-collecting RPG. It is a
  64x64 pixel sprite shown enlarged, every pixel a big square block. Keep it pixel art on exactly
  the same pixel grid, with the same creature, pose, size, position and colors. Clean it up the
  way a professional spriter would: remove stray and noisy pixels, make every color area a clean
  flat shape with at most three shades, give the creature a clean one-pixel dark outline, make
  each eye a clear black pupil with a single white highlight pixel, make the mouth a clean dark
  line, and make the hands and feet simple clear shapes with distinct claws. No anti-aliasing, no
  blur, no gradients. <image2> shows what the creature looks like. Plain white background.

pokemon:
  bergflabbser:
    refs: [assets/concept-art/bergflabbser/4.png]
    look: >-
      a round brown fish with two stubby fins, a huge grinning open mouth with a few big white
      triangle teeth and a pink tongue, two large fierce white eyes with black pupils and heavy
      brows, and on its back three chunky green mountain peaks with grey rock tips, a tiny grey
      tower on the tallest peak and four tiny colored houses in a row between the peaks.
    back_look: >-
      a round brown fish with two stubby fins and a tail fin, and on its back three chunky green
      mountain peaks with grey rock tips, a tiny grey tower on the tallest peak and four tiny
      colored houses in a row between the peaks.
    seeds: {front: 21, back: 22}
  leafing:
    look: >-
      a small green long-necked dinosaur covered in overlapping leaf scales, one big leaf sprouting
      from the top of its head, big friendly brown eyes, grey claws, and a tail tipped with a
      silver axe blade.
  waffy:
    look: >-
      a chubby blue platypus with a big yellow duck bill, big round eyes, an open happy mouth, a
      white belly, black clawed feet and a flat dark beaver tail.
  torchbat:
    look: >-
      a small red lizard standing upright, with huge long pointed bat-like ears that burn with
      small yellow flames at their tips, small wing-like flaps on its arms, a cream belly and a
      flame burning on the tip of its tail.
