# Characters in the game that the group can claim (replace with themselves).
# Names are left out on purpose (no spoilers for those who have not played the game); the real names are in
# docs/CHARACTERS.md. Shown on the website under MORE > Characters. Claims are saved on the website.
# group: what kind of character; type: the type of their team and of their surroundings; rule: a gym rule.
# about: a short line about the character's story, shown on the website.
# battles: how many times this character fights the player in Origin (each needs its own team);
# levels: the highest level in each of those teams, lowest first (from the ROM, docs/CHARACTERS.md has the names).
# Only the roles that matter are listed (Arvind, 2026-11-11): gym leaders, the Elite Four and trainers you meet and fight
# several times. Regions are left out too, so it is less obvious who is who.
# Surprises stay hidden (Arvind, 2026-11-11): the group has not played this kind of hack, so nothing here says
# who is a champion, a villain, the rival or a friend; those are 'Important trainer' with a code name.
# Champions are hidden among the important trainers like everyone else. The website shows the trainers in a random order.
# teams: one per battle, lowest level first: lv = highest level, size = number of Pokemon, side = against (they fight
# you), with (they fight next to you in a multi battle) or both (Origin uses the same team both ways), read from the
# game's own battle scripts (2026-11-12); note = something the one who claims it should know; original = Origin's own
# team (shown only to the one who claims the trainer).
# iv = the IV level of Origin's team for that battle, never lower than the battle before (scripts/character_ivs.py);
# the story team builder uses it for every Pokemon and gives the star 6 more (Arvind, 2026-11-17).
# The Elite Four are among the important trainers. The main rival is left out (Arvind makes him himself, 2026-11-12).
# The two champions were left out on 2026-11-12 and came back as Trainer Y and Trainer Z on 2026-11-17 (Arvind:
# "Du kan faktisk legge de til som mulige trenere tilbake"). Their school battle in Origin (Lv. 5) is not counted:
# it can never be started in a normal game.
# Trainer U ('Lorin') was merged into Trainer I on 2026-11-17: trainer 705 is Lance's second team; the Chinese
# original gives it a wrong name, which the EN patch fixed to Lance in rc8. The code U is not used again.
# Trainer H ('Koga (Elite Four)') was merged into Trainer M the same day: trainer 703 is Agatha's second team (same
# room, same trainer class and picture, and Agatha speaks just before the battle, also in the Chinese original).
# Koga is only the Fuchsia gym leader in Origin. The code H is not used again.
# Trainer AA (Janine) added 2026-11-17 (Arvind: "du kan legge hun til ja det er gøy. skriv at denne personen er
# master of disquise"). All 26 letters were used or retired, so the code is AA. Counted: her two battles with her own
# team and the Attack EV sparring battle; the disguised Victory Road 3F battle uses another trainer's team.
# The villains (Rocket, Magma, Aqua and Galactic: codes A, B, D, E, F, L, N, R, S, T, V) are left out too (Arvind, 2026-11-12).
# dialogue: how much they say in Origin: story = text boxes in the story, battle = lines in battle, words =
# both together (scripts/character_dialogue.py, counted 2026-11-16; only numbers, never the text).
