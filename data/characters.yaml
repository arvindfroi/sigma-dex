# Characters in the game that the group can claim (replace with themselves).
# Names are left out on purpose (no spoilers for those who have not played the game); the real names are in
# docs/CHARACTERS.md. Shown on the website under MORE > Characters. Claims are saved on the website.
# group: what kind of character; type: the type of their team and of their surroundings; rule: a gym rule.
# battles: how many times this character fights the player in Origin (each needs its own team);
# levels: the highest level in each of those teams, lowest first (from the ROM, docs/CHARACTERS.md has the names).
# Only the roles that matter are listed (Arvind, 2026-11-11): gym leaders, the Elite Four and trainers you meet and fight
# several times. Regions are left out too, so it is less obvious who is who.
# Surprises stay hidden (Arvind, 2026-11-11): the group has not played this kind of hack, so nothing here says
# who is a champion, a villain, the rival or a friend; those are 'Important trainer' with a code name.
# The Elite Four and one of the two champions are left out (Arvind, 2026-11-11: he makes those himself); one
# champion stays, hidden among the important trainers. The website shows the trainers in a random order.
# teams: one per battle, lowest level first: lv = highest level, size = number of Pokemon, partner = a multi battle
# (they may fight next to you), original = Origin's own team (shown only to the one who claims the trainer).
# The Elite Four are among the important trainers; every champion and the main rival are left out (Arvind makes those himself, 2026-11-12).
