name: Dex

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes: pick up edits from the website
  workflow_dispatch:        # the "Run workflow" button, to sync right now

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The Google Sheet and the Google Doc are no longer read (11 Nov 2026): the website is the only place to edit.
      # scripts/import_sheet.py and import_doc.py still work by hand if they are ever needed again.
      - name: Import from the website
        if: github.event_name != 'pull_request'
        run: python scripts/import_web.py
      - name: Import images attached on the website
        if: github.event_name != 'pull_request'
        run: python scripts/import_images.py
      - name: Make sprites from pictures uploaded as sprite pictures
        if: github.event_name != 'pull_request'
        run: python scripts/sprites.py auto
      - name: Check the species files
        run: python scripts/validate.py
      - name: Rebuild DEX.md, TODO.md, export/ and the website
        run: python scripts/build.py
      - name: Save the changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets DEX.md TODO.md export site
          git diff --cached --quiet || (git commit -m "Sync edits from the website" && git push)
      - name: Package the website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  website:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
