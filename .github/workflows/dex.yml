name: Dex

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes: pick up edits from the website
  workflow_dispatch:        # the "Run workflow" button, to sync right now

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.save.outputs.superseded }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The Google Sheet and the Google Doc are no longer read (11 Nov 2026): the website is the only place to edit.
      # scripts/import_sheet.py and import_doc.py still work by hand if they are ever needed again.
      - name: Import from the website
        if: github.event_name != 'pull_request'
        run: python scripts/import_web.py
      - name: Import images attached on the website
        if: github.event_name != 'pull_request'
        run: python scripts/import_images.py
      - name: Make sprites from pictures uploaded as sprite pictures
        if: github.event_name != 'pull_request'
        run: python scripts/sprites.py auto
      - name: Check the species files
        run: python scripts/validate.py
      - name: Rebuild DEX.md, TODO.md, export/ and the website
        run: python scripts/build.py
      - name: Tell Discord about Pokemon that reached 100 %
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py
      - name: Save the changes
        id: save
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets DEX.md TODO.md export site
          git diff --cached --quiet && exit 0
          git commit -m "Sync edits from the website"
          git push && exit 0
          # The push fails when someone pushed to main while this run worked. Then the run for that newer commit
          # imports the same website edits and publishes the site, so this one stops without an error.
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on while this run worked; the run for the newer commit saves and publishes instead."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1
      - name: Package the website
        if: github.event_name != 'pull_request' && steps.save.outputs.superseded != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  website:
    if: github.event_name != 'pull_request' && needs.check.outputs.superseded != 'true'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
